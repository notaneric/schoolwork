<!-- ================= HOME (Exam 2 study plan) ================= -->
<div id="home" class="wrap plan-wrap on">
  <header class="ph">
    <div class="eyebrow">CHEM 1211 Exam 2</div>
    <h1 class="set-title">Chapter 3 and Chapter 4.1 to 4.3</h1>
    <p class="ph-when">Wednesday, October 14, 10:00 AM, Lakeview Science Center 210</p>
    <p class="ph-bring">Bring a Scantron, a #2 pencil and a calculator. The formula sheet and periodic table are provided.</p>
  </header>
  <div class="plan-head"><h2 class="section-h">Study plan</h2><span class="plan-done" id="plan-done"></span></div>
  <ol class="plan" id="plan"></ol>
  <h2 class="section-h tools-h">More practice</h2>
  <div class="tools" id="tools"></div>
</div>

<!-- ================= READ (one plan step at a time) ================= -->
<div id="read" class="wrap plan-wrap">
  <div class="mode-bar">
    <button class="icon-btn" onclick="goHome()"><svg class="ic ic-16" aria-hidden="true"><use href="#i-back"/></svg>Plan</button>
    <span class="mt" id="read-pos"></span>
  </div>
  <article class="guide" id="read-body"></article>
</div>

<!-- ================= KEY TERMS ================= -->
<div id="terms" class="wrap plan-wrap">
  <div class="mode-bar">
    <button class="icon-btn" onclick="goHome()"><svg class="ic ic-16" aria-hidden="true"><use href="#i-back"/></svg>Plan</button>
    <span class="mt">Key terms</span>
  </div>
  <div id="panel-terms">
    <div class="filter"><svg class="ic" aria-hidden="true"><use href="#i-search"/></svg><input id="term-filter" type="search" placeholder="Filter terms" aria-label="Filter key terms" oninput="renderTerms()" autocomplete="off"></div>
    <div class="terms" id="term-list"></div>
  </div>
</div>
