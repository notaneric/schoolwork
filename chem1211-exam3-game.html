<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHEM 1211 Exam 3</title>
<style>
  :root {
    --bg: #F8F6F0; --card: #FFFEFA; --ink: #1E2A38; --muted: #5B6676; --line: #E6E0D2; --line-2: #D6CFBE;
    --green: #237A3B; --green-2: #2B9348; --green-edge: #1A5C2C; --green-soft: #E4F3E7; --green-ink: #1B5E2E;
    --yellow: #F4B400; --yellow-edge: #B98800; --yellow-soft: #FFF5D6;
    --coral: #E8613C; --coral-ink: #A93A16; --coral-soft: #FDEDE7; --coral-edge: #7E2A10;
    --lock: #DDD8CB; --lock-edge: #C2BCAD; --lock-ink: #7D7869;
    --focus: #2E6FD8;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  .app { max-width: 560px; margin: 0 auto; padding: 10px 16px 80px; }

  .hud { position: sticky; top: 8px; z-index: 5; display: flex; justify-content: center; gap: 2px; width: max-content; max-width: 100%; margin: 0 auto 14px; padding: 5px 6px; background: var(--card); border: 2px solid var(--line); border-radius: 999px; box-shadow: 0 3px 0 var(--line); }
  .stat { display: flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; font-weight: 800; font-variant-numeric: tabular-nums; transition: background-color .2s ease-out; }
  .stat svg { width: 22px; height: 22px; flex: none; }
  .stat small { font-size: 13px; font-weight: 700; color: var(--muted); }
  .stat.xp svg, .stat.stars svg { color: var(--yellow); }
  .stat.streak svg { color: var(--lock-ink); }
  .stat.streak.hot { background: var(--yellow-soft); }
  .stat.streak.hot svg { color: var(--coral); }
  @media (max-width: 360px) { .stat small.word { display: none; } }

  .title { text-align: center; margin: 6px 0 0; }
  h1 { margin: 0 0 4px; font-size: 28px; line-height: 1.2; font-weight: 800; letter-spacing: -.01em; }
  .when { margin: 0; color: var(--muted); font-weight: 600; }

  .path { display: flex; flex-direction: column; align-items: center; padding: 26px 0 4px; }
  .stop { display: flex; flex-direction: column; align-items: center; transform: translateX(var(--x, 0)); margin-bottom: 34px; }
  .nodewrap { position: relative; }
  .node { position: relative; z-index: 1; width: 78px; height: 78px; border: 0; border-radius: 50%; display: grid; place-items: center; cursor: pointer; background: var(--green-2); color: #FFFEFA; box-shadow: 0 7px 0 var(--green-edge); transition: transform .12s ease-out, box-shadow .12s ease-out; }
  .node svg { width: 36px; height: 36px; }
  .node:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--green-edge); }
  .node.locked { background: var(--lock); color: var(--lock-ink); box-shadow: 0 7px 0 var(--lock-edge); cursor: not-allowed; }
  .node.locked:active { transform: none; box-shadow: 0 7px 0 var(--lock-edge); }
  .node.boss { width: 92px; height: 92px; background: var(--yellow); color: var(--ink); box-shadow: 0 8px 0 var(--yellow-edge); }
  .node.boss:active { box-shadow: 0 3px 0 var(--yellow-edge); }
  .node.boss svg { width: 44px; height: 44px; }
  .node.boss.locked { background: var(--lock); color: var(--lock-ink); box-shadow: 0 8px 0 var(--lock-edge); }
  .node.shake { animation: shake .3s ease-out; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .ring { position: absolute; inset: -9px; border-radius: 50%; border: 4px solid var(--green-2); opacity: 0; pointer-events: none; animation: ring 1.8s ease-out infinite; }
  .ring.gold { border-color: var(--yellow); }
  @keyframes ring { 0% { transform: scale(.92); opacity: .55; } 100% { transform: scale(1.22); opacity: 0; } }
  .tag { position: absolute; z-index: 2; bottom: calc(100% + 16px); left: 50%; transform: translateX(-50%); padding: 5px 14px; border: 2px solid var(--line); border-radius: 12px; background: var(--card); color: var(--green); font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; box-shadow: 0 3px 0 var(--line); }
  .tag::after { content: ""; position: absolute; top: 100%; left: 50%; margin-left: -7px; border: 7px solid transparent; border-top-color: var(--line); }
  .label { margin-top: 14px; text-align: center; font-weight: 800; line-height: 1.25; }
  .label small { display: block; margin-bottom: 2px; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .label.dim { color: var(--muted); }
  .srow { display: flex; justify-content: center; gap: 2px; margin-top: 4px; }
  .srow svg { width: 18px; height: 18px; color: var(--lock); }
  .srow svg.on { color: var(--yellow); }
  .best { margin-top: 4px; font-size: 14px; font-weight: 700; color: var(--muted); }
  .reset { display: block; margin: 4px auto 0; padding: 10px; border: 0; background: none; color: var(--muted); font-size: 14px; font-weight: 600; text-decoration: underline; cursor: pointer; }
  .toast { position: fixed; left: 50%; bottom: 24px; z-index: 40; transform: translateX(-50%); padding: 10px 18px; border-radius: 999px; background: var(--ink); color: #FFFEFA; font-weight: 700; white-space: nowrap; }

  .topbar { display: flex; align-items: center; gap: 12px; margin: 0 0 18px; }
  .iconbtn { flex: none; width: 44px; height: 44px; display: grid; place-items: center; border: 2px solid var(--line); border-radius: 12px; background: var(--card); cursor: pointer; box-shadow: 0 3px 0 var(--line); }
  .iconbtn svg { width: 22px; height: 22px; }
  .bar { flex: 1; height: 16px; border-radius: 999px; background: var(--line); overflow: hidden; }
  .bar i { display: block; width: 0; height: 100%; border-radius: 999px; background: var(--green-2); transition: width .3s ease-out; }
  .count { flex: none; min-width: 40px; text-align: right; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
  .kicker { margin: 0; text-align: center; font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--green); }
  .lvl { margin: 2px 0 16px; text-align: center; font-size: 26px; }
  .box { margin: 0 0 16px; padding: 18px; background: var(--card); border: 2px solid var(--line); border-radius: 18px; box-shadow: 0 3px 0 var(--line); }
  .box h2 { margin: 0 0 12px; text-align: center; font-size: 19px; line-height: 1.3; }
  .pts { margin: 0; padding-left: 20px; }
  .pts li { margin: 7px 0; }
  .note { margin: 12px 0 0; text-align: center; font-size: 15px; color: var(--muted); }

  .btn { display: block; width: 100%; padding: 15px 18px; border: 0; border-radius: 16px; background: var(--green); color: #FFFEFA; font-size: 17px; font-weight: 800; letter-spacing: .02em; cursor: pointer; box-shadow: 0 5px 0 var(--green-edge); transition: transform .1s ease-out, box-shadow .1s ease-out; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--green-edge); }
  .btn:disabled { background: var(--lock); color: var(--lock-ink); box-shadow: 0 5px 0 var(--lock-edge); cursor: not-allowed; transform: none; }
  .btn.ghost { background: var(--card); color: var(--ink); border: 2px solid var(--line); box-shadow: 0 5px 0 var(--line); }
  .btn.ghost:active { box-shadow: 0 1px 0 var(--line); }
  .btn.miss { background: var(--coral-ink); box-shadow: 0 5px 0 var(--coral-edge); }
  .btn.miss:active { box-shadow: 0 1px 0 var(--coral-edge); }
  .btn + .btn { margin-top: 14px; }

  .qtop { min-height: 8px; margin-bottom: 8px; text-align: center; }
  .chip { display: inline-block; padding: 3px 11px; border-radius: 999px; background: var(--yellow-soft); color: var(--ink); font-size: 13px; font-weight: 800; }
  .prompt { margin: 0 0 18px; text-align: center; font-size: 21px; line-height: 1.35; font-weight: 800; }
  .tile { display: flex; align-items: center; gap: 12px; width: 100%; margin: 0 0 12px; padding: 13px 14px; text-align: left; border: 2px solid var(--line); border-radius: 14px; background: var(--card); cursor: pointer; box-shadow: 0 4px 0 var(--line); transition: transform .1s ease-out, border-color .15s ease-out; }
  .tile:hover:not(:disabled) { border-color: var(--green-2); }
  .tile:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
  .tile:disabled { cursor: default; }
  .tile .k { flex: none; width: 30px; height: 30px; display: grid; place-items: center; border: 2px solid var(--line); border-radius: 9px; font-size: 14px; font-weight: 800; color: var(--muted); }
  .tile.right { border-color: var(--green-2); background: var(--green-soft); box-shadow: 0 4px 0 var(--green-2); }
  .tile.right .k { border-color: var(--green-2); color: var(--green-ink); }
  .tile.wrong { border-color: var(--coral); background: var(--coral-soft); box-shadow: 0 4px 0 var(--coral); }
  .tile.wrong .k { border-color: var(--coral); color: var(--coral-ink); }
  .typein { display: block; width: 100%; margin: 0 0 16px; padding: 15px; border: 2px solid var(--line-2); border-radius: 14px; background: var(--card); color: var(--ink); font: inherit; font-size: 19px; text-align: center; }
  .typein:focus { outline: 3px solid var(--green-2); outline-offset: 2px; border-color: var(--green-2); }
  .typein:disabled { background: var(--bg); }
  .fb { margin: 6px 0 16px; padding: 14px 16px; border-radius: 16px; }
  .fb.ok { background: var(--green-soft); color: var(--green-ink); }
  .fb.no { background: var(--coral-soft); color: var(--coral-ink); }
  .fb .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 18px; font-weight: 800; }
  .fb p { margin: 6px 0 0; color: var(--ink); }
  .pop { flex: none; padding: 2px 10px; border-radius: 999px; background: var(--yellow); color: var(--ink); font-size: 14px; font-weight: 800; animation: pop .35s ease-out; }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .els { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  @media (max-width: 440px) { .els { grid-template-columns: repeat(3, 1fr); } }
  .el { padding: 8px 4px; text-align: center; border: 2px solid var(--line); border-radius: 12px; background: var(--card); }
  .el b { display: block; font-size: 24px; line-height: 1.15; }
  .el span { font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
  .el.hot { background: var(--yellow-soft); border-color: var(--yellow); }
  .els.states { grid-template-columns: repeat(3, 1fr); }
  @media (max-width: 440px) { .els.states { grid-template-columns: 1fr; } }
  .states .el b { font-size: 17px; }
  .states .el span { display: block; margin-top: 4px; font-size: 14px; font-weight: 600; line-height: 1.35; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th, td { padding: 8px 6px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
  th { font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  tr.sn td { border-top: 2px solid var(--line-2); }
  td.pol { font-weight: 800; }
  td.non { color: var(--muted); }
  .force { padding: 14px 0 0; margin-top: 14px; border-top: 1px solid var(--line); text-align: center; }
  .force:first-of-type { margin-top: 0; padding-top: 0; border-top: 0; }
  .force p { margin: 8px 0 0; text-align: left; }
  .steps { margin: 0; padding: 0; list-style: none; counter-reset: s; }
  .steps li { counter-increment: s; display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: start; margin: 0 0 12px; }
  .steps li::before { content: counter(s); width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; background: var(--green-2); color: #FFFEFA; font-weight: 800; }
  .vs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; text-align: center; }
  .vs .side { padding: 10px 6px; border: 2px solid var(--line); border-radius: 12px; line-height: 1.35; }
  .vs .side.hi { border-color: var(--green-2); background: var(--green-soft); }
  .vs .side b { display: block; }
  .vs .side span { display: block; font-weight: 800; font-variant-numeric: tabular-nums; }
  .vs em { font-style: normal; font-size: 13px; font-weight: 800; color: var(--muted); }
  .vsy { margin: 8px 0 18px; text-align: center; font-size: 15px; color: var(--muted); }
  .vsy:last-child { margin-bottom: 0; }

  .vid { position: relative; display: block; width: 100%; aspect-ratio: 16 / 9; padding: 0; border: 0; border-radius: 14px; overflow: hidden; background: var(--ink); cursor: pointer; }
  .vid img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .play { position: absolute; left: 50%; top: 50%; width: 68px; height: 68px; margin: -34px 0 0 -34px; display: grid; place-items: center; border-radius: 50%; background: var(--green); color: #FFFEFA; box-shadow: 0 5px 0 var(--green-edge); }
  .play svg { width: 30px; height: 30px; margin-left: 4px; }
  .vframe { display: block; width: 100%; aspect-ratio: 16 / 9; border: 0; border-radius: 14px; }
  .vmeta { margin: 10px 0 0; text-align: center; }
  .vmeta span { font-size: 15px; color: var(--muted); }
  .also { margin: 10px 0 0; text-align: center; font-size: 15px; }
  .also a { color: var(--green-ink); font-weight: 700; }
  .also span { color: var(--muted); }

  .result { text-align: center; }
  .result h2 { margin: 0 0 6px; font-size: 26px; }
  .result p { margin: 4px 0; }
  .big-stars { display: flex; justify-content: center; gap: 10px; margin: 6px 0 12px; }
  .big-stars svg { width: 64px; height: 64px; color: var(--lock); }
  .big-stars svg.on { color: var(--yellow); animation: starpop .45s ease-out both; }
  .big-stars svg.on:nth-child(2) { animation-delay: .15s; }
  .big-stars svg.on:nth-child(3) { animation-delay: .3s; }
  @keyframes starpop { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .gain { display: inline-block; margin: 12px 0 18px; padding: 6px 16px; border-radius: 999px; background: var(--yellow); font-size: 18px; font-weight: 800; }
  .clock { margin: 0 0 14px; text-align: center; font-size: 40px; line-height: 1; font-weight: 800; font-variant-numeric: tabular-nums; }
  .clock.low { color: var(--coral-ink); }
  .confetti { position: fixed; inset: 0; z-index: 50; pointer-events: none; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  .hint { margin: 8px auto 0; max-width: 34em; color: var(--muted); font-size: 15px; }
  .unit { align-self: stretch; margin: 0 0 64px; padding-top: 18px; text-align: center; border-top: 2px solid var(--line); }
  .unit:first-child { padding-top: 0; border-top: 0; }
  .unit small { display: block; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--green); }
  .unit b { display: block; margin-top: 2px; font-size: 20px; line-height: 1.25; }
  .unit span { display: block; margin-top: 2px; font-size: 14px; font-weight: 600; color: var(--muted); }
  .eq { margin: 0 0 12px; text-align: center; font-size: 17px; font-weight: 800; line-height: 1.4; }
  .stop .label { max-width: 200px; }
  @media (max-width: 400px) { .stop { transform: translateX(calc(var(--x, 0px) * .6)); } }
</style>
</head>
<body>
<div class="app">
  <div class="hud">
    <span class="stat xp" title="XP"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M13.5 2 4.5 13.5h6.2L9.5 22l9-11.5h-6.2z"/></svg><span id="h-xp">0</span><small class="word">XP</small></span>
    <span class="stat stars" title="Stars"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z"/></svg><span id="h-st">0</span><small>/48</small></span>
    <span class="stat streak" id="h-streak" title="Streak"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2.5c.6 3.2 4.8 5.3 4.8 10.2a4.8 4.8 0 0 1-9.6 0c0-2.4 1.2-4 2.4-5 .1 1.7.9 2.8 1.9 3.2-.1-3 .1-5.6.5-8.4z"/></svg><span id="h-sk">0</span><small class="word">streak</small></span>
  </div>
  <main id="view"></main>
</div>

<template id="lesson-1">
  <div class="box">
    <h2>Valence electrons</h2>
    <ul class="pts">
      <li>A main-group atom has as many valence electrons as its group A number: Li 1, Mg 2, B 3, C 4, N 5, O 6, F 7, Ne 8. Helium has 2.</li>
      <li>A Lewis symbol shows each valence electron as a dot around the element symbol. Dr. Meyers draws boron as one pair plus one single dot (2s^2 2p^1).</li>
    </ul>
  </div>
  <div class="box">
    <h2>Monatomic ions and ionic compounds</h2>
    <ul class="pts">
      <li>A cation has lost its valence electrons, so it shows no dots: [Li]^+, [Mg]^2+.</li>
      <li>An anion has gained electrons up to an octet. The nitride ion is N with 8 dots inside brackets and 3- outside: [N]^3-.</li>
      <li>An ionic compound is drawn as separate bracketed ions with their charges and no bond line. NaCl is [Na]^+ [Cl]^- with 8 dots on Cl. CaCl2 is [Cl]^- [Ca]^2+ [Cl]^-.</li>
    </ul>
  </div>
  <div class="box">
    <h2>Bonding pairs and lone pairs</h2>
    <ul class="pts">
      <li>A bonding pair is shared by two atoms and drawn as a line. A lone pair stays on one atom and is drawn as two dots.</li>
      <li>Water has 2 bonding pairs (the two O-H lines) and 2 lone pairs on O.</li>
    </ul>
    <div class="els">
      <div class="el"><b>H</b><span>1 bond</span></div>
      <div class="el"><b>C</b><span>4 bonds</span></div>
      <div class="el"><b>N</b><span>3 bonds</span></div>
      <div class="el"><b>O</b><span>2 bonds</span></div>
      <div class="el"><b>S</b><span>2 bonds</span></div>
      <div class="el"><b>Cl</b><span>1 bond</span></div>
    </div>
    <p class="note">Bonds each atom usually makes in a neutral molecule (Chapter 4 Part 2 worksheet, #2). It equals the electrons the atom still needs for an octet, or a duet for H.</p>
  </div>
</template>

<template id="lesson-2">
  <div class="box">
    <h2>The nine ions to memorize</h2>
    <div class="scroll">
      <table>
        <thead><tr><th>Name</th><th>Formula</th><th>Valence e-</th></tr></thead>
        <tbody>
          <tr><td>ammonium</td><td>NH4^+</td><td>8</td></tr>
          <tr><td>hydronium</td><td>H3O^+</td><td>8</td></tr>
          <tr><td>hydroxide</td><td>OH^-</td><td>8</td></tr>
          <tr><td>acetate</td><td>C2H3O2^-</td><td>24</td></tr>
          <tr><td>nitrate</td><td>NO3^-</td><td>24</td></tr>
          <tr><td>chlorate</td><td>ClO3^-</td><td>26</td></tr>
          <tr><td>carbonate</td><td>CO3^2-</td><td>24</td></tr>
          <tr><td>sulfate</td><td>SO4^2-</td><td>32</td></tr>
          <tr><td>phosphate</td><td>PO4^3-</td><td>32</td></tr>
        </tbody>
      </table>
    </div>
    <p class="note">The list from the Exam 2 study guide. Names, formulas and charges all count.</p>
  </div>
  <div class="box">
    <h2>Counting electrons in an ion</h2>
    <ul class="pts">
      <li>Add one electron for each negative charge. Remove one for each positive charge.</li>
      <li>NH4^+: 5 + 4(1) - 1 = 8. OH^-: 6 + 1 + 1 = 8. NO3^-: 5 + 3(6) + 1 = 24.</li>
      <li>CO3^2-: 4 + 3(6) + 2 = 24. SO4^2-: 6 + 4(6) + 2 = 32. PO4^3-: 5 + 4(6) + 3 = 32.</li>
      <li>Draw the finished ion inside brackets with its charge outside.</li>
    </ul>
  </div>
  <div class="box">
    <h2>Element names still count</h2>
    <p>Questions name compounds in words, like chlorine trifluoride or xenon trioxide, so you need the names and symbols of elements 1 to 36. Watch the look-alikes: Mg magnesium and Mn manganese, K potassium and P phosphorus, Si silicon and S sulfur, Co cobalt and Cu copper.</p>
  </div>
</template>

<template id="lesson-3">
  <div class="box">
    <h2>Dr. Meyers' six steps (Handout 13)</h2>
    <ol class="steps">
      <li><span><b>Sum the valence electrons.</b> Add one per negative charge, remove one per positive charge.</span></li>
      <li><span><b>Pick the central atom.</b> Usually the atom that makes more bonds, and usually the less electronegative one. H is never central.</span></li>
      <li><span><b>Place the terminal atoms</b> around it.</span></li>
      <li><span><b>Connect each terminal atom</b> to the center with a single bond.</span></li>
      <li><span><b>Fill octets, terminal atoms first.</b> Extra electrons go on the central atom. Short of electrons? Share a lone pair as a double or triple bond.</span></li>
      <li><span><b>Check formal charges</b> and that every electron was used.</span></li>
    </ol>
  </div>
  <div class="box">
    <h2>Worked: formaldehyde, CH2O (Handout 13, #4)</h2>
    <ul class="pts">
      <li>4 + 2(1) + 6 = 12 valence electrons. C is central: it makes 4 bonds, O makes 2, and H is never central.</li>
      <li>Three single bonds use 6 electrons. Three lone pairs on O use the other 6, but that leaves C with only 6 electrons.</li>
      <li>Share one O lone pair as a second bond. Final: C=O with 2 lone pairs on O and two C-H bonds. Every formal charge is 0.</li>
      <li>C=O is polar (3.5 - 2.5 = 1.0), so it gets an asterisk. C-H (0.4) does not.</li>
    </ul>
  </div>
  <div class="box">
    <h2>Quick ones</h2>
    <ul class="pts">
      <li>H2: 2 electrons, one H-H bond, no lone pairs.</li>
      <li>H2O: 8 electrons, two O-H bonds, 2 lone pairs on O.</li>
      <li>O2: 12 electrons. A single bond leaves one O with only 6, so O=O with 2 lone pairs on each O.</li>
      <li>N2: 10 electrons, N≡N with 1 lone pair on each N.</li>
    </ul>
  </div>
</template>

<template id="lesson-4">
  <div class="box">
    <h2>Single, double, triple</h2>
    <ul class="pts">
      <li>Bond order is the number of shared pairs: single 1, double 2, triple 3.</li>
      <li>More shared pairs pull the atoms closer and hold them tighter. Length: single &gt; double &gt; triple. Strength: triple &gt; double &gt; single.</li>
    </ul>
    <div class="scroll">
      <table>
        <thead><tr><th>Bond</th><th>Energy (kJ/mol)</th><th>Length (pm)</th></tr></thead>
        <tbody>
          <tr><td>C-C</td><td>347</td><td>154</td></tr>
          <tr><td>C=C</td><td>611</td><td>134</td></tr>
          <tr><td>C≡C</td><td>837</td><td>120</td></tr>
          <tr class="sn"><td>N-N</td><td>163</td><td>145</td></tr>
          <tr><td>N=N</td><td>418</td><td>123</td></tr>
          <tr><td>N≡N</td><td>946</td><td>110</td></tr>
          <tr class="sn"><td>C-O</td><td>360</td><td>143</td></tr>
          <tr><td>C=O</td><td>736</td><td>120</td></tr>
        </tbody>
      </table>
    </div>
    <p class="note">Values from Dr. Meyers' Oct 19 slides. A triple bond is stronger than a single bond, but for carbon it is only about 2.4 times as strong.</p>
  </div>
  <div class="box">
    <h2>Three ways to break the octet rule</h2>
    <div class="force"><span class="chip">Odd-electron</span><p>An odd electron total cannot pair up completely. NO has 11 and NO2 has 17, so one atom (N) ends with 7. These are free radicals.</p></div>
    <div class="force"><span class="chip">Incomplete octet</span><p>A group 3A central atom makes 3 bonds and stops at 6 electrons: BH3, BF3.</p></div>
    <div class="force"><span class="chip">Expanded octet</span><p>A central atom from row 3 or below (P, S, Cl, Br, I, Xe) can hold more than 8: PCl5 has 10, SF6 has 12, IBr3 has 10.</p></div>
    <p class="note">C, N, O and F always follow the octet rule. They never hold more than 8.</p>
  </div>
</template>

<template id="lesson-5">
  <div class="box">
    <h2>Formal charge</h2>
    <p class="eq">FC = valence e- - (lone-pair e- + ½ bonding e-)</p>
    <ul class="pts">
      <li>Shortcut: valence electrons minus (dots + lines) on that atom.</li>
      <li>The formal charges add up to the overall charge: 0 for a molecule, -1 for NO2^-.</li>
      <li>Dr. Meyers circles any nonzero formal charge next to the atom.</li>
    </ul>
  </div>
  <div class="box">
    <h2>Picking the best structure</h2>
    <ol class="steps">
      <li><span>It uses the correct number of valence electrons.</span></li>
      <li><span>Every atom has its octet, and C, N, O and F never go over 8.</span></li>
      <li><span>Formal charges are zero, or as close to zero as possible.</span></li>
    </ol>
    <p class="note">A central atom from row 3 or below may take more than 8 electrons to bring its formal charge to zero.</p>
  </div>
  <div class="box">
    <h2>Worked: chlorite, ClO2^- (Handout 13, #5)</h2>
    <ul class="pts">
      <li>7 + 2(6) + 1 = 20 electrons.</li>
      <li>All single bonds: every atom has an octet, but every atom also carries a formal charge (O -1, Cl +1, O -1). Valid, but not the best.</li>
      <li>O=Cl-O^- and its mirror image: only one O carries a charge, and Cl expands to 10 electrons, which a row 3 atom may do. Dr. Meyers calls these two equally the best.</li>
    </ul>
  </div>
  <div class="box">
    <h2>Resonance</h2>
    <ul class="pts">
      <li>Resonance structures keep every atom in place and move only electrons: the lone pairs and the multiple bonds.</li>
      <li>The real species is the average of its forms. Ozone, O3, has two equivalent forms, so each O-O bond has a bond order of 1.5.</li>
      <li>Nitrate (NO3^-) and carbonate (CO3^2-) have three forms each. Phosphate, drawn with one P=O, has four.</li>
    </ul>
  </div>
</template>

<template id="lesson-6">
  <div class="box">
    <h2>Steric number</h2>
    <ul class="pts">
      <li>SN = atoms bonded to the central atom + lone pairs on the central atom. A double or triple bond counts once.</li>
      <li>Electron-pair geometry places every group, lone pairs included. Molecular geometry names only where the atoms are.</li>
      <li>Lone pairs take more room than bonding pairs and squeeze the angles below the ideal, so you write &lt;120° or &lt;109.5°. The angles are only guaranteed ideal when the central atom has no lone pairs. Lone pairs placed symmetrically can still leave ideal angles: XeF2 stays at 180° and XeF4 at 90°.</li>
    </ul>
  </div>
  <div class="box">
    <h2>Shapes for SN 2 to 4 (Handout 14)</h2>
    <div class="scroll">
      <table>
        <thead><tr><th>SN</th><th>BP</th><th>LP</th><th>Shape</th><th>Angle</th><th>Example</th></tr></thead>

          <tr class="sn"><td>3</td><td>3</td><td>0</td><td>trigonal planar</td><td>120°</td><td>BF3, CH2O</td></tr>

    <p class="note">Electron-pair geometry by SN: 2 linear, 3 trigonal planar, 4 tetrahedral.</p>

  <div class="box">

    <ul class="pts">
      <li>CH2O: SN 3 (two H and one O, no lone pairs on C). Trigonal planar, 120°.</li>

      <li>PCl3: 26 electrons, so P has 3 bonds and 1 lone pair. SN 4, trigonal pyramidal, &lt;109.5°.</li>
    </ul>
  </div>
</template>

<template id="lesson-9">
  <div class="box">
    <h2>Bond polarity rules</h2>
    <ul class="pts">
      <li>Electronegativity is how strongly an atom pulls on the electrons it shares.</li>
      <li>Subtract the two values. 0 to 0.4 is a nonpolar bond, so C-H (0.4) counts as nonpolar. Above 0.4, up to 2.0, is polar. Above 2.0 is ionic.</li>
      <li>The atom that pulls harder gets the partial negative charge (δ−), and the other atom gets δ+. Dr. Meyers marks a polar bond with an asterisk.</li>
      <li>Shortcut: a bond from an NClOF atom to C, H, S or P is polar. Between two NClOF atoms, subtract: N-Cl is 0.0 (nonpolar), Cl-O is 0.5 (polar).</li>
    </ul>
  </div>
  <div class="box">
    <h2>Electronegativities to memorize</h2>
    <div class="els">
      <div class="el hot"><b>F</b><span>4.0</span></div>
      <div class="el hot"><b>O</b><span>3.5</span></div>
      <div class="el hot"><b>N</b><span>3.0</span></div>
      <div class="el hot"><b>Cl</b><span>3.0</span></div>
      <div class="el"><b>C</b><span>2.5</span></div>
      <div class="el"><b>H</b><span>2.1</span></div>
    </div>
    <p class="note">Other values: S 2.5, P 2.1, B 2.0, I 2.5, Xe 2.6.</p>
  </div>
  <div class="box">
    <h2>When a molecule is polar</h2>
    <ul class="pts">
      <li>A molecule is polar when it has polar bonds and a shape that keeps their dipoles from canceling.</li>
      <li>Draw each polar bond as an arrow pointing at its δ− atom. In a symmetric shape with identical outer atoms, the arrows cancel: CO2, BF3, CCl4.</li>
      <li>A lone pair on the central atom bends the shape, so the arrows add up: H2O, NH3, SO2.</li>
      <li>Different outer atoms also leave a net dipole: CH2O, CH2Cl2, CHCl3.</li>
      <li>Lone pairs placed symmetrically do not tip the balance: XeF4 (square planar) and XeF2 (linear) are nonpolar.</li>
    </ul>
  </div>
  <div class="box">
    <h2>Shapes and polarity</h2>
    <div class="scroll">
      <table>
        <thead><tr><th>SN</th><th>Shape</th><th>LP</th><th>Molecule</th><th>Example</th></tr></thead>
        <tbody id="pol"></tbody>
      </table>
    </div>
    <p class="note">LP is lone pairs on the central atom. Every row assumes polar bonds and identical outer atoms. A hydrocarbon (only C-H and C-C bonds) counts as nonpolar. Edge case: H2S and PH3 have lone pairs but bonds at or under the 0.4 cutoff (S-H 0.4, P-H 0.0); most textbooks call them weakly polar.</p>
  </div>
</template>

<template id="lesson-10">
  <div class="box">
    <h2>IMFs versus bonds</h2>
    <ul class="pts">
      <li>Intermolecular forces (IMFs) pull separate molecules toward each other. Bonds hold atoms together inside one molecule, and bonds are much stronger.</li>
      <li>Boiling pulls molecules apart. It overcomes IMFs, hydrogen bonds included, and breaks no covalent bonds, so steam is still H2O.</li>
    </ul>
  </div>
  <div class="box">
    <h2>Solids, liquids and gases</h2>
    <div class="els states">
      <div class="el"><b>Solid</b><span>definite shape and volume, incompressible</span></div>
      <div class="el"><b>Liquid</b><span>takes the container's shape, definite volume, mainly incompressible</span></div>
      <div class="el"><b>Gas</b><span>no definite shape or volume, compressible</span></div>
    </div>
    <ul class="pts" style="margin-top:14px">
      <li>Kinetic energy keeps particles moving apart (the disruptive force), and IMFs hold them together (the cohesive force). Raising the temperature raises kinetic energy.</li>
      <li>In a solid the cohesive forces win. In a gas the disruptive forces win.</li>
      <li>To turn a gas into a liquid, lower the temperature or raise the pressure.</li>
    </ul>
  </div>
  <div class="box">
    <h2>The three IMFs</h2>
    <div class="force"><span class="chip">Dispersion</span><p>Electrons shift for an instant and make a brief dipole that pulls on neighbors. Every molecule has it. More electrons mean higher polarizability, so stronger dispersion.</p></div>
    <div class="force"><span class="chip">Dipole-dipole</span><p>The δ+ end of one polar molecule attracts the δ− end of the next. Polar molecules only.</p></div>
    <div class="force"><span class="chip">Hydrogen bonding</span><p>An H bonded directly to N, O or F, attracted to a lone pair on an N, O or F in a nearby molecule. The strongest of the three for molecules of similar size.</p></div>
  </div>
  <div class="box">
    <h2>Finding the dominant IMF</h2>
    <ol class="steps">
      <li><span><b>Is an H bonded directly to N, O or F?</b> Hydrogen bonding: H2O, NH3, HF, CH3OH.</span></li>
      <li><span><b>If not, is the molecule polar?</b> Dipole-dipole: HCl, SO2, PCl3, CH2O, ICl, CHCl3.</span></li>
      <li><span><b>If not,</b> dispersion only: CH4, CO2, CCl4, I2.</span></li>
    </ol>
    <p class="note">The dominant IMF is the strongest type present, and every molecule also has dispersion. CH2O has H and O, but its H is bonded to C, so CH2O molecules cannot hydrogen-bond to each other.</p>
  </div>
  <div class="box">
    <h2>Worked: iodine trifluoride (Handout 14, problem 2)</h2>
    <ul class="pts">
      <li>Covalent: two nonmetals. Formula IF3.</li>
      <li>7 + 3(7) = 28 valence electrons. I goes in the center with single bonds to three F, three lone pairs on each F, and the last 4 electrons as 2 lone pairs on I. I is in row 5, so it can hold more than an octet.</li>
      <li>SN = 3 bonds + 2 lone pairs = 5. Electron geometry: trigonal bipyramidal. Molecular geometry: T-shaped. The F-I-F angles are a little under 90°, and the two axial F are a little under 180° apart.</li>
      <li>Polar: the I-F bonds are polar, and a T does not cancel.</li>
      <li>Dominant IMF: dipole-dipole. It is polar and has no H.</li>
    </ul>
  </div>
</template>

<template id="lesson-11">
  <div class="box">
    <h2>Boiling point rules</h2>
    <ul class="pts">
      <li>Stronger IMFs mean a higher boiling point. For molecules of similar size: hydrogen bonding &gt; dipole-dipole &gt; dispersion.</li>
      <li>More electrons mean stronger dispersion, so noble-gas boiling points rise from He to Xe.</li>
      <li>Shape counts too. Straight chains pack closer together than branched molecules, so their dispersion is stronger.</li>
    </ul>
  </div>
  <div class="box">
    <h2>Boiling points in pairs</h2>
    <div class="vs"><div class="side"><b>CH4</b>16 g/mol<span>−162 °C</span></div><em>vs</em><div class="side hi"><b>H2O</b>18 g/mol<span>100 °C</span></div></div>
    <p class="vsy">Same size. Water hydrogen-bonds.</p>
    <div class="vs"><div class="side"><b>Dimethyl ether</b>C2H6O<span>−24 °C</span></div><em>vs</em><div class="side hi"><b>Ethanol</b>C2H6O<span>78 °C</span></div></div>
    <p class="vsy">Same formula. Only ethanol has an O-H.</p>
    <div class="vs"><div class="side"><b>Isobutane</b>branched, C4H10<span>−11.7 °C</span></div><em>vs</em><div class="side hi"><b>Butane</b>straight chain, C4H10<span>−0.5 °C</span></div></div>
    <p class="vsy">Same formula. Butane molecules sit closer together, so their dispersion is stronger.</p>
    <div class="vs"><div class="side"><b>F2 and Cl2</b>gases</div><em>vs</em><div class="side hi"><b>I2</b>solid</div></div>
    <p class="vsy">At room temperature I2 is a solid because its extra electrons give it the strongest dispersion. Br2, in between, is a liquid.</p>
  </div>
  <div class="box">
    <h2>Solubility: like dissolves like</h2>
    <ul class="pts">
      <li>Polar and ionic substances dissolve in polar water. Nonpolar substances dissolve in nonpolar solvents like hexane.</li>
      <li>Hexane (C6H14) and water do not mix. They separate into two layers.</li>
      <li>I2 is nonpolar, so it dissolves in the hexane layer. KMnO4 is ionic, so it dissolves in the water layer, held there by ion-dipole forces between the ions and the polar water molecules.</li>
    </ul>
  </div>
  <div class="box">
    <h2>Handout 15, #1</h2>
    <div class="scroll">
      <table>
        <thead><tr><th>Species</th><th>Polarity</th><th>Dominant IMF</th><th>In water</th></tr></thead>
        <tbody>
          <tr><td>methane</td><td>nonpolar</td><td>dispersion</td><td>insoluble</td></tr>
          <tr><td>benzaldehyde</td><td>polar</td><td>dipole-dipole</td><td>slightly soluble</td></tr>
          <tr><td>glucose</td><td>polar</td><td>hydrogen bond</td><td>soluble</td></tr>
        </tbody>
      </table>
    </div>
    <p class="note">Handout 15, #2: helium (dispersion only) boils at −269 °C, acetone (dipole-dipole) at 56 °C.</p>
  </div>
</template>

<template id="lesson-12">
  <div class="box">
    <h2>Mass percent of an element</h2>
    <p class="eq">% element = mass of the element in 1 mol ÷ molar mass × 100</p>
    <ul class="pts">
      <li>Multiply each atomic mass by its subscript. Parentheses multiply too: Fe(NO3)3 has 3 N and 9 O.</li>
      <li>Use the periodic table on the exam: H 1.0079, C 12.011, N 14.007, O 15.999.</li>
      <li>A percent works as a conversion factor: 17.37 % N means 17.37 g N per 100 g of compound.</li>
    </ul>
  </div>
  <div class="box">
    <h2>Worked: N in Fe(NO3)3 (Handout 16, #1)</h2>
    <ul class="pts">
      <li>Molar mass: 55.845 + 3(14.007) + 9(15.999) = 241.857 g/mol.</li>
      <li>Nitrogen: 3(14.007) = 42.021 g.</li>
      <li>% N = 42.021 ÷ 241.857 × 100 = 17.37 %.</li>
    </ul>
  </div>
  <div class="box">
    <h2>Check the key</h2>
    <p>Chapter 6 worksheet #2 prints 175.03 g/mol for PF2Cl3 and 60.77 % Cl. The sum is 30.974 + 2(18.998) + 3(35.453) = 175.33 g/mol, so % Cl = 60.66 %. If you get 60.66 %, your work is right.</p>
  </div>
</template>

<template id="lesson-13">
  <div class="box">
    <h2>Empirical vs molecular</h2>
    <ul class="pts">
      <li>The molecular formula gives the actual atoms in one molecule. The empirical formula is the lowest whole-number ratio.</li>
      <li>Glucose, C6H12O6, has the empirical formula CH2O. Benzene, C6H6, is CH. H2O and CO2 are already empirical.</li>
      <li>Finding a molecular formula from a molar mass is not on Exam 3.</li>
    </ul>
  </div>
  <div class="box">
    <h2>From percent to formula</h2>
    <ol class="steps">
      <li><span><b>Get every percent.</b> If O is not given, it is 100 minus the rest.</span></li>
      <li><span><b>Assume 100.0 g</b>, so each percent becomes grams. Convert each to moles.</span></li>
      <li><span><b>Divide by the smallest</b> mole amount and round to the hundredths.</span></li>
      <li><span><b>Clear fractions</b> by multiplying every value by the same factor.</span></li>
    </ol>
    <div class="scroll">
      <table>
        <thead><tr><th>Ends in</th><th>.20</th><th>.25</th><th>.33</th><th>.40</th><th>.50</th><th>.67</th><th>.75</th><th>.80</th></tr></thead>
        <tbody><tr><td>Times</td><td>5</td><td>4</td><td>3</td><td>5</td><td>2</td><td>3</td><td>4</td><td>5</td></tr></tbody>
      </table>
    </div>
  </div>
  <div class="box">
    <h2>Worked: Chapter 6 worksheet #4</h2>
    <ul class="pts">
      <li>58.23 % C and 10.75 % H, so O = 31.02 %.</li>
      <li>C: 58.23 ÷ 12.011 = 4.848 mol. H: 10.75 ÷ 1.0079 = 10.67 mol. O: 31.02 ÷ 15.999 = 1.939 mol.</li>
      <li>Divide by 1.939: C 2.50, H 5.50, O 1.00. Halves, so double everything: C5H11O2.</li>
    </ul>
    <p class="note">Handout 16, #2 (52.14 % C, 13.13 % H, 34.73 % O) works out to C2H6O, the formula of both ethanol and dimethyl ether.</p>
  </div>
</template>

<template id="lesson-14">
  <div class="box">
    <h2>Solute and solvent</h2>
    <ul class="pts">
      <li>The solvent is the component present in the largest amount. Everything dissolved in it is a solute.</li>
      <li>Aqueous (aq) means water is the solvent.</li>
      <li>Natural gas (97 % methane): methane is the solvent, and ethane, CO2 and N2 are solutes. Rose gold (75 % gold): gold is the solvent, copper and silver are solutes. Dental amalgam (about 50 % mercury by mass, the rest a silver, tin and copper alloy): mercury is the largest single part, so it is the solvent.</li>
    </ul>
  </div>
  <div class="box">
    <h2>Molarity</h2>
    <p class="eq">M = mol solute ÷ L solution</p>
    <ul class="pts">
      <li>It is not on the formula sheet. Memorize it.</li>
      <li>Grams to M: g ÷ molar mass = mol, then ÷ L. M to grams: L × M = mol, then × molar mass.</li>
      <li>Convert mL to L first: 125 mL = 0.125 L.</li>
      <li>Ions multiply: 1 M CaCl2 gives [Ca^2+] = 1 M and [Cl^-] = 2 M.</li>
    </ul>
  </div>
  <div class="box">
    <h2>Worked: Handout 17, #2 and #4</h2>
    <ul class="pts">
      <li>4.83 g Na2S2O3 in 125 mL: 4.83 ÷ 158.11 = 0.03055 mol, then ÷ 0.125 L = 0.244 M.</li>
      <li>NaCl for 150. mL of 0.855 M: 0.150 L × 0.855 = 0.1283 mol, then × 58.443 = 7.50 g.</li>
    </ul>
  </div>
</template>

<template id="lesson-15">
  <div class="box">
    <h2>Three more units</h2>
    <div class="force"><span class="chip">% m/m, also called % w/w</span><p>g solute ÷ g solution × 100. The solution mass is solute plus solvent.</p></div>
    <div class="force"><span class="chip">% v/v</span><p>mL solute ÷ mL solution × 100. Rubbing alcohol is 70 % v/v isopropyl alcohol.</p></div>
    <div class="force"><span class="chip">ppm</span><p>g solute ÷ g solution × 10^6. In a dilute water solution, 1 ppm is about 1 mg per liter.</p></div>
    <p class="note">The formula sheet has % = part ÷ whole × 100, but not the 10^6 for ppm. Dr. Meyers' slides never define % v/v or ppm, so these follow the textbook's chapter 6 definitions.</p>
  </div>
  <div class="box">
    <h2>Worked: Handout 17, #3</h2>
    <ul class="pts">
      <li>2.52 g sucrose in 25.0 g water. Solution mass = 2.52 + 25.0 = 27.5 g.</li>
      <li>% m/m = 2.52 ÷ 27.5 × 100 = 9.16 %.</li>
      <li>Dividing by the 25.0 g of water alone gives 10.1 %, the classic mistake.</li>
    </ul>
  </div>
  <div class="box">
    <h2>Worked: Chapter 6 worksheet #9</h2>
    <ul class="pts">
      <li>1.15 M NaBr with a density of 1.08 g/mL. Take 1 L of solution.</li>
      <li>Solute: 1.15 mol × 102.89 g/mol = 118.3 g. Solution: 1000 mL × 1.08 g/mL = 1080 g.</li>
      <li>% m/m = 118.3 ÷ 1080 × 100 = 11.0 %. The 235 mL in the problem does not matter.</li>
    </ul>
  </div>
</template>

<template id="lesson-16">
  <div class="box">
    <h2>C1V1 = C2V2</h2>
    <ul class="pts">
      <li>Adding solvent lowers the concentration, but the moles of solute stay the same. That is why C1V1 = C2V2 works. It is on the formula sheet.</li>
      <li>1 is the stock you start with. 2 is the new solution.</li>
      <li>V2 is the total final volume, not the water you add.</li>
      <li>Always add acid to water.</li>
    </ul>
  </div>
  <div class="box">
    <h2>Worked: Handout 17, #5</h2>
    <ul class="pts">
      <li>9.00 mL of water is added to 1.00 mL of 0.325 M Cr^3+, so V2 = 10.00 mL.</li>
      <li>C2 = (0.325 M)(1.00 mL) ÷ 10.00 mL = 0.0325 M.</li>
    </ul>
  </div>
  <div class="box">
    <h2>Worked: Chapter 6 worksheet #10</h2>
    <ul class="pts">
      <li>Make 500. mL of 6 M HCl from 12 M HCl. The 12 M stock is the 1, and the new 6 M solution is the 2.</li>
      <li>V1 = (6 M)(500. mL) ÷ 12 M = 250. mL.</li>
      <li>Add 250. mL of 12 M HCl to 250. mL of water, for 500. mL total.</li>
    </ul>
  </div>
</template>
