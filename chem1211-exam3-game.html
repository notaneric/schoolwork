  { lv: 4, t: 'type', q: 'How many electrons surround P in PCl5?', ans: '10', re: '^10$', why: 'Five P-Cl bonds and no lone pairs on P.' },

  { lv: 5, t: 'mc', q: 'Formal charge equals', a: ['Valence electrons - (lone-pair electrons + ½ bonding electrons)', 'Valence electrons + lone-pair electrons - bonding electrons', 'Bonding electrons - lone-pair electrons', 'Number of bonds - number of lone pairs'], why: 'Shortcut: valence electrons minus (dots + lines) on that atom.' },
  { lv: 5, t: 'mc', q: 'What is the formal charge on O in water?', a: ['0', '-1', '+1', '-2'], why: 'O has 4 dots and 2 lines: 6 - (4 + 2) = 0.' },
  { lv: 5, t: 'mc', q: 'What is the formal charge on N in NH4^+?', a: ['+1', '0', '-1', '+4'], why: 'N has no dots and 4 lines: 5 - (0 + 4) = +1. The charges add to the ion charge, +1.' },
  { lv: 5, t: 'mc', q: 'What is the formal charge on O in OH^-?', a: ['-1', '0', '+1', '-2'], why: 'O has 3 lone pairs and 1 bond: 6 - (6 + 1) = -1. That is the circled minus in Dr. Meyers\' key.' },
  { lv: 5, t: 'mc', q: 'In a polyatomic ion, the formal charges add up to', a: ['The charge of the ion', 'Zero', 'The number of bonds', 'The number of lone pairs'], why: 'They add to 0 in a neutral molecule and to the ion charge in an ion, like -1 for NO2^-.' },
  { lv: 5, t: 'mc', q: 'By Dr. Meyers\' rules, the best Lewis structure has', a: ['The right electron count, octets where required, and formal charges closest to zero', 'The most double bonds', 'The most lone pairs on the central atom', 'Every formal charge on the central atom'], why: 'His NO2^- key: correct valence electrons, each atom has its octet, and formal charges equal to or closest to zero.' },
  { lv: 5, t: 'mc', q: 'For NO2^-, why is O=N=O with a lone pair on N not allowed?', a: ['N would hold 10 electrons, and N never exceeds an octet', 'N would hold only 6 electrons', 'The structure has only 16 electrons', 'O cannot form a double bond'], why: 'The count is right (18), but two double bonds plus a lone pair put 10 electrons on N. C, N, O and F never go over 8.' },
  { lv: 5, t: 'mc', q: 'In the best structure of NO2^-, the -1 formal charge sits on', a: ['The singly bonded O', 'N', 'The doubly bonded O', 'No atom, because every charge is zero'], why: 'O=N-O^-: N is 5 - (2 + 3) = 0, the double-bonded O is 6 - (4 + 2) = 0, and the single-bonded O is 6 - (6 + 1) = -1.' },
  { lv: 5, t: 'mc', q: 'Which chlorite (ClO2^-) structure did Dr. Meyers call best (Handout 13, #5)?', a: ['O=Cl-O^- and its mirror image', 'All single bonds, with a charge on every atom', 'Cl bonded to two O with no lone pairs on Cl', 'An O-O bond with Cl on the end'], why: 'Cl is in row 3, so it can take 10 electrons to bring its formal charge to 0, leaving one charged O. The all-single-bond form is valid but puts a charge on every atom.' },
  { lv: 5, t: 'mc', q: 'Resonance structures differ only in', a: ['Where the lone pairs and multiple bonds go', 'Where the atoms go', 'The total number of electrons', 'The overall charge'], why: 'The atoms stay put. Only electrons move between resonance forms.' },
  { lv: 5, t: 'mc', q: 'Ozone, O3, has two equivalent resonance forms. The bond order of each O-O bond is', a: ['1.5', '1', '2', '3'], why: 'One form has the double bond on the left and the other on the right. The real molecule averages them: (1 + 2) ÷ 2 = 1.5.' },
  { lv: 5, t: 'mc', q: 'How many resonance structures does nitrate, NO3^-, have?', a: ['3', '1', '2', '4'], why: 'The N=O double bond can sit on any of the three O atoms.' },
  { lv: 5, t: 'mc', q: 'Phosphate is drawn with one P=O and three P-O single bonds. The formal charge on P is', a: ['0', '+1', '-1', '+5'], why: 'P has no dots and 5 lines: 5 - 5 = 0. Each single-bonded O is -1, adding up to -3. P is in row 3, so it can hold 10 electrons.' },
  { lv: 5, t: 'type', q: 'What is the formal charge on C in CO2 (O=C=O)?', ans: '0', re: '^(0|zero)$', why: 'C has no dots and 4 lines: 4 - 4 = 0. Each O: 6 - (4 + 2) = 0.' },

  { lv: 6, t: 'mc', q: 'What is the steric number of C in CO2?', a: ['2', '4', '3', '6'], why: 'Two O atoms and no lone pairs on C. Each double bond counts once.' },
  { lv: 6, t: 'mc', q: 'Water: electron-pair geometry and molecular geometry?', a: ['Tetrahedral and bent', 'Bent and bent', 'Tetrahedral and tetrahedral', 'Trigonal planar and bent'], why: 'SN 4 (2 H + 2 lone pairs) gives a tetrahedral electron-pair geometry. Naming only the atoms gives bent.' },
  { lv: 6, t: 'mc', q: 'The molecular geometry of NH3 is', a: ['Trigonal pyramidal', 'Trigonal planar', 'Tetrahedral', 'T-shaped'], why: 'SN 4: 3 H + 1 lone pair.' },
  { lv: 6, t: 'mc', q: 'The H-N-H angle in NH3 is', a: ['Less than 109.5°', 'Exactly 109.5°', '120°', '90°'], why: 'The lone pair takes more room than a bond and squeezes the angles. Write <109.5°.' },
  { lv: 6, t: 'mc', q: 'BF3: shape and bond angle?', a: ['Trigonal planar, 120°', 'Trigonal pyramidal, <109.5°', 'T-shaped, <90°', 'Bent, <120°'], why: 'SN 3 with no lone pairs on B, so the angle is exactly 120°.' },
  { lv: 6, t: 'mc', q: 'SO2: shape and bond angle?', a: ['Bent, <120°', 'Linear, 180°', 'Bent, <109.5°', 'Trigonal planar, 120°'], why: 'Dr. Meyers draws O=S=O with a lone pair on S. SN 3 (2 O + 1 lone pair) gives bent, under 120°.' },
  { lv: 6, t: 'mc', q: 'The molecular geometry of PCl3 is', a: ['Trigonal pyramidal', 'Trigonal planar', 'T-shaped', 'Tetrahedral'], why: '26 electrons, so P has 3 bonds and 1 lone pair. SN 4, trigonal pyramidal, <109.5°.' },
  { lv: 6, t: 'mc', q: 'CH2O: shape and bond angle?', a: ['Trigonal planar, 120°', 'Tetrahedral, 109.5°', 'Bent, <120°', 'Trigonal pyramidal, <109.5°'], why: 'SN 3: two H and one O, with C=O counted once and no lone pairs on C.' },
  { lv: 6, t: 'mc', q: 'Which molecule has the smallest bond angle?', a: ['H2O', 'NH3', 'CH4', 'BF3'], why: 'Two lone pairs squeeze hardest: H2O about 104.5°, NH3 about 107°, CH4 109.5°, BF3 120°.' },
  { lv: 6, t: 'mc', q: 'How do electron-pair geometry and molecular geometry differ?', a: ['Electron-pair geometry counts lone pairs as positions; molecular geometry names only where the atoms are', 'They always have the same name', 'Molecular geometry counts lone pairs; electron-pair geometry ignores them', 'Electron-pair geometry only applies to ions'], why: 'They match only when the central atom has no lone pairs.' },
  { lv: 6, t: 'type', q: 'What is the steric number of C in CH4?', ans: '4', re: '^(4|four)$', why: '4 H atoms and no lone pairs: tetrahedral, 109.5°.' },
  { lv: 6, t: 'type', q: 'Ideal bond angle of a tetrahedral molecule, in degrees?', ans: '109.5', re: '^109\\.5(°|degrees?)?$', why: 'Tetrahedral is 109.5°. Lone pairs push it lower.' },
  { lv: 6, t: 'type', q: 'Bond angle in a linear molecule, in degrees?', ans: '180', re: '^180(°|degrees?)?$', why: 'Linear is 180°, as in CO2.' },

  { lv: 7, t: 'mc', q: 'The molecular geometry of SF4 is', a: ['Seesaw', 'Tetrahedral', 'Square planar', 'Trigonal pyramidal'], why: '34 electrons: S has 4 bonds and 1 lone pair, SN 5. The lone pair goes equatorial, which leaves a seesaw.' },
  { lv: 7, t: 'mc', q: 'The molecular geometry of ClF3 is', a: ['T-shaped', 'Trigonal planar', 'Trigonal pyramidal', 'Seesaw'], why: 'SN 5 with 2 lone pairs. Both go equatorial, so the three F atoms form a T.' },
  { lv: 7, t: 'mc', q: 'The molecular geometry of XeF2 is', a: ['Linear', 'Bent', 'T-shaped', 'Seesaw'], why: '22 electrons: Xe has 2 bonds and 3 lone pairs, SN 5. All three lone pairs sit equatorial, so F-Xe-F is 180°.' },
  { lv: 7, t: 'mc', q: 'The molecular geometry of XeF4 is', a: ['Square planar', 'Tetrahedral', 'Seesaw', 'Square pyramidal'], why: '36 electrons: Xe has 4 bonds and 2 lone pairs, SN 6. The second lone pair goes opposite the first.' },
  { lv: 7, t: 'mc', q: 'The molecular geometry of BrF5 is', a: ['Square pyramidal', 'Trigonal bipyramidal', 'Octahedral', 'Seesaw'], why: '42 electrons: Br has 5 bonds and 1 lone pair, SN 6.' },
  { lv: 7, t: 'mc', q: 'In a trigonal bipyramid, lone pairs go', a: ['Equatorial first', 'Axial first', 'Anywhere there is room', 'One axial, then one equatorial'], why: 'An equatorial position has only two neighbors at 90°, so it has more room (Handout 14, footnote 1).' },
  { lv: 7, t: 'mc', q: 'The bond angles in PCl5 are', a: ['90° (axial to equatorial) and 120° (equatorial to equatorial)', '109.5° only', '90° only', '120° only'], why: 'SN 5 with no lone pairs: trigonal bipyramidal.' },
  { lv: 7, t: 'mc', q: 'The F-Cl-F bond angle in ClF3 is predicted to be', a: ['Less than 90°', 'Exactly 90°', '120°', '109.5°'], why: 'T-shaped. The two lone pairs push the F atoms together, so each axial-to-equatorial F-Cl-F angle drops below 90° (Chapter 4 Part 2 worksheet, #4).' },
  { lv: 7, t: 'mc', q: 'What is the molecular geometry of IBr3?', a: ['T-shaped', 'Trigonal pyramidal', 'Trigonal planar', 'Seesaw'], why: '28 electrons, like ClF3. I has 3 bonds and 2 lone pairs, SN 5.' },
  { lv: 7, t: 'mc', q: 'XeO3, drawn with three Xe=O and one lone pair on Xe, has what shape?', a: ['Trigonal pyramidal', 'Trigonal planar', 'T-shaped', 'Tetrahedral'], why: 'Three O atoms + 1 lone pair = SN 4. Double bonds count once.' },
  { lv: 7, t: 'mc', q: 'The molecular geometry of SF6 is', a: ['Octahedral', 'Trigonal bipyramidal', 'Square planar', 'Hexagonal'], why: 'SN 6 with no lone pairs. Every angle between neighboring F atoms is 90°.' },
  { lv: 7, t: 'type', q: 'What is the steric number of Xe in XeF4?', ans: '6', re: '^(6|six)$', why: '4 F + 2 lone pairs.' },
  { lv: 7, t: 'type', q: 'How many lone pairs are on Cl in ClF3?', ans: '2', re: '^(2|two)$', why: '28 - 6 in bonds - 18 on the three F = 4 electrons, so 2 lone pairs on Cl.' },

  { lv: 8, t: 'mc', q: 'In ethane, H3C-CH3, each carbon is', a: ['Tetrahedral', 'Trigonal planar', 'Linear', 'Trigonal pyramidal'], why: 'Each C has 4 single bonds and no lone pairs: SN 4.' },
  { lv: 8, t: 'mc', q: 'In ethene, H2C=CH2, each carbon is', a: ['Trigonal planar', 'Tetrahedral', 'Linear', 'Bent'], why: 'Each C bonds to 3 atoms (2 H and the other C), and the double bond counts once: SN 3.' },
  { lv: 8, t: 'mc', q: 'In ethyne, HC≡CH, each carbon is', a: ['Linear', 'Trigonal planar', 'Tetrahedral', 'Bent'], why: 'Each C bonds to 2 atoms: SN 2, 180°.' },
  { lv: 8, t: 'mc', q: 'The oxygen in methanol, CH3-O-H, is', a: ['Bent', 'Linear', 'Trigonal planar', 'Tetrahedral'], why: 'O bonds to C and H and keeps 2 lone pairs: SN 4, bent, <109.5°.' },
  { lv: 8, t: 'mc', q: 'In glycine, H2N-CH2-COOH, the nitrogen is', a: ['Trigonal pyramidal', 'Trigonal planar', 'Tetrahedral', 'Bent'], why: 'N bonds to 2 H and C and keeps 1 lone pair: SN 4 (Handout 14, #3).' },
  { lv: 8, t: 'mc', q: 'In glycine, the carbon of the COOH group is', a: ['Trigonal planar', 'Tetrahedral', 'Linear', 'Trigonal pyramidal'], why: 'It bonds to C, O and O (C=O counts once) and has no lone pairs: SN 3.' },
  { lv: 8, t: 'mc', q: 'In glycine, the CH2 carbon is', a: ['Tetrahedral', 'Trigonal planar', 'Bent', 'Linear'], why: 'Four single bonds (N, C and 2 H): SN 4.' },
  { lv: 8, t: 'mc', q: 'In acetic acid, CH3COOH, the oxygen of the O-H group is', a: ['Bent', 'Linear', 'Trigonal planar', 'Trigonal pyramidal'], why: 'Bonded to C and H with 2 lone pairs: SN 4, bent.' },
  { lv: 8, t: 'mc', q: 'The nitrogen in methylamine, CH3-NH2, is', a: ['Trigonal pyramidal', 'Trigonal planar', 'Bent', 'Tetrahedral'], why: 'N bonds to C and 2 H and keeps 1 lone pair: SN 4.' },
  { lv: 8, t: 'mc', q: 'In HCN, the carbon is', a: ['Linear', 'Bent', 'Trigonal planar', 'Tetrahedral'], why: 'C bonds to H and N, and the triple bond counts once: SN 2.' },
  { lv: 8, t: 'type', q: 'Steric number of the carbonyl carbon (the C in C=O) in acetic acid?', ans: '3', re: '^(3|three)$', why: 'Bonded to CH3, =O and -OH, with no lone pairs: trigonal planar.' },
  { lv: 8, t: 'type', q: 'Steric number of the N in glycine?', ans: '4', re: '^(4|four)$', why: '3 atoms (2 H and C) + 1 lone pair: trigonal pyramidal.' },

  { lv: 9, t: 'mc', q: 'A bond whose electronegativity difference is 0.4 or less is', a: ['Nonpolar covalent', 'Polar covalent', 'Ionic', 'A hydrogen bond'], why: '0 to 0.4 is nonpolar. C-H (2.5 vs 2.1) is exactly 0.4, so C-H counts as nonpolar.' },
  { lv: 9, t: 'mc', q: 'Which bond is polar?', a: ['C-O', 'C-H', 'Cl-Cl', 'H-H'], why: 'C-O: 3.5 minus 2.5 is 1.0. C-H is 0.4, still nonpolar, and two identical atoms share electrons equally.' },
  { lv: 9, boss: true, t: 'mc', q: 'In an O-H bond, the partial negative charge (δ−) sits on', a: ['The oxygen', 'The hydrogen', 'Both atoms equally', 'Neither atom'], why: 'O (3.5) pulls harder than H (2.1), so the shared electrons sit closer to O.' },
  { lv: 9, t: 'mc', q: 'Which bond is the most polar?', a: ['H-F', 'O-H', 'N-H', 'C-H'], why: 'The differences are H-F 1.9, O-H 1.4, N-H 0.9 and C-H 0.4. The biggest difference is the most polar bond.' },
  { lv: 9, t: 'mc', q: 'Using N 3.0 and Cl 3.0, an N-Cl bond is', a: ['Nonpolar', 'Polar', 'Ionic', 'A hydrogen bond'], why: 'The difference is 0.0. Both are NClOF atoms, so subtract instead of using the shortcut.' },
  { lv: 9, boss: true, t: 'mc', q: 'A bond with an electronegativity difference of 2.5 is', a: ['Ionic', 'Polar covalent', 'Nonpolar covalent', 'A hydrogen bond'], why: 'Above 2.0 counts as ionic.' },
  { lv: 9, t: 'type', q: 'Electronegativity of oxygen?', ans: '3.5', re: '^3\\.50*$', why: 'NClOF: F 4.0, O 3.5, N 3.0, Cl 3.0.' },
  { lv: 9, t: 'type', q: 'Electronegativity of fluorine?', ans: '4.0', re: '^4(\\.0+)?$', why: 'Fluorine is the most electronegative element.' },
  { lv: 9, t: 'type', q: 'Electronegativity difference in a C-O bond?', ans: '1.0', re: '^1(\\.0+)?$', why: 'O 3.5 minus C 2.5 is 1.0, so C-O is polar.' },
  { lv: 9, t: 'mc', q: 'CO2 is nonpolar because', a: ['Its two C=O dipoles point in opposite directions and cancel', 'C=O bonds are nonpolar', 'Carbon has two lone pairs', 'The molecule is bent'], why: 'C=O is polar (a difference of 1.0), but CO2 is linear, so the two dipoles cancel exactly.' },
  { lv: 9, boss: true, t: 'mc', q: 'Which molecule is polar?', a: ['H2O', 'CO2', 'CH4', 'CCl4'], why: 'Water is bent, so its O-H dipoles add. The other three are symmetric: CO2 is linear, and CH4 and CCl4 are tetrahedral.' },
  { lv: 9, t: 'mc', q: 'Which molecule is nonpolar?', a: ['CCl4', 'CH2Cl2', 'NH3', 'HCl'], why: 'Four identical C-Cl dipoles in a tetrahedron cancel. CH2Cl2 has mixed outer atoms, NH3 has a lone pair, and HCl has a single polar bond.' },
  { lv: 9, t: 'mc', q: 'NH3 is polar mainly because', a: ['The lone pair on N makes it trigonal pyramidal, so the N-H dipoles do not cancel', 'N-H bonds are nonpolar', 'It is trigonal planar', 'Nitrogen forms a double bond with hydrogen'], why: 'Electron geometry tetrahedral, molecular geometry trigonal pyramidal. The three N-H dipoles all tilt the same way.' },
  { lv: 9, t: 'mc', q: 'Formaldehyde, CH2O, is', a: ['Polar, because the C=O dipole is not balanced by the two C-H bonds', 'Nonpolar, because every trigonal planar molecule is nonpolar', 'Nonpolar, because carbon has no lone pairs', 'Ionic'], why: 'Trigonal planar cancels only when all three outer atoms are the same. Here one is O and two are H.' },
  { lv: 9, boss: true, t: 'mc', q: 'SO2 is', a: ['Polar: the lone pair on S makes it bent', 'Nonpolar: it is linear like CO2', 'Nonpolar: S-O bonds are nonpolar', 'Nonpolar: the two S-O dipoles cancel'], why: 'SN 3 with 1 lone pair gives a bent shape. S-O is polar (2.5 vs 3.5), and a bent shape does not cancel.' },
  { lv: 9, t: 'mc', q: 'IF3 (T-shaped) is', a: ['Polar', 'Nonpolar, because all three outer atoms are F', 'Nonpolar, because I-F bonds are nonpolar', 'Ionic'], why: 'Identical outer atoms are not enough. The 2 lone pairs on I leave a T, and a T does not cancel.' },
  { lv: 9, t: 'type', q: 'CO2: polar or nonpolar?', ans: 'nonpolar', re: '^nonpolar(molecule)?$', why: 'Polar C=O bonds, but the linear shape cancels them.' },
  { lv: 9, boss: true, t: 'mc', q: 'A molecule with polar bonds can still be nonpolar when', a: ['Its symmetric shape makes the bond dipoles cancel', 'Its central atom has a lone pair', 'It contains hydrogen', 'It has a double bond'], why: 'Polarity needs polar bonds and a shape that keeps them from canceling. CO2 and CCl4 have polar bonds and are nonpolar.' },
  { lv: 9, boss: true, t: 'mc', q: 'BF3 is trigonal planar and every outer atom is F. The molecule is', a: ['Nonpolar', 'Polar, because each B-F bond is polar', 'Polar, because boron has a lone pair', 'Polar, because the molecule is bent'], why: 'Each B-F bond is polar, but three identical dipoles at 120° cancel. Boron has no lone pair in BF3.' },
  { lv: 9, boss: true, t: 'mc', q: 'XeF4 has two lone pairs on Xe yet is nonpolar, because', a: ['The lone pairs sit opposite each other, leaving a square planar shape whose Xe-F dipoles cancel', 'Xe-F bonds are nonpolar', 'Lone pairs never affect polarity', 'XeF4 is tetrahedral'], why: 'The second lone pair goes opposite the first (Handout 14, footnote 2). The four F sit in a flat square and cancel.' },
  { lv: 10, t: 'mc', q: 'Intermolecular forces are', a: ['Attractions between separate molecules', 'The covalent bonds inside a molecule', 'Attractions between the nucleus and electrons of one atom', 'The ionic bonds in a salt'], why: 'Inter means between. The bonds inside a molecule are intramolecular, and they are much stronger.' },
  { lv: 10, t: 'mc', q: 'When liquid water boils, what is overcome?', a: ['The hydrogen bonds between water molecules', 'The O-H covalent bonds inside each molecule', 'The forces inside the oxygen nucleus', 'Ionic bonds between H and O'], why: 'Boiling separates molecules from each other. The steam is still H2O, so no O-H bond broke.' },
  { lv: 10, t: 'mc', q: 'Which IMF is present in every molecule?', a: ['Dispersion forces', 'Dipole-dipole forces', 'Hydrogen bonding', 'Ion-dipole forces'], why: 'Every molecule has electrons that can shift for an instant. Dipole-dipole needs a polar molecule, and hydrogen bonding needs H on N, O or F.' },
  { lv: 10, boss: true, t: 'mc', q: 'Dispersion forces get stronger as molecules', a: ['Have more electrons, meaning larger and heavier molecules', 'Get smaller', 'Lose their lone pairs', 'Become more compact and ball-shaped'], why: 'A bigger electron cloud shifts more easily, so its brief dipoles are bigger.' },
  { lv: 10, t: 'mc', q: 'A hydrogen bond can form when H is bonded directly to', a: ['N, O or F', 'C', 'Any nonmetal', 'A metal'], why: 'N, O and F are very electronegative and small, so the δ+ H can get close to a lone pair on the next molecule. Cl matches N at 3.0 but is much larger, so HCl does not hydrogen-bond.' },
  { lv: 10, boss: true, t: 'mc', q: 'Dipole-dipole forces act between', a: ['Polar molecules', 'Nonpolar molecules only', 'Atoms inside one molecule', 'Noble-gas atoms'], why: 'The δ+ end of one polar molecule attracts the δ− end of the next.' },
  { lv: 10, t: 'type', q: 'Name the IMF that every molecule has.', ans: 'dispersion', re: '^((london(dispersion)?|dispersion)(force|forces)?|ldfs?)$', why: 'Dispersion, also called London dispersion.' },
  { lv: 10, boss: true, t: 'mc', q: 'As the number of electrons in a molecule rises, its polarizability', a: ['Rises, so dispersion gets stronger', 'Falls, so dispersion gets weaker', 'Rises, so dispersion gets weaker', 'Stays the same'], why: 'More electrons make a bigger cloud that shifts more easily. Higher polarizability means stronger dispersion.' },
  { lv: 10, t: 'mc', q: 'To turn a gas into a liquid, you can', a: ['Lower the temperature or raise the pressure', 'Raise the temperature or lower the pressure', 'Raise the temperature only', 'Lower the pressure only'], why: 'Less kinetic energy, or particles pushed closer together, lets the IMFs take over.' },
  { lv: 10, boss: true, t: 'mc', q: 'In a gas, which wins?', a: ['Disruptive forces (kinetic energy) win over cohesive forces', 'Cohesive forces (IMFs) win over disruptive forces', 'The two are always exactly equal', 'Neither acts in a gas'], why: 'Gas particles move fast enough to escape their IMFs. In a solid, the cohesive forces win.' },
  { lv: 10, boss: true, t: 'mc', q: 'Which state has a definite volume but no definite shape?', a: ['Liquid', 'Solid', 'Gas', 'None of them'], why: 'A liquid takes the shape of its container but keeps its volume. A solid keeps both; a gas keeps neither.' },
  { lv: 10, t: 'mc', q: 'The dominant IMF in methane, CH4, is', a: ['Dispersion', 'Dipole-dipole', 'Hydrogen bonding', 'Covalent bonding'], why: 'C-H bonds are nonpolar and the molecule is symmetric, so dispersion is all it has. Covalent bonds are not IMFs.' },
  { lv: 10, t: 'mc', q: 'Which IMF does HCl have that CH4 does not?', a: ['Dipole-dipole', 'Hydrogen bonding', 'Dispersion', 'None; they have the same IMFs'], why: 'HCl is polar (3.0 vs 2.1). Its H is bonded to Cl, which is not N, O or F, so no hydrogen bonding. Both have dispersion.' },
  { lv: 10, t: 'mc', q: 'The dominant IMF in ammonia, NH3, is', a: ['Hydrogen bonding', 'Dipole-dipole only', 'Dispersion only', 'Ionic bonding'], why: "H is bonded directly to N, and N has a lone pair for the next molecule's H." },
  { lv: 10, t: 'mc', q: 'The dominant IMF between formaldehyde (CH2O) molecules is', a: ['Dipole-dipole', 'Hydrogen bonding', 'Dispersion only', 'Ionic bonding'], why: 'CH2O has H and O, but the H is bonded to C, so it is not δ+ enough to hydrogen-bond. CH2O is polar, so dipole-dipole.' },
  { lv: 10, t: 'mc', q: 'The dominant IMF in methanol, CH3OH, is', a: ['Hydrogen bonding', 'Dipole-dipole', 'Dispersion only', 'Ionic bonding'], why: 'Its O-H puts an H directly on O.' },
  { lv: 10, t: 'mc', q: 'The dominant IMF in iodine trifluoride, IF3, is', a: ['Dipole-dipole', 'Hydrogen bonding', 'Dispersion only', 'Ionic bonding'], why: 'IF3 is T-shaped and polar, and it has no H at all.' },
  { lv: 10, t: 'type', q: 'Dominant IMF in water?', ans: 'hydrogen bonding', re: '^(hydrogen|h)(bond|bonds|bonding)(force|forces|interaction|interactions)?$', why: 'Water has H bonded directly to O.' },
  { lv: 10, t: 'type', q: 'Dominant IMF in SO2?', ans: 'dipole-dipole', re: '^dipole(dipole)?(force|forces|attraction|attractions|interaction|interactions)?$', why: 'SO2 is bent and polar, with no H.' },
  { lv: 10, boss: true, t: 'mc', q: 'The dominant IMF in CO2 is', a: ['Dispersion', 'Dipole-dipole', 'Hydrogen bonding', 'Ion-dipole'], why: 'Polar bonds, but the linear shape cancels them. A nonpolar molecule has dispersion only.' },
  { lv: 11, t: 'mc', q: 'Which has the highest boiling point?', a: ['H2O', 'CH4', 'CO2', 'O2'], why: 'Water hydrogen-bonds and boils at 100 °C. The other three are nonpolar and are all gases at room temperature.' },
  { lv: 11, t: 'mc', q: 'Ethanol and dimethyl ether share the formula C2H6O. Which boils higher, and why?', a: ['Ethanol, because its O-H lets it hydrogen-bond', 'Dimethyl ether, because it has stronger dispersion', 'Neither; the same formula means the same boiling point', 'Dimethyl ether, because only it is polar'], why: 'Ethanol boils at 78 °C and dimethyl ether at −24 °C. Same atoms, but only ethanol has H on O.' },
  { lv: 11, boss: true, t: 'mc', q: 'Which halogen is a solid at room temperature?', a: ['I2', 'F2', 'Cl2', 'Br2'], why: 'All four are nonpolar, so dispersion decides. I2 has the most electrons. Br2 is a liquid; F2 and Cl2 are gases.' },
  { lv: 11, t: 'mc', q: 'Boiling points of the noble gases from He to Xe', a: ['Rise, because dispersion grows with the number of electrons', 'Fall, because larger atoms are farther apart', 'Stay the same, because all are nonpolar', 'Rise, because heavier atoms hydrogen-bond'], why: 'Nonpolar atoms only have dispersion, and more electrons mean stronger dispersion.' },
  { lv: 11, t: 'mc', q: 'Butane (a straight chain) boils at −0.5 °C and isobutane (branched) at −11.7 °C, both C4H10. Why?', a: ['Butane molecules can sit closer together, so their dispersion forces are stronger', 'Butane hydrogen-bonds', 'Isobutane is polar', 'Butane has more electrons'], why: 'Same formula, same electrons. The branched shape keeps isobutane molecules farther apart, so they attract each other less.' },
  { lv: 11, boss: true, t: 'mc', q: 'As the IMFs in a liquid get stronger, its boiling point', a: ['Rises', 'Falls', 'Stays the same', 'Depends only on the covalent bonds'], why: 'More energy is needed to pull the molecules apart.' },
  { lv: 11, t: 'mc', q: 'For molecules of similar size, the IMFs rank from strongest to weakest as', a: ['Hydrogen bonding > dipole-dipole > dispersion', 'Dispersion > dipole-dipole > hydrogen bonding', 'Dipole-dipole > hydrogen bonding > dispersion', 'All three are about equal'], why: 'Propane (44 g/mol, dispersion) boils at −42 °C, dimethyl ether (46 g/mol, dipole-dipole) at −24 °C, and ethanol (46 g/mol, hydrogen bonding) at 78 °C.' },
  { lv: 11, t: 'type', q: 'Which boils higher, CH4 or H2O?', ans: 'H2O', re: '^(h2o|h20|water)$', why: 'Water hydrogen-bonds. Methane has dispersion only.' },

  { lv: 11, t: 'mc', q: 'Is methane soluble in water?', a: ['No: methane is nonpolar and water is polar', 'Yes: both contain hydrogen', 'Yes: methane hydrogen-bonds with water', 'Only when heated'], why: 'Like dissolves like. Methane has dispersion forces only (Handout 15, #1).' },
  { lv: 11, t: 'mc', q: 'Which IMFs are present in a sample of glucose?', a: ['Dispersion, dipole-dipole and hydrogen bonding', 'Hydrogen bonding only', 'Dipole-dipole only', 'Dispersion only'], why: 'Every molecule has dispersion. Glucose is polar, so dipole-dipole too, and its O-H groups add hydrogen bonding, the dominant one.' },
  { lv: 11, t: 'mc', q: 'Which IMFs are present in a sample of ClF3?', a: ['Dispersion and dipole-dipole', 'Dispersion only', 'Dipole-dipole and hydrogen bonding', 'All three'], why: 'ClF3 is polar, so dipole-dipole. It has no O-H, N-H or F-H bond, so no hydrogen bonding (Chapter 4 Part 2 worksheet, #7).' },
  { lv: 11, t: 'mc', q: 'Benzaldehyde, C6H5CHO, is a benzene ring carrying an H-C=O group. Its dominant IMF is', a: ['Dipole-dipole', 'Hydrogen bonding', 'Dispersion', 'Ion-dipole'], why: 'Every H is bonded to C, so there is no hydrogen bonding. The C=O makes the molecule polar, so its dominant IMF is dipole-dipole (Handout 15, #1). It is only slightly soluble in water because the polar C=O is a small part of a large nonpolar ring.' },
  { lv: 11, t: 'mc', q: 'Which has the higher boiling point, helium or acetone?', a: ['Acetone, because its dipole-dipole forces beat helium\'s weak dispersion', 'Helium, because it is a noble gas', 'They boil at the same temperature', 'Helium, because its atoms are smaller'], why: 'He boils at −269 °C and acetone at 56 °C (Handout 15, #2). A stronger IMF takes more energy to overcome.' },
  { lv: 11, t: 'mc', q: 'Hexane (C6H14) and water are poured together. They', a: ['Separate into two layers, because nonpolar hexane and polar water do not mix', 'Mix completely, because both are liquids', 'React to form a new compound', 'Mix, because both contain hydrogen'], why: 'Like dissolves like. Hexane is a nonpolar hydrocarbon.' },
  { lv: 11, t: 'mc', q: 'I2 is added to a funnel holding hexane and water. Where does it dissolve?', a: ['In the hexane', 'In the water', 'In both equally', 'In neither'], why: 'I2 is nonpolar, so it dissolves in nonpolar hexane.' },
  { lv: 11, t: 'mc', q: 'KMnO4 is added to the same funnel. Where does it dissolve?', a: ['In the water', 'In the hexane', 'In both equally', 'In neither'], why: 'KMnO4 is ionic. Polar water dissolves many ionic compounds through ion-dipole attractions.' },

  { lv: 12, t: 'mc', q: 'What is the mass percent of O in H2O?', a: ['88.81 %', '11.19 %', '33.33 %', '50.00 %'], why: '15.999 ÷ 18.015 × 100 = 88.81 %. 11.19 % is the hydrogen, and 33.33 % counts atoms instead of mass.' },
  { lv: 12, t: 'mc', q: 'What is the mass percent of N in Fe(NO3)3? (Handout 16, #1)', a: ['17.37 %', '5.79 %', '59.54 %', '11.89 %'], why: '3(14.007) ÷ 241.857 × 100 = 17.37 %. 5.79 % counts only one N, 59.54 % is the oxygen, and 11.89 % ignores the 3 outside the parentheses.' },
  { lv: 12, t: 'type', q: 'Mass percent of V in V2O5? Number only. (Chapter 6 worksheet #1)', ans: '56.02', re: '^56\\.0[12]?%?$', why: '2(50.942) ÷ 181.879 × 100 = 56.02 %. Rounded masses, like 101.88 ÷ 181.88, give 56.01 %, which is also accepted.' },
  { lv: 12, t: 'mc', q: 'What is the mass percent of Cl in PF2Cl3? (Chapter 6 worksheet #2)', a: ['60.66 %', '60.77 %', '20.22 %', '21.67 %'], why: '3(35.453) ÷ 175.33 × 100 = 60.66 %. The key prints 60.77 % because it used 175.03 g/mol, but 30.974 + 2(18.998) + 3(35.453) = 175.33.' },
  { lv: 12, t: 'mc', q: 'Which has the larger mass percent of carbon?', a: ['CO', 'CO2', 'They are equal', 'It depends on the sample size'], why: 'CO: 12.011 ÷ 28.010 = 42.88 %. CO2: 12.011 ÷ 44.009 = 27.29 %. Percent composition never depends on sample size.' },
  { lv: 12, t: 'mc', q: 'What is the mass percent of Na in NaCl?', a: ['39.34 %', '60.66 %', '50.00 %', '22.99 %'], why: '22.990 ÷ 58.443 × 100 = 39.34 %. 60.66 % is the chlorine.' },
  { lv: 12, t: 'type', q: 'Mass percent of C in CH4, to two decimal places? Number only.', ans: '74.87', re: '^74\\.87%?$', why: '12.011 ÷ 16.043 × 100 = 74.87 %.' },
  { lv: 12, t: 'mc', q: 'What is the mass percent of Ca in CaCO3?', a: ['40.04 %', '12.00 %', '47.96 %', '20.02 %'], why: '40.078 ÷ 100.086 × 100 = 40.04 %. 12.00 % is the carbon and 47.96 % is the oxygen.' },
  { lv: 12, t: 'mc', q: 'A compound is 17.37 % N. How many grams of N are in 200.0 g of it?', a: ['34.74 g', '17.37 g', '3474 g', '1151 g'], why: 'Use the percent as a conversion factor: 200.0 g × 17.37 g N per 100 g = 34.74 g N. 3474 g forgets to divide by 100.' },
  { lv: 12, t: 'mc', q: 'The mass percent of an element in a pure compound depends on', a: ['Only the formula', 'The size of the sample', 'The temperature', 'Whether the sample is solid or liquid'], why: 'Every sample of a pure compound has the same composition.' },

  { lv: 13, t: 'mc', q: 'The empirical formula of glucose, C6H12O6, is', a: ['CH2O', 'C6H12O6', 'C2H4O2', 'C3H6O3'], why: 'Divide every subscript by 6: CH2O.' },
  { lv: 13, t: 'mc', q: 'Which formula is already an empirical formula?', a: ['C2H6O', 'C2H4', 'C6H6', 'H2O2'], why: '2 : 6 : 1 cannot be reduced. C2H4 reduces to CH2, C6H6 to CH, and H2O2 to HO.' },
  { lv: 13, t: 'mc', q: 'A compound is 52.14 % C, 13.13 % H and 34.73 % O (Handout 16, #2). Its empirical formula is', a: ['C2H6O', 'CH3O', 'C2H5O', 'C3H8O'], why: 'Moles: C 4.341, H 13.03, O 2.171. Divide by 2.171: 2.00 : 6.00 : 1.00.' },
  { lv: 13, t: 'mc', q: 'After dividing by the smallest, you get C 1.00, H 2.50, O 1.00. The empirical formula is', a: ['C2H5O2', 'CH3O', 'CH2O', 'C2H5O'], why: 'A value ending in .50 means halves, so multiply every value by 2: 2 : 5 : 2.' },
  { lv: 13, t: 'mc', q: 'After dividing, you get C 1.00 and H 1.33. Multiply every value by', a: ['3', '2', '4', '1.33'], why: '.33 is a third, so multiply by 3 to get C3H4.' },
  { lv: 13, t: 'type', q: 'A C, H, O compound is 66.63 % C and 11.18 % H (Chapter 6 worksheet #3). Empirical formula, as CxHyOz?', ans: 'C4H8O', re: '^c4h8o1?$', why: 'O = 22.19 %. Moles: C 5.547, H 11.09, O 1.387. Divide by 1.387: 4.00 : 8.00 : 1.00.' },
  { lv: 13, t: 'mc', q: 'A problem gives only % C and % H for a compound of C, H and O. First step?', a: ['Find % O by subtracting from 100 %', 'Assume there is no oxygen', 'Divide % C by % H', 'Look up the molar mass of the compound'], why: 'Step 1: get every percent. The O is whatever is left.' },
  { lv: 13, t: 'mc', q: 'With a 100.0 g sample, 40.00 % C becomes', a: ['40.00 g C', '0.4000 g C', '40.00 mol C', '100.0 g C'], why: 'Assume 100.0 g, and each percent turns straight into grams. Then convert the grams to moles.' },
  { lv: 13, t: 'type', q: 'A compound is 40.00 % S and 60.00 % O. Empirical formula?', ans: 'SO3', re: '^so3$', why: 'S: 40.00 ÷ 32.065 = 1.247 mol. O: 60.00 ÷ 15.999 = 3.750 mol. 3.750 ÷ 1.247 = 3.01, so SO3.' },
  { lv: 13, t: 'type', q: 'A hydrocarbon is 85.62 % C and 14.38 % H. Empirical formula?', ans: 'CH2', re: '^c1?h2$', why: 'C: 7.128 mol. H: 14.27 mol. 14.27 ÷ 7.128 = 2.00, so CH2.' },
  { lv: 13, t: 'mc', q: 'How do a molecular formula and an empirical formula relate?', a: ['The molecular formula is a whole-number multiple of the empirical formula', 'They are always different', 'The empirical formula always has more atoms', 'The empirical formula shows the actual atoms in one molecule'], why: 'Glucose: C6H12O6 is 6 × CH2O. Sometimes the multiple is 1, as in H2O.' },
  { lv: 13, t: 'mc', q: 'Dividing by the smallest gives C 1.50, H 2.50, O 1.00. The empirical formula is', a: ['C3H5O2', 'C2H3O', 'C3H5O', 'CHO'], why: 'Values ending in .50 mean halves, so double everything: 3 : 5 : 2. Adipic acid, C6H10O4, has this empirical formula.' },

  { lv: 14, t: 'mc', q: 'In an aqueous NaOH solution, the solvent is', a: ['Water', 'NaOH', 'Both', 'Neither'], why: 'Aqueous means dissolved in water (Chapter 6 worksheet #5).' },
  { lv: 14, t: 'mc', q: 'Natural gas is 97 % methane, 1.5 % ethane, 1 % CO2 and 0.5 % N2. The solvent is', a: ['Methane', 'Ethane', 'Carbon dioxide', 'Dinitrogen'], why: 'The solvent is the component present in the largest amount. A solution can be a gas.' },
  { lv: 14, t: 'mc', q: 'Rose gold is 75 % gold, 22.25 % copper and 2.75 % silver. The solutes are', a: ['Copper and silver', 'Gold only', 'Gold and copper', 'Silver only'], why: 'Gold is the largest part, so it is the solvent. Everything else is a solute.' },
  { lv: 14, t: 'mc', q: 'Dental amalgam is about 50 % mercury by mass, mixed with a powdered silver, tin and copper alloy. The solvent is', a: ['Mercury', 'Silver', 'Tin', 'Copper'], why: 'Mercury is the largest single part, and it is the liquid the other metals dissolve in (Handout 17, #1c).' },
  { lv: 14, t: 'mc', q: 'Molarity is', a: ['Moles of solute per liter of solution', 'Moles of solute per liter of solvent', 'Grams of solute per liter of solution', 'Moles of solute per kilogram of solvent'], why: 'M = mol solute ÷ L solution. Moles per kilogram of solvent is molality, a different unit.' },
  { lv: 14, t: 'mc', q: '4.83 g of Na2S2O3 is dissolved to make 125 mL of solution (Handout 17, #2). Its molarity is', a: ['0.244 M', '0.0305 M', '38.6 M', '0.0386 M'], why: '4.83 g ÷ 158.11 g/mol = 0.03055 mol, then ÷ 0.125 L = 0.244 M. 0.0305 forgets to divide by the liters, and 38.6 divides grams by liters.' },
  { lv: 14, t: 'type', q: 'Mass of NaCl, in g, for 150. mL of 0.855 M NaCl? (Handout 17, #4)', ans: '7.50', re: '^7\\.50(g|gnacl)?$', why: '0.150 L × 0.855 mol/L = 0.1283 mol, then × 58.443 g/mol = 7.50 g. Three sig figs, so 7.50, not 7.5.' },
  { lv: 14, t: 'type', q: 'Molarity of 0.653 g NaOH in 350.0 mL of solution? (Chapter 6 worksheet #6)', ans: '0.0466', re: '^0?\\.0466(m|mnaoh)?$', why: '0.653 ÷ 39.997 = 0.01633 mol, then ÷ 0.3500 L = 0.0466 M.' },
  { lv: 14, t: 'mc', q: 'How many moles of solute are in 250. mL of 0.400 M glucose?', a: ['0.100 mol', '100. mol', '1.60 mol', '0.00160 mol'], why: '0.250 L × 0.400 mol/L = 0.100 mol. Convert mL to L first.' },
  { lv: 14, t: 'mc', q: 'What volume of 0.500 M KCl contains 0.125 mol of KCl?', a: ['250. mL', '62.5 mL', '4.00 L', '0.0625 mL'], why: '0.125 mol ÷ 0.500 mol/L = 0.250 L = 250. mL.' },
  { lv: 14, t: 'mc', q: 'In 0.150 M CaCl2, the concentration of Cl^- is', a: ['0.300 M', '0.150 M', '0.0750 M', '0.450 M'], why: 'Each CaCl2 releases 2 Cl^-: 2 × 0.150 = 0.300 M. [Ca^2+] is 0.150 M.' },
  { lv: 14, t: 'type', q: 'Mass of glucose (180.16 g/mol), in g, for 500. mL of 0.200 M solution?', ans: '18.0', re: '^18\\.0(g)?$', why: '0.500 L × 0.200 mol/L = 0.100 mol, then × 180.16 g/mol = 18.0 g. Three sig figs, so 18.0, not 18.' },

  { lv: 15, t: 'mc', q: '2.52 g of sucrose is dissolved in 25.0 g of water (Handout 17, #3). The % m/m is', a: ['9.16 %', '10.1 %', '2.52 %', '91.6 %'], why: 'Divide by the solution mass, 2.52 + 25.0 = 27.5 g: 9.16 %. 10.1 % divides by the water alone.' },
  { lv: 15, t: 'mc', q: '% v/v means', a: ['mL solute ÷ mL solution × 100', 'mL solute ÷ mL solvent × 100', 'g solute ÷ mL solution × 100', 'mol solute ÷ L solution × 100'], why: 'Volume of solute over the volume of the whole solution.' },
  { lv: 15, t: 'mc', q: '70.0 mL of isopropyl alcohol is diluted with water to 100.0 mL total. The % v/v is', a: ['70.0 %', '41.2 %', '30.0 %', '233 %'], why: '70.0 ÷ 100.0 × 100 = 70.0 %. The 100.0 mL is already the whole solution.' },
  { lv: 15, t: 'mc', q: 'Parts per million (ppm) is', a: ['g solute ÷ g solution × 10^6', 'g solute ÷ g solution × 100', 'mol solute ÷ L solution × 10^6', 'g solute ÷ g solvent × 1000'], why: 'The same idea as a percent, but per million instead of per hundred.' },
  { lv: 15, t: 'mc', q: 'A 1.0 kg water sample holds 0.0050 g of lead. Its concentration is', a: ['5.0 ppm', '0.0050 ppm', '5000 ppm', '0.50 ppm'], why: '0.0050 g ÷ 1000 g × 10^6 = 5.0 ppm. Convert kg to g first.' },
  { lv: 15, t: 'type', q: '15.0 g of NaCl in 135.0 g of water. % m/m? Number only.', ans: '10.0', re: '^10\\.0%?$', why: '15.0 ÷ (15.0 + 135.0) × 100 = 10.0 %. Three sig figs, so 10.0, not 10.' },
  { lv: 15, t: 'mc', q: 'How many grams of a 2.0 % m/m phenolphthalein solution hold 75 mg of phenolphthalein? (Chapter 6 worksheet #8)', a: ['3.8 g', '1.5 g', '0.0015 g', '37.5 g'], why: '0.075 g ÷ 0.020 = 3.75 g, or 3.8 g to 2 sig figs. 0.0015 g multiplies instead of dividing, and 1.5 g also skips the mg-to-g step.' },
  { lv: 15, t: 'mc', q: 'To turn a molarity into a % m/m, you also need', a: ['The density of the solution', 'The volume of the container', 'Avogadro\'s number', 'The boiling point'], why: 'Molarity uses liters of solution and % m/m uses grams of solution. Density links the two (Chapter 6 worksheet #9).' },
  { lv: 15, t: 'type', q: 'A 1.15 M NaBr solution has a density of 1.08 g/mL. Its % m/m? Number only. (Chapter 6 worksheet #9)', ans: '11.0', re: '^11\\.0%?$', why: 'In 1 L: 1.15 mol × 102.89 g/mol = 118.3 g NaBr in 1080 g of solution. 118.3 ÷ 1080 × 100 = 11.0 %. Three sig figs, so 11.0, not 11.' },
  { lv: 15, t: 'mc', q: 'Which unit suits a trace contaminant in drinking water?', a: ['ppm', '% m/m', '% v/v', 'Mass of solvent in kg'], why: 'Very small amounts give awkward percents. ppm (or ppb) keeps the numbers readable.' },
  { lv: 15, t: 'mc', q: 'In a dilute water solution, 1 ppm is about', a: ['1 mg per liter', '1 g per liter', '1 mg per mL', '1 g per 100 mL'], why: 'A liter of dilute solution weighs about 1000 g, and 1 mg in 1000 g is one part per million.' },

  { lv: 16, t: 'mc', q: 'In C1V1 = C2V2, V2 is', a: ['The total volume of the diluted solution', 'The volume of water added', 'The volume of the stock solution', 'The volume of solute'], why: 'V2 is the whole final solution, stock plus added water.' },
  { lv: 16, t: 'mc', q: '9.00 mL of water is added to 1.00 mL of 0.325 M Cr^3+ (Handout 17, #5). The new concentration is', a: ['0.0325 M', '0.0361 M', '3.25 M', '0.325 M'], why: 'V2 = 1.00 + 9.00 = 10.00 mL, so C2 = 0.325 × 1.00 ÷ 10.00 = 0.0325 M. 0.0361 M divides by the 9.00 mL of water only.' },
  { lv: 16, t: 'mc', q: 'To make 500. mL of 6 M HCl from 12 M HCl (Chapter 6 worksheet #10), you mix', a: ['250. mL of 12 M HCl with 250. mL of water', '500. mL of 12 M HCl with 500. mL of water', '250. mL of 12 M HCl with 500. mL of water', '1000 mL of 12 M HCl with 500. mL of water'], why: 'V1 = (6 M)(500. mL) ÷ 12 M = 250. mL. Water brings the total to 500. mL, and the acid goes into the water.' },
  { lv: 16, t: 'mc', q: 'Diluting a solution changes', a: ['Its concentration, but not the moles of solute', 'The moles of solute, but not the concentration', 'Both', 'Neither'], why: 'Only solvent is added, so the same moles spread through more volume.' },
  { lv: 16, t: 'type', q: '25.0 mL of 2.00 M NaCl is diluted to 100.0 mL. New molarity?', ans: '0.500', re: '^0?\\.500(m)?$', why: '2.00 × 25.0 ÷ 100.0 = 0.500 M. Three sig figs, so 0.500, not 0.5.' },
  { lv: 16, t: 'type', q: 'Volume of 6.0 M HCl, in mL, needed to make 300. mL of 1.5 M HCl?', ans: '75', re: '^75(ml)?$', why: 'V1 = 1.5 × 300. ÷ 6.0 = 75 mL. Add it to water and bring the total to 300. mL.' },
  { lv: 16, t: 'mc', q: 'When you dilute a concentrated acid, you', a: ['Add the acid to the water', 'Add the water to the acid', 'Pour both in at once', 'Can use either order'], why: 'Dr. Meyers: always add acid to water.' },
  { lv: 16, t: 'mc', q: 'From a 1.00 M stock, which gives 0.100 M?', a: ['10.0 mL diluted to 100.0 mL total', '10.0 mL plus 100.0 mL of water', '100.0 mL diluted to 10.0 mL', '1.00 mL diluted to 1000 mL'], why: '1.00 × 10.0 ÷ 100.0 = 0.100 M. Adding 100.0 mL of water makes 110.0 mL, which gives 0.0909 M.' },
  { lv: 16, t: 'mc', q: 'How much water must be added to 50.0 mL of 0.800 M KNO3 to make it 0.200 M?', a: ['150. mL', '200. mL', '12.5 mL', '40.0 mL'], why: 'V2 = 0.800 × 50.0 ÷ 0.200 = 200. mL total, so add 200. - 50.0 = 150. mL of water.' },
  { lv: 16, t: 'mc', q: '8 mol of solute in 1 L (8 M) is diluted to 3 L. The new concentration is', a: ['2.67 M', '24 M', '8 M', '0.375 M'], why: '8 × 1 ÷ 3 = 2.67 M. The same 8 mol now spread over 3 L. Dr. Meyers\' slide keeps three digits even though 8 and 3 have one sig fig.' },
];

const $ = (s, r) => (r || document).querySelector(s);

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const norm = s => String(s).trim().toLowerCase().replace(/[\s\-‐-―−_]/g, '').replace(/\.$/, '');

// formulas: a capital letter (plus optional lowercase) followed by digits gets the digits as a subscript;
// a caret marks a charge or exponent (SO4^2-, Cr^3+, 10^6) and becomes a superscript
function subify(root) {
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: n => /[A-Z][a-z]?\d|\^/.test(n.nodeValue) && !n.parentElement.closest('sub, sup, script, style') ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT,
  });
  const nodes = [];
  while (w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(n => {
    const t = document.createElement('template');
    t.innerHTML = esc(n.nodeValue).replace(/\^(\d*[+\-−])(?!\d)/g, '<sup>$1</sup>').replace(/\^([+\-−]?\d+)/g, '<sup>$1</sup>').replace(/([A-Z][a-z]?)(\d+)/g, '$1<sub>$2</sub>');
    n.replaceWith(t.content);
  });
}

function qBody(q) {

    return '<p class="prompt">' + esc(q.q) + '</p><input class="typein" id="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Your answer" placeholder="Your answer">' +

function wireQ(q, done) {

    const inp = $('#ans'), chk = $('#check');

      if (!inp.value.trim() || inp.disabled) return;

function renderQ() {

function celebrate() {
  if (reduced()) return;
  const c = document.createElement('canvas');
  c.className = 'confetti';
  document.body.appendChild(c);
  const W = c.width = window.innerWidth, H = c.height = window.innerHeight, ctx = c.getContext('2d');
  const cols = ['#2B9348', '#F4B400', '#E8613C', '#2E6FD8'];
  const P = Array.from({ length: 90 }, () => ({ x: W / 2, y: H * 0.32, vx: (Math.random() - 0.5) * 14, vy: -4 - Math.random() * 12, s: 5 + Math.random() * 6, c: cols[Math.floor(Math.random() * cols.length)], r: Math.random() * 6 }));
  const t0 = performance.now();
  (function frame(t) {
    ctx.clearRect(0, 0, W, H);
    P.forEach(p => {
      p.vy += 0.45; p.x += p.vx; p.y += p.vy; p.r += 0.2;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore();
    });
    if (t - t0 < 1100) requestAnimationFrame(frame); else c.remove();
  })(t0);
}

hud();
renderPath();
</script>
