<template id="lesson-1">
  <div class="box">
    <h2>Bond polarity rules</h2>
    <ul class="pts">
      <li>Electronegativity is how strongly an atom pulls on the electrons it shares.</li>
      <li>Subtract the two values. 0 to 0.4 is a nonpolar bond, so C-H (0.4) counts as nonpolar. Above 0.4, up to 2.0, is polar. Above 2.0 is ionic.</li>
      <li>The atom that pulls harder gets the partial negative charge (δ−), and the other atom gets δ+. Dr. Meyers marks a polar bond with an asterisk.</li>
      <li>Shortcut: a bond from an NClOF atom to C, H, S or P is polar. Between two NClOF atoms, subtract: N-Cl is 0.0 (nonpolar), Cl-O is 0.5 (polar).</li>
    </ul>
  </div>
  <div class="box">
    <h2>Electronegativities to memorize</h2>
    <div class="els">
      <div class="el hot"><b>F</b><span>4.0</span></div>
      <div class="el hot"><b>O</b><span>3.5</span></div>
      <div class="el hot"><b>N</b><span>3.0</span></div>
      <div class="el hot"><b>Cl</b><span>3.0</span></div>
      <div class="el"><b>C</b><span>2.5</span></div>
      <div class="el"><b>H</b><span>2.1</span></div>
    </div>
    <p class="note">Other values: S 2.5, P 2.1, B 2.0, I 2.5, Xe 2.6.</p>
  </div>
</template>

<template id="lesson-2">
  <div class="box">
    <h2>When a molecule is polar</h2>
    <ul class="pts">
      <li>A molecule is polar when it has polar bonds and a shape that keeps their dipoles from canceling.</li>
      <li>Draw each polar bond as an arrow pointing at its δ− atom. In a symmetric shape with identical outer atoms, the arrows cancel: CO2, BF3, CCl4.</li>
      <li>A lone pair on the central atom bends the shape, so the arrows add up: H2O, NH3, SO2.</li>
      <li>Different outer atoms also leave a net dipole: CH2O, CH2Cl2, CHCl3.</li>
      <li>Lone pairs placed symmetrically do not tip the balance: XeF4 (square planar) and XeF2 (linear) are nonpolar.</li>
    </ul>
  </div>
  <div class="box">
    <h2>Shapes and polarity</h2>
    <div class="scroll">
      <table>
        <thead><tr><th>SN</th><th>Shape</th><th>LP</th><th>Molecule</th><th>Example</th></tr></thead>
        <tbody id="pol"></tbody>
      </table>
    </div>
    <p class="note">LP is lone pairs on the central atom. Every row assumes polar bonds and identical outer atoms. A hydrocarbon (only C-H and C-C bonds) counts as nonpolar. Edge case: H2S and PH3 have lone pairs but bonds at or under the 0.4 cutoff (S-H 0.4, P-H 0.0); most textbooks call them weakly polar.</p>
  </div>
</template>

<template id="lesson-3">
  <div class="box">
    <h2>IMFs versus bonds</h2>
    <ul class="pts">
      <li>Intermolecular forces (IMFs) pull separate molecules toward each other. Bonds hold atoms together inside one molecule, and bonds are much stronger.</li>
      <li>Boiling pulls molecules apart. It overcomes IMFs, hydrogen bonds included, and breaks no covalent bonds, so steam is still H2O.</li>
    </ul>
  </div>
  <div class="box">
    <h2>Solids, liquids and gases</h2>
    <div class="els states">
      <div class="el"><b>Solid</b><span>definite shape and volume, incompressible</span></div>
      <div class="el"><b>Liquid</b><span>takes the container's shape, definite volume, mainly incompressible</span></div>
      <div class="el"><b>Gas</b><span>no definite shape or volume, compressible</span></div>
    </div>
    <ul class="pts" style="margin-top:14px">
      <li>Kinetic energy keeps particles moving apart (the disruptive force), and IMFs hold them together (the cohesive force). Raising the temperature raises kinetic energy.</li>
      <li>In a solid the cohesive forces win. In a gas the disruptive forces win.</li>
      <li>To turn a gas into a liquid, lower the temperature or raise the pressure.</li>
    </ul>
  </div>
  <div class="box">
    <h2>The three IMFs</h2>
    <div class="force"><span class="chip">Dispersion</span><p>Electrons shift for an instant and make a brief dipole that pulls on neighbors. Every molecule has it. More electrons mean higher polarizability, so stronger dispersion.</p></div>
    <div class="force"><span class="chip">Dipole-dipole</span><p>The δ+ end of one polar molecule attracts the δ− end of the next. Polar molecules only.</p></div>
    <div class="force"><span class="chip">Hydrogen bonding</span><p>An H bonded directly to N, O or F, attracted to a lone pair on an N, O or F in a nearby molecule. The strongest of the three for molecules of similar size.</p></div>
  </div>
</template>

<template id="lesson-4">
  <div class="box">
    <h2>Finding the dominant IMF</h2>
    <ol class="steps">
      <li><span><b>Is an H bonded directly to N, O or F?</b> Hydrogen bonding: H2O, NH3, HF, CH3OH.</span></li>
      <li><span><b>If not, is the molecule polar?</b> Dipole-dipole: HCl, SO2, PCl3, CH2O, ICl, CHCl3.</span></li>
      <li><span><b>If not,</b> dispersion only: CH4, CO2, CCl4, I2.</span></li>
    </ol>
    <p class="note">The dominant IMF is the strongest type present, and every molecule also has dispersion. CH2O has H and O, but its H is bonded to C, so CH2O molecules cannot hydrogen-bond to each other.</p>
  </div>
  <div class="box">
    <h2>Worked: iodine trifluoride (Handout 14, problem 2)</h2>
    <ul class="pts">
      <li>Covalent: two nonmetals. Formula IF3.</li>
      <li>7 + 3(7) = 28 valence electrons. I goes in the center with single bonds to three F, three lone pairs on each F, and the last 4 electrons as 2 lone pairs on I. I is in row 5, so it can hold more than an octet.</li>
      <li>SN = 3 bonds + 2 lone pairs = 5. Electron geometry: trigonal bipyramidal. Molecular geometry: T-shaped. The F-I-F angles are a little under 90°, and the two axial F are a little under 180° apart.</li>
      <li>Polar: the I-F bonds are polar, and a T does not cancel.</li>
      <li>Dominant IMF: dipole-dipole. It is polar and has no H.</li>
    </ul>
  </div>
</template>

<template id="lesson-5">
  <div class="box">
    <h2>Boiling point rules</h2>
    <ul class="pts">
      <li>Stronger IMFs mean a higher boiling point. For molecules of similar size: hydrogen bonding &gt; dipole-dipole &gt; dispersion.</li>
      <li>More electrons mean stronger dispersion, so noble-gas boiling points rise from He to Xe.</li>
      <li>Shape counts too. Straight chains pack closer together than branched molecules, so their dispersion is stronger.</li>
    </ul>
  </div>

// formulas: a capital letter (plus optional lowercase) followed by digits gets the digits as a subscript
function subify(root) {
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: n => /[A-Z][a-z]?\d/.test(n.nodeValue) && !n.parentElement.closest('sub, script, style') ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT,
  });
  const nodes = [];
  while (w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(n => {
    const t = document.createElement('template');
    t.innerHTML = esc(n.nodeValue).replace(/([A-Z][a-z]?)(\d+)/g, '$1<sub>$2</sub>');
    n.replaceWith(t.content);
  });
}

  let h = '<header class="title"><h1>Polarity and IMFs</h1><p class="when">Oct 26 and Oct 28 lectures</p></header><div class="path">';
  LEVELS.forEach((l, i) => {
    const st = S.stars[l.n] || 0, open = unlocked(l.n), state = !open ? 'locked' : st ? 'done' : 'open';
    h += '<div class="stop" style="--x:' + off[i] + 'px"><div class="nodewrap">' +
      (cur === l.n ? '<span class="tag">' + (S.xp ? 'Next' : 'Start') + '</span><span class="ring"></span>' : '') +
      '<button class="node ' + state + '" data-lv="' + l.n + '" aria-label="Level ' + l.n + ', ' + l.name + (state === 'locked' ? ', locked' : st ? ', ' + st + ' of 3 stars' : '') + '">' +
      (state === 'locked' ? ICON.lock : st ? ICON.check : ICON[l.icon]) + '</button></div>' +
      '<div class="label' + (open ? '' : ' dim') + '"><small>Level ' + l.n + '</small>' + l.name + '</div>' +
      (st ? starRow(st, 'srow') : '') + '</div>';
  });
  const bo = bossUnlocked();
  h += '<div class="stop"><div class="nodewrap">' + (cur === 'boss' ? '<span class="tag">Boss</span><span class="ring gold"></span>' : '') +
    '<button class="node boss' + (bo ? '' : ' locked') + '" id="boss" aria-label="Boss round' + (bo ? '' : ', locked') + '">' + (bo ? ICON.watch : ICON.lock) + '</button></div>' +
    '<div class="label' + (bo ? '' : ' dim') + '"><small>Boss round</small>3-minute quiz</div>' +
    (S.boss ? '<div class="best">Best: ' + S.boss + ' of 6</div>' : '') + '</div></div>' +
    '<button class="reset" id="reset">Reset progress</button>';
  show(h);
  document.querySelectorAll('.node[data-lv]').forEach(b => b.onclick = () => {
    const n = +b.dataset.lv;
    if (unlocked(n)) return openLevel(n);
    b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
    toast('Clear level ' + (n - 1) + ' first');
  });
  $('#boss').onclick = e => {
    if (bossUnlocked()) return openBoss();
    const b = e.currentTarget; b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
    toast('Clear all five levels first');
  };
  $('#reset').onclick = e => {
    const b = e.currentTarget;
    if (b.dataset.arm) { S = { xp: 0, stars: {}, boss: 0 }; streak = 0; save(); hud(); return renderPath(); }
    b.dataset.arm = '1'; b.textContent = 'Confirm reset';
    setTimeout(() => { if (b.isConnected) { delete b.dataset.arm; b.textContent = 'Reset progress'; } }, 4000);
  };
}

function videoBox(v) {
  return '<div class="box"><h2>Watch</h2>' +
    '<button class="vid" data-id="' + esc(v.id) + '" data-title="' + esc(v.title) + '" aria-label="Play video: ' + esc(v.title) + '"><img src="https://i.ytimg.com/vi/' + esc(v.id) + '/hqdefault.jpg" alt="" loading="lazy"><span class="play">' + ICON.play + '</span></button>' +
    '<p class="vmeta"><b>' + esc(v.title) + '</b><br><span>' + esc(v.ch) + ', ' + esc(v.dur) + '</span></p>' +
    (v.note ? '<p class="note">' + esc(v.note) + '</p>' : '') +
    (v.alt ? '<p class="also">Also good: <a href="https://www.youtube.com/watch?v=' + esc(v.alt.id) + '" target="_blank" rel="noopener">' + esc(v.alt.title) + '</a> <span>(' + esc(v.alt.ch) + ', ' + esc(v.alt.dur) + ')</span></p>' : '') +
    '</div>';
}
function wireVideo() {
  document.querySelectorAll('.vid').forEach(b => b.onclick = () => {
    const f = document.createElement('iframe');
    f.className = 'vframe';
    f.title = b.dataset.title;
    f.src = 'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(b.dataset.id) + '?autoplay=1&rel=0';
    f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
    f.allowFullscreen = true;
    b.replaceWith(f);
  });
}

function openLevel(n, replace) {
  stopTick(); boss = null;
  history[replace ? 'replaceState' : 'pushState']({ v: 'level' }, '');
  run = { n, gain: 0 };
  const l = LEVELS[n - 1], v = VIDEOS[n];
  show(topbar(0) + '<p class="kicker">Level ' + n + ' of 5</p><h1 class="lvl">' + l.name + '</h1><div id="lesson"></div>' +
    (v ? videoBox(v) : '') + '<button class="btn" id="go">Start practice (' + levelQs(n).length + ' questions)</button>');
  const lesson = $('#lesson');
  lesson.appendChild(document.getElementById('lesson-' + n).content.cloneNode(true));
  if (n === 2) {
    let last = 0;
    $('#pol').innerHTML = TABLE.map(r => {
      const first = r[0] !== last; last = r[0];
      return '<tr class="' + (first ? 'sn' : '') + '"><td>' + (first ? r[0] : '') + '</td><td>' + r[1] + '</td><td>' + r[2] + '</td>' +
        (r[3] ? '<td class="pol">polar</td>' : '<td class="non">nonpolar</td>') + '<td>' + esc(r[4]) + '</td></tr>';
    }).join('');
  }
  subify(lesson);
  wireVideo();
  $('#go').onclick = startLevel;
}
function startLevel() {
  Object.assign(run, { queue: shuffle(levelQs(run.n)), i: 0, right: 0, misses: [], fix: false });
  renderQ();
}

function qBody(q) {
  if (q.t === 'type') {
    return '<p class="prompt">' + esc(q.q) + '</p><input class="typein" id="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Your answer" placeholder="Your answer">' +
      '<div id="fb" aria-live="polite"></div><button class="btn" id="check" disabled>Check</button>';
  }
  curOpts = shuffle(q.a.map((t, i) => ({ t, right: i === 0 })));
  return '<p class="prompt">' + esc(q.q) + '</p>' +
    curOpts.map((o, i) => '<button class="tile" data-i="' + i + '"><span class="k">' + 'ABCD'[i] + '</span><span>' + esc(o.t) + '</span></button>').join('') +
    '<div id="fb" aria-live="polite"></div>';
}
function wireQ(q, done) {
  if (q.t === 'type') {
    const inp = $('#ans'), chk = $('#check');
    inp.oninput = () => { chk.disabled = !inp.value.trim(); };
    const go = () => {
      if (!inp.value.trim() || inp.disabled) return;
      inp.disabled = true; chk.remove();
      done(checkTyped(q, inp.value));
    };
    chk.onclick = go;
    inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); go(); } };
    inp.focus({ preventScroll: true });
    return;
  }
  document.querySelectorAll('.tile').forEach(b => b.onclick = () => {
    const o = curOpts[+b.dataset.i];
    document.querySelectorAll('.tile').forEach((x, i) => { x.disabled = true; if (curOpts[i].right) x.classList.add('right'); });
    if (!o.right) b.classList.add('wrong');
    done(o.right);
  });
}
function feedback(q, ok, pts, next) {
  const fb = $('#fb');
  const head = ok ? (streak >= 3 ? 'Correct, ' + streak + ' in a row' : 'Correct') : (q.t === 'type' ? 'Answer: ' + esc(q.ans) : 'Missed');
  fb.innerHTML = '<div class="fb ' + (ok ? 'ok' : 'no') + '"><div class="head"><span>' + head + '</span>' + (pts ? '<span class="pop">+' + pts + ' XP</span>' : '') + '</div><p>' + esc(q.why) + '</p></div>' +
    '<button class="btn' + (ok ? '' : ' miss') + '" id="next">Continue</button>';
  subify(fb);
  const nb = $('#next');
  nb.onclick = next;
  nb.focus({ preventScroll: true });
  nb.scrollIntoView({ block: 'nearest', behavior: reduced() ? 'auto' : 'smooth' });
}

function renderQ() {
  const list = run.fix ? run.misses : run.queue, idx = list[run.i], q = Q[idx];
  const prog = run.fix ? 1 : run.i / run.queue.length;
  const count = run.fix ? 'Retry' : (run.i + 1) + '/' + run.queue.length;
  const chip = run.fix ? '<span class="chip">Second try, ' + (run.i + 1) + ' of ' + run.misses.length + '</span>' : q.t === 'type' ? '<span class="chip">Type it: 20 XP</span>' : '';
  show(topbar(prog, count) + '<div class="qtop">' + chip + '</div>' + qBody(q));
  wireQ(q, ok => {
    const first = !run.fix;
    if (first) { if (ok) run.right++; else run.misses.push(idx); }
    let pts = 0;
    if (ok) {
      streak++;
      pts = gain(first ? (q.t === 'type' ? 20 : 10) + (streak >= 3 ? 5 : 0) : 5);
    } else { streak = 0; hud(); }
    if (first) $('.bar i').style.width = ((run.i + 1) / run.queue.length * 100) + '%';
    feedback(q, ok, pts, nextQ);
  });
}
function nextQ() {
  run.i++;
  const list = run.fix ? run.misses : run.queue;
  if (run.i < list.length) return renderQ();
  if (!run.fix && run.misses.length) { run.fix = true; run.i = 0; return renderQ(); }
  finishLevel();
}
function finishLevel() {
  const total = run.queue.length, acc = run.right / total, n = run.n;
  const stars = acc >= 0.9 ? 3 : acc >= 0.75 ? 2 : acc >= 0.6 ? 1 : 0;
  if (stars) { gain(10 * stars); S.stars[n] = Math.max(S.stars[n] || 0, stars); save(); hud(); }
  const last = n === LEVELS.length;
  show(topbar(1) + '<div class="box result">' + starRow(stars, 'big-stars') +
    '<h2>' + (stars ? 'Level ' + n + ' cleared' : 'Not cleared yet') + '</h2>' +
    '<p>' + run.right + ' of ' + total + ' right on the first try</p>' +
    (stars ? '' : '<p>Clearing it takes ' + Math.ceil(0.6 * total) + ' of ' + total + '.</p>') +
    '<span class="gain">+' + run.gain + ' XP</span>' +
    (stars
      ? '<button class="btn" id="fwd">' + (last ? 'Boss round' : 'Next level') + '</button><button class="btn ghost" id="again">Replay level</button>'
      : '<button class="btn" id="again">Try again</button><button class="btn ghost" id="home">Back to the path</button>') +
    '</div>');
  if ($('#fwd')) $('#fwd').onclick = () => last ? (bossUnlocked() ? openBoss(true) : goPath()) : openLevel(n + 1, true);
  $('#again').onclick = () => openLevel(n, true);
  if ($('#home')) $('#home').onclick = goPath;
  if (stars) celebrate();
}

function openBoss(replace) {
  stopTick(); run = null;
  history[replace ? 'replaceState' : 'pushState']({ v: 'boss' }, '');
  boss = { gain: 0 };
  show(topbar(0) + '<p class="kicker">Boss round</p><h1 class="lvl">3-minute quiz</h1><div class="box result">' +
    '<p>6 questions from all five levels, 15 XP each. The clock doesn\'t pause for explanations.</p>' +
    (S.boss ? '<p><b>Best: ' + S.boss + ' of 6</b></p>' : '') +
    '<p></p><button class="btn" id="go">Start the clock</button></div>');
  $('#go').onclick = startBoss;
}
function drawClock() {
  const c = $('#clock');
  if (!c) return;
  c.textContent = Math.floor(boss.left / 60) + ':' + String(boss.left % 60).padStart(2, '0');
  c.classList.toggle('low', boss.left <= 30);
  const b = $('.bar i');
  if (b) b.style.width = (boss.left / 180 * 100) + '%';
}
function startBoss() {
  const pool = Q.map((q, i) => i).filter(i => Q[i].t === 'mc');
  Object.assign(boss, { picks: shuffle(pool).slice(0, 6), i: 0, right: 0, left: 180, gain: 0 });
  stopTick();
  tick = setInterval(() => { boss.left--; drawClock(); if (boss.left <= 0) finishBoss(true); }, 1000);
  renderBossQ();
}
function renderBossQ() {
  const q = Q[boss.picks[boss.i]];
  show(topbar(boss.left / 180, (boss.i + 1) + '/6') + '<div class="clock" id="clock" role="timer"></div>' + qBody(q));
  drawClock();
  wireQ(q, ok => {
    let pts = 0;
    if (ok) { boss.right++; streak++; pts = gain(15); } else { streak = 0; hud(); }
    feedback(q, ok, pts, () => { boss.i++; if (boss.i < boss.picks.length) renderBossQ(); else finishBoss(false); });
  });
}
function finishBoss(timeUp) {
  stopTick();
  const r = boss.right, prev = S.boss || 0;
  if (r === boss.picks.length) gain(30);
  if (r > prev) { S.boss = r; save(); }
  show(topbar(1) + '<div class="box result"><p class="kicker">' + (timeUp ? 'Time' : 'Boss round') + '</p>' +
    '<h2>' + r + ' of 6 right</h2>' +
    '<p>' + (r > prev ? 'New best' : 'Best: ' + S.boss + ' of 6') + '</p>' +
    '<span class="gain">+' + boss.gain + ' XP</span>' +
    '<button class="btn" id="again">Run it again</button><button class="btn ghost" id="home">Back to the path</button></div>');
  $('#again').onclick = () => openBoss(true);
  $('#home').onclick = goPath;
  if (r >= 5) celebrate();
}

function celebrate() {
  if (reduced()) return;
  const c = document.createElement('canvas');
  c.className = 'confetti';
  document.body.appendChild(c);
  const W = c.width = window.innerWidth, H = c.height = window.innerHeight, ctx = c.getContext('2d');
  const cols = ['#2B9348', '#F4B400', '#E8613C', '#2E6FD8'];
  const P = Array.from({ length: 90 }, () => ({ x: W / 2, y: H * 0.32, vx: (Math.random() - 0.5) * 14, vy: -4 - Math.random() * 12, s: 5 + Math.random() * 6, c: cols[Math.floor(Math.random() * cols.length)], r: Math.random() * 6 }));
  const t0 = performance.now();
  (function frame(t) {
    ctx.clearRect(0, 0, W, H);
    P.forEach(p => {
      p.vy += 0.45; p.x += p.vx; p.y += p.vy; p.r += 0.2;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore();
    });
    if (t - t0 < 1100) requestAnimationFrame(frame); else c.remove();
  })(t0);
}

hud();
renderPath();
</script>
</body>
</html>
