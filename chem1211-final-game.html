  { lv: 15, t: 'mc', q: 'What is the name of CuSO4?', a: ['copper(II) sulfate', 'copper(I) sulfate', 'copper(II) sulfite', 'copper(II) sulfide'], why: 'SO4^2- carries -2, so copper must be +2. SO4 is sulfate. Sulfite is SO3^2-, and sulfide is S^2-.' },
  { lv: 15, t: 'mc', q: 'What is the name of (NH4)2CO3?', a: ['ammonium carbonate', 'diammonium carbonate', 'ammonia carbonate', 'ammonium carbide'], why: 'NH4^+ is ammonium and CO3^2- is carbonate. Ionic names do not use prefixes, so no di-. Ammonia is NH3, and carbide is C^4-.' },
  { lv: 15, t: 'mc', q: 'What is the name of Ca(OH)2?', a: ['calcium hydroxide', 'calcium dihydroxide', 'calcium hydroxate', 'calcium hydrogen oxide'], why: 'OH^- is hydroxide. Ca is in group 2A, so it has one charge and needs no numeral. Prefixes are for molecular compounds. Hydroxide has no -ate ending.' },
  { lv: 15, t: 'mc', q: 'What is the formula of sodium phosphate?', a: ['Na3PO4', 'NaPO4', 'Na2PO4', 'Na3PO3'], why: 'PO4^3- needs three Na^+ to balance. NaPO4 and Na2PO4 leave a negative charge. Phosphate is PO4, not PO3.' },
  { lv: 15, t: 'mc', q: 'What is the formula of iron(III) nitrate?', a: ['Fe(NO3)3', 'FeNO3', 'Fe(NO3)2', 'Fe3NO3'], why: 'The numeral gives Fe^3+, and NO3^- has a charge of -1, so three nitrates are needed, written in parentheses. FeNO3 would be iron(I) and Fe(NO3)2 would be iron(II).' },
  { lv: 15, t: 'mc', q: 'What is the formula of cobalt(III) sulfide?', a: ['Co2S3', 'CoS', 'Co3S2', 'Co2S'], why: '2 x (+3) = +6 and 3 x (-2) = -6. CoS would be cobalt(II). Co3S2 swaps the subscripts, and Co2S leaves the charges unbalanced.' },
  { lv: 15, t: 'mc', q: 'What is the formula of aluminum sulfate?', a: ['Al2(SO4)3', 'AlSO4', 'Al(SO4)3', 'Al3(SO4)2'], why: 'Al^3+ and SO4^2-: 2 x (+3) = +6 and 3 x (-2) = -6. Parentheses go around SO4 because it takes a subscript. Al3(SO4)2 swaps the subscripts, and AlSO4 and Al(SO4)3 leave the charge unbalanced.' },
  { lv: 15, t: 'mc', q: 'What is the name of CrCl3?', a: ['chromium(III) chloride', 'chromium(II) chloride', 'chromium(VI) chloride', 'chromium(III) chlorate'], why: 'Three Cl^- add up to -3, so Cr is +3. Chlorate is ClO3^-, and Cl^- is chloride. The numeral is the charge on the chromium ion.' },
  { lv: 15, t: 'mc', q: 'Why does chromium need a Roman numeral in its name when sodium does not?', a: ['Chromium can form more than one charge, while sodium always forms Na^+', 'Chromium is heavier than sodium', 'Chromium forms covalent bonds', 'The numeral counts the chromium atoms in the formula'], why: 'The numeral tells you which charge a transition metal has. Groups 1A, 2A and 3A have one charge each, so no numeral is needed. The numeral is the charge on one chromium ion, not a count of atoms.' },
  { lv: 15, t: 'mc', q: 'Which is the correct formula and charge of the chlorate ion?', a: ['ClO3^-', 'ClO2^-', 'ClO4^-', 'Cl^-'], why: 'Chlorate is ClO3^-. ClO4^- is perchlorate, ClO2^- is chlorite, and Cl^- is chloride.' },
  { lv: 15, t: 'mc', q: 'What is the name of Fe(NO3)2?', a: ['iron(II) nitrate', 'iron(III) nitrate', 'iron(II) nitride', 'iron(II) nitrite'], why: 'Two NO3^- give -2, so iron is +2. Nitrate is NO3^-. Nitride is N^3- and nitrite is NO2^-.' },
  { lv: 15, t: 'mc', q: 'Which symbol stands for manganese?', a: ['Mn', 'Mg', 'Mo', 'Ma'], why: 'Mn is manganese. Mg is magnesium and Mo is molybdenum. There is no element with the symbol Ma.' },
  { lv: 15, t: 'type', q: 'Type the name of Li3N.', ans: 'lithium nitride', re: '^lithiumnitride$', why: 'Li^+ and N^3-: the metal keeps its name and the nonmetal ends in -ide.' },
  { lv: 15, t: 'type', q: 'Type the formula of ammonium sulfate.', ans: '(NH4)2SO4', re: '^\\(nh4\\)2so4$', why: 'NH4^+ and SO4^2-: it takes two ammoniums to balance one sulfate, and NH4 goes in parentheses.' },
  { lv: 15, t: 'type', q: 'Type the name of FeCl3, with the Roman numeral in parentheses, like iron(II) chloride.', ans: 'iron(III) chloride', re: '^iron\\(iii\\)chloride$', why: 'Three Cl^- give -3, so iron is +3.' },
  { lv: 15, t: 'mc', boss: true, q: 'What is the name of Co(OH)3?', a: ['cobalt(III) hydroxide', 'cobalt(II) hydroxide', 'cobalt(III) oxide', 'cobalt(III) hydride'], why: 'Three OH^- give -3, so cobalt is +3. Cobalt(III) oxide would be Co2O3, and hydride is H^-, not OH^-.' },
  { lv: 15, t: 'mc', boss: true, q: 'What is the name of PbSO4?', a: ['lead(II) sulfate', 'lead(IV) sulfate', 'lead(II) sulfite', 'lead(II) sulfide'], why: 'Lead is a metal, so the compound is ionic. SO4^2- is -2, so lead is +2. Lead(IV) would need two sulfates. Sulfite and sulfide are SO3^2- and S^2-.' },
  { lv: 15, t: 'mc', boss: true, q: 'What is the formula of copper(I) carbonate?', a: ['Cu2CO3', 'CuCO3', 'Cu(CO3)2', 'Cu2(CO3)3'], why: 'Cu^+ and CO3^2-: two Cu^+ balance one carbonate. CuCO3 would be copper(II). Cu(CO3)2 and Cu2(CO3)3 do not balance the charges.' },

  { lv: 16, t: 'mc', q: 'What is the name of PCl5?', a: ['phosphorus pentachloride', 'monophosphorus pentachloride', 'phosphorus pentachlorine', 'phosphorus tetrachloride'], why: 'Prefix the second element: penta- for 5, and end in -ide. Mono- is never used on the first element. The element name chlorine becomes chloride. Tetra- would be PCl4.' },
  { lv: 16, t: 'mc', q: 'What is the name of N2O4?', a: ['dinitrogen tetroxide', 'dinitrogen dioxide', 'tetranitrogen dioxide', 'dinitrogen pentoxide'], why: 'Two N is di-, and four O is tetra-. The a drops before oxide, so tetroxide. The other names have the counts mixed up.' },
  { lv: 16, t: 'mc', q: 'What is the name of CO?', a: ['carbon monoxide', 'monocarbon monoxide', 'carbon dioxide', 'carbon monoxygen'], why: 'Mono- is never used on the first element, but it is used on the second. The o drops to give monoxide. Carbon dioxide is CO2, and the second element ends in -ide.' },
  { lv: 16, t: 'mc', q: 'What is the name of SF6?', a: ['sulfur hexafluoride', 'disulfur hexafluoride', 'sulfur pentafluoride', 'sulfur hexafluorine'], why: 'One S needs no prefix. Six F is hexa-, and fluorine becomes fluoride. Di- would mean two sulfurs, and penta- is five.' },
  { lv: 16, t: 'mc', q: 'What is the formula of dinitrogen pentoxide?', a: ['N2O5', 'N5O2', 'NO5', 'N2O3'], why: 'Di- is 2 N and pent- is 5 O. N5O2 swaps the counts, NO5 ignores the di-, and N2O3 would be dinitrogen trioxide.' },
  { lv: 16, t: 'mc', q: 'What is the formula of carbon disulfide?', a: ['CS2', 'C2S', 'CS', 'C2S2'], why: 'There is no prefix on carbon, so 1 C. Di- means 2 S. C2S swaps the counts, CS is carbon monosulfide, and C2S2 would need di- on carbon.' },
  { lv: 16, t: 'mc', q: 'What is the formula of sulfur trioxide?', a: ['SO3', 'S3O', 'S2O3', 'SO2'], why: 'One S and tri- means 3 O. S3O swaps the counts, S2O3 would be disulfur trioxide, and SO2 is sulfur dioxide.' },
  { lv: 16, t: 'mc', q: 'What is the formula of dichlorine heptoxide?', a: ['Cl2O7', 'Cl7O2', 'ClO7', 'Cl2O5'], why: 'Di- is 2 Cl and hept- is 7 O. Cl7O2 swaps the counts, ClO7 drops the di-, and Cl2O5 would be dichlorine pentoxide.' },
  { lv: 16, t: 'mc', q: 'Which compound is named with Greek prefixes?', a: ['N2O3', 'MgO', 'Al2O3', 'Na2O'], why: 'Only compounds of two nonmetals use prefixes, so N2O3 is dinitrogen trioxide. The others have a metal and are ionic, so they are named magnesium oxide, aluminum oxide and sodium oxide.' },
  { lv: 16, t: 'mc', q: 'What is the correct name for CaCl2?', a: ['calcium chloride', 'calcium dichloride', 'monocalcium dichloride', 'calcium chlorine'], why: 'Ca is a metal, so this is an ionic compound and takes no prefixes. The charges already fix the ratio. The nonmetal ends in -ide.' },
  { lv: 16, t: 'mc', q: 'What is the name of CCl4?', a: ['carbon tetrachloride', 'monocarbon tetrachloride', 'tetrachlorocarbon', 'carbon tetrachlorine'], why: 'No mono- on the first element. Four chlorines is tetra-, and chlorine becomes chloride. The element listed first in the formula is named first.' },
  { lv: 16, t: 'mc', q: 'What is the formula of xenon trioxide?', a: ['XeO3', 'Xe3O', 'XeO', 'Xe3O3'], why: 'Xe has no prefix, so 1 Xe. Tri- means 3 O. Xe3O swaps the counts, and XeO would be xenon monoxide.' },
  { lv: 16, t: 'mc', q: 'What is the name of ClF3?', a: ['chlorine trifluoride', 'chlorine trifluorine', 'trichlorine fluoride', 'chlorine fluoride'], why: 'Chlorine takes no prefix, and tri- goes with fluoride. The suffix on the second element is -ide. Leaving off the prefix gives no count at all, and even ClF is chlorine monofluoride.' },
  { lv: 16, t: 'type', q: 'Type the Greek prefix that means 5.', ans: 'penta', re: '^penta$', why: 'The prefixes are mono, di, tri, tetra, penta, hexa, hepta, octa, nona, deca.' },
  { lv: 16, t: 'type', q: 'Type the name of N2O5.', ans: 'dinitrogen pentoxide', re: '^dinitrogenpenta?oxide$', why: 'Two N is di-nitrogen. Five O is penta-, and the a drops before oxide.' },
  { lv: 16, t: 'type', q: 'Type the formula of phosphorus trichloride.', ans: 'PCl3', re: '^pcl3$', why: 'P takes no prefix, so 1 P. Tri- means 3 Cl.' },
  { lv: 16, t: 'mc', boss: true, q: 'What is the name of P2O5?', a: ['diphosphorus pentoxide', 'diphosphorus tetroxide', 'pentaphosphorus dioxide', 'diphosphorus pentoxygen'], why: 'Di- for 2 P and pent- for 5 O, with the a dropped before oxide. The tetroxide name would be P2O4, and pentaphosphorus dioxide swaps the counts. The second element ends in -ide, not -ygen.' },
  { lv: 16, t: 'mc', boss: true, q: 'Which pair of compounds are BOTH named with prefixes?', a: ['SiCl4 and N2O', 'CaCl2 and Na2O', 'FeO and CO', 'NaCl and CO2'], why: 'SiCl4 and N2O have no metal (Si is a metalloid), so both are molecular and take prefixes. CaCl2 and Na2O are ionic. FeO pairs a metal with a nonmetal, so it is ionic, and NaCl is ionic too.' },
  { lv: 16, t: 'mc', boss: true, q: 'What is the formula of diboron trioxide?', a: ['B2O3', 'B3O2', 'BO3', 'B2O'], why: 'Di- is 2 B and tri- is 3 O. B3O2 swaps the counts, BO3 drops the di-, and B2O would be diboron monoxide.' },

  { lv: 17, t: 'mc', q: 'How many valence electrons does a neutral sulfur atom have?', a: ['6', '16', '4', '2'], why: 'S is in group 6A, so it has 6 valence electrons (3s^2 3p^4). 16 is its atomic number.' },
  { lv: 17, t: 'mc', q: 'How many dots go around B in the Lewis symbol of a boron atom?', a: ['3', '5', '2', '8'], why: 'Boron is in group 3A, so 3 valence electrons. Dr. Meyers draws one pair and one single dot.' },
  { lv: 17, t: 'mc', q: 'Which is the Lewis structure of the lithium ion?', a: ['[Li]^+ with no dots', 'Li with one dot', '[Li]^+ with eight dots', '[Li]^- with two dots'], why: 'Li gives up its one valence electron. Nothing is left to show, so it is written [Li]^+ with no dots.' },
  { lv: 17, t: 'mc', q: 'How many dots surround N in the Lewis structure of the nitride ion, N^3-?', a: ['8', '5', '3', '2'], why: 'N has 5 valence electrons and gains 3, giving 8. The ion goes in brackets with 3- outside.' },
  { lv: 17, t: 'mc', q: 'How is the Lewis structure of NaCl drawn?', a: ['[Na]^+ and [Cl]^- as separate bracketed ions, with 8 dots on Cl', 'Na-Cl with a single bond line', 'Na=Cl with a double bond', 'One neutral NaCl unit sharing 8 dots'], why: 'NaCl is ionic. The electron is transferred, not shared, so there is no bond line.' },
  { lv: 17, t: 'mc', q: 'Which Lewis structure fits CaCl2?', a: ['[Cl]^- [Ca]^2+ [Cl]^-, with 8 dots on each Cl and none on Ca', 'Cl-Ca-Cl with two single bonds', '[Ca]^2+ [Cl2]^2-, with Cl2 drawn as one unit', 'Ca=Cl with a double bond to one Cl'], why: 'Ca loses 2 electrons and each Cl gains 1. Ionic compounds are drawn as separate ions with their charges.' },
  { lv: 17, t: 'mc', q: 'A lone pair is', a: ['Two valence electrons that stay on one atom', 'Two electrons shared between two atoms', 'Any electron in an inner shell', 'A single unpaired electron'], why: 'A bonding pair is shared and drawn as a line. A lone pair belongs to one atom and is drawn as two dots.' },
  { lv: 17, t: 'mc', q: 'How many bonding pairs and lone pairs does water have?', a: ['2 bonding pairs and 2 lone pairs on O', '2 bonding pairs and no lone pairs', '4 bonding pairs and 2 lone pairs', '1 bonding pair and 3 lone pairs'], why: '8 valence electrons. The two O-H bonds use 4, and the other 4 sit on O as 2 lone pairs.' },
  { lv: 17, t: 'mc', q: 'In a neutral molecule, nitrogen usually makes how many bonds?', a: ['3', '4', '2', '5'], why: 'N has 5 valence electrons and needs 3 more for an octet: 3 bonds plus 1 lone pair, as in NH3.' },
  { lv: 17, t: 'type', q: 'How many bonds does carbon usually make in a neutral molecule?', ans: '4', re: '^(4|four)$', why: 'C has 4 valence electrons and needs 4 more: 4 bonds and no lone pairs, as in CH4.' },
  { lv: 17, t: 'type', q: 'How many bonds does sulfur usually make in a neutral molecule?', ans: '2', re: '^(2|two)$', why: 'S, like O, has 6 valence electrons and needs 2 more (Chapter 4 Part 2 worksheet, #2).' },
  { lv: 17, t: 'type', q: 'How many dots surround Mg in the Lewis structure of the Mg^2+ ion?', ans: '0', re: '^(0|zero|none)$', why: 'Mg gives up both valence electrons, so [Mg]^2+ shows no dots.' },

  { lv: 18, t: 'mc', q: 'Sulfate is', a: ['SO4^2-', 'SO3^2-', 'SO4^-', 'S2O4^2-'], why: 'Sulfate is SO4^2-. SO3^2- is sulfite, which is not on the list.' },
  { lv: 18, t: 'mc', q: 'Phosphate is', a: ['PO4^3-', 'PO3^3-', 'PO4^2-', 'P2O4^3-'], why: 'Phosphate is PO4^3-, with 5 + 4(6) + 3 = 32 valence electrons.' },
  { lv: 18, t: 'mc', q: 'Ammonium is', a: ['NH4^+', 'NH3^+', 'NH4^-', 'NH3'], why: 'Ammonium is NH4^+. NH3 is ammonia, a neutral molecule.' },
  { lv: 18, t: 'mc', q: 'Hydronium is', a: ['H3O^+', 'H2O^+', 'OH^-', 'H3O^-'], why: 'Hydronium is H3O^+, a water molecule plus an H^+. OH^- is hydroxide.' },
  { lv: 18, t: 'mc', q: 'Chlorate is', a: ['ClO3^-', 'ClO4^-', 'ClO2^-', 'Cl^-'], why: 'Chlorate is ClO3^-. ClO4^- is perchlorate, ClO2^- is chlorite (Handout 13, #5), and Cl^- is chloride.' },
  { lv: 18, t: 'mc', q: 'Carbonate is', a: ['CO3^2-', 'CO3^-', 'CO2^2-', 'C2O4^2-'], why: 'Carbonate is CO3^2-, with 4 + 3(6) + 2 = 24 valence electrons.' },
  { lv: 18, t: 'mc', q: 'Acetate is', a: ['C2H3O2^-', 'C2H3O2^+', 'CH3O^-', 'C2H5O^-'], why: 'Acetate is C2H3O2^-, also written CH3COO^-.' },
  { lv: 18, t: 'type', q: 'Name the ion OH^-.', ans: 'hydroxide', re: '^hydroxide(ion)?$', why: 'OH^- is hydroxide. It has 8 valence electrons and a -1 formal charge on O.' },
  { lv: 18, t: 'type', q: 'Name the ion NO3^-.', ans: 'nitrate', re: '^nitrate(ion)?$', why: 'NO3^- is nitrate. NO2^- is nitrite.' },
  { lv: 18, t: 'type', q: 'How many valence electrons are in the carbonate ion, CO3^2-?', ans: '24', re: '^24$', why: '4 + 3(6) + 2 = 24. Add 2 for the 2- charge.' },
  { lv: 18, t: 'mc', q: 'How many valence electrons are in NH4^+?', a: ['8', '9', '10', '11'], why: '5 + 4(1) - 1 = 8. A positive charge removes an electron.' },
  { lv: 18, t: 'mc', q: 'Which element has the symbol Mn?', a: ['Manganese', 'Magnesium', 'Molybdenum', 'Mercury'], why: 'Mn is manganese, element 25. Magnesium is Mg, molybdenum is Mo and mercury is Hg.' },
  { lv: 18, t: 'mc', q: 'What is the symbol for potassium?', a: ['K', 'P', 'Po', 'Pt'], why: 'Potassium is K, element 19. P is phosphorus.' },

  { lv: 19, t: 'mc', q: 'How many valence electrons are in NBr3?', a: ['26', '24', '28', '22'], why: '5 + 3(7) = 26.' },
  { lv: 19, t: 'mc', q: 'Which atom is central in CH2O?', a: ['C', 'O', 'H', 'Either C or O'], why: 'C makes 4 bonds and O makes 2, so C goes in the middle. H is never central.' },
  { lv: 19, t: 'mc', q: 'In formaldehyde, CH2O, the carbon-oxygen bond is', a: ['A double bond', 'A single bond', 'A triple bond', 'An ionic bond'], why: 'With single bonds only, C ends at 6 electrons. Sharing one O lone pair makes C=O and gives C its octet.' },
  { lv: 19, t: 'mc', q: 'The Lewis structure of O2 has', a: ['O=O with two lone pairs on each O', 'O-O with three lone pairs on each O', 'O≡O with one lone pair on each O', 'O-O with two lone pairs on each O'], why: 'O2 has 12 electrons. O-O with three lone pairs on each O would need 14. O=O with two lone pairs on each uses exactly 12 and gives both O an octet.' },
  { lv: 19, t: 'mc', q: 'How many lone pairs sit on N in NBr3?', a: ['1', '0', '2', '3'], why: '26 electrons - 6 in bonds - 18 in the Br lone pairs = 2 left, one lone pair on N.' },
  { lv: 19, t: 'mc', q: 'How many valence electrons are in the chlorite ion, ClO2^-?', a: ['20', '19', '21', '18'], why: '7 + 2(6) + 1 = 20. The negative charge adds one.' },
  { lv: 19, t: 'mc', q: 'For a cation, the charge is', a: ['Subtracted from the valence electron total', 'Added to the valence electron total', 'Ignored when counting electrons', 'Added as a lone pair on the central atom'], why: 'A cation has lost electrons. NH4^+: 5 + 4 - 1 = 8.' },
  { lv: 19, t: 'mc', q: 'The single bonds are in and the terminal atoms are full (2 on H, 8 on the rest), but the central C, N or O has only 6 electrons. Next step?', a: ['Share a terminal lone pair as a second bond to the central atom', 'Add two more electrons to the total', 'Remove a terminal atom', 'Put a lone pair on a hydrogen'], why: 'Step 5: when you are short of electrons, share them through a multiple bond.' },
  { lv: 19, t: 'mc', q: 'Which molecule has a triple bond?', a: ['N2', 'O2', 'F2', 'H2O'], why: 'N2 has 10 electrons: N≡N with one lone pair on each N. O2 has a double bond, and F2 and H2O have only single bonds.' },
  { lv: 19, t: 'mc', q: 'The Lewis structure of HCN, with C in the middle, is', a: ['H-C≡N with one lone pair on N', 'H-C=N with two lone pairs on N', 'H-C-N with three lone pairs on N', 'H=C=N with one lone pair on N'], why: '1 + 4 + 5 = 10 electrons. H-C≡N with one lone pair on N uses all 10 and gives C and N octets. H only ever makes one bond.' },
  { lv: 19, t: 'type', q: 'How many valence electrons are in SO4^2-?', ans: '32', re: '^32$', why: '6 + 4(6) + 2 = 32.' },
  { lv: 19, t: 'type', q: 'How many valence electrons are in CO2?', ans: '16', re: '^16$', why: '4 + 2(6) = 16, drawn as O=C=O with two lone pairs on each O.' },
  { lv: 19, t: 'type', q: 'How many electrons are in the Lewis structure of H2?', ans: '2', re: '^(2|two)$', why: 'Each H brings 1. One shared pair, H-H, gives each H its duet.' },

  { lv: 20, t: 'mc', q: 'Rank the carbon-carbon bonds from shortest to longest.', a: ['C≡C < C=C < C-C', 'C-C < C=C < C≡C', 'C=C < C≡C < C-C', 'All three are the same length'], why: 'More shared pairs pull the atoms closer: C≡C 120 pm, C=C 134 pm, C-C 154 pm.' },
  { lv: 20, t: 'mc', q: 'Which bond is the strongest?', a: ['N≡N', 'N=N', 'N-N', 'All three are equally strong'], why: 'Triple > double > single for the same two atoms: 946, 418 and 163 kJ/mol.' },
  { lv: 20, t: 'mc', q: 'Compared with a C-O single bond, a C=O double bond is', a: ['Shorter and stronger', 'Longer and stronger', 'Shorter and weaker', 'Longer and weaker'], why: 'C=O is 120 pm and 736 kJ/mol. C-O is 143 pm and 360 kJ/mol.' },
  { lv: 20, t: 'mc', q: 'A double bond contains how many shared electrons?', a: ['4', '2', '6', '8'], why: 'Two shared pairs, so 4 electrons.' },
  { lv: 20, t: 'mc', q: 'NO has 11 valence electrons. It is', a: ['An odd-electron molecule (a free radical)', 'An expanded octet', 'An incomplete octet', 'An ionic compound'], why: 'An odd total cannot pair up completely, so one atom, N, ends with 7. That is the odd-electron case. An incomplete octet is an even count that stops at 6 around a group 3A atom, like B in BF3.' },
  { lv: 20, t: 'mc', q: 'In BF3, boron has how many electrons around it?', a: ['6', '8', '10', '4'], why: 'Three B-F single bonds and no lone pairs on B: 6 electrons. A group 3A central atom is the incomplete-octet case.' },
  { lv: 20, t: 'mc', q: 'Which central atom can hold an expanded octet?', a: ['S', 'O', 'N', 'C'], why: 'Only atoms from row 3 and below can hold more than 8. C, N, O and F always follow the octet rule.' },
  { lv: 20, t: 'mc', q: 'Which molecule has an expanded octet on its central atom?', a: ['SF6', 'CF4', 'NF3', 'BF3'], why: 'S makes 6 bonds, 12 electrons. CF4 and NF3 have octets, and BF3 has only 6.' },
  { lv: 20, t: 'mc', q: 'Which atom always follows the octet rule?', a: ['F', 'P', 'Xe', 'I'], why: 'C, N, O and F always follow the octet rule. P, Xe and I sit in row 3 or below and can expand.' },
  { lv: 20, t: 'mc', q: 'How many valence electrons does ClF3 have, and how many sit around Cl?', a: ['28 total, 10 around Cl', '28 total, 8 around Cl', '26 total, 10 around Cl', '28 total, 6 around Cl'], why: '7 + 3(7) = 28. Cl makes 3 bonds and keeps 2 lone pairs: 6 + 4 = 10, an expanded octet.' },
  { lv: 20, t: 'type', q: 'How many valence electrons are in NO2?', ans: '17', re: '^17$', why: '5 + 2(6) = 17, an odd number, so NO2 is a free radical.' },
  { lv: 20, t: 'type', q: 'How many electrons surround S in SF6?', ans: '12', re: '^12$', why: 'Six S-F bonds at 2 electrons each. S is in row 3, so it can expand.' },
  { lv: 20, t: 'type', q: 'How many electrons surround P in PCl5?', ans: '10', re: '^10$', why: 'Five P-Cl bonds and no lone pairs on P.' },

  { lv: 21, t: 'mc', q: 'Formal charge equals', a: ['Valence electrons - (lone-pair electrons + ½ bonding electrons)', 'Valence electrons + lone-pair electrons - bonding electrons', 'Bonding electrons - lone-pair electrons', 'Number of bonds - number of lone pairs'], why: 'Shortcut: valence electrons minus (dots + lines) on that atom.' },
  { lv: 21, t: 'mc', q: 'What is the formal charge on O in water?', a: ['0', '-1', '+1', '-2'], why: 'O has 4 dots and 2 lines: 6 - (4 + 2) = 0.' },
  { lv: 21, t: 'mc', q: 'What is the formal charge on N in NH4^+?', a: ['+1', '0', '-1', '+4'], why: 'N has no dots and 4 lines: 5 - (0 + 4) = +1. The charges add to the ion charge, +1.' },
  { lv: 21, t: 'mc', q: 'What is the formal charge on O in OH^-?', a: ['-1', '0', '+1', '-2'], why: 'O has 3 lone pairs and 1 bond: 6 - (6 + 1) = -1. That is the circled minus in Dr. Meyers\' key.' },
  { lv: 21, t: 'mc', q: 'In a polyatomic ion, the formal charges add up to', a: ['The charge of the ion', 'Zero', 'The number of bonds', 'The number of lone pairs'], why: 'They add to 0 in a neutral molecule and to the ion charge in an ion, like -1 for NO2^-.' },
  { lv: 21, t: 'mc', q: 'By Dr. Meyers\' rules, the best Lewis structure has', a: ['The right electron count, octets where required, and formal charges closest to zero', 'The most double bonds', 'The most lone pairs on the central atom', 'Every formal charge on the central atom'], why: 'His NO2^- key: correct valence electrons, each atom has its octet, and formal charges equal to or closest to zero.' },
  { lv: 21, t: 'mc', q: 'For NO2^-, why is O=N=O with a lone pair on N not allowed?', a: ['N would hold 10 electrons, and N never exceeds an octet', 'N would hold only 6 electrons', 'The structure has only 16 electrons', 'O cannot form a double bond'], why: 'The count is right (18), but two double bonds plus a lone pair put 10 electrons on N. C, N, O and F never go over 8.' },
  { lv: 21, t: 'mc', q: 'In the best structure of NO2^-, the -1 formal charge sits on', a: ['The singly bonded O', 'N', 'The doubly bonded O', 'No atom, because every charge is zero'], why: 'O=N-O^-: N is 5 - (2 + 3) = 0, the double-bonded O is 6 - (4 + 2) = 0, and the single-bonded O is 6 - (6 + 1) = -1.' },
  { lv: 21, t: 'mc', q: 'Which chlorite (ClO2^-) structure did Dr. Meyers call best (Handout 13, #5)?', a: ['O=Cl-O^- and its mirror image', 'All single bonds, with a charge on every atom', 'Cl bonded to two O with no lone pairs on Cl', 'An O-O bond with Cl on the end'], why: 'Cl is in row 3, so it can take 10 electrons to bring its formal charge to 0, leaving one charged O. The all-single-bond form is valid but puts a charge on every atom.' },
  { lv: 21, t: 'mc', q: 'Resonance structures differ only in', a: ['Where the lone pairs and multiple bonds go', 'Where the atoms go', 'The total number of electrons', 'The overall charge'], why: 'The atoms stay put. Only electrons move between resonance forms.' },
  { lv: 21, t: 'mc', q: 'Ozone, O3, has two equivalent resonance forms. The bond order of each O-O bond is', a: ['1.5', '1', '2', '3'], why: 'One form has the double bond on the left and the other on the right. The real molecule averages them: (1 + 2) ÷ 2 = 1.5.' },
  { lv: 21, t: 'mc', q: 'How many resonance structures does nitrate, NO3^-, have?', a: ['3', '1', '2', '4'], why: 'The N=O double bond can sit on any of the three O atoms.' },
  { lv: 21, t: 'mc', q: 'Phosphate is drawn with one P=O and three P-O single bonds. The formal charge on P is', a: ['0', '+1', '-1', '+5'], why: 'P has no dots and 5 lines: 5 - 5 = 0. Each single-bonded O is -1, adding up to -3. P is in row 3, so it can hold 10 electrons.' },
  { lv: 21, t: 'type', q: 'What is the formal charge on C in CO2 (O=C=O)?', ans: '0', re: '^(0|zero)$', why: 'C has no dots and 4 lines: 4 - 4 = 0. Each O: 6 - (4 + 2) = 0.' },

  { lv: 22, t: 'mc', q: 'What is the steric number of C in CO2?', a: ['2', '4', '3', '6'], why: 'Two O atoms and no lone pairs on C. Each double bond counts once.' },
  { lv: 22, t: 'mc', q: 'Water: electron-pair geometry and molecular geometry?', a: ['Tetrahedral and bent', 'Bent and bent', 'Tetrahedral and tetrahedral', 'Trigonal planar and bent'], why: 'SN 4 (2 H + 2 lone pairs) gives a tetrahedral electron-pair geometry. Naming only the atoms gives bent.' },
  { lv: 22, t: 'mc', q: 'The molecular geometry of NH3 is', a: ['Trigonal pyramidal', 'Trigonal planar', 'Tetrahedral', 'T-shaped'], why: 'SN 4: 3 H + 1 lone pair.' },
  { lv: 22, t: 'mc', q: 'The H-N-H angle in NH3 is', a: ['Less than 109.5°', 'Exactly 109.5°', '120°', '90°'], why: 'The lone pair takes more room than a bond and squeezes the angles. Write <109.5°.' },
  { lv: 22, t: 'mc', q: 'BF3: shape and bond angle?', a: ['Trigonal planar, 120°', 'Trigonal pyramidal, <109.5°', 'T-shaped, <90°', 'Bent, <120°'], why: 'SN 3 with no lone pairs on B, so the angle is exactly 120°.' },
  { lv: 22, t: 'mc', q: 'SO2: shape and bond angle?', a: ['Bent, <120°', 'Linear, 180°', 'Bent, <109.5°', 'Trigonal planar, 120°'], why: 'Dr. Meyers draws O=S=O with a lone pair on S. SN 3 (2 O + 1 lone pair) gives bent, under 120°.' },
  { lv: 22, t: 'mc', q: 'The molecular geometry of PCl3 is', a: ['Trigonal pyramidal', 'Trigonal planar', 'T-shaped', 'Tetrahedral'], why: '26 electrons, so P has 3 bonds and 1 lone pair. SN 4, trigonal pyramidal, <109.5°.' },
  { lv: 22, t: 'mc', q: 'CH2O: shape and bond angle?', a: ['Trigonal planar, 120°', 'Tetrahedral, 109.5°', 'Bent, <120°', 'Trigonal pyramidal, <109.5°'], why: 'SN 3: two H and one O, with C=O counted once and no lone pairs on C.' },
  { lv: 22, t: 'mc', q: 'Which molecule has the smallest bond angle?', a: ['H2O', 'NH3', 'CH4', 'BF3'], why: 'Two lone pairs squeeze hardest: H2O about 104.5°, NH3 about 107°, CH4 109.5°, BF3 120°.' },
  { lv: 22, t: 'mc', q: 'How do electron-pair geometry and molecular geometry differ?', a: ['Electron-pair geometry counts lone pairs as positions; molecular geometry names only where the atoms are', 'They always have the same name', 'Molecular geometry counts lone pairs; electron-pair geometry ignores them', 'Electron-pair geometry only applies to ions'], why: 'They match only when the central atom has no lone pairs.' },
  { lv: 22, t: 'type', q: 'What is the steric number of C in CH4?', ans: '4', re: '^(4|four)$', why: '4 H atoms and no lone pairs: tetrahedral, 109.5°.' },
  { lv: 22, t: 'type', q: 'Ideal bond angle of a tetrahedral molecule, in degrees?', ans: '109.5', re: '^109\\.5(°|degrees?)?$', why: 'Tetrahedral is 109.5°. Lone pairs push it lower.' },
  { lv: 22, t: 'type', q: 'Bond angle in a linear molecule, in degrees?', ans: '180', re: '^180(°|degrees?)?$', why: 'Linear is 180°, as in CO2.' },

  { lv: 23, t: 'mc', q: 'The molecular geometry of SF4 is', a: ['Seesaw', 'Tetrahedral', 'Square planar', 'Trigonal pyramidal'], why: '34 electrons: S has 4 bonds and 1 lone pair, SN 5. The lone pair goes equatorial, which leaves a seesaw.' },
  { lv: 23, t: 'mc', q: 'The molecular geometry of ClF3 is', a: ['T-shaped', 'Trigonal planar', 'Trigonal pyramidal', 'Seesaw'], why: 'SN 5 with 2 lone pairs. Both go equatorial, so the three F atoms form a T.' },
  { lv: 23, t: 'mc', q: 'The molecular geometry of XeF2 is', a: ['Linear', 'Bent', 'T-shaped', 'Seesaw'], why: '22 electrons: Xe has 2 bonds and 3 lone pairs, SN 5. All three lone pairs sit equatorial, so F-Xe-F is 180°.' },
  { lv: 23, t: 'mc', q: 'The molecular geometry of XeF4 is', a: ['Square planar', 'Tetrahedral', 'Seesaw', 'Square pyramidal'], why: '36 electrons: Xe has 4 bonds and 2 lone pairs, SN 6. The second lone pair goes opposite the first.' },
  { lv: 23, t: 'mc', q: 'The molecular geometry of BrF5 is', a: ['Square pyramidal', 'Trigonal bipyramidal', 'Octahedral', 'Seesaw'], why: '42 electrons: Br has 5 bonds and 1 lone pair, SN 6.' },
  { lv: 23, t: 'mc', q: 'In a trigonal bipyramid, lone pairs go', a: ['Equatorial first', 'Axial first', 'Anywhere there is room', 'One axial, then one equatorial'], why: 'An equatorial position has only two neighbors at 90°, so it has more room (Handout 14, footnote 1).' },
  { lv: 23, t: 'mc', q: 'The bond angles in PCl5 are', a: ['90° (axial to equatorial) and 120° (equatorial to equatorial)', '109.5° only', '90° only', '120° only'], why: 'SN 5 with no lone pairs: trigonal bipyramidal.' },
  { lv: 23, t: 'mc', q: 'The F-Cl-F bond angle in ClF3 is predicted to be', a: ['Less than 90°', 'Exactly 90°', '120°', '109.5°'], why: 'T-shaped. The two lone pairs push the F atoms together, so each axial-to-equatorial F-Cl-F angle drops below 90° (Chapter 4 Part 2 worksheet, #4).' },
  { lv: 23, t: 'mc', q: 'What is the molecular geometry of IBr3?', a: ['T-shaped', 'Trigonal pyramidal', 'Trigonal planar', 'Seesaw'], why: '28 electrons, like ClF3. I has 3 bonds and 2 lone pairs, SN 5.' },
  { lv: 23, t: 'mc', q: 'XeO3, drawn with three Xe=O and one lone pair on Xe, has what shape?', a: ['Trigonal pyramidal', 'Trigonal planar', 'T-shaped', 'Tetrahedral'], why: 'Three O atoms + 1 lone pair = SN 4. Double bonds count once.' },
  { lv: 23, t: 'mc', q: 'The molecular geometry of SF6 is', a: ['Octahedral', 'Trigonal bipyramidal', 'Square planar', 'Hexagonal'], why: 'SN 6 with no lone pairs. Every angle between neighboring F atoms is 90°.' },
  { lv: 23, t: 'type', q: 'What is the steric number of Xe in XeF4?', ans: '6', re: '^(6|six)$', why: '4 F + 2 lone pairs.' },
  { lv: 23, t: 'type', q: 'How many lone pairs are on Cl in ClF3?', ans: '2', re: '^(2|two)$', why: '28 - 6 in bonds - 18 on the three F = 4 electrons, so 2 lone pairs on Cl.' },

  { lv: 24, t: 'mc', q: 'In ethane, H3C-CH3, each carbon is', a: ['Tetrahedral', 'Trigonal planar', 'Linear', 'Trigonal pyramidal'], why: 'Each C has 4 single bonds and no lone pairs: SN 4.' },
  { lv: 24, t: 'mc', q: 'In ethene, H2C=CH2, each carbon is', a: ['Trigonal planar', 'Tetrahedral', 'Linear', 'Bent'], why: 'Each C bonds to 3 atoms (2 H and the other C), and the double bond counts once: SN 3.' },
  { lv: 24, t: 'mc', q: 'In ethyne, HC≡CH, each carbon is', a: ['Linear', 'Trigonal planar', 'Tetrahedral', 'Bent'], why: 'Each C bonds to 2 atoms: SN 2, 180°.' },
  { lv: 24, t: 'mc', q: 'The oxygen in methanol, CH3-O-H, is', a: ['Bent', 'Linear', 'Trigonal planar', 'Tetrahedral'], why: 'O bonds to C and H and keeps 2 lone pairs: SN 4, bent, <109.5°.' },
  { lv: 24, t: 'mc', q: 'In glycine, H2N-CH2-COOH, the nitrogen is', a: ['Trigonal pyramidal', 'Trigonal planar', 'Tetrahedral', 'Bent'], why: 'N bonds to 2 H and C and keeps 1 lone pair: SN 4 (Handout 14, #3).' },
  { lv: 24, t: 'mc', q: 'In glycine, the carbon of the COOH group is', a: ['Trigonal planar', 'Tetrahedral', 'Linear', 'Trigonal pyramidal'], why: 'It bonds to C, O and O (C=O counts once) and has no lone pairs: SN 3.' },
  { lv: 24, t: 'mc', q: 'In glycine, the CH2 carbon is', a: ['Tetrahedral', 'Trigonal planar', 'Bent', 'Linear'], why: 'Four single bonds (N, C and 2 H): SN 4.' },
  { lv: 24, t: 'mc', q: 'In acetic acid, CH3COOH, the oxygen of the O-H group is', a: ['Bent', 'Linear', 'Trigonal planar', 'Trigonal pyramidal'], why: 'Bonded to C and H with 2 lone pairs: SN 4, bent.' },
  { lv: 24, t: 'mc', q: 'The nitrogen in methylamine, CH3-NH2, is', a: ['Trigonal pyramidal', 'Trigonal planar', 'Bent', 'Tetrahedral'], why: 'N bonds to C and 2 H and keeps 1 lone pair: SN 4.' },
  { lv: 24, t: 'mc', q: 'In HCN, the carbon is', a: ['Linear', 'Bent', 'Trigonal planar', 'Tetrahedral'], why: 'C bonds to H and N, and the triple bond counts once: SN 2.' },
  { lv: 24, t: 'type', q: 'Steric number of the carbonyl carbon (the C in C=O) in acetic acid?', ans: '3', re: '^(3|three)$', why: 'Bonded to CH3, =O and -OH, with no lone pairs: trigonal planar.' },
  { lv: 24, t: 'type', q: 'Steric number of the N in glycine?', ans: '4', re: '^(4|four)$', why: '3 atoms (2 H and C) + 1 lone pair: trigonal pyramidal.' },

  { lv: 25, t: 'mc', q: 'A bond whose electronegativity difference is 0.4 or less is', a: ['Nonpolar covalent', 'Polar covalent', 'Ionic', 'A hydrogen bond'], why: '0 to 0.4 is nonpolar. C-H (2.5 vs 2.1) is exactly 0.4, so C-H counts as nonpolar.' },
  { lv: 25, t: 'mc', q: 'Which bond is polar?', a: ['C-O', 'C-H', 'Cl-Cl', 'H-H'], why: 'C-O: 3.5 minus 2.5 is 1.0. C-H is 0.4, still nonpolar, and two identical atoms share electrons equally.' },
  { lv: 25, boss: true, t: 'mc', q: 'In an O-H bond, the partial negative charge (δ−) sits on', a: ['The oxygen', 'The hydrogen', 'Both atoms equally', 'Neither atom'], why: 'O (3.5) pulls harder than H (2.1), so the shared electrons sit closer to O.' },
  { lv: 25, t: 'mc', q: 'Which bond is the most polar?', a: ['H-F', 'O-H', 'N-H', 'C-H'], why: 'The differences are H-F 1.9, O-H 1.4, N-H 0.9 and C-H 0.4. The biggest difference is the most polar bond.' },
  { lv: 25, t: 'mc', q: 'Using N 3.0 and Cl 3.0, an N-Cl bond is', a: ['Nonpolar', 'Polar', 'Ionic', 'A hydrogen bond'], why: 'The difference is 0.0. Both are NClOF atoms, so subtract instead of using the shortcut.' },
  { lv: 25, boss: true, t: 'mc', q: 'A bond with an electronegativity difference of 2.5 is', a: ['Ionic', 'Polar covalent', 'Nonpolar covalent', 'A hydrogen bond'], why: 'Above 2.0 counts as ionic.' },
  { lv: 25, t: 'type', q: 'Electronegativity of oxygen?', ans: '3.5', re: '^3\\.50*$', why: 'NClOF: F 4.0, O 3.5, N 3.0, Cl 3.0.' },
  { lv: 25, t: 'type', q: 'Electronegativity of fluorine?', ans: '4.0', re: '^4(\\.0+)?$', why: 'Fluorine is the most electronegative element.' },
  { lv: 25, t: 'type', q: 'Electronegativity difference in a C-O bond?', ans: '1.0', re: '^1(\\.0+)?$', why: 'O 3.5 minus C 2.5 is 1.0, so C-O is polar.' },
  { lv: 25, t: 'mc', q: 'CO2 is nonpolar because', a: ['Its two C=O dipoles point in opposite directions and cancel', 'C=O bonds are nonpolar', 'Carbon has two lone pairs', 'The molecule is bent'], why: 'C=O is polar (a difference of 1.0), but CO2 is linear, so the two dipoles cancel exactly.' },
  { lv: 25, boss: true, t: 'mc', q: 'Which molecule is polar?', a: ['H2O', 'CO2', 'CH4', 'CCl4'], why: 'Water is bent, so its O-H dipoles add. The other three are symmetric: CO2 is linear, and CH4 and CCl4 are tetrahedral.' },
  { lv: 25, t: 'mc', q: 'Which molecule is nonpolar?', a: ['CCl4', 'CH2Cl2', 'NH3', 'HCl'], why: 'Four identical C-Cl dipoles in a tetrahedron cancel. CH2Cl2 has mixed outer atoms, NH3 has a lone pair, and HCl has a single polar bond.' },
  { lv: 25, t: 'mc', q: 'NH3 is polar mainly because', a: ['The lone pair on N makes it trigonal pyramidal, so the N-H dipoles do not cancel', 'N-H bonds are nonpolar', 'It is trigonal planar', 'Nitrogen forms a double bond with hydrogen'], why: 'Electron geometry tetrahedral, molecular geometry trigonal pyramidal. The three N-H dipoles all tilt the same way.' },
  { lv: 25, t: 'mc', q: 'Formaldehyde, CH2O, is', a: ['Polar, because the C=O dipole is not balanced by the two C-H bonds', 'Nonpolar, because every trigonal planar molecule is nonpolar', 'Nonpolar, because carbon has no lone pairs', 'Ionic'], why: 'Trigonal planar cancels only when all three outer atoms are the same. Here one is O and two are H.' },
  { lv: 25, boss: true, t: 'mc', q: 'SO2 is', a: ['Polar: the lone pair on S makes it bent', 'Nonpolar: it is linear like CO2', 'Nonpolar: S-O bonds are nonpolar', 'Nonpolar: the two S-O dipoles cancel'], why: 'SN 3 with 1 lone pair gives a bent shape. S-O is polar (2.5 vs 3.5), and a bent shape does not cancel.' },
  { lv: 25, t: 'mc', q: 'IF3 (T-shaped) is', a: ['Polar', 'Nonpolar, because all three outer atoms are F', 'Nonpolar, because I-F bonds are nonpolar', 'Ionic'], why: 'Identical outer atoms are not enough. The 2 lone pairs on I leave a T, and a T does not cancel.' },
  { lv: 25, t: 'type', q: 'CO2: polar or nonpolar?', ans: 'nonpolar', re: '^nonpolar(molecule)?$', why: 'Polar C=O bonds, but the linear shape cancels them.' },
  { lv: 25, boss: true, t: 'mc', q: 'A molecule with polar bonds can still be nonpolar when', a: ['Its symmetric shape makes the bond dipoles cancel', 'Its central atom has a lone pair', 'It contains hydrogen', 'It has a double bond'], why: 'Polarity needs polar bonds and a shape that keeps them from canceling. CO2 and CCl4 have polar bonds and are nonpolar.' },
  { lv: 25, boss: true, t: 'mc', q: 'BF3 is trigonal planar and every outer atom is F. The molecule is', a: ['Nonpolar', 'Polar, because each B-F bond is polar', 'Polar, because boron has a lone pair', 'Polar, because the molecule is bent'], why: 'Each B-F bond is polar, but three identical dipoles at 120° cancel. Boron has no lone pair in BF3.' },
  { lv: 25, boss: true, t: 'mc', q: 'XeF4 has two lone pairs on Xe yet is nonpolar, because', a: ['The lone pairs sit opposite each other, leaving a square planar shape whose Xe-F dipoles cancel', 'Xe-F bonds are nonpolar', 'Lone pairs never affect polarity', 'XeF4 is tetrahedral'], why: 'The second lone pair goes opposite the first (Handout 14, footnote 2). The four F sit in a flat square and cancel.' },

  { lv: 26, t: 'mc', q: 'Intermolecular forces are', a: ['Attractions between separate molecules', 'The covalent bonds inside a molecule', 'Attractions between the nucleus and electrons of one atom', 'The ionic bonds in a salt'], why: 'Inter means between. The bonds inside a molecule are intramolecular, and they are much stronger.' },
  { lv: 26, t: 'mc', q: 'When liquid water boils, what is overcome?', a: ['The hydrogen bonds between water molecules', 'The O-H covalent bonds inside each molecule', 'The forces inside the oxygen nucleus', 'Ionic bonds between H and O'], why: 'Boiling separates molecules from each other. The steam is still H2O, so no O-H bond broke.' },
  { lv: 26, t: 'mc', q: 'Which IMF is present in every molecule?', a: ['Dispersion forces', 'Dipole-dipole forces', 'Hydrogen bonding', 'Ion-dipole forces'], why: 'Every molecule has electrons that can shift for an instant. Dipole-dipole needs a polar molecule, and hydrogen bonding needs H on N, O or F.' },
  { lv: 26, boss: true, t: 'mc', q: 'Dispersion forces get stronger as molecules', a: ['Have more electrons, meaning larger and heavier molecules', 'Get smaller', 'Lose their lone pairs', 'Become more compact and ball-shaped'], why: 'A bigger electron cloud shifts more easily, so its brief dipoles are bigger.' },
  { lv: 26, t: 'mc', q: 'A hydrogen bond can form when H is bonded directly to', a: ['N, O or F', 'C', 'Any nonmetal', 'A metal'], why: 'N, O and F are very electronegative and small, so the δ+ H can get close to a lone pair on the next molecule. Cl matches N at 3.0 but is much larger, so HCl does not hydrogen-bond.' },
  { lv: 26, boss: true, t: 'mc', q: 'Dipole-dipole forces act between', a: ['Polar molecules', 'Nonpolar molecules only', 'Atoms inside one molecule', 'Noble-gas atoms'], why: 'The δ+ end of one polar molecule attracts the δ− end of the next.' },
  { lv: 26, t: 'type', q: 'Name the IMF that every molecule has.', ans: 'dispersion', re: '^((london(dispersion)?|dispersion)(force|forces)?|ldfs?)$', why: 'Dispersion, also called London dispersion.' },
  { lv: 26, boss: true, t: 'mc', q: 'As the number of electrons in a molecule rises, its polarizability', a: ['Rises, so dispersion gets stronger', 'Falls, so dispersion gets weaker', 'Rises, so dispersion gets weaker', 'Stays the same'], why: 'More electrons make a bigger cloud that shifts more easily. Higher polarizability means stronger dispersion.' },
  { lv: 26, t: 'mc', q: 'To turn a gas into a liquid, you can', a: ['Lower the temperature or raise the pressure', 'Raise the temperature or lower the pressure', 'Raise the temperature only', 'Lower the pressure only'], why: 'Less kinetic energy, or particles pushed closer together, lets the IMFs take over.' },
  { lv: 26, boss: true, t: 'mc', q: 'In a gas, which wins?', a: ['Disruptive forces (kinetic energy) win over cohesive forces', 'Cohesive forces (IMFs) win over disruptive forces', 'The two are always exactly equal', 'Neither acts in a gas'], why: 'Gas particles move fast enough to escape their IMFs. In a solid, the cohesive forces win.' },
  { lv: 26, boss: true, t: 'mc', q: 'Which state has a definite volume but no definite shape?', a: ['Liquid', 'Solid', 'Gas', 'None of them'], why: 'A liquid takes the shape of its container but keeps its volume. A solid keeps both; a gas keeps neither.' },
  { lv: 26, t: 'mc', q: 'The dominant IMF in methane, CH4, is', a: ['Dispersion', 'Dipole-dipole', 'Hydrogen bonding', 'Covalent bonding'], why: 'C-H bonds are nonpolar and the molecule is symmetric, so dispersion is all it has. Covalent bonds are not IMFs.' },
  { lv: 26, t: 'mc', q: 'Which IMF does HCl have that CH4 does not?', a: ['Dipole-dipole', 'Hydrogen bonding', 'Dispersion', 'None; they have the same IMFs'], why: 'HCl is polar (3.0 vs 2.1). Its H is bonded to Cl, which is not N, O or F, so no hydrogen bonding. Both have dispersion.' },
  { lv: 26, t: 'mc', q: 'The dominant IMF in ammonia, NH3, is', a: ['Hydrogen bonding', 'Dipole-dipole only', 'Dispersion only', 'Ionic bonding'], why: "H is bonded directly to N, and N has a lone pair for the next molecule's H." },
  { lv: 26, t: 'mc', q: 'The dominant IMF between formaldehyde (CH2O) molecules is', a: ['Dipole-dipole', 'Hydrogen bonding', 'Dispersion only', 'Ionic bonding'], why: 'CH2O has H and O, but the H is bonded to C, so it is not δ+ enough to hydrogen-bond. CH2O is polar, so dipole-dipole.' },
  { lv: 26, t: 'mc', q: 'The dominant IMF in methanol, CH3OH, is', a: ['Hydrogen bonding', 'Dipole-dipole', 'Dispersion only', 'Ionic bonding'], why: 'Its O-H puts an H directly on O.' },
  { lv: 26, t: 'mc', q: 'The dominant IMF in iodine trifluoride, IF3, is', a: ['Dipole-dipole', 'Hydrogen bonding', 'Dispersion only', 'Ionic bonding'], why: 'IF3 is T-shaped and polar, and it has no H at all.' },
  { lv: 26, t: 'type', q: 'Dominant IMF in water?', ans: 'hydrogen bonding', re: '^(hydrogen|h)(bond|bonds|bonding)(force|forces|interaction|interactions)?$', why: 'Water has H bonded directly to O.' },
  { lv: 26, t: 'type', q: 'Dominant IMF in SO2?', ans: 'dipole-dipole', re: '^dipole(dipole)?(force|forces|attraction|attractions|interaction|interactions)?$', why: 'SO2 is bent and polar, with no H.' },
  { lv: 26, boss: true, t: 'mc', q: 'The dominant IMF in CO2 is', a: ['Dispersion', 'Dipole-dipole', 'Hydrogen bonding', 'Ion-dipole'], why: 'Polar bonds, but the linear shape cancels them. A nonpolar molecule has dispersion only.' },

  { lv: 27, t: 'mc', q: 'Which has the highest boiling point?', a: ['H2O', 'CH4', 'CO2', 'O2'], why: 'Water hydrogen-bonds and boils at 100 °C. The other three are nonpolar and are all gases at room temperature.' },
  { lv: 27, t: 'mc', q: 'Ethanol and dimethyl ether share the formula C2H6O. Which boils higher, and why?', a: ['Ethanol, because its O-H lets it hydrogen-bond', 'Dimethyl ether, because it has stronger dispersion', 'Neither; the same formula means the same boiling point', 'Dimethyl ether, because only it is polar'], why: 'Ethanol boils at 78 °C and dimethyl ether at −24 °C. Same atoms, but only ethanol has H on O.' },
  { lv: 27, boss: true, t: 'mc', q: 'Which halogen is a solid at room temperature?', a: ['I2', 'F2', 'Cl2', 'Br2'], why: 'All four are nonpolar, so dispersion decides. I2 has the most electrons. Br2 is a liquid; F2 and Cl2 are gases.' },
  { lv: 27, t: 'mc', q: 'Boiling points of the noble gases from He to Xe', a: ['Rise, because dispersion grows with the number of electrons', 'Fall, because larger atoms are farther apart', 'Stay the same, because all are nonpolar', 'Rise, because heavier atoms hydrogen-bond'], why: 'Nonpolar atoms only have dispersion, and more electrons mean stronger dispersion.' },
  { lv: 27, t: 'mc', q: 'Butane (a straight chain) boils at −0.5 °C and isobutane (branched) at −11.7 °C, both C4H10. Why?', a: ['Butane molecules can sit closer together, so their dispersion forces are stronger', 'Butane hydrogen-bonds', 'Isobutane is polar', 'Butane has more electrons'], why: 'Same formula, same electrons. The branched shape keeps isobutane molecules farther apart, so they attract each other less.' },
  { lv: 27, boss: true, t: 'mc', q: 'As the IMFs in a liquid get stronger, its boiling point', a: ['Rises', 'Falls', 'Stays the same', 'Depends only on the covalent bonds'], why: 'More energy is needed to pull the molecules apart.' },
  { lv: 27, t: 'mc', q: 'For molecules of similar size, the IMFs rank from strongest to weakest as', a: ['Hydrogen bonding > dipole-dipole > dispersion', 'Dispersion > dipole-dipole > hydrogen bonding', 'Dipole-dipole > hydrogen bonding > dispersion', 'All three are about equal'], why: 'Propane (44 g/mol, dispersion) boils at −42 °C, dimethyl ether (46 g/mol, dipole-dipole) at −24 °C, and ethanol (46 g/mol, hydrogen bonding) at 78 °C.' },
  { lv: 27, t: 'type', q: 'Which boils higher, CH4 or H2O?', ans: 'H2O', re: '^(h2o|h20|water)$', why: 'Water hydrogen-bonds. Methane has dispersion only.' },
  { lv: 27, t: 'mc', q: 'Is methane soluble in water?', a: ['No: methane is nonpolar and water is polar', 'Yes: both contain hydrogen', 'Yes: methane hydrogen-bonds with water', 'Only when heated'], why: 'Like dissolves like. Methane has dispersion forces only (Handout 15, #1).' },
  { lv: 27, t: 'mc', q: 'Which IMFs are present in a sample of glucose?', a: ['Dispersion, dipole-dipole and hydrogen bonding', 'Hydrogen bonding only', 'Dipole-dipole only', 'Dispersion only'], why: 'Every molecule has dispersion. Glucose is polar, so dipole-dipole too, and its O-H groups add hydrogen bonding, the dominant one.' },
  { lv: 27, t: 'mc', q: 'Which IMFs are present in a sample of ClF3?', a: ['Dispersion and dipole-dipole', 'Dispersion only', 'Dipole-dipole and hydrogen bonding', 'All three'], why: 'ClF3 is polar, so dipole-dipole. It has no O-H, N-H or F-H bond, so no hydrogen bonding (Chapter 4 Part 2 worksheet, #7).' },
  { lv: 27, t: 'mc', q: 'Benzaldehyde, C6H5CHO, is a benzene ring carrying an H-C=O group. Its dominant IMF is', a: ['Dipole-dipole', 'Hydrogen bonding', 'Dispersion', 'Ion-dipole'], why: 'Every H is bonded to C, so there is no hydrogen bonding. The C=O makes the molecule polar, so its dominant IMF is dipole-dipole (Handout 15, #1). It is only slightly soluble in water because the polar C=O is a small part of a large nonpolar ring.' },
  { lv: 27, t: 'mc', q: 'Which has the higher boiling point, helium or acetone?', a: ['Acetone, because its dipole-dipole forces beat helium\'s weak dispersion', 'Helium, because it is a noble gas', 'They boil at the same temperature', 'Helium, because its atoms are smaller'], why: 'He boils at −269 °C and acetone at 56 °C (Handout 15, #2). A stronger IMF takes more energy to overcome.' },
  { lv: 27, t: 'mc', q: 'Hexane (C6H14) and water are poured together. They', a: ['Separate into two layers, because nonpolar hexane and polar water do not mix', 'Mix completely, because both are liquids', 'React to form a new compound', 'Mix, because both contain hydrogen'], why: 'Like dissolves like. Hexane is a nonpolar hydrocarbon.' },
  { lv: 27, t: 'mc', q: 'I2 is added to a funnel holding hexane and water. Where does it dissolve?', a: ['In the hexane', 'In the water', 'In both equally', 'In neither'], why: 'I2 is nonpolar, so it dissolves in nonpolar hexane.' },
  { lv: 27, t: 'mc', q: 'KMnO4 is added to the same funnel. Where does it dissolve?', a: ['In the water', 'In the hexane', 'In both equally', 'In neither'], why: 'KMnO4 is ionic. Polar water dissolves many ionic compounds through ion-dipole attractions.' },

  { lv: 28, t: 'mc', q: 'What is the mass percent of O in H2O?', a: ['88.81 %', '11.19 %', '33.33 %', '50.00 %'], why: '15.999 ÷ 18.015 × 100 = 88.81 %. 11.19 % is the hydrogen, and 33.33 % counts atoms instead of mass.' },
  { lv: 28, t: 'mc', q: 'What is the mass percent of N in Fe(NO3)3? (Handout 16, #1)', a: ['17.37 %', '5.79 %', '59.54 %', '11.89 %'], why: '3(14.007) ÷ 241.857 × 100 = 17.37 %. 5.79 % counts only one N, 59.54 % is the oxygen, and 11.89 % ignores the 3 outside the parentheses.' },
  { lv: 28, t: 'type', q: 'Mass percent of V in V2O5? Number only. (Chapter 6 worksheet #1)', ans: '56.02', re: '^56\\.0[12]?%?$', why: '2(50.942) ÷ 181.879 × 100 = 56.02 %. Rounded masses, like 101.88 ÷ 181.88, give 56.01 %, which is also accepted.' },
  { lv: 28, t: 'mc', q: 'What is the mass percent of Cl in PF2Cl3? (Chapter 6 worksheet #2)', a: ['60.66 %', '60.77 %', '20.22 %', '21.67 %'], why: '3(35.453) ÷ 175.33 × 100 = 60.66 %. The key prints 60.77 % because it used 175.03 g/mol, but 30.974 + 2(18.998) + 3(35.453) = 175.33.' },
  { lv: 28, t: 'mc', q: 'Which has the larger mass percent of carbon?', a: ['CO', 'CO2', 'They are equal', 'It depends on the sample size'], why: 'CO: 12.011 ÷ 28.010 = 42.88 %. CO2: 12.011 ÷ 44.009 = 27.29 %. Percent composition never depends on sample size.' },
  { lv: 28, t: 'mc', q: 'What is the mass percent of Na in NaCl?', a: ['39.34 %', '60.66 %', '50.00 %', '22.99 %'], why: '22.990 ÷ 58.443 × 100 = 39.34 %. 60.66 % is the chlorine.' },
  { lv: 28, t: 'type', q: 'Mass percent of C in CH4, to two decimal places? Number only.', ans: '74.87', re: '^74\\.87%?$', why: '12.011 ÷ 16.043 × 100 = 74.87 %.' },
  { lv: 28, t: 'mc', q: 'What is the mass percent of Ca in CaCO3?', a: ['40.04 %', '12.00 %', '47.96 %', '20.02 %'], why: '40.078 ÷ 100.086 × 100 = 40.04 %. 12.00 % is the carbon and 47.96 % is the oxygen.' },
  { lv: 28, t: 'mc', q: 'A compound is 17.37 % N. How many grams of N are in 200.0 g of it?', a: ['34.74 g', '17.37 g', '3474 g', '1151 g'], why: 'Use the percent as a conversion factor: 200.0 g × 17.37 g N per 100 g = 34.74 g N. 3474 g forgets to divide by 100.' },
  { lv: 28, t: 'mc', q: 'The mass percent of an element in a pure compound depends on', a: ['Only the formula', 'The size of the sample', 'The temperature', 'Whether the sample is solid or liquid'], why: 'Every sample of a pure compound has the same composition.' },

  { lv: 29, t: 'mc', q: 'The empirical formula of glucose, C6H12O6, is', a: ['CH2O', 'C6H12O6', 'C2H4O2', 'C3H6O3'], why: 'Divide every subscript by 6: CH2O.' },
  { lv: 29, t: 'mc', q: 'Which formula is already an empirical formula?', a: ['C2H6O', 'C2H4', 'C6H6', 'H2O2'], why: '2 : 6 : 1 cannot be reduced. C2H4 reduces to CH2, C6H6 to CH, and H2O2 to HO.' },
  { lv: 29, t: 'mc', q: 'A compound is 52.14 % C, 13.13 % H and 34.73 % O (Handout 16, #2). Its empirical formula is', a: ['C2H6O', 'CH3O', 'C2H5O', 'C3H8O'], why: 'Moles: C 4.341, H 13.03, O 2.171. Divide by 2.171: 2.00 : 6.00 : 1.00.' },
  { lv: 29, t: 'mc', q: 'After dividing by the smallest, you get C 1.00, H 2.50, O 1.00. The empirical formula is', a: ['C2H5O2', 'CH3O', 'CH2O', 'C2H5O'], why: 'A value ending in .50 means halves, so multiply every value by 2: 2 : 5 : 2.' },
  { lv: 29, t: 'mc', q: 'After dividing, you get C 1.00 and H 1.33. Multiply every value by', a: ['3', '2', '4', '1.33'], why: '.33 is a third, so multiply by 3 to get C3H4.' },
  { lv: 29, t: 'type', q: 'A C, H, O compound is 66.63 % C and 11.18 % H (Chapter 6 worksheet #3). Empirical formula, as CxHyOz?', ans: 'C4H8O', re: '^c4h8o1?$', why: 'O = 22.19 %. Moles: C 5.547, H 11.09, O 1.387. Divide by 1.387: 4.00 : 8.00 : 1.00.' },
  { lv: 29, t: 'mc', q: 'A problem gives only % C and % H for a compound of C, H and O. First step?', a: ['Find % O by subtracting from 100 %', 'Assume there is no oxygen', 'Divide % C by % H', 'Look up the molar mass of the compound'], why: 'Step 1: get every percent. The O is whatever is left.' },
  { lv: 29, t: 'mc', q: 'With a 100.0 g sample, 40.00 % C becomes', a: ['40.00 g C', '0.4000 g C', '40.00 mol C', '100.0 g C'], why: 'Assume 100.0 g, and each percent turns straight into grams. Then convert the grams to moles.' },
  { lv: 29, t: 'type', q: 'A compound is 40.00 % S and 60.00 % O. Empirical formula?', ans: 'SO3', re: '^so3$', why: 'S: 40.00 ÷ 32.065 = 1.247 mol. O: 60.00 ÷ 15.999 = 3.750 mol. 3.750 ÷ 1.247 = 3.01, so SO3.' },
  { lv: 29, t: 'type', q: 'A hydrocarbon is 85.62 % C and 14.38 % H. Empirical formula?', ans: 'CH2', re: '^c1?h2$', why: 'C: 7.128 mol. H: 14.27 mol. 14.27 ÷ 7.128 = 2.00, so CH2.' },
  { lv: 29, t: 'mc', q: 'How do a molecular formula and an empirical formula relate?', a: ['The molecular formula is a whole-number multiple of the empirical formula', 'They are always different', 'The empirical formula always has more atoms', 'The empirical formula shows the actual atoms in one molecule'], why: 'Glucose: C6H12O6 is 6 × CH2O. Sometimes the multiple is 1, as in H2O.' },
  { lv: 29, t: 'mc', q: 'Dividing by the smallest gives C 1.50, H 2.50, O 1.00. The empirical formula is', a: ['C3H5O2', 'C2H3O', 'C3H5O', 'CHO'], why: 'Values ending in .50 mean halves, so double everything: 3 : 5 : 2. Adipic acid, C6H10O4, has this empirical formula.' },

  { lv: 30, t: 'mc', q: 'In an aqueous NaOH solution, the solvent is', a: ['Water', 'NaOH', 'Both', 'Neither'], why: 'Aqueous means dissolved in water (Chapter 6 worksheet #5).' },
  { lv: 30, t: 'mc', q: 'Natural gas is 97 % methane, 1.5 % ethane, 1 % CO2 and 0.5 % N2. The solvent is', a: ['Methane', 'Ethane', 'Carbon dioxide', 'Dinitrogen'], why: 'The solvent is the component present in the largest amount. A solution can be a gas.' },
  { lv: 30, t: 'mc', q: 'Rose gold is 75 % gold, 22.25 % copper and 2.75 % silver. The solutes are', a: ['Copper and silver', 'Gold only', 'Gold and copper', 'Silver only'], why: 'Gold is the largest part, so it is the solvent. Everything else is a solute.' },
  { lv: 30, t: 'mc', q: 'Dental amalgam is about 50 % mercury by mass, mixed with a powdered silver, tin and copper alloy. The solvent is', a: ['Mercury', 'Silver', 'Tin', 'Copper'], why: 'Mercury is the largest single part, and it is the liquid the other metals dissolve in (Handout 17, #1c).' },
  { lv: 30, t: 'mc', q: 'Molarity is', a: ['Moles of solute per liter of solution', 'Moles of solute per liter of solvent', 'Grams of solute per liter of solution', 'Moles of solute per kilogram of solvent'], why: 'M = mol solute ÷ L solution. Moles per kilogram of solvent is molality, a different unit.' },
  { lv: 30, t: 'mc', q: '4.83 g of Na2S2O3 is dissolved to make 125 mL of solution (Handout 17, #2). Its molarity is', a: ['0.244 M', '0.0305 M', '38.6 M', '0.0386 M'], why: '4.83 g ÷ 158.11 g/mol = 0.03055 mol, then ÷ 0.125 L = 0.244 M. 0.0305 forgets to divide by the liters, and 38.6 divides grams by liters.' },
  { lv: 30, t: 'type', q: 'Mass of NaCl, in g, for 150. mL of 0.855 M NaCl? (Handout 17, #4)', ans: '7.50', re: '^7\\.50(g|gnacl)?$', why: '0.150 L × 0.855 mol/L = 0.1283 mol, then × 58.443 g/mol = 7.50 g. Three sig figs, so 7.50, not 7.5.' },
  { lv: 30, t: 'type', q: 'Molarity of 0.653 g NaOH in 350.0 mL of solution? (Chapter 6 worksheet #6)', ans: '0.0466', re: '^0?\\.0466(m|mnaoh)?$', why: '0.653 ÷ 39.997 = 0.01633 mol, then ÷ 0.3500 L = 0.0466 M.' },
  { lv: 30, t: 'mc', q: 'How many moles of solute are in 250. mL of 0.400 M glucose?', a: ['0.100 mol', '100. mol', '1.60 mol', '0.00160 mol'], why: '0.250 L × 0.400 mol/L = 0.100 mol. Convert mL to L first.' },
  { lv: 30, t: 'mc', q: 'What volume of 0.500 M KCl contains 0.125 mol of KCl?', a: ['250. mL', '62.5 mL', '4.00 L', '0.0625 mL'], why: '0.125 mol ÷ 0.500 mol/L = 0.250 L = 250. mL.' },
  { lv: 30, t: 'mc', q: 'In 0.150 M CaCl2, the concentration of Cl^- is', a: ['0.300 M', '0.150 M', '0.0750 M', '0.450 M'], why: 'Each CaCl2 releases 2 Cl^-: 2 × 0.150 = 0.300 M. [Ca^2+] is 0.150 M.' },
  { lv: 30, t: 'type', q: 'Mass of glucose (180.16 g/mol), in g, for 500. mL of 0.200 M solution?', ans: '18.0', re: '^18\\.0(g)?$', why: '0.500 L × 0.200 mol/L = 0.100 mol, then × 180.16 g/mol = 18.0 g. Three sig figs, so 18.0, not 18.' },

  { lv: 31, t: 'mc', q: '2.52 g of sucrose is dissolved in 25.0 g of water (Handout 17, #3). The % m/m is', a: ['9.16 %', '10.1 %', '2.52 %', '91.6 %'], why: 'Divide by the solution mass, 2.52 + 25.0 = 27.5 g: 9.16 %. 10.1 % divides by the water alone.' },
  { lv: 31, t: 'mc', q: '% v/v means', a: ['mL solute ÷ mL solution × 100', 'mL solute ÷ mL solvent × 100', 'g solute ÷ mL solution × 100', 'mol solute ÷ L solution × 100'], why: 'Volume of solute over the volume of the whole solution.' },
  { lv: 31, t: 'mc', q: '70.0 mL of isopropyl alcohol is diluted with water to 100.0 mL total. The % v/v is', a: ['70.0 %', '41.2 %', '30.0 %', '233 %'], why: '70.0 ÷ 100.0 × 100 = 70.0 %. The 100.0 mL is already the whole solution.' },
  { lv: 31, t: 'mc', q: 'Parts per million (ppm) is', a: ['g solute ÷ g solution × 10^6', 'g solute ÷ g solution × 100', 'mol solute ÷ L solution × 10^6', 'g solute ÷ g solvent × 1000'], why: 'The same idea as a percent, but per million instead of per hundred.' },
  { lv: 31, t: 'mc', q: 'A 1.0 kg water sample holds 0.0050 g of lead. Its concentration is', a: ['5.0 ppm', '0.0050 ppm', '5000 ppm', '0.50 ppm'], why: '0.0050 g ÷ 1000 g × 10^6 = 5.0 ppm. Convert kg to g first.' },
  { lv: 31, t: 'type', q: '15.0 g of NaCl in 135.0 g of water. % m/m? Number only.', ans: '10.0', re: '^10\\.0%?$', why: '15.0 ÷ (15.0 + 135.0) × 100 = 10.0 %. Three sig figs, so 10.0, not 10.' },
  { lv: 31, t: 'mc', q: 'How many grams of a 2.0 % m/m phenolphthalein solution hold 75 mg of phenolphthalein? (Chapter 6 worksheet #8)', a: ['3.8 g', '1.5 g', '0.0015 g', '37.5 g'], why: '0.075 g ÷ 0.020 = 3.75 g, or 3.8 g to 2 sig figs. 0.0015 g multiplies instead of dividing, and 1.5 g also skips the mg-to-g step.' },
  { lv: 31, t: 'mc', q: 'To turn a molarity into a % m/m, you also need', a: ['The density of the solution', 'The volume of the container', 'Avogadro\'s number', 'The boiling point'], why: 'Molarity uses liters of solution and % m/m uses grams of solution. Density links the two (Chapter 6 worksheet #9).' },
  { lv: 31, t: 'type', q: 'A 1.15 M NaBr solution has a density of 1.08 g/mL. Its % m/m? Number only. (Chapter 6 worksheet #9)', ans: '11.0', re: '^11\\.0%?$', why: 'In 1 L: 1.15 mol × 102.89 g/mol = 118.3 g NaBr in 1080 g of solution. 118.3 ÷ 1080 × 100 = 11.0 %. Three sig figs, so 11.0, not 11.' },
  { lv: 31, t: 'mc', q: 'Which unit suits a trace contaminant in drinking water?', a: ['ppm', '% m/m', '% v/v', 'Mass of solvent in kg'], why: 'Very small amounts give awkward percents. ppm (or ppb) keeps the numbers readable.' },
  { lv: 31, t: 'mc', q: 'In a dilute water solution, 1 ppm is about', a: ['1 mg per liter', '1 g per liter', '1 mg per mL', '1 g per 100 mL'], why: 'A liter of dilute solution weighs about 1000 g, and 1 mg in 1000 g is one part per million.' },

  { lv: 32, t: 'mc', q: 'In C1V1 = C2V2, V2 is', a: ['The total volume of the diluted solution', 'The volume of water added', 'The volume of the stock solution', 'The volume of solute'], why: 'V2 is the whole final solution, stock plus added water.' },
  { lv: 32, t: 'mc', q: '9.00 mL of water is added to 1.00 mL of 0.325 M Cr^3+ (Handout 17, #5). The new concentration is', a: ['0.0325 M', '0.0361 M', '3.25 M', '0.325 M'], why: 'V2 = 1.00 + 9.00 = 10.00 mL, so C2 = 0.325 × 1.00 ÷ 10.00 = 0.0325 M. 0.0361 M divides by the 9.00 mL of water only.' },
  { lv: 32, t: 'mc', q: 'To make 500. mL of 6 M HCl from 12 M HCl (Chapter 6 worksheet #10), you mix', a: ['250. mL of 12 M HCl with 250. mL of water', '500. mL of 12 M HCl with 500. mL of water', '250. mL of 12 M HCl with 500. mL of water', '1000 mL of 12 M HCl with 500. mL of water'], why: 'V1 = (6 M)(500. mL) ÷ 12 M = 250. mL. Water brings the total to 500. mL, and the acid goes into the water.' },
  { lv: 32, t: 'mc', q: 'Diluting a solution changes', a: ['Its concentration, but not the moles of solute', 'The moles of solute, but not the concentration', 'Both', 'Neither'], why: 'Only solvent is added, so the same moles spread through more volume.' },
  { lv: 32, t: 'type', q: '25.0 mL of 2.00 M NaCl is diluted to 100.0 mL. New molarity?', ans: '0.500', re: '^0?\\.500(m)?$', why: '2.00 × 25.0 ÷ 100.0 = 0.500 M. Three sig figs, so 0.500, not 0.5.' },
  { lv: 32, t: 'type', q: 'Volume of 6.0 M HCl, in mL, needed to make 300. mL of 1.5 M HCl?', ans: '75', re: '^75(ml)?$', why: 'V1 = 1.5 × 300. ÷ 6.0 = 75 mL. Add it to water and bring the total to 300. mL.' },
  { lv: 32, t: 'mc', q: 'When you dilute a concentrated acid, you', a: ['Add the acid to the water', 'Add the water to the acid', 'Pour both in at once', 'Can use either order'], why: 'Dr. Meyers: always add acid to water.' },
  { lv: 32, t: 'mc', q: 'From a 1.00 M stock, which gives 0.100 M?', a: ['10.0 mL diluted to 100.0 mL total', '10.0 mL plus 100.0 mL of water', '100.0 mL diluted to 10.0 mL', '1.00 mL diluted to 1000 mL'], why: '1.00 × 10.0 ÷ 100.0 = 0.100 M. Adding 100.0 mL of water makes 110.0 mL, which gives 0.0909 M.' },
  { lv: 32, t: 'mc', q: 'How much water must be added to 50.0 mL of 0.800 M KNO3 to make it 0.200 M?', a: ['150. mL', '200. mL', '12.5 mL', '40.0 mL'], why: 'V2 = 0.800 × 50.0 ÷ 0.200 = 200. mL total, so add 200. - 50.0 = 150. mL of water.' },
  { lv: 32, t: 'mc', q: '8 mol of solute in 1 L (8 M) is diluted to 3 L. The new concentration is', a: ['2.67 M', '24 M', '8 M', '0.375 M'], why: '8 × 1 ÷ 3 = 2.67 M. The same 8 mol now spread over 3 L. Dr. Meyers\' slide keeps three digits even though 8 and 3 have one sig fig.' },

  { lv: 33, t: 'mc', q: 'The law of conservation of mass says that in a chemical reaction', a: ['Atoms are only rearranged, so the products have the same total mass as the reactants', 'The products have more mass, because new bonds form', 'The number of molecules is the same on both sides', 'Mass is conserved only when every substance is a gas'], why: 'No atom is created or destroyed; the atoms just change partners. Molecules are not conserved: 2 H2 + O2 -> 2 H2O starts with 3 molecules and ends with 2, but both sides hold 4 H and 2 O.' },
  { lv: 33, t: 'mc', q: 'When you balance a chemical equation, what are you allowed to change?', a: ['Only the coefficients in front of the formulas', 'Only the subscripts inside the formulas', 'Both the coefficients and the subscripts', 'The state symbols, such as (g) and (aq)'], why: 'Dr. Meyers\' first tip: you cannot change the formula, only the coefficient. Changing the subscript in H2O to get H2O2 turns water into hydrogen peroxide, a different substance.' },
  { lv: 33, t: 'type', q: 'How many O atoms are shown by 2 Al2(SO4)3?', ans: '24', re: '^24(o|oatoms|atoms)?$', why: 'The coefficient multiplies the whole formula, and the 3 after the parentheses multiplies the sulfate: 2 × 3 × 4 = 24. Leaving out the coefficient gives 12.' },
  { lv: 33, t: 'mc', q: 'Balance C3H8(g) + O2(g) -> CO2(g) + H2O(l) with the lowest whole numbers. The coefficients, in order, are (Handout 18, #1a)', a: ['1, 5, 3, 4', '1, 10, 3, 4', '2, 10, 6, 8', '1, 3, 3, 4'], why: 'Set C3H8 to 1. Its 3 C make 3 CO2 and its 8 H make 4 H2O. The right side then holds 3(2) + 4 = 10 O atoms, which is 5 O2. 1, 10, 3, 4 counts O atoms instead of O2 molecules, and 2, 10, 6, 8 balances but is not in the lowest whole-number ratio.' },
  { lv: 33, t: 'mc', q: 'Balance H3PO4(aq) + KOH(aq) -> K3PO4(aq) + H2O(l). What coefficient goes in front of KOH? (Handout 18, #1b)', a: ['3', '1', '2', '4'], why: 'Treat phosphate, PO4, as one unit: there is one on each side. K3PO4 needs 3 K, so 3 KOH. Those 3 OH plus the 3 H from H3PO4 make 3 H2O. Full answer: 1, 3, 1, 3.' },
  { lv: 33, t: 'mc', q: 'Which is the correctly balanced form of Fe(s) + O2(g) -> Fe2O3(s), with the lowest whole-number coefficients? (Handout 18, #1c)', a: ['4 Fe + 3 O2 -> 2 Fe2O3', '2 Fe + 3/2 O2 -> Fe2O3', '2 Fe + 3 O2 -> Fe2O3', '2 Fe + O2 -> 2 FeO'], why: 'Fe2O3 has 3 O, an odd number, but O2 brings O in pairs, so start with 2 Fe2O3 (6 O). That takes 3 O2 and 4 Fe. 2 Fe + 3/2 O2 balances but uses a fraction, so double it. FeO is a different compound; you may never change the formula of a product.' },
  { lv: 33, t: 'mc', q: 'Solid white phosphorus (P4) reacts with dioxygen gas to make solid tetraphosphorus decoxide. Which equation is written and balanced correctly? (Handout 19, #1)', a: ['P4(s) + 5 O2(g) -> P4O10(s)', 'P4(s) + 10 O(g) -> P4O10(s)', 'P4(s) + O2(g) -> P4O10(s)', 'P4(s) + 5 O2(g) -> P4O10(g)'], why: 'Dioxygen is O2, and tetra- (4) plus deca- (10) gives P4O10. Its 10 O need 5 O2. Writing 10 O uses single O atoms, which is not dioxygen, and the product is a solid, so it gets (s), not (g).' },
  { lv: 33, t: 'mc', q: 'In a chemical equation, (aq) after a formula means the substance is', a: ['Dissolved in water', 'A pure liquid', 'A gas', 'A solid'], why: '(aq) stands for aqueous: dissolved in water, like KCl(aq). A pure liquid is (l), as in H2O(l), (g) is a gas and (s) is a solid.' },
  { lv: 33, t: 'mc', q: 'Which of these is a chemical change, the kind a chemical equation describes?', a: ['Propane burning to form CO2 and H2O', 'Water boiling into steam', 'Sugar dissolving in water', 'Dry ice (solid CO2) turning into CO2 gas'], why: 'A chemical change makes new substances. Boiling, dissolving and subliming change the state or mix things, but the formula stays the same: dry ice is still CO2 after it turns to gas.' },
  { lv: 33, t: 'mc', q: 'When Pb(NO3)2(aq) and KCl(aq) are mixed, a solid appears (Handout 19, #6). What does the solid tell you?', a: ['A chemical change happened: the solid, PbCl2, is a new substance', 'A physical change happened: some Pb(NO3)2 came back out of the water', 'A physical change happened: the water evaporated and left a solid', 'Nothing new formed, because both reactants started out dissolved'], why: 'In Pb(NO3)2(aq) + KCl(aq) -> PbCl2(s) + KNO3(aq), the (s) marks PbCl2 as the new solid. KNO3 stays dissolved, so it is written (aq). Two dissolved reactants can still react.' },
  { lv: 33, t: 'mc', q: 'Balance Pb(NO3)2(aq) + KCl(aq) -> PbCl2(s) + KNO3(aq). The coefficients, in order, are (Handout 19, #6a)', a: ['1, 2, 1, 2', '1, 2, 1, 1', '1, 1, 1, 1', '2, 1, 2, 1'], why: 'PbCl2 has 2 Cl, so 2 KCl. That brings 2 K, and Pb(NO3)2 brings 2 NO3 groups, so 2 KNO3 balances both. 1, 2, 1, 1 leaves 2 K and 2 NO3 on the left but only 1 of each on the right.' },
  { lv: 33, t: 'type', q: 'Balance C2H6 + O2 -> CO2 + H2O with the lowest whole numbers. What coefficient goes in front of O2?', ans: '7', re: '^(7|seven)$', why: '2 C gives 2 CO2 and 6 H gives 3 H2O, so the right side holds 2(2) + 3 = 7 O atoms, or 7/2 O2. Coefficients must be whole numbers, so double everything: 2 C2H6 + 7 O2 -> 4 CO2 + 6 H2O.' },
  { lv: 33, t: 'type', q: '4.0 g of H2 reacts with exactly 32.0 g of O2, and nothing is left over. What mass of water forms, in g?', ans: '36.0', re: '^36\\.0(g|gh2o)?$', why: 'Conservation of mass: mass in equals mass out, so 4.0 g + 32.0 g = 36.0 g. A sum keeps the tenths place, so 36.0.' },
  { lv: 33, boss: true, t: 'mc', q: 'Balance C4H10 + O2 -> CO2 + H2O with the lowest whole numbers. The coefficient of O2 is', a: ['13', '6.5', '26', '9'], why: '4 C gives 4 CO2 and 10 H gives 5 H2O, so the right side holds 4(2) + 5 = 13 O atoms, or 13/2 O2. Double everything: 2 C4H10 + 13 O2 -> 8 CO2 + 10 H2O. 6.5 stops before clearing the fraction, 26 counts O atoms after doubling, and 9 comes from writing 10 H2O for 10 H.' },
  { lv: 33, boss: true, t: 'mc', q: 'Ethanol burns: C2H5OH + O2 -> CO2 + H2O. Balanced with the lowest whole numbers, the coefficient of O2 is', a: ['3', '3.5', '7', '6'], why: '2 C gives 2 CO2 and 6 H gives 3 H2O, so the right side holds 2(2) + 3 = 7 O. Ethanol already brings 1 O, so O2 supplies the other 6: 3 O2. 3.5 forgets the O inside ethanol, and 6 and 7 count O atoms instead of O2 molecules.' },
  { lv: 33, boss: true, t: 'mc', q: 'Balance Ca(OH)2 + H3PO4 -> Ca3(PO4)2 + H2O. The coefficients, in order, are', a: ['3, 2, 1, 6', '3, 2, 1, 3', '3, 1, 1, 6', '1, 1, 1, 2'], why: 'Keep PO4 together as one unit. Ca3(PO4)2 needs 3 Ca and 2 PO4, so 3 Ca(OH)2 and 2 H3PO4. That puts 6 OH and 6 H on the left, which pair up into 6 H2O. 3, 2, 1, 3 leaves 12 H on the left and only 6 on the right.' },

  { lv: 34, t: 'mc', q: 'In N2 + 3 H2 -> 2 NH3, the mole ratio of H2 to NH3 is', a: ['3 mol H2 : 2 mol NH3', '2 mol H2 : 3 mol NH3', '3 g H2 : 2 g NH3', '1 mol H2 : 1 mol NH3'], why: 'Read it from the coefficients: 3 H2 and 2 NH3. Coefficients count moles (or molecules), never grams, so the mass ratio is wrong. The subscripts inside H2 and NH3 are not part of the ratio.' },
  { lv: 34, t: 'mc', q: '2 graham crackers + 1 marshmallow + 1 chocolate -> 1 s\'more. How many s\'mores can 12 graham crackers make if there is plenty of everything else?', a: ['6', '12', '24', '3'], why: '12 graham × (1 s\'more ÷ 2 graham) = 6. 24 multiplies by the 2 instead of dividing, and 3 divides by all 4 pieces, but only the graham crackers matter here.' },
  { lv: 34, t: 'mc', q: 'P4 + 5 O2 -> P4O10. How many mol of P4 react with 20. mol of O2? (Handout 19, #1, trial A)', a: ['4.0 mol', '100 mol', '20. mol', '0.25 mol'], why: '20. mol O2 × (1 mol P4 ÷ 5 mol O2) = 4.0 mol P4. 100 mol has the ratio upside down, and 20. mol ignores it. The trial also makes 4.0 mol of P4O10.' },
  { lv: 34, t: 'mc', q: 'P4 + 5 O2 -> P4O10. With 5.0 mol of P4, how many mol of O2 are used? (Handout 19, #1, trial B)', a: ['25 mol', '1.0 mol', '5.0 mol', '10. mol'], why: '5.0 mol P4 × (5 mol O2 ÷ 1 mol P4) = 25 mol O2. 1.0 mol divides by 5 instead of multiplying, and 10. mol uses the subscript in O2 instead of the coefficient.' },
  { lv: 34, t: 'mc', q: 'P4 + 5 O2 -> P4O10. How many mol of P4O10 form from 1.0 mol of O2? (Handout 19, #1, trial D)', a: ['0.20 mol', '5.0 mol', '1.0 mol', '0.10 mol'], why: '1.0 mol O2 × (1 mol P4O10 ÷ 5 mol O2) = 0.20 mol. 1.0 has two sig figs, so write 0.20. 5.0 mol has the ratio upside down, and 0.10 mol divides by the 10 in P4O10, which is a subscript.' },
  { lv: 34, t: 'mc', q: 'N2 + 3 H2 -> 2 NH3. What mass of N2 is needed to make 51.0 g of NH3? (Handout 19, #2)', a: ['41.9 g', '83.9 g', '168 g', '25.5 g'], why: '51.0 g ÷ 17.03 g/mol = 2.995 mol NH3. × (1 mol N2 ÷ 2 mol NH3) = 1.497 mol N2. × 28.014 g/mol = 41.9 g. 83.9 g skips the mole ratio, 168 g flips it, and 25.5 g halves the grams, but coefficients compare moles, not grams.' },
  { lv: 34, t: 'mc', q: 'O2 + 2 H2 -> 2 H2O. What mass of H2O can 2.5 g of H2 make with plenty of O2?', a: ['22 g', '11 g', '45 g', '2.5 g'], why: '2.5 g ÷ 2.016 g/mol = 1.24 mol H2, which makes 1.24 mol H2O (2:2). × 18.015 g/mol = 22 g, kept to two sig figs. 11 g and 45 g misuse the 2:2 ratio, and 2.5 g assumes grams carry straight across.' },
  { lv: 34, t: 'mc', q: 'How many H2 molecules are in 2.5 g of H2?', a: ['7.5 x 10^23', '1.5 x 10^24', '2.4 x 10^23', '2.1 x 10^-24'], why: '2.5 g ÷ 2.016 g/mol = 1.24 mol, then × 6.022 x 10^23 = 7.5 x 10^23 molecules. 1.5 x 10^24 counts H atoms (two per molecule), 2.4 x 10^23 divides Avogadro\'s number by the grams, and 2.1 x 10^-24 divides the moles by it.' },
  { lv: 34, t: 'mc', q: '4 Al + 3 O2 -> 2 Al2O3. What mass of Al2O3 forms from 5.40 g of Al?', a: ['10.2 g', '20.4 g', '40.8 g', '5.10 g'], why: '5.40 g ÷ 26.982 g/mol = 0.2001 mol Al. × (2 mol Al2O3 ÷ 4 mol Al) = 0.1001 mol. × 101.96 g/mol = 10.2 g. 20.4 g skips the 2:4 ratio, 40.8 g flips it, and 5.10 g uses 1/4 in place of 2/4.' },
  { lv: 34, t: 'mc', q: 'C3H8 + 5 O2 -> 3 CO2 + 4 H2O. What mass of O2 is needed to burn 44.1 g of C3H8?', a: ['160. g', '32.0 g', '6.40 g', '80.0 g'], why: '44.1 g ÷ 44.096 g/mol = 1.000 mol C3H8. × 5 = 5.000 mol O2. × 31.998 g/mol = 160. g. 80.0 g uses 15.999 g/mol for O instead of 31.998 for O2, 32.0 g skips the 1:5 ratio, and 6.40 g flips it.' },
  { lv: 34, t: 'mc', q: 'You know grams of A and want grams of B. Which path matches Dr. Meyers\' stoichiometry pathway?', a: ['g A -> mol A -> mol B -> g B', 'g A -> g B, with the coefficients as a mass ratio', 'g A -> mol B -> g B, with the molar mass of B', 'g A -> particles A -> g B'], why: 'Molar mass turns g A into mol A, the coefficients turn mol A into mol B, and molar mass again turns mol B into g B. Coefficients compare moles, never grams, so there is no shortcut from g A to g B.' },
  { lv: 34, t: 'type', q: 'N2 + 3 H2 -> 2 NH3. How many mol of NH3 form from 6.0 mol of H2?', ans: '4.0', re: '^4\\.0(mol|molnh3)?$', why: '6.0 mol H2 × (2 mol NH3 ÷ 3 mol H2) = 4.0 mol NH3. Two sig figs, so 4.0, not 4.' },
  { lv: 34, t: 'type', q: '4 Fe + 3 O2 -> 2 Fe2O3. How many mol of Fe2O3 form from 1.20 mol of Fe?', ans: '0.600', re: '^0?\\.600(mol|molfe2o3)?$', why: '1.20 mol Fe × (2 mol Fe2O3 ÷ 4 mol Fe) = 0.600 mol. Three sig figs, so 0.600.' },
  { lv: 34, boss: true, t: 'mc', q: '2 H2 + O2 -> 2 H2O. How many O2 molecules react with 0.50 mol of H2?', a: ['1.5 x 10^23', '3.0 x 10^23', '6.0 x 10^23', '0.25'], why: '0.50 mol H2 × (1 mol O2 ÷ 2 mol H2) = 0.25 mol O2, then × 6.022 x 10^23 = 1.5 x 10^23 molecules. 3.0 x 10^23 skips the 1:2 ratio, 6.0 x 10^23 flips it, and 0.25 stops at moles.' },
  { lv: 34, boss: true, t: 'mc', q: 'N2 + 3 H2 -> 2 NH3. What mass of H2 is needed to make 34.0 g of NH3?', a: ['6.04 g', '2.68 g', '4.02 g', '3.02 g'], why: '34.0 g ÷ 17.03 g/mol = 1.996 mol NH3. × (3 mol H2 ÷ 2 mol NH3) = 2.995 mol H2. × 2.016 g/mol = 6.04 g. 2.68 g flips the ratio, 4.02 g skips it, and 3.02 g uses 1.0079 g/mol for H instead of 2.016 for H2.' },
  { lv: 34, boss: true, t: 'mc', q: '4 NH3 + 5 O2 -> 4 NO + 6 H2O. How many mol of H2O form when 2.5 mol of O2 react?', a: ['3.0 mol', '2.1 mol', '2.5 mol', '2.0 mol'], why: '2.5 mol O2 × (6 mol H2O ÷ 5 mol O2) = 3.0 mol H2O. 2.1 mol flips the ratio, 2.5 mol ignores it, and 2.0 mol uses the 4 that belongs to NH3.' },

  { lv: 35, t: 'mc', q: 'The limiting reactant is the reactant that', a: ['Runs out first and so sets how much product forms', 'Has the smallest mass at the start', 'Has the smallest coefficient in the balanced equation', 'Is still left over when the reaction stops'], why: 'When the limiting reactant is gone, the reaction stops. Find it by comparing moles through the equation, not grams or coefficients. The reactant still left over is the excess reactant.' },
  { lv: 35, t: 'mc', q: '2 graham crackers + 1 marshmallow + 1 chocolate -> 1 s\'more. You have 12 graham crackers, 8 marshmallows and 10 chocolates. Which runs out first?', a: ['Graham crackers', 'Marshmallows', 'Chocolates', 'All three run out together'], why: '12 graham crackers make 6 s\'mores, 8 marshmallows could make 8 and 10 chocolates could make 10. The smallest, 6, wins: the graham crackers limit, even though you have the most of them.' },
  { lv: 35, t: 'mc', q: 'P4 + 5 O2 -> P4O10. A flask holds 4.0 mol of P4 and 15 mol of O2. Which reactant limits, and how much P4O10 can form? (Handout 19, #3a and #3b)', a: ['O2 limits, and 3.0 mol of P4O10 forms', 'P4 limits, and 4.0 mol of P4O10 forms', 'O2 limits, and 15 mol of P4O10 forms', 'P4 limits, and 3.0 mol of P4O10 forms'], why: '4.0 mol P4 could make 4.0 mol P4O10 (1:1). 15 mol O2 could make only 15 ÷ 5 = 3.0 mol. The smaller amount wins, so O2 limits even though there are more moles of it. 1.0 mol of P4 is left over.' },
  { lv: 35, t: 'type', q: 'P4 + 5 O2 -> P4O10. A flask holds 4.0 mol of P4 and 10. mol of O2. How many mol of P4 are left when the reaction stops?', ans: '2.0', re: '^2\\.0(mol|molp4)?$', why: 'O2 limits: 10. mol ÷ 5 = 2.0 mol P4O10, which uses 2.0 mol P4. Left over = start - used = 4.0 - 2.0 = 2.0 mol of P4.' },
  { lv: 35, t: 'mc', q: 'N2 + 3 H2 -> 2 NH3. 20.0 g of N2 is mixed with 12.5 g of H2. Which reactant limits? (Handout 19, #5)', a: ['N2', 'H2', 'NH3', 'Neither; both are used up'], why: 'N2: 20.0 ÷ 28.014 = 0.7139 mol, enough for 1.428 mol NH3. H2: 12.5 ÷ 2.016 = 6.200 mol, enough for 4.134 mol NH3. N2 makes less, so it limits. It has the larger mass, but its molar mass is about 14 times larger too.' },
  { lv: 35, t: 'type', q: 'N2 + 3 H2 -> 2 NH3, starting with 20.0 g of N2 and 12.5 g of H2. What is the most NH3, in g, that can form? (Handout 19, #5)', ans: '24.3', re: '^24\\.3(g|gnh3)?$', why: 'Run both: N2 gives 0.7139 mol × 2 = 1.428 mol NH3 = 24.3 g, and H2 gives 4.134 mol NH3 = 70.4 g. The smaller, 24.3 g, is the answer; 70.4 g is out of reach because the N2 runs out first.' },
  { lv: 35, t: 'mc', q: 'Which is true of the excess reactant?', a: ['Some of it is still there when the reaction stops', 'It is always the reactant with the larger mass', 'It decides how much product forms', 'It is completely used up'], why: 'The excess reactant is the one left over; the limiting reactant decides how much product forms. Mass alone does not tell you which is which, so compare moles through the equation.' },
  { lv: 35, t: 'mc', q: '2 H2 + O2 -> 2 H2O. You mix 4 mol of H2 with 3 mol of O2. Which reactant limits, and what is left over?', a: ['H2 limits; 1 mol of O2 is left', 'O2 limits; 1 mol of H2 is left', 'H2 limits; 1 mol of H2 is left', 'Neither limits; nothing is left'], why: '4 mol H2 needs only 2 mol O2, and 3 mol is there, so H2 runs out first and 3 - 2 = 1 mol of O2 is left. Picking O2 because 3 is less than 4 compares raw moles and skips the 2:1 ratio.' },
  { lv: 35, t: 'type', q: '2 Na + Cl2 -> 2 NaCl. 3.0 mol of Na reacts with 2.0 mol of Cl2. How many mol of NaCl can form?', ans: '3.0', re: '^3\\.0(mol|molnacl)?$', why: 'Na gives 3.0 × (2 ÷ 2) = 3.0 mol NaCl. Cl2 gives 2.0 × (2 ÷ 1) = 4.0 mol. Na gives less, so Na limits and 3.0 mol forms; 4.0 mol is out of reach.' },
  { lv: 35, t: 'mc', q: '2 Al + 3 Cl2 -> 2 AlCl3. 2.70 g of Al is mixed with 7.09 g of Cl2. Which reactant limits?', a: ['Cl2', 'Al', 'AlCl3', 'Neither; they are in the exact ratio'], why: 'Al: 2.70 ÷ 26.982 = 0.1001 mol, enough for 0.1001 mol AlCl3. Cl2: 7.09 ÷ 70.906 = 0.1000 mol, enough for only 0.1000 × 2/3 = 0.0667 mol. Cl2 limits. The moles are nearly equal, but the equation needs 3 Cl2 for every 2 Al, so they are not in the exact ratio.' },
  { lv: 35, t: 'mc', q: 'Given grams of two reactants, the hint on Handout 19, #5 says to find the limiting reactant by', a: ['Running a separate calculation from each reactant to the product and comparing', 'Picking the reactant with the smaller mass', 'Picking the reactant with the smaller molar mass', 'Picking the reactant with the larger coefficient'], why: 'His hint: do two separate calculations, one starting from each reactant, then compare. The smaller product amount is the theoretical yield, and the reactant that gave it is limiting.' },
  { lv: 35, t: 'mc', q: 'N2 + 3 H2 -> 2 NH3. A flask holds 2.0 mol of N2 and 3.0 mol of H2. Which reactant is left over when the reaction stops, and how much?', a: ['1.0 mol of N2', '1.0 mol of H2', '2.0 mol of N2', 'Neither; both run out together'], why: '3.0 mol H2 needs only 1.0 mol N2, and 2.0 mol is there, so H2 limits and 2.0 - 1.0 = 1.0 mol of N2 is left. 2.0 mol forgets to subtract the N2 that reacted.' },
