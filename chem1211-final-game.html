  { lv: 35, t: 'mc', q: 'Two reactants are mixed in exactly the mole ratio of the balanced equation. Then', a: ['Both run out at the same time, and neither is in excess', 'The one with the smaller molar mass limits', 'The one with the larger coefficient limits', 'No product forms until one is in excess'], why: 'If the amounts match the coefficients exactly, both are used up together. There is still a theoretical yield; there is just nothing left over.' },
  { lv: 35, boss: true, t: 'mc', q: 'N2 + 3 H2 -> 2 NH3, starting with 20.0 g of N2 and 12.5 g of H2. How many grams of H2 are left when the reaction stops? (numbers from Handout 19, #5)', a: ['8.2 g', '4.32 g', '12.0 g', '10.3 g'], why: 'N2 limits: 0.7139 mol N2 uses 3 × 0.7139 = 2.142 mol H2 = 4.32 g. 12.5 - 4.32 = 8.2 g left; a subtraction keeps the tenths place of 12.5. 4.32 g is the H2 used, not left. 12.0 g flips the 1:3 ratio, and 10.3 g uses 1.0079 g/mol for H instead of 2.016 for H2.' },
  { lv: 35, boss: true, t: 'mc', q: '2 Al + 3 Cl2 -> 2 AlCl3. What mass of AlCl3 can form from 2.70 g of Al and 7.09 g of Cl2?', a: ['8.89 g', '13.3 g', '20.0 g', '9.79 g'], why: 'Cl2 limits: 7.09 ÷ 70.906 = 0.1000 mol × 2/3 = 0.0667 mol AlCl3 × 133.34 g/mol = 8.89 g. 13.3 g comes from the Al, the excess reactant, 20.0 g flips the 2:3 ratio, and 9.79 g adds the reactant masses even though some Al is left over.' },
  { lv: 35, boss: true, t: 'mc', q: 'C3H8 + 5 O2 -> 3 CO2 + 4 H2O. 1.0 mol of C3H8 burns with 4.0 mol of O2. How many mol of CO2 form?', a: ['2.4 mol', '3.0 mol', '6.7 mol', '0.80 mol'], why: 'C3H8 could make 3.0 mol CO2, but O2 could make only 4.0 × 3/5 = 2.4 mol. O2 limits, so 2.4 mol. 3.0 mol uses the excess C3H8, 6.7 mol flips the ratio, and 0.80 mol stops at 4.0 ÷ 5.' },

  { lv: 36, t: 'mc', q: 'The theoretical yield of a reaction is', a: ['The most product it could make, worked out by stoichiometry', 'The amount of product actually collected in the lab', 'The total mass of the reactants', 'The amount of excess reactant left over'], why: 'Theoretical yield comes from a calculation. The amount you actually collect and weigh is the actual yield, and it is usually less.' },
  { lv: 36, t: 'mc', q: 'In a percent yield problem, the actual yield is usually', a: ['Given in the problem as the amount collected', 'Calculated from the limiting reactant', 'Read off the formula sheet', 'The larger of the two yields'], why: 'The actual yield is measured in the lab, so the problem hands it to you. The theoretical yield is the one you calculate from the limiting reactant.' },
  { lv: 36, t: 'mc', q: 'Which is the percent yield formula from the formula sheet?', a: ['actual yield ÷ theoretical yield × 100', 'theoretical yield ÷ actual yield × 100', 'actual yield - theoretical yield', '(theoretical yield - actual yield) ÷ theoretical yield × 100'], why: 'Actual goes on top. Flipping the fraction gives more than 100 % for a normal reaction, and (theoretical - actual) ÷ theoretical gives the percent that was lost.' },
  { lv: 36, t: 'mc', q: 'The theoretical yield is 3.0 mol of P4O10 and 2.0 mol is collected. What is the percent yield? (Handout 19, #3c)', a: ['67 %', '150 %', '33 %', '50. %'], why: '2.0 ÷ 3.0 × 100 = 67 %, two sig figs. 150 % has the fraction upside down, 33 % is the part that was lost, and 50. % divides by 4.0 mol, what the excess P4 could have made.' },
  { lv: 36, t: 'type', q: '4 Fe + 3 O2 -> 2 Fe2O3. What is the theoretical yield of Fe2O3, in g, from 11.2 g of Fe with excess O2?', ans: '16.0', re: '^16\\.0(g|gfe2o3)?$', why: '11.2 g ÷ 55.845 g/mol = 0.2006 mol Fe. × (2 mol Fe2O3 ÷ 4 mol Fe) = 0.1003 mol. × 159.69 g/mol = 16.0 g. Three sig figs, so 16.0.' },
  { lv: 36, t: 'mc', q: '4 Fe + 3 O2 -> 2 Fe2O3. 2.7 g of Fe reacts with excess O2 and 3.2 g of Fe2O3 is collected. What is the percent yield? (Handout 19, #4)', a: ['83 %', '41 %', '21 %', '119 %'], why: 'Theoretical yield: 2.7 g Fe -> 0.04835 mol Fe -> 0.02417 mol Fe2O3 -> 3.86 g. Then 3.2 ÷ 3.86 × 100 = 83 %. 41 % skips the 2:4 ratio, 21 % flips it, and 119 % divides by the grams of Fe, a different substance.' },
  { lv: 36, t: 'type', q: 'N2 + 3 H2 -> 2 NH3. 20.0 g of N2 and 12.5 g of H2 give 21.5 g of NH3. What is the percent yield? Number only. (Handout 19, #5)', ans: '88.4', re: '^88\\.4%?$', why: 'N2 limits, so the theoretical yield is 24.3 g of NH3. 21.5 ÷ 24.32 × 100 = 88.4 %. Dividing by the 70.4 g from the H2 path gives 30.5 %, but H2 is the excess reactant.' },
  { lv: 36, t: 'type', q: 'A reaction has a theoretical yield of 25.0 g, and 20.0 g is collected. What is the percent yield? Number only.', ans: '80.0', re: '^80\\.0%?$', why: '20.0 ÷ 25.0 × 100 = 80.0 %. Three sig figs, so 80.0, not 80.' },
  { lv: 36, t: 'mc', q: 'A student reports a 112 % yield. What is the most likely reason?', a: ['The product was still wet or impure when it was weighed', 'The reaction created extra atoms', 'The limiting reactant was used to find the theoretical yield', 'Yields over 100 % are normal for fast reactions'], why: 'Mass is conserved, so you cannot collect more product than the theoretical yield. Over 100 % means something else, like water or an impurity, was weighed along with the product.' },
  { lv: 36, t: 'mc', q: 'To calculate the theoretical yield, you start from', a: ['The limiting reactant', 'The excess reactant', 'Whichever reactant has the larger mass', 'The actual yield'], why: 'Only the limiting reactant tells you how much product can really form. Starting from the excess reactant gives an amount the reaction can never reach.' },
  { lv: 36, t: 'mc', q: 'Your actual yield is 7.00 g of Fe2O3 and your theoretical yield is 0.0500 mol of Fe2O3. Before you divide, you must', a: ['Convert so both are in the same unit, such as grams', 'Divide 7.00 by 0.0500 as written', 'Multiply the moles by Avogadro\'s number', 'Apply the mole ratio a second time'], why: 'Percent yield compares like with like. 0.0500 mol × 159.69 g/mol = 7.98 g, then 7.00 ÷ 7.98 × 100 = 87.7 %. Dividing 7.00 by 0.0500 gives 14,000 %, a sure sign the units do not match.' },
  { lv: 36, t: 'mc', q: 'N2 + 3 H2 -> 2 NH3. 3.00 g of H2 reacts with excess N2 and 12.0 g of NH3 is collected. What is the percent yield?', a: ['71.0 %', '31.6 %', '47.4 %', '400. %'], why: '3.00 g ÷ 2.016 g/mol = 1.488 mol H2. × (2 ÷ 3) = 0.9921 mol NH3. × 17.03 g/mol = 16.89 g. 12.0 ÷ 16.89 × 100 = 71.0 %. 47.4 % skips the 2:3 ratio, 31.6 % flips it, and 400. % divides by the grams of H2.' },
  { lv: 36, t: 'mc', q: 'Which of these makes the actual yield come out lower than the theoretical yield?', a: ['Some product sticks to the filter paper and is lost', 'The product is weighed while it is still wet', 'The equation is balanced before the calculation', 'The theoretical yield is found from the limiting reactant'], why: 'Losing product during filtering and transfer is the usual reason a yield falls short. A wet product does the opposite: the extra water makes the yield look too high.' },
  { lv: 36, boss: true, t: 'mc', q: 'A reaction has a theoretical yield of 24.3 g and a percent yield of 75.0 %. What mass was actually collected?', a: ['18.2 g', '32.4 g', '24.3 g', '6.08 g'], why: 'actual = percent yield ÷ 100 × theoretical = 0.750 × 24.3 g = 18.2 g. 32.4 g divides by 0.750 instead, 24.3 g assumes a perfect yield, and 6.08 g is the 25.0 % that was lost.' },
  { lv: 36, boss: true, t: 'mc', q: '4 Fe + 3 O2 -> 2 Fe2O3. 5.00 g of Fe and 5.00 g of O2 react, and 6.50 g of Fe2O3 is collected. What is the percent yield?', a: ['90.9 %', '39.1 %', '65.0 %', '22.7 %'], why: 'Fe gives 7.15 g of Fe2O3 and O2 gives 16.6 g, so Fe limits and the theoretical yield is 7.15 g. 6.50 ÷ 7.15 × 100 = 90.9 %. 39.1 % divides by the O2 path, 65.0 % divides by the 10.00 g of reactants, and 22.7 % flips the Fe ratio.' },
  { lv: 36, boss: true, t: 'mc', q: 'Which change leaves the theoretical yield the same?', a: ['Adding more of the excess reactant', 'Adding more of the limiting reactant', 'Using half as much of the limiting reactant', 'Doubling the amounts of both reactants'], why: 'The theoretical yield depends only on the limiting reactant. Extra excess reactant just leaves more of it behind. Changing the limiting reactant, or both reactants, changes how much product can form.' },

  { lv: 37, t: 'mc', q: 'How many mol of NaOH are in 250. mL of 0.400 M NaOH?', a: ['0.100 mol', '100. mol', '1.60 mol', '0.00160 mol'], why: 'mol = M × L = 0.400 mol/L × 0.250 L = 0.100 mol. 100. mol forgets to change mL to L, and 1.60 mol and 0.00160 mol divide instead of multiply.' },
  { lv: 37, t: 'mc', q: 'Pb(NO3)2(aq) + 2 KCl(aq) -> PbCl2(s) + 2 KNO3(aq). What volume of 5.0 x 10^-1 M KCl precipitates all the Pb^2+ in 0.100 L of 0.150 M Pb(NO3)2? (Handout 19, #6b)', a: ['60. mL', '30. mL', '15 mL', '0.060 mL'], why: '0.100 L × 0.150 mol/L = 0.0150 mol Pb(NO3)2. × (2 mol KCl ÷ 1 mol Pb(NO3)2) = 0.0300 mol KCl. ÷ 0.50 mol/L = 0.060 L = 60. mL. 30. mL is the M1V1 = M2V2 shortcut, which Dr. Meyers marks incorrect: it only works when diluting one chemical, and here it skips the 2:1 ratio. 15 mL flips the ratio.' },
  { lv: 37, t: 'mc', q: 'Why does C1V1 = C2V2 fail for Handout 19, #6b?', a: ['It only works when diluting one chemical; two chemicals reacting need the mole ratio', 'It only works when both volumes are in liters', 'It only works for gases', 'It only works when neither solution is aqueous'], why: 'His Nov 20 slide: M1V1 = M2V2 only works when diluting 1 chemical. Here Pb(NO3)2 and KCl react 1:2, so you go through moles and the coefficients instead.' },
  { lv: 37, t: 'mc', q: 'Pb(NO3)2(aq) + 2 KCl(aq) -> PbCl2(s) + 2 KNO3(aq). What mass of PbCl2 forms from 0.100 L of 0.150 M Pb(NO3)2 with excess KCl?', a: ['4.17 g', '8.34 g', '2.09 g', '0.0150 g'], why: '0.100 L × 0.150 mol/L = 0.0150 mol Pb(NO3)2 = 0.0150 mol PbCl2 (1:1). × 278.1 g/mol = 4.17 g. 8.34 g uses the 2 that belongs to KCl, 2.09 g halves it, and 0.0150 g stops at moles.' },
  { lv: 37, t: 'type', q: 'How many mol of HCl are in 35.0 mL of 0.200 M HCl?', ans: '0.00700', re: '^0?\\.00700(mol|molhcl)?$', why: '35.0 mL = 0.0350 L. 0.0350 L × 0.200 mol/L = 0.00700 mol. Three sig figs, so 0.00700.' },
  { lv: 37, t: 'mc', q: 'HCl(aq) + NaOH(aq) -> NaCl(aq) + H2O(l). What volume of 0.100 M NaOH neutralizes 25.0 mL of 0.150 M HCl?', a: ['37.5 mL', '16.7 mL', '3.75 mL', '0.0375 mL'], why: '0.0250 L × 0.150 mol/L = 0.00375 mol HCl = 0.00375 mol NaOH (1:1). ÷ 0.100 mol/L = 0.0375 L = 37.5 mL. 16.7 mL swaps the two molarities. With a 1:1 ratio, M1V1 = M2V2 happens to give the same answer; with any other ratio it does not.' },
  { lv: 37, t: 'mc', q: 'H2SO4(aq) + 2 NaOH(aq) -> Na2SO4(aq) + 2 H2O(l). How many mL of 0.250 M NaOH react with 20.0 mL of 0.100 M H2SO4?', a: ['16.0 mL', '8.00 mL', '4.00 mL', '40.0 mL'], why: '0.0200 L × 0.100 mol/L = 0.00200 mol H2SO4. × (2 mol NaOH ÷ 1 mol H2SO4) = 0.00400 mol NaOH. ÷ 0.250 mol/L = 0.0160 L = 16.0 mL. 8.00 mL is the M1V1 = M2V2 shortcut, which misses the 1:2 ratio, 4.00 mL flips the ratio, and 40.0 mL divides by the acid\'s molarity instead of the base\'s.' },
  { lv: 37, t: 'mc', q: 'In a titration, the equivalence point is reached when', a: ['The acid and base have been mixed in the exact mole ratio of the balanced equation', 'Equal volumes of acid and base have been added', 'Equal masses of acid and base have been added', 'The acid and base have the same molarity'], why: 'At the equivalence point the moles match the coefficients: 1:1 for HCl and NaOH, 1:2 for H2SO4 and NaOH. The volumes, masses and molarities do not have to be equal.' },
  { lv: 37, t: 'mc', q: 'For Handout 19, #6b (given the volume of one solution, find the volume of another), which pathway did Dr. Meyers use?', a: ['L A -> mol A -> mol B -> L B', 'L A -> L B, using C1V1 = C2V2', 'L A -> g A -> g B -> L B', 'mol A -> L A -> L B -> mol B'], why: 'Molarity turns liters into moles (mol = M × L), the coefficients turn mol A into mol B, and molarity turns mol B back into liters (L = mol ÷ M). This is his Nov 20 work slide for #6.' },
  { lv: 37, t: 'type', q: 'AgNO3(aq) + KCl(aq) -> AgCl(s) + KNO3(aq). How many mL of 0.200 M AgNO3 react with 0.0250 mol of KCl?', ans: '125', re: '^125(ml|mlagno3)?$', why: '0.0250 mol KCl = 0.0250 mol AgNO3 (1:1). ÷ 0.200 mol/L = 0.125 L = 125 mL. Stopping at 0.125 leaves the answer in liters.' },
  { lv: 37, t: 'mc', q: 'Mg(s) + 2 HCl(aq) -> MgCl2(aq) + H2(g). What volume of 2.00 M HCl reacts completely with 1.22 g of Mg?', a: ['50.2 mL', '25.1 mL', '12.5 mL', '201 mL'], why: '1.22 g ÷ 24.305 g/mol = 0.05020 mol Mg. × (2 mol HCl ÷ 1 mol Mg) = 0.1004 mol HCl. ÷ 2.00 mol/L = 0.05020 L = 50.2 mL. 25.1 mL skips the 1:2 ratio, 12.5 mL flips it, and 201 mL multiplies by the molarity instead of dividing.' },
  { lv: 37, t: 'mc', q: 'How many mol of Pb^2+ ions are in 0.100 L of 0.150 M Pb(NO3)2? (Handout 19, #6b)', a: ['0.0150 mol', '0.0300 mol', '15.0 mol', '0.667 mol'], why: 'Each Pb(NO3)2 holds one Pb^2+, so 0.100 L × 0.150 mol/L = 0.0150 mol. 0.0300 mol is the nitrate count (two per formula), 15.0 mol treats 100 mL as if it were liters, and 0.667 mol divides instead of multiplies.' },
  { lv: 37, t: 'type', q: 'What volume, in mL, of 0.250 M NaOH holds 0.0100 mol of NaOH?', ans: '40.0', re: '^40\\.0(ml|mlnaoh)?$', why: 'L = mol ÷ M = 0.0100 mol ÷ 0.250 mol/L = 0.0400 L = 40.0 mL. Three sig figs.' },
  { lv: 37, boss: true, t: 'mc', q: 'HCl(aq) + NaOH(aq) -> NaCl(aq) + H2O(l). A 25.0 mL sample of HCl needs 30.0 mL of 0.100 M NaOH to reach the equivalence point. What is the molarity of the HCl?', a: ['0.120 M', '0.0833 M', '0.00300 M', '0.240 M'], why: '0.0300 L × 0.100 mol/L = 0.00300 mol NaOH = 0.00300 mol HCl (1:1). ÷ 0.0250 L = 0.120 M. 0.0833 M swaps the volumes, 0.00300 M forgets to divide by liters, and 0.240 M uses a 1:2 ratio this equation does not have.' },
  { lv: 37, boss: true, t: 'mc', q: 'AgNO3(aq) + KCl(aq) -> AgCl(s) + KNO3(aq). What mass of AgCl precipitates when 50.0 mL of 0.200 M AgNO3 reacts with excess KCl?', a: ['1.43 g', '1.43 x 10^3 g', '1.70 g', '0.0100 g'], why: '0.0500 L × 0.200 mol/L = 0.0100 mol AgNO3 = 0.0100 mol AgCl. × 143.32 g/mol = 1.43 g. 1.43 x 10^3 g forgets to change mL to L, 1.70 g uses the molar mass of AgNO3, and 0.0100 g stops at moles.' },
  { lv: 37, boss: true, t: 'mc', q: 'Pb(NO3)2(aq) + 2 KCl(aq) -> PbCl2(s) + 2 KNO3(aq). 25.0 mL of 0.200 M Pb(NO3)2 is mixed with 25.0 mL of 0.200 M KCl. How many mol of PbCl2 can form?', a: ['0.00250 mol', '0.00500 mol', '0.0100 mol', '2.50 mol'], why: 'Each solution holds 0.0250 L × 0.200 mol/L = 0.00500 mol. Pb(NO3)2 could make 0.00500 mol PbCl2, but KCl could make only 0.00500 ÷ 2 = 0.00250 mol, so KCl limits. 0.00500 mol uses the excess Pb(NO3)2, 0.0100 mol flips the 1:2 ratio, and 2.50 mol uses mL as if they were liters.' },
];

const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
// a minus sign that starts a number (-233, 10^-23) is kept, so a sign or exponent slip is marked wrong;
// a hyphen inside a word or name (carbon-12, Cu-63) is still dropped
const norm = s => String(s).trim().toLowerCase().replace(/(^|[^a-z0-9])[-−](?=\d)/g, '$1\u0001').replace(/[\s\-‐-―−_]/g, '').replace(/\u0001/g, '-').replace(/\.$/, '');
const checkTyped = (q, s) => new RegExp(q.re).test(norm(s));
const reduced = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// formulas: a capital letter (plus optional lowercase) followed by digits gets the digits as a subscript;
// a caret marks a charge or exponent (SO4^2-, Cr^3+, 10^6) and becomes a superscript
function subify(root) {
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: n => /[A-Z][a-z]?\d|\^|\)\d|->|\w - [\w(]/.test(n.nodeValue) && !n.parentElement.closest('sub, sup, script, style') ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT,
  });
  const nodes = [];
  while (w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(n => {
    const t = document.createElement('template');
    t.innerHTML = esc(n.nodeValue).replace(/(\d) ([x×]) 10\^/g, '$1\u00a0$2\u00a010^').replace(/(^|[\s(+;])(\d+) (?=\(?[A-Z])/g, '$1$2\u00a0').replace(/(\d) (g|mg|kg|mol|mL|L|M|J|nm|cm|m) (?=\(?[A-Z])/g, '$1\u00a0$2\u00a0').replace(/(\w) - (?=[\w(])/g, '$1 −\u00a0').replace(/\^(\d*[+\-−])(?!\d)/g, '<sup>$1</sup>').replace(/\^([+\-−]?\d+)/g, '<sup>$1</sup>').replace(/<sup>([^<]*?)-/g, '<sup>$1−').replace(/([A-Z][a-z]?)(\d+)/g, '$1<sub>$2</sub>').replace(/\)(\d+)/g, ')<sub>$1</sub>').replace(/-&gt;/g, '→');
    n.replaceWith(t.content);
  });
}

      '<div id="fb" aria-live="polite"></div><button class="btn" id="check" disabled>Check</button>';
  }
  curOpts = shuffle(q.a.map((t, i) => ({ t, right: i === 0 })));
  return '<p class="prompt">' + esc(q.q) + '</p>' +
    curOpts.map((o, i) => '<button class="tile" data-i="' + i + '"><span class="k">' + 'ABCD'[i] + '</span><span>' + esc(o.t) + '</span></button>').join('') +
    '<div id="fb" aria-live="polite"></div>';
}
function wireQ(q, done) {
  if (q.t === 'type') {
    const inp = $('#ans'), chk = $('#check');
    inp.oninput = () => { chk.disabled = !inp.value.trim(); };
    const go = () => {
      if (!inp.value.trim() || inp.disabled) return;
      inp.disabled = true; chk.remove();
      done(checkTyped(q, inp.value));
    };
    chk.onclick = go;
    inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); go(); } };
    inp.focus({ preventScroll: true });
    return;
  }
  document.querySelectorAll('.tile').forEach(b => b.onclick = () => {
    const o = curOpts[+b.dataset.i];
    document.querySelectorAll('.tile').forEach((x, i) => { x.disabled = true; if (curOpts[i].right) x.classList.add('right'); });
    if (!o.right) b.classList.add('wrong');
    done(o.right);
  });
}
function feedback(q, ok, pts, next) {
  const fb = $('#fb');
  const head = ok ? (streak >= 3 ? 'Correct, ' + streak + ' in a row' : 'Correct') : (q.t === 'type' ? 'Answer: ' + esc(q.ans) : 'Missed');
  fb.innerHTML = '<div class="fb ' + (ok ? 'ok' : 'no') + '"><div class="head"><span>' + head + '</span>' + (pts ? '<span class="pop">+' + pts + ' XP</span>' : '') + '</div><p>' + esc(q.why) + '</p></div>' +
    '<button class="btn' + (ok ? '' : ' miss') + '" id="next">Continue</button>';
  subify(fb);
  const nb = $('#next');
  nb.onclick = next;
  nb.focus({ preventScroll: true });
  nb.scrollIntoView({ block: 'nearest', behavior: reduced() ? 'auto' : 'smooth' });
}

function renderQ() {
  const list = run.fix ? run.misses : run.queue, idx = list[run.i], q = Q[idx];
  const prog = run.fix ? 1 : run.i / run.queue.length;
  const count = run.fix ? 'Retry' : (run.i + 1) + '/' + run.queue.length;
  const chip = run.fix ? '<span class="chip">Second try, ' + (run.i + 1) + ' of ' + run.misses.length + '</span>' : q.t === 'type' ? '<span class="chip">Type it: 20 XP</span>' : '';
  show(topbar(prog, count) + '<div class="qtop">' + chip + '</div>' + qBody(q));
  wireQ(q, ok => {
    const first = !run.fix;
    if (first) { if (ok) run.right++; else run.misses.push(idx); }
    let pts = 0;
    if (ok) {
      streak++;
      pts = gain(first ? (q.t === 'type' ? 20 : 10) + (streak >= 3 ? 5 : 0) : 5);
    } else { streak = 0; hud(); }
    if (first) $('.bar i').style.width = ((run.i + 1) / run.queue.length * 100) + '%';
    feedback(q, ok, pts, nextQ);
  });
}
function nextQ() {
  run.i++;
  const list = run.fix ? run.misses : run.queue;
  if (run.i < list.length) return renderQ();
  if (!run.fix && run.misses.length) { run.fix = true; run.i = 0; return renderQ(); }
  finishLevel();
}
function finishLevel() {
  const total = run.queue.length, acc = run.right / total, n = run.n;
  const stars = acc >= 0.9 ? 3 : acc >= 0.75 ? 2 : acc >= 0.6 ? 1 : 0;
  if (stars) { gain(10 * stars); S.stars[n] = Math.max(S.stars[n] || 0, stars); save(); hud(); }
  const last = n === LEVELS.length;
  show(topbar(1) + '<div class="box result">' + starRow(stars, 'big-stars') +
    '<h2>' + (stars ? 'Level ' + n + ' cleared' : 'Not cleared yet') + '</h2>' +
    '<p>' + run.right + ' of ' + total + ' right on the first try</p>' +
    (stars ? '' : '<p>Clearing it takes ' + Math.ceil(0.6 * total) + ' of ' + total + '.</p>') +
    '<span class="gain">+' + run.gain + ' XP</span>' +
    (stars
      ? '<button class="btn" id="fwd">' + (last ? 'Boss round' : 'Next level') + '</button><button class="btn ghost" id="again">Replay level</button>'
      : '<button class="btn" id="again">Try again</button><button class="btn ghost" id="home">Back to the path</button>') +
    '</div>');
  if ($('#fwd')) $('#fwd').onclick = () => last ? (bossUnlocked() ? openBoss(true) : goPath()) : openLevel(n + 1, true);
  $('#again').onclick = () => openLevel(n, true);
  if ($('#home')) $('#home').onclick = goPath;
  if (stars) celebrate();
}

function openBoss(replace) {
  stopTick(); run = null;
  history[replace ? 'replaceState' : 'pushState']({ v: 'boss' }, '');
  boss = { gain: 0 };
  show(topbar(0) + '<p class="kicker">Boss round</p><h1 class="lvl">' + BOSS_N + ' questions, ' + BOSS_SECS / 60 + ' minutes</h1><div class="box result">' +
    '<p>' + BOSS_N + ' multiple-choice questions from all ' + LEVELS.length + ' levels, 15 XP each. The clock doesn\'t pause for explanations.</p>' +
    (S.boss ? '<p><b>Best: ' + S.boss + ' of ' + BOSS_N + '</b></p>' : '') +
    '<p></p><button class="btn" id="go">Start the clock</button></div>');
  $('#go').onclick = startBoss;
}
function drawClock() {
  const c = $('#clock');
  if (!c) return;
  c.textContent = Math.floor(boss.left / 60) + ':' + String(boss.left % 60).padStart(2, '0');
  c.classList.toggle('low', boss.left <= 30);
  const b = $('.bar i');
  if (b) b.style.width = (boss.left / BOSS_SECS * 100) + '%';
}
function startBoss() {
  const pool = Q.map((q, i) => i).filter(i => Q[i].t === 'mc');
  Object.assign(boss, { picks: shuffle(pool).slice(0, BOSS_N), i: 0, right: 0, left: BOSS_SECS, gain: 0 });
  stopTick();
  tick = setInterval(() => { boss.left--; drawClock(); if (boss.left <= 0) finishBoss(true); }, 1000);
  renderBossQ();
}
function renderBossQ() {
  const q = Q[boss.picks[boss.i]];
  show(topbar(boss.left / BOSS_SECS, (boss.i + 1) + '/' + BOSS_N) + '<div class="clock" id="clock" role="timer"></div>' + qBody(q));
  drawClock();
  wireQ(q, ok => {
    let pts = 0;
    if (ok) { boss.right++; streak++; pts = gain(15); } else { streak = 0; hud(); }
    feedback(q, ok, pts, () => { boss.i++; if (boss.i < boss.picks.length) renderBossQ(); else finishBoss(false); });
  });
}
function finishBoss(timeUp) {
  stopTick();
  const r = boss.right, prev = S.boss || 0;
  if (r === boss.picks.length) gain(30);
  if (r > prev) { S.boss = r; save(); }
  show(topbar(1) + '<div class="box result"><p class="kicker">' + (timeUp ? 'Time' : 'Boss round') + '</p>' +
    '<h2>' + r + ' of ' + BOSS_N + ' right</h2>' +
    '<p>' + (r > prev ? 'New best' : 'Best: ' + S.boss + ' of ' + BOSS_N) + '</p>' +
    '<span class="gain">+' + boss.gain + ' XP</span>' +
    '<button class="btn" id="again">Run it again</button><button class="btn ghost" id="home">Back to the path</button></div>');
  $('#again').onclick = () => openBoss(true);
  $('#home').onclick = goPath;
  if (r >= BOSS_N - 1) celebrate();
}

function celebrate() {
  if (reduced()) return;
  const c = document.createElement('canvas');
  c.className = 'confetti';
  document.body.appendChild(c);
  const W = c.width = window.innerWidth, H = c.height = window.innerHeight, ctx = c.getContext('2d');
  const cols = ['#2B9348', '#F4B400', '#E8613C', '#2E6FD8'];
  const P = Array.from({ length: 90 }, () => ({ x: W / 2, y: H * 0.32, vx: (Math.random() - 0.5) * 14, vy: -4 - Math.random() * 12, s: 5 + Math.random() * 6, c: cols[Math.floor(Math.random() * cols.length)], r: Math.random() * 6 }));
  const t0 = performance.now();
  (function frame(t) {
    ctx.clearRect(0, 0, W, H);
    P.forEach(p => {
      p.vy += 0.45; p.x += p.vx; p.y += p.vy; p.r += 0.2;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore();
    });
    if (t - t0 < 1100) requestAnimationFrame(frame); else c.remove();
  })(t0);
}

hud();
renderPath();
</script>
</body>
</html>
