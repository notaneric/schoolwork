<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHEM 1211 Final Exam</title>
<style>
  :root {
    --bg: #F8F6F0; --card: #FFFEFA; --ink: #1E2A38; --muted: #5B6676; --line: #E6E0D2; --line-2: #D6CFBE;
    --green: #237A3B; --green-2: #2B9348; --green-edge: #1A5C2C; --green-soft: #E4F3E7; --green-ink: #1B5E2E;
    --yellow: #F4B400; --yellow-edge: #B98800; --yellow-soft: #FFF5D6;
    --coral: #E8613C; --coral-ink: #A93A16; --coral-soft: #FDEDE7; --coral-edge: #7E2A10;
    --lock: #DDD8CB; --lock-edge: #C2BCAD; --lock-ink: #7D7869;
    --focus: #2E6FD8;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  .app { max-width: 560px; margin: 0 auto; padding: 10px 16px 80px; }

  .hud { position: sticky; top: 8px; z-index: 5; display: flex; justify-content: center; gap: 2px; width: max-content; max-width: 100%; margin: 0 auto 14px; padding: 5px 6px; background: var(--card); border: 2px solid var(--line); border-radius: 999px; box-shadow: 0 3px 0 var(--line); }
  .stat { display: flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; font-weight: 800; font-variant-numeric: tabular-nums; transition: background-color .2s ease-out; }
  .stat svg { width: 22px; height: 22px; flex: none; }
  .stat small { font-size: 13px; font-weight: 700; color: var(--muted); }
  .stat.xp svg, .stat.stars svg { color: var(--yellow); }
  .stat.streak svg { color: var(--lock-ink); }
  .stat.streak.hot { background: var(--yellow-soft); }
  .stat.streak.hot svg { color: var(--coral); }
  @media (max-width: 360px) { .stat small.word { display: none; } }

  .title { text-align: center; margin: 6px 0 0; }
  h1 { margin: 0 0 4px; font-size: 28px; line-height: 1.2; font-weight: 800; letter-spacing: -.01em; }
  .when { margin: 0; color: var(--muted); font-weight: 600; }

  .path { display: flex; flex-direction: column; align-items: center; padding: 26px 0 4px; }
  .stop { display: flex; flex-direction: column; align-items: center; transform: translateX(var(--x, 0)); margin-bottom: 34px; }
  .nodewrap { position: relative; }
  .node { position: relative; z-index: 1; width: 78px; height: 78px; border: 0; border-radius: 50%; display: grid; place-items: center; cursor: pointer; background: var(--green-2); color: #FFFEFA; box-shadow: 0 7px 0 var(--green-edge); transition: transform .12s ease-out, box-shadow .12s ease-out; }
  .node svg { width: 36px; height: 36px; }
  .node:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--green-edge); }
  .node.locked { background: var(--lock); color: var(--lock-ink); box-shadow: 0 7px 0 var(--lock-edge); cursor: not-allowed; }
  .node.locked:active { transform: none; box-shadow: 0 7px 0 var(--lock-edge); }
  .node.boss { width: 92px; height: 92px; background: var(--yellow); color: var(--ink); box-shadow: 0 8px 0 var(--yellow-edge); }
  .node.boss:active { box-shadow: 0 3px 0 var(--yellow-edge); }
  .node.boss svg { width: 44px; height: 44px; }
  .node.boss.locked { background: var(--lock); color: var(--lock-ink); box-shadow: 0 8px 0 var(--lock-edge); }
  .node.shake { animation: shake .3s ease-out; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .ring { position: absolute; inset: -9px; border-radius: 50%; border: 4px solid var(--green-2); opacity: 0; pointer-events: none; animation: ring 1.8s ease-out infinite; }
  .ring.gold { border-color: var(--yellow); }
  @keyframes ring { 0% { transform: scale(.92); opacity: .55; } 100% { transform: scale(1.22); opacity: 0; } }
  .tag { position: absolute; z-index: 2; bottom: calc(100% + 16px); left: 50%; transform: translateX(-50%); padding: 5px 14px; border: 2px solid var(--line); border-radius: 12px; background: var(--card); color: var(--green); font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; box-shadow: 0 3px 0 var(--line); }
  .tag::after { content: ""; position: absolute; top: 100%; left: 50%; margin-left: -7px; border: 7px solid transparent; border-top-color: var(--line); }
  .label { margin-top: 14px; text-align: center; font-weight: 800; line-height: 1.25; }
  .label small { display: block; margin-bottom: 2px; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .label.dim { color: var(--muted); }
  .srow { display: flex; justify-content: center; gap: 2px; margin-top: 4px; }
  .srow svg { width: 18px; height: 18px; color: var(--lock); }
  .srow svg.on { color: var(--yellow); }
  .best { margin-top: 4px; font-size: 14px; font-weight: 700; color: var(--muted); }
  .reset { display: block; margin: 4px auto 0; padding: 10px; border: 0; background: none; color: var(--muted); font-size: 14px; font-weight: 600; text-decoration: underline; cursor: pointer; }
  .toast { position: fixed; left: 50%; bottom: 24px; z-index: 40; transform: translateX(-50%); padding: 10px 18px; border-radius: 999px; background: var(--ink); color: #FFFEFA; font-weight: 700; white-space: nowrap; }

  .topbar { display: flex; align-items: center; gap: 12px; margin: 0 0 18px; }
  .iconbtn { flex: none; width: 44px; height: 44px; display: grid; place-items: center; border: 2px solid var(--line); border-radius: 12px; background: var(--card); cursor: pointer; box-shadow: 0 3px 0 var(--line); }
  .iconbtn svg { width: 22px; height: 22px; }
  .bar { flex: 1; height: 16px; border-radius: 999px; background: var(--line); overflow: hidden; }
  .bar i { display: block; width: 0; height: 100%; border-radius: 999px; background: var(--green-2); transition: width .3s ease-out; }
  .count { flex: none; min-width: 40px; text-align: right; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
  .kicker { margin: 0; text-align: center; font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--green); }
  .lvl { margin: 2px 0 16px; text-align: center; font-size: 26px; }
  .box { margin: 0 0 16px; padding: 18px; background: var(--card); border: 2px solid var(--line); border-radius: 18px; box-shadow: 0 3px 0 var(--line); }
  .box h2 { margin: 0 0 12px; text-align: center; font-size: 19px; line-height: 1.3; }
  .pts { margin: 0; padding-left: 20px; }
  .pts li { margin: 7px 0; }
  .note { margin: 12px 0 0; text-align: center; font-size: 15px; color: var(--muted); }

  .btn { display: block; width: 100%; padding: 15px 18px; border: 0; border-radius: 16px; background: var(--green); color: #FFFEFA; font-size: 17px; font-weight: 800; letter-spacing: .02em; cursor: pointer; box-shadow: 0 5px 0 var(--green-edge); transition: transform .1s ease-out, box-shadow .1s ease-out; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--green-edge); }
  .btn:disabled { background: var(--lock); color: var(--lock-ink); box-shadow: 0 5px 0 var(--lock-edge); cursor: not-allowed; transform: none; }
  .btn.ghost { background: var(--card); color: var(--ink); border: 2px solid var(--line); box-shadow: 0 5px 0 var(--line); }
  .btn.ghost:active { box-shadow: 0 1px 0 var(--line); }
  .btn.miss { background: var(--coral-ink); box-shadow: 0 5px 0 var(--coral-edge); }
  .btn.miss:active { box-shadow: 0 1px 0 var(--coral-edge); }
  .btn + .btn { margin-top: 14px; }

  .qtop { min-height: 8px; margin-bottom: 8px; text-align: center; }
  .chip { display: inline-block; padding: 3px 11px; border-radius: 999px; background: var(--yellow-soft); color: var(--ink); font-size: 13px; font-weight: 800; }
  .prompt { margin: 0 0 18px; text-align: center; font-size: 21px; line-height: 1.35; font-weight: 800; }
  .tile { display: flex; align-items: center; gap: 12px; width: 100%; margin: 0 0 12px; padding: 13px 14px; text-align: left; border: 2px solid var(--line); border-radius: 14px; background: var(--card); cursor: pointer; box-shadow: 0 4px 0 var(--line); transition: transform .1s ease-out, border-color .15s ease-out; }
  .tile:hover:not(:disabled) { border-color: var(--green-2); }
  .tile:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
  .tile:disabled { cursor: default; }
  .tile .k { flex: none; width: 30px; height: 30px; display: grid; place-items: center; border: 2px solid var(--line); border-radius: 9px; font-size: 14px; font-weight: 800; color: var(--muted); }
  .tile.right { border-color: var(--green-2); background: var(--green-soft); box-shadow: 0 4px 0 var(--green-2); }
  .tile.right .k { border-color: var(--green-2); color: var(--green-ink); }
  .tile.wrong { border-color: var(--coral); background: var(--coral-soft); box-shadow: 0 4px 0 var(--coral); }
  .tile.wrong .k { border-color: var(--coral); color: var(--coral-ink); }
  .typein { display: block; width: 100%; margin: 0 0 16px; padding: 15px; border: 2px solid var(--line-2); border-radius: 14px; background: var(--card); color: var(--ink); font: inherit; font-size: 19px; text-align: center; }
  .typein:focus { outline: 3px solid var(--green-2); outline-offset: 2px; border-color: var(--green-2); }
  .typein:disabled { background: var(--bg); }
  .fb { margin: 6px 0 16px; padding: 14px 16px; border-radius: 16px; }
  .fb.ok { background: var(--green-soft); color: var(--green-ink); }
  .fb.no { background: var(--coral-soft); color: var(--coral-ink); }
  .fb .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 18px; font-weight: 800; }
  .fb p { margin: 6px 0 0; color: var(--ink); }
  .pop { flex: none; padding: 2px 10px; border-radius: 999px; background: var(--yellow); color: var(--ink); font-size: 14px; font-weight: 800; animation: pop .35s ease-out; }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .els { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  @media (max-width: 440px) { .els { grid-template-columns: repeat(3, 1fr); } }
  .el { padding: 8px 4px; text-align: center; border: 2px solid var(--line); border-radius: 12px; background: var(--card); }
  .el b { display: block; font-size: 24px; line-height: 1.15; }
  .el span { font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
  .el.hot { background: var(--yellow-soft); border-color: var(--yellow); }
  .els.states { grid-template-columns: repeat(3, 1fr); }
  @media (max-width: 440px) { .els.states { grid-template-columns: 1fr; } }
  .states .el b { font-size: 17px; }
  .states .el span { display: block; margin-top: 4px; font-size: 14px; font-weight: 600; line-height: 1.35; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th, td { padding: 8px 6px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
  th { font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  tr.sn td { border-top: 2px solid var(--line-2); }
  td.pol { font-weight: 800; }
  td.non { color: var(--muted); }
  .force { padding: 14px 0 0; margin-top: 14px; border-top: 1px solid var(--line); text-align: center; }
  .force:first-of-type { margin-top: 0; padding-top: 0; border-top: 0; }
  .force p { margin: 8px 0 0; text-align: left; }
  .steps { margin: 0; padding: 0; list-style: none; counter-reset: s; }
  .steps li { counter-increment: s; display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: start; margin: 0 0 12px; }
  .steps li::before { content: counter(s); width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; background: var(--green-2); color: #FFFEFA; font-weight: 800; }
  .vs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; text-align: center; }
  .vs .side { padding: 10px 6px; border: 2px solid var(--line); border-radius: 12px; line-height: 1.35; }
  .vs .side.hi { border-color: var(--green-2); background: var(--green-soft); }
  .vs .side b { display: block; }
  .vs .side span { display: block; font-weight: 800; font-variant-numeric: tabular-nums; }
  .vs em { font-style: normal; font-size: 13px; font-weight: 800; color: var(--muted); }
  .vsy { margin: 8px 0 18px; text-align: center; font-size: 15px; color: var(--muted); }
  .vsy:last-child { margin-bottom: 0; }

  .vid { position: relative; display: block; width: 100%; aspect-ratio: 16 / 9; padding: 0; border: 0; border-radius: 14px; overflow: hidden; background: var(--ink); cursor: pointer; }
  .vid img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .play { position: absolute; left: 50%; top: 50%; width: 68px; height: 68px; margin: -34px 0 0 -34px; display: grid; place-items: center; border-radius: 50%; background: var(--green); color: #FFFEFA; box-shadow: 0 5px 0 var(--green-edge); }
  .play svg { width: 30px; height: 30px; margin-left: 4px; }
  .vframe { display: block; width: 100%; aspect-ratio: 16 / 9; border: 0; border-radius: 14px; }
  .vmeta { margin: 10px 0 0; text-align: center; }
  .vmeta span { font-size: 15px; color: var(--muted); }
  .also { margin: 10px 0 0; text-align: center; font-size: 15px; }
  .also a { color: var(--green-ink); font-weight: 700; }
  .also span { color: var(--muted); }

  .result { text-align: center; }
  .result h2 { margin: 0 0 6px; font-size: 26px; }
  .result p { margin: 4px 0; }
  .big-stars { display: flex; justify-content: center; gap: 10px; margin: 6px 0 12px; }
  .big-stars svg { width: 64px; height: 64px; color: var(--lock); }
  .big-stars svg.on { color: var(--yellow); animation: starpop .45s ease-out both; }
  .big-stars svg.on:nth-child(2) { animation-delay: .15s; }
  .big-stars svg.on:nth-child(3) { animation-delay: .3s; }
  @keyframes starpop { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .gain { display: inline-block; margin: 12px 0 18px; padding: 6px 16px; border-radius: 999px; background: var(--yellow); font-size: 18px; font-weight: 800; }
  .clock { margin: 0 0 14px; text-align: center; font-size: 40px; line-height: 1; font-weight: 800; font-variant-numeric: tabular-nums; }
  .clock.low { color: var(--coral-ink); }
  .confetti { position: fixed; inset: 0; z-index: 50; pointer-events: none; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  .hint { margin: 8px auto 0; max-width: 34em; color: var(--muted); font-size: 15px; }
  .unit { align-self: stretch; margin: 0 0 64px; padding-top: 18px; text-align: center; border-top: 2px solid var(--line); }
  .unit:first-child { padding-top: 0; border-top: 0; }
  .unit small { display: block; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--green); }
  .unit b { display: block; margin-top: 2px; font-size: 20px; line-height: 1.25; }
  .unit span { display: block; margin-top: 2px; font-size: 14px; font-weight: 600; color: var(--muted); }
  .eq { margin: 0 0 12px; text-align: center; font-size: 17px; font-weight: 800; line-height: 1.4; }
  .stop .label { max-width: 200px; }
  @media (max-width: 400px) { .stop { transform: translateX(calc(var(--x, 0px) * .6)); } }
  .els.words { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  .els.words .el b { font-size: 18px; }
  .els.names { grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); }
  .els.names .el span { font-size: 12px; }
  sub, sup { line-height: 0; }
  .stop .label { text-wrap: balance; }
</style>
</head>

<div class="app">
  <div class="hud">
    <span class="stat xp" title="XP"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M13.5 2 4.5 13.5h6.2L9.5 22l9-11.5h-6.2z"/></svg><span id="h-xp">0</span><small class="word">XP</small></span>
    <span class="stat stars" title="Stars"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z"/></svg><span id="h-st">0</span><small>/111</small></span>
    <span class="stat streak" id="h-streak" title="Streak"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2.5c.6 3.2 4.8 5.3 4.8 10.2a4.8 4.8 0 0 1-9.6 0c0-2.4 1.2-4 2.4-5 .1 1.7.9 2.8 1.9 3.2-.1-3 .1-5.6.5-8.4z"/></svg><span id="h-sk">0</span><small class="word">streak</small></span>
  </div>
  <main id="view"></main>
</div>

<template id="lesson-1">
  <div class="box">
    <h2>Scientific notation</h2>
    <ul class="pts">
      <li>A number between 1 and 10, times 10 raised to an integer. 61,500 is 6.15 x 10^4 and 0.0000568 is 5.68 x 10^-5.</li>
      <li>Dr. Meyers' mnemonic: + means x10, - means /10. A positive exponent gives a value above 1, a negative exponent gives a value below 1.</li>
      <li>To compare two values, look at the exponent first. 7.6 x 10^-2 beats 6.2 x 10^-3 even though 7.6 is not much bigger than 6.2.</li>
      <li>Multiplying adds the exponents: 10^2 x 10^3 = 10^5. Dividing subtracts them: 10^2 / 10^3 = 10^-1.</li>
    </ul>
  </div>
  <div class="box">
    <h2>Counting significant figures</h2>
    <div class="scroll">
      <table>
        <thead><tr><th>Rule</th><th>Example</th><th>Sig figs</th></tr></thead>
        <tbody>
          <tr><td>Nonzero digits count</td><td>32415</td><td>5</td></tr>
          <tr><td>Captive zeros count</td><td>32015</td><td>5</td></tr>
          <tr><td>Leading zeros do not</td><td>0.032015</td><td>5</td></tr>
          <tr><td>Trailing zeros after a decimal count</td><td>0.03201500</td><td>7</td></tr>
          <tr><td>Trailing zeros with no decimal might</td><td>3201500</td><td>5, 6 or 7</td></tr>
          <tr><td>A decimal point at the end makes them all count</td><td>3201500.</td><td>7</td></tr>
          <tr><td>In scientific notation only the coefficient counts</td><td>3.20 x 10^6</td><td>3</td></tr>
        </tbody>
      </table>
    </div>
    <p class="note">Exact numbers, from a count or a definition (60 s = 1 min), have infinite sig figs and never limit an answer.</p>
  </div>
  <div class="box">
    <h2>Sig figs in calculations, and rounding</h2>
    <ul class="pts">
      <li>Multiply or divide: the answer keeps as many sig figs as the least precise value. 100. / 9.8 = 10.204, so 10. (2 sig figs). 5.55 x 2525 = 14,013.75, so 1.40 x 10^4.</li>
      <li>Add or subtract: the answer keeps as many decimal places as the value with the fewest. 152.39 - 74.4 = 77.99, so 78.0.</li>
      <li>Round half up: 2.73894 to 3 sig figs is 2.74.</li>
      <li>With mixed steps, finish each step with its own rule: (24.20 - 21.2) / 3.00 has 1 decimal after the subtraction (3.0, 2 sig figs), so the answer has 2 sig figs.</li>
    </ul>
    <p class="eq">Accuracy = close to the accepted value. Precision = close to each other.</p>
  </div>
</template>

<template id="lesson-2">
  <div class="box">
    <h2>Prefixes to know</h2>
    <div class="scroll">
      <table>
        <thead><tr><th>Prefix</th><th>Symbol</th><th>Multiplier</th></tr></thead>
        <tbody>
          <tr><td>giga</td><td>G</td><td>10^9</td></tr>
          <tr><td>mega</td><td>M</td><td>10^6</td></tr>
          <tr><td>kilo</td><td>k</td><td>10^3</td></tr>
          <tr><td>deci</td><td>d</td><td>10^-1</td></tr>
          <tr><td>centi</td><td>c</td><td>10^-2</td></tr>
          <tr><td>milli</td><td>m</td><td>10^-3</td></tr>
          <tr><td>micro</td><td>µ</td><td>10^-6</td></tr>
          <tr><td>nano</td><td>n</td><td>10^-9</td></tr>
          <tr><td>pico</td><td>p</td><td>10^-12</td></tr>
        </tbody>
      </table>
    </div>
    <p class="note">1 mm = 10^-3 m, which is the same as 10^3 mm = 1 m. 1 mL = 1 cm^3.</p>
  </div>
  <div class="box">
    <h2>Dr. Meyers' factor-label setup</h2>
    <ol class="steps">
      <li><span><b>Know.</b> Write each given as an equality, and put the starting quantity over 1.</span></li>
      <li><span><b>Want.</b> Write the unit you need with a question mark.</span></li>
      <li><span><b>Pathway.</b> Draw a units-only arrow chain, such as mi to gal to $. One arrow is one conversion factor.</span></li>
      <li><span><b>Factor-label bars.</b> Chain the fractions so the unit to cancel sits on the bottom of the next factor. Circle the unit left over.</span></li>
    </ol>
    <p class="note">Words that signal an equality: equal, is, per, has, in, for every, for each, contains. The sig figs come from the measured values only, never from conversion factors that are definitions.</p>
  </div>
  <div class="box">
    <h2>Squared and cubed units</h2>
    <ul class="pts">
      <li>Square or cube the whole factor, number and unit. (1 m / 100 cm) squared is 1 m^2 / 10,000 cm^2.</li>
      <li>1500. cm^2 is 0.1500 m^2. 2.0 m^3 is 2.0 x 10^6 cm^3. 0.42 cm^2 is 0.065 in^2 (divide by 2.54^2 = 6.4516).</li>
      <li>Forgetting to square the number is the most common mistake. A cm^3 is tiny, so a volume in cm^3 is a big number.</li>
    </ul>
    <p class="eq">405 mi x (1 gal / 24 mi) x ($3.50 / 1 gal) = $59.0625, so $59</p>
  </div>
</template>

<template id="lesson-3">
  <div class="box">
    <h2>Density</h2>
    <p class="eq">rho = m / V</p>
    <ul class="pts">
      <li>Density is mass per volume. Common units are g/mL (same as g/cm^3) and kg/m^3.</li>
      <li>Rearrange it for the unknown: m = rho x V and V = m / rho. Convert to the units of rho first, such as 1.25 L to 1250 mL.</li>
      <li>Density is intensive. Cut a block in half and each piece has the same density.</li>
      <li>A solid or liquid floats on water if its density is below 1.00 g/mL, and sinks if it is above.</li>
    </ul>
  </div>
  <div class="box">
    <h2>Volume by displacement</h2>
    <ul class="pts">
      <li>For an odd-shaped solid, drop it in a graduated cylinder. Its volume is the rise in water level.</li>
      <li>A 45.2 g rock raises the water from 25.0 to 31.4 mL. V = 31.4 - 25.0 = 6.4 mL, so rho = 45.2 / 6.4 = 7.1 g/mL.</li>
      <li>For a rectangular block, V = length x width x height, and cm^3 = mL.</li>
    </ul>
  </div>
  <div class="box">
    <h2>Temperature</h2>
    <p class="eq">K = °C + 273.15 and °F = 9/5 °C + 32</p>
    <ul class="pts">
      <li>Kelvin is the SI base unit. The K scale never goes below 0.</li>
      <li>°F to °C: subtract 32 first, then multiply by 5/9. 98.6 °F gives 66.6 x 5/9 = 37.0 °C.</li>
      <li>Add and subtract with decimal-place sig figs: 25 °C + 273.15 = 298 K.</li>
      <li>To find the coldest of several readings, put them all in kelvin.</li>
    </ul>
  </div>
</template>

<template id="lesson-4">
  <div class="box">
    <h2>Classifying matter</h2>
    <ul class="pts">
      <li>Matter is either a pure substance or a mixture.</li>
      <li>A pure substance has a constant composition. It is either an element (cannot be broken down by chemical change) or a compound (can be broken into elements).</li>
      <li>A mixture is homogeneous (uniform, also called a solution: filtered air, salt water) or heterogeneous (composition varies from point to point: sand in water, a cookie).</li>
      <li>An element can be made of molecules. N2 and O2 are elements. CO2 and H2O are compounds.</li>
    </ul>
  </div>
  <div class="box">
    <h2>States of matter</h2>
    <div class="scroll">
      <table>
        <thead><tr><th>State</th><th>Shape</th><th>Volume</th><th>Particles</th></tr></thead>
        <tbody>
          <tr><td>Solid</td><td>definite</td><td>definite</td><td>fixed positions</td></tr>
          <tr><td>Liquid</td><td>takes the container's</td><td>definite</td><td>touching, free to move past each other</td></tr>
          <tr><td>Gas</td><td>takes the container's</td><td>fills the container, easily compressed</td><td>far apart</td></tr>
        </tbody>
      </table>
    </div>
    <p class="note">Taking the container's shape is true of both liquids and gases, so it cannot tell them apart.</p>
  </div>
  <div class="box">
    <h2>Properties and changes</h2>
    <ul class="pts">
      <li>A physical property can be measured without changing the substance: density, color, hardness, melting and boiling point.</li>
      <li>A chemical property is the ability to turn into another substance: flammability, reactivity, toxicity.</li>
      <li>Physical change: same substance, new form or state (melting, boiling, grinding). Chemical change: new substances (burning, rusting, souring).</li>
      <li>Intensive properties do not depend on the amount (density, color, melting point). Extensive properties do (mass, volume, length).</li>
    </ul>
  </div>
</template>

<template id="lesson-5">
  <div class="box">
    <h2>Three particles</h2>
    <div class="scroll">
      <table>
        <thead><tr><th>Particle</th><th>Charge</th><th>Mass</th><th>Where</th></tr></thead>
        <tbody>
          <tr><td>Proton</td><td>1+</td><td>about 1 amu</td><td>nucleus</td></tr>
          <tr><td>Neutron</td><td>0</td><td>about 1 amu</td><td>nucleus</td></tr>
          <tr><td>Electron</td><td>1-</td><td>about 0.00055 amu (1/1836 of a proton)</td><td>cloud around nucleus</td></tr>
        </tbody>
      </table>
    </div>
    <p class="note">Almost all the mass sits in the tiny nucleus.</p>
  </div>
  <div class="box">
    <h2>Counting from a symbol</h2>
    <ul class="pts">
      <li>Atomic number Z = protons. It names the element.</li>
      <li>Mass number A = protons + neutrons. So neutrons = A - Z.</li>
      <li>In a neutral atom, electrons = protons.</li>
      <li>In a nuclear symbol the mass number goes top left, the atomic number bottom left, and the charge top right. Written in words: silicon-30, or Si-30.</li>
    </ul>
    <p class="eq">Si-30: 14 protons, 30 - 14 = 16 neutrons, 14 electrons</p>
  </div>
  <div class="box">
    <h2>Ions</h2>
    <ul class="pts">
      <li>A cation lost electrons, so charge = protons - electrons is positive. An anion gained them.</li>
      <li>Only the electrons change. Protons and neutrons stay the same.</li>
      <li>Cu-65 with a 2+ charge: 29 protons, 36 neutrons, 29 - 2 = 27 electrons.</li>
      <li>N-15 with a 3- charge: 7 protons, 8 neutrons, 7 + 3 = 10 electrons.</li>
      <li>37 protons, 48 neutrons and 36 electrons: Z = 37 is Rb, A = 85, charge 37 - 36 = 1+.</li>
    </ul>
  </div>
</template>

<template id="lesson-6">
  <div class="box">
    <h2>Isotopes</h2>
    <ul class="pts">
      <li>Isotopes are atoms of one element with different numbers of neutrons. Same Z, different A.</li>
      <li>Br-79 has 44 neutrons and Br-81 has 46. Both have 35 protons.</li>
      <li>Isotopes of one element have the same protons and, when neutral, the same electrons, so they behave almost the same in chemical reactions.</li>
    </ul>
  </div>
  <div class="box">
    <h2>Average atomic mass</h2>
    <p class="eq">Average atomic mass = sum of (isotope abundance x isotope mass)</p>
    <ul class="pts">
      <li>It is a weighted average, not a plain average. Turn each percent into a decimal first.</li>
      <li>Chlorine: (0.75770 x 34.969) + (0.24230 x 36.966) = 35.453 amu.</li>
      <li>Abundances must add up to 100%. If one is missing, subtract the rest from 100.</li>
      <li>The average lands closer to the more abundant isotope. Cu is 63.546, so Cu-63 is more common than Cu-65.</li>
    </ul>
  </div>
  <div class="box">
    <h2>Solving for a missing mass</h2>
    <ul class="pts">
      <li>Boron: B-10 is 10.0129 amu at 19.80%, and the average is 10.811 amu. B-11 is 80.20%.</li>
      <li>10.811 = (0.1980 x 10.0129) + (0.8020 x m), so m = (10.811 - 1.9826) / 0.8020 = 11.0080 amu. The accepted value is 11.0093 amu.</li>
      <li>Do not swap the two abundances.</li>
    </ul>
    <p class="note">Average atomic mass is the number under the symbol on the periodic table, in amu or g/mol. It is almost never a whole number. Mass number always is.</p>
  </div>
</template>

<template id="lesson-7">
  <div class="box">
    <h2>Atoms, molecules, compounds, ions</h2>
    <ul class="pts">
      <li>Atom: one particle of an element (Na, He).</li>
      <li>Molecule: atoms bonded together. It can be an element (O2, N2) or a compound (H2O, CO2).</li>
      <li>Compound: two or more different elements in a fixed ratio. Ionic compounds such as NaCl are lattices of ions, and their particle is called a formula unit: the simplest ratio of ions, one Na^+ to one Cl^-.</li>
      <li>Monatomic ion: one atom with a charge (Cl^-, Mg^2+). Polyatomic ion: bonded atoms with a net charge (NH4^+, SO4^2-).</li>
    </ul>
  </div>
  <div class="box">
    <h2>The periodic table</h2>

      <li>A period is a horizontal row. A group is a vertical column, and members of a group behave alike.</li>

      <li>Metals are on the left, nonmetals on the right, and metalloids touch the staircase between them: B, Si, Ge, As, Sb, Te.</li>

<template id="lesson-8">
  <div class="box">
    <h2>The mole</h2>
    <p class="eq">1 mol = 6.022 x 10^23 particles</p>
    <ul class="pts">
      <li>The mole is a counting unit, like a dozen. The particle can be an atom, a molecule, a formula unit or a pen.</li>
      <li>Molar mass (g/mol) is the number under the symbol on the periodic table. For a compound, add up every atom in the formula.</li>
      <li>Other names for molar mass: atomic mass, molecular mass, molecular weight, molar weight, formula weight.</li>
    </ul>
  </div>
  <div class="box">
    <h2>The conversion path</h2>
    <p class="eq">grams  to  moles  to  particles</p>
    <ul class="pts">
      <li>Always route through moles. Divide grams by molar mass to get moles. Multiply moles by 6.022 x 10^23 to get particles.</li>
      <li>5.00 g C x (1 mol / 12.011 g) x (6.022 x 10^23 / 1 mol) = 2.51 x 10^23 atoms.</li>
      <li>Watch the prefix: 20.3 ng is 20.3 x 10^-9 g, and 125. mg is 0.125 g.</li>
      <li>Sanity check: a sample lighter than one molar mass holds fewer than 6.022 x 10^23 particles.</li>
    </ul>
  </div>
  <div class="box">
    <h2>Reading a formula</h2>
    <ul class="pts">
      <li>A subscript outside parentheses multiplies everything inside. Fe(NO3)3 is 1 Fe, 3 N and 9 O, so 13 atoms per formula unit.</li>
      <li>Fe(NO3)3 molar mass: 55.845 + 3(14.007) + 9(15.999) = 241.86 g/mol. The classic trap is using 3 oxygens instead of 9.</li>
      <li>1 mol of H2O holds 2 mol of H atoms and 1 mol of O atoms. 2.00 mol of CO2 holds 4.00 mol of O atoms.</li>
      <li>Equal masses do not mean equal atoms. Lighter atoms means more atoms: 10.0 g of C has more atoms than 10.0 g of Fe.</li>
    </ul>
  </div>
</template>

<template id="lesson-9">
  <div class="box">
    <h2>Light as a wave</h2>
    <ul class="pts">
      <li>All EM radiation travels at c = 3.00 x 10^8 m/s in a vacuum. What changes is wavelength (λ), frequency (ν) and energy.</li>
      <li>Long wavelength means low frequency and low energy. Short wavelength means high frequency and high energy.</li>
      <li>Amplitude is the wave height. It sets brightness, not color.</li>
      <li>Wavelength sets color. Visible light runs from about 400 nm (violet, highest energy) to 750 nm (red, lowest).</li>
    </ul>
    <p class="eq">c = λν &nbsp;&nbsp; E = hν &nbsp;&nbsp; E = hc/λ</p>
    <p class="note">The exam gives c = 3.00 x 10^8 m/s and h = 6.626 x 10^-34 J s on the formula sheet.</p>
  </div>
  <div class="box">
    <h2>The spectrum, low to high energy</h2>
    <div class="els words">
      <div class="el"><b>Radio</b><span>NMR (nuclei)</span></div>
      <div class="el"><b>Microwave</b><span>rotation</span></div>
      <div class="el"><b>Infrared</b><span>bond vibration</span></div>
      <div class="el"><b>Visible</b><span>electrons</span></div>
      <div class="el"><b>Ultraviolet</b><span>electrons</span></div>
      <div class="el"><b>X-ray</b><span>electron clouds</span></div>
      <div class="el"><b>Gamma</b><span>highest energy</span></div>
    </div>
    <p class="note">Dr. Meyers' mnemonic: RaMIVUXGam. The observed color of an object is the color it reflects. The color it absorbs is the complement.</p>
  </div>
  <div class="box">
    <h2>Photon energy: the working steps</h2>
    <ul class="pts">
      <li>Convert first. Wavelength goes to m (1 nm = 10^-9 m) and frequency goes to Hz (1 MHz = 10^6 Hz).</li>
      <li>Given wavelength, use E = hc/λ. Given frequency, use E = hν.</li>
      <li>E is for one photon. For a mole, multiply by 6.022 x 10^23.</li>
    </ul>
    <p class="eq">400. nm = 4.00 x 10^-7 m &nbsp; E = (6.626 x 10^-34)(3.00 x 10^8)/(4.00 x 10^-7) = 4.97 x 10^-19 J</p>
    <p class="note">Wave-particle duality: light and electrons act as both. Electrons through two slits make an interference pattern, which only waves do.</p>
  </div>
</template>

<template id="lesson-10">
  <div class="box">
    <h2>Why spectra have lines</h2>
    <ul class="pts">
      <li>An excited atom gives off light only at certain exact energies. The pattern of lines is the emission spectrum, and each element has its own, like a fingerprint (flame tests).</li>
      <li>Lines mean the electron energies are quantized: only certain levels are allowed.</li>
      <li>Absorbing a photon moves the electron up (nf larger than ni). Emitting a photon moves it down (nf smaller than ni). The photon carries the gap between the two levels.</li>
      <li>The levels crowd closer together as n grows.</li>
    </ul>
  </div>
  <div class="box">
    <h2>The Rydberg equation</h2>
    <p class="eq">1/λ, ν or ΔE = RH (1/nf squared - 1/ni squared)</p>
    <div class="scroll">
      <table>
        <thead><tr><th>You want</th><th>RH to use</th></tr></thead>
        <tbody>
          <tr><td>1/λ (then invert for λ)</td><td>1.097 x 10^7 m^-1</td></tr>
          <tr><td>frequency ν</td><td>3.290 x 10^15 Hz</td></tr>
          <tr><td>energy ΔE</td><td>2.18 x 10^-18 J</td></tr>
        </tbody>
      </table>
    </div>
    <p class="note">Dr. Meyers' sign rule: a positive answer means energy was emitted, a negative one means absorbed. Some textbooks give the atom's own energy change, which flips the sign. Use his rule on his exam.</p>
  </div>
  <div class="box">
    <h2>Worked example: n = 3 to n = 2</h2>
    <ul class="pts">
      <li>1/λ = (1.097 x 10^7)(1/4 - 1/9) = 1.52 x 10^6 m^-1.</li>
      <li>Invert: λ = 6.56 x 10^-7 m, which is 656 nm, red visible light.</li>
      <li>Solving for a shell: divide by RH, set equal to 1/nf squared - 1/ni squared, solve for 1/ni squared, invert, then take the square root. Shell numbers are whole numbers.</li>
    </ul>
    <p class="note">Traps: forgetting the final inversion for λ, forgetting the square root for n, and mixing up which shell is ni and which is nf.</p>
  </div>
</template>

<template id="lesson-11">
  <div class="box">
    <h2>The four quantum numbers</h2>
    <div class="scroll">
      <table>
        <thead><tr><th>Number</th><th>Name</th><th>Values</th><th>Tells you</th></tr></thead>
        <tbody>
          <tr><td>n</td><td>principal</td><td>1, 2, 3, ...</td><td>shell: size and energy</td></tr>
          <tr><td>l</td><td>angular momentum</td><td>0 to n - 1</td><td>subshell: shape (s, p, d, f)</td></tr>
          <tr><td>ml</td><td>magnetic</td><td>-l to +l</td><td>orbital orientation</td></tr>
          <tr><td>ms</td><td>spin</td><td>+1/2 or -1/2</td><td>electron spin</td></tr>
        </tbody>
      </table>
    </div>
    <p class="note">Check an orbital left to right: n first, then l against n, then ml against l. (1, 1, 0) fails at l, and (3, 1, 2) fails at ml.</p>
  </div>
  <div class="box">
    <h2>Counting</h2>
    <ul class="pts">
      <li>A subshell has 2l + 1 orbitals: s has 1, p has 3, d has 5, f has 7. Each orbital holds 2 electrons.</li>
      <li>A shell has n squared orbitals and holds 2n squared electrons: 2, 8, 18, 32.</li>
      <li>Shell n has n subshells. The 4th shell has 4s, 4p, 4d and 4f (16 orbitals). There is no 2d, and f starts at n = 4.</li>
    </ul>
  </div>
  <div class="box">
    <h2>Shapes</h2>
    <ul class="pts">
      <li>s orbitals are spheres. Every shell has one.</li>
      <li>p orbitals are dumbbells. The three point along x, y and z at right angles to each other. Each has one nodal plane through the nucleus, where the electron is never found.</li>
      <li>d orbitals are mostly cloverleaves, and f orbitals are more complex.</li>
      <li>An orbital plot encloses the region where the electron is found 90% of the time.</li>
    </ul>
  </div>
</template>

<template id="lesson-12">
  <div class="box">
    <h2>Filling rules</h2>
    <ul class="pts">
      <li>Aufbau: fill the lowest-energy subshell first. Order: 1s 2s 2p 3s 3p 4s 3d 4p 5s 4d 5p 6s.</li>
      <li>Pauli: an orbital holds at most 2 electrons, with opposite spins.</li>
      <li>Hund: spread electrons over the orbitals in a subshell with the same spin before pairing any.</li>
      <li>Why 4s before 3d, and 2s before 2p: s electrons penetrate closer to the nucleus, so they are shielded less. They feel a larger Z<sub>eff</sub> and sit lower in energy. Z<sub>eff</sub> = Z - S.</li>
    </ul>
    <p class="note">Noble-gas notation: Ca is [Ar]4s^2 and S is [Ne]3s^2 3p^4. The noble gas stands for all the core electrons.</p>
  </div>
  <div class="box">
    <h2>Ions, magnetism, valence and core</h2>
    <ul class="pts">
      <li>Transition metals lose their outer s electrons first. Fe is [Ar]3d^6 4s^2, so Fe^2+ is [Ar]3d^6 and Fe^3+ is [Ar]3d^5.</li>
      <li>Exceptions: Cr is [Ar]3d^5 4s^1 and Cu is [Ar]3d^10 4s^1, because half-full and full d subshells are favored.</li>
      <li>Paramagnetic means at least one unpaired electron. Diamagnetic means all paired. Decide it from the orbital diagram.</li>
      <li>For a main-group atom, valence electrons are in the outermost shell (the group A number), and everything else is core, including a filled 3d. Ge has 4 valence and 28 core.</li>
      <li>Isoelectronic species have the same number of electrons: Cl^-, Ar and K^+ all have 18.</li>
    </ul>
  </div>
  <div class="box">
    <h2>Reading a configuration</h2>
    <ul class="pts">
      <li>The last term names the element: [Kr]5s^2 4d^10 5p^3 is row 5, p block, third column, so Sb.</li>
      <li>Count unpaired electrons from the last subshell: nitrogen 2p^3 has 3, oxygen 2p^4 has 2.</li>
    </ul>
    <p class="note">Traps: skipping the 3d^10 in Ge through Br, and removing d electrons before s when making a cation.</p>
  </div>
</template>

<template id="lesson-13">
  <div class="box">
    <h2>The trends</h2>
    <div class="scroll">
      <table>
        <thead><tr><th>Property</th><th>Down a group</th><th>Across a period</th></tr></thead>
        <tbody>
          <tr><td>Atomic radius</td><td>increases</td><td>decreases</td></tr>
          <tr><td>First ionization energy</td><td>decreases</td><td>increases</td></tr>
          <tr><td>Electron affinity</td><td>no clear trend</td><td>more negative</td></tr>
          <tr><td>Metallic character</td><td>increases</td><td>decreases</td></tr>
        </tbody>
      </table>
    </div>
    <p class="note">Size and metallic character grow toward the bottom left. Ionization energy grows toward the top right. Z<sub>eff</sub> rises across a period and pulls the same shell in. Down a group the outer orbital is bigger and farther away.</p>
  </div>
  <div class="box">
    <h2>Ions and successive ionization energy</h2>
    <ul class="pts">
      <li>A cation is smaller than its atom. An anion is larger.</li>
      <li>In an isoelectronic series, more protons means a smaller ion: Ca^2+ is smaller than K^+, which is smaller than Cl^-, which is smaller than S^2-.</li>
      <li>Each successive ionization energy is larger, with a huge jump once a core electron is removed. K has a much bigger second one than Ca.</li>
      <li>Two dips in the first IE across period 2: B is lower than Be, and O is lower than N, because O has a paired 2p electron that is repelled. Period 3 repeats them: Al is lower than Mg, and S is lower than P.</li>
    </ul>
  </div>
  <div class="box">
    <h2>Predicting ion charges</h2>
    <ul class="pts">
      <li>Metals lose their valence electrons. Group 1A forms +1, 2A forms +2 and 3A forms +3.</li>
      <li>Nonmetals gain electrons to reach 8. Group 5A forms -3, 6A forms -2 and 7A forms -1.</li>
      <li>Each ion ends up with the electron count of the nearest noble gas. Mg is [Ne]3s^2 and gives Mg^2+. S is [Ne]3s^2 3p^4 and gives S^2-.</li>
    </ul>
  </div>
</template>

<template id="lesson-14">
  <div class="box">
    <h2>Ionic and covalent bonds</h2>
    <div class="scroll">
      <table>
        <thead><tr><th>Bond</th><th>What happens</th><th>Between</th></tr></thead>
        <tbody>
          <tr><td>Ionic</td><td>electrons transferred, ions attract</td><td>metal + nonmetal</td></tr>
          <tr><td>Covalent</td><td>electrons shared</td><td>nonmetal + nonmetal</td></tr>
        </tbody>
      </table>
    </div>
    <ul class="pts">
      <li>Octet rule: atoms gain, lose or share electrons to reach 8 valence electrons (2 for H).</li>
      <li>Pb and Sn are metals even though they sit in the p block, so PbS2 is ionic.</li>
      <li>Some compounds have both: Na2SO4 and Ca(OH)2 have ionic bonds between the ions and covalent bonds inside the polyatomic ion.</li>
    </ul>
  </div>
  <div class="box">
    <h2>Writing an ionic formula</h2>
    <ul class="pts">
      <li>Total positive charge must equal total negative charge.</li>
      <li>Al^3+ and O^2-: 2 x (+3) = +6 and 3 x (-2) = -6, so Al2O3.</li>
      <li>Put a polyatomic ion in parentheses when it needs a subscript: Ca3(PO4)2 and (NH4)2SO4.</li>
      <li>Count ions, not atoms: Ca(NO3)2 is 3 ions (1 Ca^2+ and 2 NO3^-) but 9 atoms.</li>
    </ul>
  </div>
  <div class="box">
    <h2>Naming what you see</h2>
    <ul class="pts">
      <li>Atom: one neutral atom, such as He. Monatomic ion: one atom with a charge, such as Cl^-.</li>
      <li>Polyatomic ion: a charged group of bonded atoms, such as NO3^-.</li>
      <li>Molecule: atoms joined by covalent bonds, such as O2, N2 or H2O. Compound: two or more elements, ionic (NaCl) or molecular (CO2).</li>
    </ul>
  </div>
</template>

<template id="lesson-15">
  <div class="box">
    <h2>The nine polyatomic ions</h2>
    <div class="scroll">

          <tr><td>chlorate</td><td>ClO3^-</td><td></td><td></td></tr>

    </div>
    <p class="note">Names, formulas and charges all count. The -ite ion has one fewer O than -ate, and per- has the most O (ClO4^- is perchlorate).</p>
  </div>
  <div class="box">
    <h2>Naming ionic compounds</h2>
    <ul class="pts">
      <li>Cation first, then anion. No prefixes: CaCl2 is calcium chloride, not calcium dichloride.</li>
      <li>Monatomic anions end in -ide: chloride, oxide, nitride, phosphide, sulfide.</li>
      <li>Groups 1A, 2A and 3A have one charge, so no numeral. Transition metals (and Pb and Sn) need a Roman numeral for the charge.</li>
      <li>Find the metal's charge from the anions: Fe2O3 has 3 x (-2) = -6, so each Fe is +3, and the name is iron(III) oxide.</li>
    </ul>
  </div>
  <div class="box">
    <h2>Going from name to formula</h2>
    <ul class="pts">
      <li>Write each ion with its charge, then balance the charges. Cobalt(III) sulfide is Co^3+ and S^2-, so Co2S3.</li>
      <li>Aluminum sulfate is Al^3+ and SO4^2-, so Al2(SO4)3. Iron(III) nitrate is Fe(NO3)3.</li>
      <li>The Roman numeral is the charge of one metal ion, not the total.</li>
    </ul>
    <p class="note">Know the names and symbols of elements 1 to 36. Watch the look-alikes: Mn manganese and Mg magnesium, K potassium and P phosphorus, Ca calcium and Cl chlorine.</p>
  </div>
</template>

    <ul class="pts">

    </ul>
    <p class="note">The textbook also uses Stock names like phosphorus(V) chloride. On his exam, use the prefix style he teaches.</p>

<template id="lesson-17">
  <div class="box">
    <h2>Valence electrons</h2>
    <ul class="pts">
      <li>A main-group atom has as many valence electrons as its group A number: Li 1, Mg 2, B 3, C 4, N 5, O 6, F 7, Ne 8. Helium has 2.</li>
      <li>A Lewis symbol shows each valence electron as a dot around the element symbol. Dr. Meyers draws boron as one pair plus one single dot (2s^2 2p^1).</li>
    </ul>
  </div>
  <div class="box">
    <h2>Monatomic ions and ionic compounds</h2>
    <ul class="pts">
      <li>A cation has lost its valence electrons, so it shows no dots: [Li]^+, [Mg]^2+.</li>
      <li>An anion has gained electrons up to an octet. The nitride ion is N with 8 dots inside brackets and 3- outside: [N]^3-.</li>
      <li>An ionic compound is drawn as separate bracketed ions with their charges and no bond line. NaCl is [Na]^+ [Cl]^- with 8 dots on Cl. CaCl2 is [Cl]^- [Ca]^2+ [Cl]^-.</li>
    </ul>
  </div>
  <div class="box">
    <h2>Bonding pairs and lone pairs</h2>
    <ul class="pts">
      <li>A bonding pair is shared by two atoms and drawn as a line. A lone pair stays on one atom and is drawn as two dots.</li>
      <li>Water has 2 bonding pairs (the two O-H lines) and 2 lone pairs on O.</li>
    </ul>
    <div class="els">
      <div class="el"><b>H</b><span>1 bond</span></div>
      <div class="el"><b>C</b><span>4 bonds</span></div>
      <div class="el"><b>N</b><span>3 bonds</span></div>
      <div class="el"><b>O</b><span>2 bonds</span></div>
      <div class="el"><b>S</b><span>2 bonds</span></div>
      <div class="el"><b>Cl</b><span>1 bond</span></div>
    </div>
    <p class="note">Bonds each atom usually makes in a neutral molecule (Chapter 4 Part 2 worksheet, #2). It equals the electrons the atom still needs for an octet, or a duet for H.</p>
  </div>
</template>

    </ul>
  </div>

    <h2>Element names still count</h2>
    <p>Questions name compounds in words, like chlorine trifluoride or xenon trioxide, so you need the names and symbols of elements 1 to 36. Watch the look-alikes: Mg magnesium and Mn manganese, K potassium and P phosphorus, Si silicon and S sulfur, Co cobalt and Cu copper.</p>

<template id="lesson-19">
  <div class="box">
    <h2>Dr. Meyers' six steps (Handout 13)</h2>
    <ol class="steps">
      <li><span><b>Sum the valence electrons.</b> Add one per negative charge, remove one per positive charge.</span></li>
      <li><span><b>Pick the central atom.</b> Usually the atom that makes more bonds, and usually the less electronegative one. H is never central.</span></li>
      <li><span><b>Place the terminal atoms</b> around it.</span></li>
      <li><span><b>Connect each terminal atom</b> to the center with a single bond.</span></li>
      <li><span><b>Fill octets, terminal atoms first.</b> Extra electrons go on the central atom. Short of electrons? Share a lone pair as a double or triple bond.</span></li>
      <li><span><b>Check formal charges</b> and that every electron was used.</span></li>
    </ol>
  </div>
  <div class="box">
    <h2>Worked: formaldehyde, CH2O (Handout 13, #4)</h2>
    <ul class="pts">
      <li>4 + 2(1) + 6 = 12 valence electrons. C is central: it makes 4 bonds, O makes 2, and H is never central.</li>
      <li>Three single bonds use 6 electrons. Three lone pairs on O use the other 6, but that leaves C with only 6 electrons.</li>
      <li>Share one O lone pair as a second bond. Final: C=O with 2 lone pairs on O and two C-H bonds. Every formal charge is 0.</li>
      <li>C=O is polar (3.5 - 2.5 = 1.0), so it gets an asterisk. C-H (0.4) does not.</li>
    </ul>
  </div>
  <div class="box">
    <h2>Quick ones</h2>
    <ul class="pts">
      <li>H2: 2 electrons, one H-H bond, no lone pairs.</li>
      <li>H2O: 8 electrons, two O-H bonds, 2 lone pairs on O.</li>
      <li>O2: 12 electrons. A single bond leaves one O with only 6, so O=O with 2 lone pairs on each O.</li>
      <li>N2: 10 electrons, N≡N with 1 lone pair on each N.</li>
    </ul>
  </div>
</template>

<template id="lesson-20">
  <div class="box">
    <h2>Single, double, triple</h2>
    <ul class="pts">
      <li>Bond order is the number of shared pairs: single 1, double 2, triple 3.</li>
      <li>More shared pairs pull the atoms closer and hold them tighter. Length: single &gt; double &gt; triple. Strength: triple &gt; double &gt; single.</li>
    </ul>
    <div class="scroll">
      <table>
        <thead><tr><th>Bond</th><th>Energy (kJ/mol)</th><th>Length (pm)</th></tr></thead>
        <tbody>
          <tr><td>C-C</td><td>347</td><td>154</td></tr>
          <tr><td>C=C</td><td>611</td><td>134</td></tr>
          <tr><td>C≡C</td><td>837</td><td>120</td></tr>
          <tr class="sn"><td>N-N</td><td>163</td><td>145</td></tr>
          <tr><td>N=N</td><td>418</td><td>123</td></tr>
          <tr><td>N≡N</td><td>946</td><td>110</td></tr>
          <tr class="sn"><td>C-O</td><td>360</td><td>143</td></tr>
          <tr><td>C=O</td><td>736</td><td>120</td></tr>
        </tbody>
      </table>
    </div>
    <p class="note">Values from Dr. Meyers' Oct 19 slides. A triple bond is stronger than a single bond, but for carbon it is only about 2.4 times as strong.</p>
  </div>
  <div class="box">
    <h2>Three ways to break the octet rule</h2>
    <div class="force"><span class="chip">Odd-electron</span><p>An odd electron total cannot pair up completely. NO has 11 and NO2 has 17, so one atom (N) ends with 7. These are free radicals.</p></div>
    <div class="force"><span class="chip">Incomplete octet</span><p>A group 3A central atom makes 3 bonds and stops at 6 electrons: BH3, BF3.</p></div>
    <div class="force"><span class="chip">Expanded octet</span><p>A central atom from row 3 or below (P, S, Cl, Br, I, Xe) can hold more than 8: PCl5 has 10, SF6 has 12, IBr3 has 10.</p></div>
    <p class="note">C, N, O and F always follow the octet rule. They never hold more than 8.</p>
  </div>
</template>

<template id="lesson-21">
  <div class="box">
    <h2>Formal charge</h2>
    <p class="eq">FC = valence e- - (lone-pair e- + ½ bonding e-)</p>
    <ul class="pts">
      <li>Shortcut: valence electrons minus (dots + lines) on that atom.</li>
      <li>The formal charges add up to the overall charge: 0 for a molecule, -1 for NO2^-.</li>
      <li>Dr. Meyers circles any nonzero formal charge next to the atom.</li>
    </ul>
  </div>
  <div class="box">
    <h2>Picking the best structure</h2>
    <ol class="steps">
      <li><span>It uses the correct number of valence electrons.</span></li>
      <li><span>Every atom has its octet, and C, N, O and F never go over 8.</span></li>
      <li><span>Formal charges are zero, or as close to zero as possible.</span></li>
    </ol>
    <p class="note">A central atom from row 3 or below may take more than 8 electrons to bring its formal charge to zero.</p>
  </div>
  <div class="box">
    <h2>Worked: chlorite, ClO2^- (Handout 13, #5)</h2>
    <ul class="pts">
      <li>7 + 2(6) + 1 = 20 electrons.</li>
      <li>All single bonds: every atom has an octet, but every atom also carries a formal charge (O -1, Cl +1, O -1). Valid, but not the best.</li>
      <li>O=Cl-O^- and its mirror image: only one O carries a charge, and Cl expands to 10 electrons, which a row 3 atom may do. Dr. Meyers calls these two equally the best.</li>
    </ul>
  </div>
  <div class="box">
    <h2>Resonance</h2>
    <ul class="pts">
      <li>Resonance structures keep every atom in place and move only electrons: the lone pairs and the multiple bonds.</li>
      <li>The real species is the average of its forms. Ozone, O3, has two equivalent forms, so each O-O bond has a bond order of 1.5.</li>
      <li>Nitrate (NO3^-) and carbonate (CO3^2-) have three forms each. Phosphate, drawn with one P=O, has four.</li>
    </ul>
  </div>
</template>

<template id="lesson-22">

      <li>SN = atoms bonded to the central atom + lone pairs on the central atom. A double or triple bond counts once.</li>
      <li>Electron-pair geometry places every group, lone pairs included. Molecular geometry names only where the atoms are.</li>
      <li>Lone pairs take more room than bonding pairs and squeeze the angles below the ideal, so you write &lt;120° or &lt;109.5°. The angles are only guaranteed ideal when the central atom has no lone pairs. Lone pairs placed symmetrically can still leave ideal angles: XeF2 stays at 180° and XeF4 at 90°.</li>

<template id="lesson-25">
  <div class="box">
    <h2>Bond polarity rules</h2>
    <ul class="pts">
      <li>Electronegativity is how strongly an atom pulls on the electrons it shares.</li>
      <li>Subtract the two values. 0 to 0.4 is a nonpolar bond, so C-H (0.4) counts as nonpolar. Above 0.4, up to 2.0, is polar. Above 2.0 is ionic.</li>
      <li>The atom that pulls harder gets the partial negative charge (δ−), and the other atom gets δ+. Dr. Meyers marks a polar bond with an asterisk.</li>
      <li>Shortcut: a bond from an NClOF atom to C, H, S or P is polar. Between two NClOF atoms, subtract: N-Cl is 0.0 (nonpolar), Cl-O is 0.5 (polar).</li>
    </ul>
  </div>
  <div class="box">
    <h2>Electronegativities to memorize</h2>
    <div class="els">
      <div class="el hot"><b>F</b><span>4.0</span></div>
      <div class="el hot"><b>O</b><span>3.5</span></div>
      <div class="el hot"><b>N</b><span>3.0</span></div>
      <div class="el hot"><b>Cl</b><span>3.0</span></div>
      <div class="el"><b>C</b><span>2.5</span></div>
      <div class="el"><b>H</b><span>2.1</span></div>
    </div>
    <p class="note">Other values: S 2.5, P 2.1, B 2.0, I 2.5, Xe 2.6.</p>
  </div>
  <div class="box">
    <h2>When a molecule is polar</h2>
    <ul class="pts">
      <li>A molecule is polar when it has polar bonds and a shape that keeps their dipoles from canceling.</li>
      <li>Draw each polar bond as an arrow pointing at its δ− atom. In a symmetric shape with identical outer atoms, the arrows cancel: CO2, BF3, CCl4.</li>
      <li>A lone pair on the central atom bends the shape, so the arrows add up: H2O, NH3, SO2.</li>
      <li>Different outer atoms also leave a net dipole: CH2O, CH2Cl2, CHCl3.</li>
      <li>Lone pairs placed symmetrically do not tip the balance: XeF4 (square planar) and XeF2 (linear) are nonpolar.</li>
    </ul>
  </div>
  <div class="box">
    <h2>Shapes and polarity</h2>
    <div class="scroll">
      <table>
        <thead><tr><th>SN</th><th>Shape</th><th>LP</th><th>Molecule</th><th>Example</th></tr></thead>
        <tbody id="pol"></tbody>
      </table>
    </div>
    <p class="note">LP is lone pairs on the central atom. Every row assumes polar bonds and identical outer atoms. A hydrocarbon (only C-H and C-C bonds) counts as nonpolar. Edge case: H2S and PH3 have lone pairs but bonds at or under the 0.4 cutoff (S-H 0.4, P-H 0.0); most textbooks call them weakly polar.</p>
  </div>
</template>

<template id="lesson-26">
  <div class="box">
    <h2>IMFs versus bonds</h2>
    <ul class="pts">
      <li>Intermolecular forces (IMFs) pull separate molecules toward each other. Bonds hold atoms together inside one molecule, and bonds are much stronger.</li>
      <li>Boiling pulls molecules apart. It overcomes IMFs, hydrogen bonds included, and breaks no covalent bonds, so steam is still H2O.</li>
    </ul>
  </div>
  <div class="box">
    <h2>Solids, liquids and gases</h2>
    <div class="els states">
      <div class="el"><b>Solid</b><span>definite shape and volume, incompressible</span></div>
      <div class="el"><b>Liquid</b><span>takes the container's shape, definite volume, mainly incompressible</span></div>
      <div class="el"><b>Gas</b><span>no definite shape or volume, compressible</span></div>
    </div>
    <ul class="pts" style="margin-top:14px">
      <li>Kinetic energy keeps particles moving apart (the disruptive force), and IMFs hold them together (the cohesive force). Raising the temperature raises kinetic energy.</li>
      <li>In a solid the cohesive forces win. In a gas the disruptive forces win.</li>
      <li>To turn a gas into a liquid, lower the temperature or raise the pressure.</li>
    </ul>
  </div>
  <div class="box">
    <h2>The three IMFs</h2>
    <div class="force"><span class="chip">Dispersion</span><p>Electrons shift for an instant and make a brief dipole that pulls on neighbors. Every molecule has it. More electrons mean higher polarizability, so stronger dispersion.</p></div>
    <div class="force"><span class="chip">Dipole-dipole</span><p>The δ+ end of one polar molecule attracts the δ− end of the next. Polar molecules only.</p></div>
    <div class="force"><span class="chip">Hydrogen bonding</span><p>An H bonded directly to N, O or F, attracted to a lone pair on an N, O or F in a nearby molecule. The strongest of the three for molecules of similar size.</p></div>
  </div>
  <div class="box">
    <h2>Finding the dominant IMF</h2>
    <ol class="steps">
      <li><span><b>Is an H bonded directly to N, O or F?</b> Hydrogen bonding: H2O, NH3, HF, CH3OH.</span></li>
      <li><span><b>If not, is the molecule polar?</b> Dipole-dipole: HCl, SO2, PCl3, CH2O, ICl, CHCl3.</span></li>
      <li><span><b>If not,</b> dispersion only: CH4, CO2, CCl4, I2.</span></li>
    </ol>
    <p class="note">The dominant IMF is the strongest type present, and every molecule also has dispersion. CH2O has H and O, but its H is bonded to C, so CH2O molecules cannot hydrogen-bond to each other.</p>
  </div>
  <div class="box">
    <h2>Worked: iodine trifluoride (Handout 14, problem 2)</h2>
    <ul class="pts">
      <li>Covalent: two nonmetals. Formula IF3.</li>
      <li>7 + 3(7) = 28 valence electrons. I goes in the center with single bonds to three F, three lone pairs on each F, and the last 4 electrons as 2 lone pairs on I. I is in row 5, so it can hold more than an octet.</li>
      <li>SN = 3 bonds + 2 lone pairs = 5. Electron geometry: trigonal bipyramidal. Molecular geometry: T-shaped. The F-I-F angles are a little under 90°, and the two axial F are a little under 180° apart.</li>
      <li>Polar: the I-F bonds are polar, and a T does not cancel.</li>
      <li>Dominant IMF: dipole-dipole. It is polar and has no H.</li>
    </ul>
  </div>
</template>

<template id="lesson-27">
  <div class="box">
    <h2>Boiling point rules</h2>
    <ul class="pts">
      <li>Stronger IMFs mean a higher boiling point. For molecules of similar size: hydrogen bonding &gt; dipole-dipole &gt; dispersion.</li>
      <li>More electrons mean stronger dispersion, so noble-gas boiling points rise from He to Xe.</li>
      <li>Shape counts too. Straight chains pack closer together than branched molecules, so their dispersion is stronger.</li>
    </ul>
  </div>
  <div class="box">
    <h2>Boiling points in pairs</h2>
    <div class="vs"><div class="side"><b>CH4</b>16 g/mol<span>−162 °C</span></div><em>vs</em><div class="side hi"><b>H2O</b>18 g/mol<span>100 °C</span></div></div>
    <p class="vsy">Same size. Water hydrogen-bonds.</p>
    <div class="vs"><div class="side"><b>Dimethyl ether</b>C2H6O<span>−24 °C</span></div><em>vs</em><div class="side hi"><b>Ethanol</b>C2H6O<span>78 °C</span></div></div>
    <p class="vsy">Same formula. Only ethanol has an O-H.</p>
    <div class="vs"><div class="side"><b>Isobutane</b>branched, C4H10<span>−11.7 °C</span></div><em>vs</em><div class="side hi"><b>Butane</b>straight chain, C4H10<span>−0.5 °C</span></div></div>
    <p class="vsy">Same formula. Butane molecules sit closer together, so their dispersion is stronger.</p>
    <div class="vs"><div class="side"><b>F2 and Cl2</b>gases</div><em>vs</em><div class="side hi"><b>I2</b>solid</div></div>
    <p class="vsy">At room temperature I2 is a solid because its extra electrons give it the strongest dispersion. Br2, in between, is a liquid.</p>
  </div>
  <div class="box">
    <h2>Solubility: like dissolves like</h2>
    <ul class="pts">
      <li>Polar and ionic substances dissolve in polar water. Nonpolar substances dissolve in nonpolar solvents like hexane.</li>
      <li>Hexane (C6H14) and water do not mix. They separate into two layers.</li>
      <li>I2 is nonpolar, so it dissolves in the hexane layer. KMnO4 is ionic, so it dissolves in the water layer, held there by ion-dipole forces between the ions and the polar water molecules.</li>
    </ul>
  </div>
  <div class="box">
    <h2>Handout 15, #1</h2>
    <div class="scroll">
      <table>
        <thead><tr><th>Species</th><th>Polarity</th><th>Dominant IMF</th><th>In water</th></tr></thead>
        <tbody>
          <tr><td>methane</td><td>nonpolar</td><td>dispersion</td><td>insoluble</td></tr>
          <tr><td>benzaldehyde</td><td>polar</td><td>dipole-dipole</td><td>slightly soluble</td></tr>
          <tr><td>glucose</td><td>polar</td><td>hydrogen bond</td><td>soluble</td></tr>
        </tbody>
      </table>
    </div>
    <p class="note">Handout 15, #2: helium (dispersion only) boils at −269 °C, acetone (dipole-dipole) at 56 °C.</p>
  </div>
</template>

<template id="lesson-28">
  <div class="box">
    <h2>Mass percent of an element</h2>
    <p class="eq">% element = mass of the element in 1 mol ÷ molar mass × 100</p>
    <ul class="pts">
      <li>Multiply each atomic mass by its subscript. Parentheses multiply too: Fe(NO3)3 has 3 N and 9 O.</li>
      <li>Use the periodic table on the exam: H 1.0079, C 12.011, N 14.007, O 15.999.</li>
      <li>A percent works as a conversion factor: 17.37 % N means 17.37 g N per 100 g of compound.</li>
    </ul>
  </div>
  <div class="box">
    <h2>Worked: N in Fe(NO3)3 (Handout 16, #1)</h2>
    <ul class="pts">
      <li>Molar mass: 55.845 + 3(14.007) + 9(15.999) = 241.857 g/mol.</li>
      <li>Nitrogen: 3(14.007) = 42.021 g.</li>
      <li>% N = 42.021 ÷ 241.857 × 100 = 17.37 %.</li>
    </ul>
  </div>
  <div class="box">
    <h2>Check the key</h2>
    <p>Chapter 6 worksheet #2 prints 175.03 g/mol for PF2Cl3 and 60.77 % Cl. The sum is 30.974 + 2(18.998) + 3(35.453) = 175.33 g/mol, so % Cl = 60.66 %. If you get 60.66 %, your work is right.</p>
  </div>
</template>

<template id="lesson-29">
  <div class="box">
    <h2>Empirical vs molecular</h2>
    <ul class="pts">
      <li>The molecular formula gives the actual atoms in one molecule. The empirical formula is the lowest whole-number ratio.</li>
      <li>Glucose, C6H12O6, has the empirical formula CH2O. Benzene, C6H6, is CH. H2O and CO2 are already empirical.</li>
      <li>Finding a molecular formula from a molar mass is not on the final.</li>
    </ul>
  </div>
  <div class="box">
    <h2>From percent to formula</h2>
    <ol class="steps">
      <li><span><b>Get every percent.</b> If O is not given, it is 100 minus the rest.</span></li>
      <li><span><b>Assume 100.0 g</b>, so each percent becomes grams. Convert each to moles.</span></li>
      <li><span><b>Divide by the smallest</b> mole amount and round to the hundredths.</span></li>
      <li><span><b>Clear fractions</b> by multiplying every value by the same factor.</span></li>
    </ol>
    <div class="scroll">
      <table>
        <thead><tr><th>Ends in</th><th>.20</th><th>.25</th><th>.33</th><th>.40</th><th>.50</th><th>.67</th><th>.75</th><th>.80</th></tr></thead>
        <tbody><tr><td>Times</td><td>5</td><td>4</td><td>3</td><td>5</td><td>2</td><td>3</td><td>4</td><td>5</td></tr></tbody>
      </table>
    </div>
  </div>
  <div class="box">
    <h2>Worked: Chapter 6 worksheet #4</h2>
    <ul class="pts">
      <li>58.23 % C and 10.75 % H, so O = 31.02 %.</li>
      <li>C: 58.23 ÷ 12.011 = 4.848 mol. H: 10.75 ÷ 1.0079 = 10.67 mol. O: 31.02 ÷ 15.999 = 1.939 mol.</li>
      <li>Divide by 1.939: C 2.50, H 5.50, O 1.00. Halves, so double everything: C5H11O2.</li>
    </ul>
    <p class="note">Handout 16, #2 (52.14 % C, 13.13 % H, 34.73 % O) works out to C2H6O, the formula of both ethanol and dimethyl ether.</p>
  </div>
</template>

<template id="lesson-30">
  <div class="box">
    <h2>Solute and solvent</h2>
    <ul class="pts">
      <li>The solvent is the component present in the largest amount. Everything dissolved in it is a solute.</li>
      <li>Aqueous (aq) means water is the solvent.</li>
      <li>Natural gas (97 % methane): methane is the solvent, and ethane, CO2 and N2 are solutes. Rose gold (75 % gold): gold is the solvent, copper and silver are solutes. Dental amalgam (about 50 % mercury by mass, the rest a silver, tin and copper alloy): mercury is the largest single part, so it is the solvent.</li>
    </ul>
  </div>
  <div class="box">
    <h2>Molarity</h2>
    <p class="eq">M = mol solute ÷ L solution</p>
    <ul class="pts">
      <li>It is not on the formula sheet. Memorize it.</li>
      <li>Grams to M: g ÷ molar mass = mol, then ÷ L. M to grams: L × M = mol, then × molar mass.</li>
      <li>Convert mL to L first: 125 mL = 0.125 L.</li>
      <li>Ions multiply: 1 M CaCl2 gives [Ca^2+] = 1 M and [Cl^-] = 2 M.</li>
    </ul>
  </div>
  <div class="box">
    <h2>Worked: Handout 17, #2 and #4</h2>
    <ul class="pts">
      <li>4.83 g Na2S2O3 in 125 mL: 4.83 ÷ 158.11 = 0.03055 mol, then ÷ 0.125 L = 0.244 M.</li>
      <li>NaCl for 150. mL of 0.855 M: 0.150 L × 0.855 = 0.1283 mol, then × 58.443 = 7.50 g.</li>
    </ul>
  </div>
</template>

<template id="lesson-31">
  <div class="box">
    <h2>Three more units</h2>
    <div class="force"><span class="chip">% m/m, also called % w/w</span><p>g solute ÷ g solution × 100. The solution mass is solute plus solvent.</p></div>
    <div class="force"><span class="chip">% v/v</span><p>mL solute ÷ mL solution × 100. Rubbing alcohol is 70 % v/v isopropyl alcohol.</p></div>
    <div class="force"><span class="chip">ppm</span><p>g solute ÷ g solution × 10^6. In a dilute water solution, 1 ppm is about 1 mg per liter.</p></div>
    <p class="note">The formula sheet has % = part ÷ whole × 100, but not the 10^6 for ppm. Dr. Meyers' slides never define % v/v or ppm, so these follow the textbook's chapter 6 definitions.</p>
  </div>
  <div class="box">
    <h2>Worked: Handout 17, #3</h2>
    <ul class="pts">
      <li>2.52 g sucrose in 25.0 g water. Solution mass = 2.52 + 25.0 = 27.5 g.</li>
      <li>% m/m = 2.52 ÷ 27.5 × 100 = 9.16 %.</li>
      <li>Dividing by the 25.0 g of water alone gives 10.1 %, the classic mistake.</li>
    </ul>
  </div>
  <div class="box">
    <h2>Worked: Chapter 6 worksheet #9</h2>
    <ul class="pts">
      <li>1.15 M NaBr with a density of 1.08 g/mL. Take 1 L of solution.</li>
      <li>Solute: 1.15 mol × 102.89 g/mol = 118.3 g. Solution: 1000 mL × 1.08 g/mL = 1080 g.</li>
      <li>% m/m = 118.3 ÷ 1080 × 100 = 11.0 %. The 235 mL in the problem does not matter.</li>
    </ul>
  </div>
</template>

<template id="lesson-32">
  <div class="box">
    <h2>C1V1 = C2V2</h2>
    <ul class="pts">
      <li>Adding solvent lowers the concentration, but the moles of solute stay the same. That is why C1V1 = C2V2 works. It is on the formula sheet.</li>
      <li>1 is the stock you start with. 2 is the new solution.</li>
      <li>V2 is the total final volume, not the water you add.</li>
      <li>Always add acid to water.</li>
    </ul>
  </div>
  <div class="box">
    <h2>Worked: Handout 17, #5</h2>
    <ul class="pts">
      <li>9.00 mL of water is added to 1.00 mL of 0.325 M Cr^3+, so V2 = 10.00 mL.</li>
      <li>C2 = (0.325 M)(1.00 mL) ÷ 10.00 mL = 0.0325 M.</li>
    </ul>
  </div>
  <div class="box">
    <h2>Worked: Chapter 6 worksheet #10</h2>
    <ul class="pts">
      <li>Make 500. mL of 6 M HCl from 12 M HCl. The 12 M stock is the 1, and the new 6 M solution is the 2.</li>
      <li>V1 = (6 M)(500. mL) ÷ 12 M = 250. mL.</li>
      <li>Add 250. mL of 12 M HCl to 250. mL of water, for 500. mL total.</li>
    </ul>
  </div>
</template>

<template id="lesson-33">
  <div class="box">
    <h2>Reading an equation</h2>
    <ul class="pts">
      <li>Reactants sit left of the arrow and products sit right: Ni(s) + 2 HCl(aq) -&gt; NiCl2(aq) + H2(g), from the Nov 9 slides.</li>
      <li>A coefficient counts whole formulas. No number means 1, as for Ni, NiCl2 and H2.</li>
      <li>A subscript is part of the formula. 2 H2O is two water molecules, but H2O2 is hydrogen peroxide, a different substance.</li>
      <li>Conservation of mass: atoms are rearranged, never created or destroyed. Every element has the same count on both sides, and the mass in equals the mass out.</li>
    </ul>
    <div class="els">
      <div class="el"><b>(s)</b><span>solid</span></div>
      <div class="el"><b>(l)</b><span>liquid</span></div>
      <div class="el"><b>(g)</b><span>gas</span></div>
      <div class="el"><b>(aq)</b><span>in water</span></div>
    </div>
    <p class="note">A chemical change makes a new substance: burning, rusting, a solid forming when two solutions mix. Melting, boiling and dissolving are physical changes, because the formula stays the same.</p>
  </div>
  <div class="box">
    <h2>Dr. Meyers' tips (Handout 18)</h2>
    <ol class="steps">
      <li><span><b>Change only coefficients.</b> Never touch a formula.</span></li>
      <li><span><b>Set the most complex formula to 1.</b></span></li>
      <li><span><b>Balance one element at a time.</b> Leave any element that shows up more than once per side, often O, for last.</span></li>
      <li><span><b>Move a polyatomic ion as one group</b> when it appears whole on both sides, like PO4 or NO3.</span></li>
      <li><span><b>End in the lowest whole-number ratio.</b> Clear a fraction like 7/2 by doubling everything.</span></li>
    </ol>
  </div>
  <div class="box">
    <h2>Worked: Handout 18, #1a</h2>
    <p class="eq">C3H8(g) + O2(g) -&gt; CO2(g) + H2O(l)</p>
    <ol class="steps">
      <li><span><b>Set C3H8 to 1.</b> It is the most complex formula.</span></li>
      <li><span><b>Carbon:</b> 3 C on the left, so 3 CO2.</span></li>
      <li><span><b>Hydrogen:</b> 8 H on the left, so 4 H2O.</span></li>
      <li><span><b>Oxygen last:</b> the right holds 3(2) + 4 = 10 O atoms, so 5 O2.</span></li>
    </ol>
    <div class="scroll">
      <table>
        <thead><tr><th>Atom</th><th>Left</th><th>Right</th></tr></thead>
        <tbody>
          <tr><td>C</td><td>3</td><td>3</td></tr>
          <tr><td>H</td><td>8</td><td>4 × 2 = 8</td></tr>
          <tr><td>O</td><td>5 × 2 = 10</td><td>3 × 2 + 4 = 10</td></tr>
        </tbody>
      </table>
    </div>
    <p class="note">Answer: 1, 5, 3, 4. The rest of Handout 18: #1b is 1, 3, 1, 3 with PO4 kept whole, and #1c is 4 Fe + 3 O2 -&gt; 2 Fe2O3.</p>
  </div>
</template>

<template id="lesson-34">
  <div class="box">
    <h2>Coefficients are mole ratios</h2>
    <ul class="pts">
      <li>Dr. Meyers' s'more recipe: 2 graham crackers + 1 marshmallow + 1 chocolate -&gt; 1 s'more. 12 graham crackers × (1 s'more ÷ 2 graham crackers) = 6 s'mores.</li>
      <li>N2 + 3 H2 -&gt; 2 NH3 reads 1 mol N2 : 3 mol H2 : 2 mol NH3. Any two can be related: reactant to product, product to reactant, or reactant to reactant.</li>
      <li>Coefficients count moles or particles, never grams. 1 g of N2 does not make 2 g of NH3.</li>
    </ul>
    <p class="eq">g A -&gt; mol A -&gt; mol B -&gt; g B</p>
    <p class="note">One chemical: particles &lt;-&gt; mol &lt;-&gt; g. Two chemicals: cross from A to B with the mole ratio. With solutions, L takes the place of g at either end.</p>
  </div>
  <div class="box">
    <h2>Worked: Handout 19, #2</h2>
    <p>What mass of N2 is needed to make 51.0 g of NH3? N2 + 3 H2 -&gt; 2 NH3.</p>
    <div class="scroll">
      <table>
        <thead><tr><th>Know</th><th>Want</th></tr></thead>
        <tbody>
          <tr><td>51.0 g NH3</td><td rowspan="4">? g N2</td></tr>
          <tr><td>17.03 g NH3 = 1 mol NH3</td></tr>
          <tr><td>1 mol N2 = 2 mol NH3</td></tr>
          <tr><td>28.014 g N2 = 1 mol N2</td></tr>
        </tbody>
      </table>
    </div>
    <ol class="steps">
      <li><span><b>g NH3 to mol NH3:</b> 51.0 g NH3 × (1 mol NH3 ÷ 17.03 g NH3) = 2.995 mol NH3</span></li>
      <li><span><b>mol NH3 to mol N2:</b> 2.995 mol NH3 × (1 mol N2 ÷ 2 mol NH3) = 1.497 mol N2</span></li>
      <li><span><b>mol N2 to g N2:</b> 1.497 mol N2 × (28.014 g N2 ÷ 1 mol N2) = 41.9 g N2 (3 SF)</span></li>
    </ol>
  </div>

    <h2>Handout 19, #1: P4 + 5 O2 -&gt; P4O10</h2>

        <tbody>

          <tr><td>B</td><td><b>5.0</b></td><td>25</td><td>5.0</td></tr>
          <tr><td>C</td><td>0.5</td><td>2.5</td><td><b>0.5</b></td></tr>

<template id="lesson-35">
  <div class="box">
    <h2>Which runs out first</h2>
    <ul class="pts">
      <li>The limiting reactant runs out first and sets how much product forms. The excess reactant is what is left over.</li>
      <li>12 graham crackers, 8 marshmallows and 10 chocolates make only 6 s'mores. The graham crackers limit, even though you have the most of them.</li>
      <li>Never compare grams, or even raw moles. Compare how much product each reactant could make.</li>
    </ul>
    <p class="eq">for each reactant: g -&gt; mol -&gt; mol product</p>
  </div>
  <div class="box">
    <h2>Worked: Handout 19, #5</h2>
    <p>20.0 g of N2 and 12.5 g of H2 react: N2 + 3 H2 -&gt; 2 NH3. The handout's hint: run one calculation from each reactant, then compare.</p>
    <div class="scroll">
      <table>
        <thead><tr><th>Know</th><th>Want</th></tr></thead>
        <tbody>
          <tr><td>20.0 g N2 and 12.5 g H2</td><td rowspan="3">limiting reactant and ? g NH3</td></tr>
          <tr><td>28.014 g N2, 2.016 g H2, 17.03 g NH3 per mol</td></tr>
          <tr><td>1 mol N2 = 2 mol NH3; 3 mol H2 = 2 mol NH3</td></tr>
        </tbody>
      </table>
    </div>
    <ol class="steps">
      <li><span><b>From N2:</b> 20.0 g N2 × (1 mol N2 ÷ 28.014 g N2) × (2 mol NH3 ÷ 1 mol N2) × (17.03 g NH3 ÷ 1 mol NH3) = 24.3 g NH3</span></li>
      <li><span><b>From H2:</b> 12.5 g H2 × (1 mol H2 ÷ 2.016 g H2) × (2 mol NH3 ÷ 3 mol H2) × (17.03 g NH3 ÷ 1 mol NH3) = 70.4 g NH3</span></li>
      <li><span><b>Compare:</b> N2 gives less, so N2 limits and 24.3 g is the theoretical yield. H2 is in excess.</span></li>
    </ol>
  </div>
  <div class="box">
    <h2>How much excess is left</h2>
    <p class="eq">left over = start - used</p>
    <ul class="pts">
      <li>With the Handout 19, #5 numbers: 0.7139 mol N2 uses 3 × 0.7139 = 2.142 mol H2, which is 4.32 g. 12.5 - 4.32 = 8.2 g of H2 is left, because a subtraction keeps the tenths place of 12.5.</li>
      <li>With the Handout 19, #3 numbers: 4.0 mol P4 and 15 mol O2 in P4 + 5 O2 -&gt; P4O10. O2 can make 3.0 mol P4O10 and P4 could make 4.0, so O2 limits. That uses 3.0 mol P4, leaving 1.0 mol.</li>
    </ul>
  </div>
</template>

<template id="lesson-36">
  <div class="box">
    <h2>Three yields</h2>
    <ul class="pts">
      <li><b>Theoretical yield:</b> the most product the reaction can make, calculated from the limiting reactant.</li>
      <li><b>Actual yield:</b> what you really collect and weigh. The problem gives it to you.</li>
      <li><b>Percent yield</b> compares the two. It is on the formula sheet.</li>
    </ul>
    <p class="eq">percent yield = actual yield ÷ theoretical yield × 100</p>
    <p class="note">Both yields need the same unit. Lost product makes a yield fall short. A yield over 100 % means the product was weighed wet or impure.</p>
  </div>
  <div class="box">
    <h2>Worked: Handout 19, #4</h2>
    <p>2.7 g of Fe reacts with excess O2, and 3.2 g of Fe2O3 is collected. 4 Fe + 3 O2 -&gt; 2 Fe2O3.</p>
    <div class="scroll">
      <table>
        <thead><tr><th>Know</th><th>Want</th></tr></thead>
        <tbody>
          <tr><td>2.7 g Fe (O2 is in excess, so Fe limits)</td><td rowspan="4">? % yield</td></tr>
          <tr><td>3.2 g Fe2O3 collected (actual yield)</td></tr>
          <tr><td>55.845 g Fe = 1 mol Fe; 159.69 g Fe2O3 = 1 mol Fe2O3</td></tr>
          <tr><td>4 mol Fe = 2 mol Fe2O3</td></tr>
        </tbody>
      </table>
    </div>
    <p class="eq">g Fe -&gt; mol Fe -&gt; mol Fe2O3 -&gt; g Fe2O3</p>
    <ol class="steps">
      <li><span><b>Theoretical yield:</b> 2.7 g Fe × (1 mol Fe ÷ 55.845 g Fe) × (2 mol Fe2O3 ÷ 4 mol Fe) × (159.69 g Fe2O3 ÷ 1 mol Fe2O3) = 3.86 g Fe2O3</span></li>
      <li><span><b>Percent yield:</b> 3.2 g ÷ 3.86 g × 100 = 83 % (2 SF)</span></li>
    </ol>
  </div>
  <div class="box">
    <h2>The rest of Handout 19</h2>
    <ul class="pts">
      <li>#3c: theoretical yield 3.0 mol P4O10, 2.0 mol collected. 2.0 ÷ 3.0 × 100 = 67 %.</li>
      <li>#5: theoretical yield 24.3 g NH3 (N2 limits), 21.5 g collected. 21.5 ÷ 24.32 × 100 = 88.4 %.</li>
      <li>Divide by the limiting reactant's product. The 70.4 g from the excess H2 gives 30.5 %, a wrong answer that looks reasonable.</li>
    </ul>
  </div>
</template>

<template id="lesson-37">
  <div class="box">
    <h2>Liters in, liters out</h2>
    <p class="eq">L A -&gt; mol A -&gt; mol B -&gt; L B</p>
    <ul class="pts">
      <li>Molarity is the bridge: mol = M × L, and L = mol ÷ M. Change mL to L first.</li>
      <li>The coefficients still carry you from A to B. Either end can be grams instead: g A -&gt; mol A, or mol B -&gt; g B.</li>
      <li>C1V1 = C2V2 is only for diluting one chemical. It does not work across a reaction (Nov 20 slides).</li>
    </ul>
  </div>
  <div class="box">
    <h2>Worked: Handout 19, #6b</h2>
    <p>Pb(NO3)2(aq) + 2 KCl(aq) -&gt; PbCl2(s) + 2 KNO3(aq). What volume of 5.0 x 10^-1 M KCl precipitates all the Pb^2+ in 0.100 L of 0.150 M Pb(NO3)2?</p>
    <div class="scroll">
      <table>
        <thead><tr><th>Know</th><th>Want</th></tr></thead>
        <tbody>
          <tr><td>0.100 L of 0.150 M Pb(NO3)2</td><td rowspan="3">? mL KCl</td></tr>
          <tr><td>0.50 M KCl</td></tr>
          <tr><td>1 mol Pb(NO3)2 = 2 mol KCl</td></tr>
        </tbody>
      </table>
    </div>
    <ol class="steps">
      <li><span><b>L to mol:</b> 0.100 L × (0.150 mol Pb(NO3)2 ÷ 1 L) = 0.0150 mol Pb(NO3)2</span></li>
      <li><span><b>mol to mol:</b> 0.0150 mol Pb(NO3)2 × (2 mol KCl ÷ 1 mol Pb(NO3)2) = 0.0300 mol KCl</span></li>
      <li><span><b>mol to L:</b> 0.0300 mol KCl × (1 L ÷ 0.50 mol KCl) × (1000 mL ÷ 1 L) = 60. mL KCl (2 SF)</span></li>
    </ol>
    <p class="note">M1V1 = M2V2 gives 30. mL here, and Dr. Meyers marks that incorrect: it only works when diluting one chemical, and here it skips the 2:1 ratio. His work slide writes the KCl as 0.500 M, but the problem gives 5.0 x 10^-1 M, two sig figs, which is why the answer is 60. mL.</p>
  </div>
  <div class="box">
    <h2>Titrations (section 7.5)</h2>
    <ul class="pts">
      <li>A titration adds a solution of known molarity until the reaction is complete. At the equivalence point, the moles match the ratio in the equation.</li>
      <li>Same pathway: 30.0 mL of 0.200 M HCl holds 0.00600 mol, so it needs 0.00600 mol NaOH (1:1), which is 60.0 mL of 0.100 M NaOH.</li>
      <li>Watch the ratio: H2SO4 + 2 NaOH -&gt; Na2SO4 + 2 H2O needs twice as many mol of NaOH as H2SO4.</li>
    </ul>
    <p class="note">Section 7.5 is on the final study guide (all of chapter 7 except 7.2), but no handout covers it. Expect it to look like Handout 19, #6.</p>
  </div>
</template>

  { lv: 1, t: 'mc', q: 'How many significant figures are in 0.04030?', a: ['4', '3', '5', '2'], why: 'The leading zeros do not count. The 4, the captive 0 and the 3 count, and the trailing 0 after the decimal point counts too. That is 4.' },
  { lv: 1, t: 'mc', q: 'How many significant figures are in 3201500. (a decimal point after the last zero)?', a: ['7', '5', '6', '4'], why: 'The decimal point at the end makes every digit significant, so all 7 count. Without the point, 3201500 would be ambiguous (5, 6 or 7).' },
