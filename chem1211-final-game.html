  { lv: 1, t: 'mc', q: 'Round 12203.0 to 2 significant figures.', a: ['1.2 x 10^4', '1.20 x 10^4', '1.3 x 10^4', '1.22 x 10^4'], why: 'Keep 2 digits: 1.2, and the next digit is 2, so it stays. Scientific notation is needed so the 2 sig figs are clear. 1.20 x 10^4 shows 3 sig figs, and 1.3 x 10^4 rounds up when it should not.' },
  { lv: 1, t: 'mc', q: 'Calculate to the correct number of significant figures: 100. / 9.8', a: ['10.', '10.2', '10.20', '1 x 10^1'], why: '100. has 3 sig figs and 9.8 has 2, so the answer keeps 2. The raw result is 10.204. The decimal point in 10. shows 2 sig figs, while 1 x 10^1 shows only 1.' },
  { lv: 1, t: 'mc', q: 'Calculate to the correct number of significant figures: 5.55 x 2525', a: ['1.40 x 10^4', '1.4 x 10^4', '14,013.75', '1.401 x 10^4'], why: '5.55 has 3 sig figs and 2525 has 4, so keep 3. 14,013.75 rounds to 1.40 x 10^4. Writing 1.4 x 10^4 drops the zero that carries the third sig fig.' },
  { lv: 1, t: 'mc', q: 'Calculate to the correct number of significant figures: 152.39 - 74.4', a: ['78.0', '78', '77.99', '77.9'], why: 'For subtraction count decimal places, not sig figs. 74.4 has 1 decimal, so the answer has 1 decimal: 77.99 rounds up to 78.0. Plain 78 has no decimals, and 77.9 rounds the wrong way.' },
  { lv: 1, t: 'mc', q: 'How many significant figures belong in the answer to (24.20 - 21.2) / 3.00?', a: ['2', '3', '4', '1'], why: 'Do the subtraction first with decimals: 24.20 - 21.2 = 3.0, which has 1 decimal and so 2 sig figs. Then divide by 3.00 (3 sig figs). The least precise value has 2, so the answer has 2.' },
  { lv: 1, t: 'mc', q: 'A balance reads 12.51 g, 12.52 g, 12.50 g and 12.51 g for a sample whose accepted mass is 10.00 g. Which description fits?', a: ['Precise but not accurate', 'Accurate but not precise', 'Both accurate and precise', 'Neither accurate nor precise'], why: 'The readings sit very close together, so they are precise. They are all about 2.5 g from 10.00 g, so they are not accurate. Accuracy is closeness to the accepted value; precision is closeness of repeated measurements to each other.' },
  { lv: 1, t: 'mc', q: 'Which of these numbers is exact, with infinite significant figures?', a: ['The 60 in 60 s = 1 min', 'The 60 on a speedometer reading of 60 mph', 'The 60. g read from a balance', 'The 60 in a thermometer reading of 60 °C'], why: 'Numbers that come from a definition or a count are exact. The 60 in 60 s = 1 min is a definition. The other three are measurements, so each has a limited number of sig figs.' },
  { lv: 1, t: 'type', q: 'How many significant figures are in 0.03201500?', ans: '7', re: '^(7|seven)(sigfigs?|sf|significantfigures?)?$', why: 'Leading zeros do not count. 3, 2, the captive 0, 1 and 5 count, and both trailing zeros after the decimal count. That is 7.' },
  { lv: 1, t: 'type', q: 'How many significant figures are in 4.8 x 10^-4?', ans: '2', re: '^(2|two)(sigfigs?|sf|significantfigures?)?$', why: 'In scientific notation only the coefficient counts. 4.8 has 2 sig figs. The power of ten never adds any.' },
  { lv: 1, t: 'type', q: 'Round 0.9338429 to 4 significant figures.', ans: '0.9338', re: '^0?\\.9338$', why: 'The first 4 sig figs are 9338 and the next digit is 4, so it rounds down. The 0 before the decimal point does not count.' },
  { lv: 1, t: 'mc', boss: true, q: 'Calculate to the correct number of significant figures: 12.8 - 4.62', a: ['8.2', '8.18', '8', '8.1'], why: 'Subtraction follows the fewest decimal places. 12.8 has 1 decimal, so the answer has 1: 8.18 rounds to 8.2. Keeping 8.18 uses the wrong rule, and 8.1 rounds the wrong way.' },
  { lv: 1, t: 'mc', boss: true, q: 'Calculate to the correct number of significant figures: (2.5 x 10^7) times (30.0 x 10^-3)', a: ['7.5 x 10^5', '7.50 x 10^5', '7.5 x 10^4', '7.5 x 10^10'], why: 'Multiply the coefficients (2.5 x 30.0 = 75.0) and add the exponents (7 + -3 = 4), giving 75.0 x 10^4 = 7.5 x 10^5. 2.5 has 2 sig figs, so keep 2. 7.50 shows 3.' },

  { lv: 2, t: 'mc', q: 'The prefix mega- (M) stands for which power of ten?', a: ['10^6', '10^-6', '10^3', '10^9'], why: 'Mega is 10^6 (a million). 10^-6 is micro, 10^3 is kilo and 10^9 is giga.' },
  { lv: 2, t: 'mc', q: 'Convert 7.15 mL to liters.', a: ['7.15 x 10^-3 L', '7.15 x 10^3 L', '0.715 L', '7.15 x 10^-6 L'], why: '1 mL = 10^-3 L, so 7.15 mL = 7.15 x 10^-3 L = 0.00715 L. A milliliter is a thousandth of a liter, so the number gets smaller, not larger.' },
  { lv: 2, t: 'mc', q: 'A mass of 0.000000092 g is best written with a prefix as', a: ['92 ng', '92 µg', '9.2 ng', '92 mg'], why: '0.000000092 g = 9.2 x 10^-8 g = 92 x 10^-9 g, and 10^-9 is nano. 92 µg would be 92 x 10^-6 g, which is 1000 times too big.' },
  { lv: 2, t: 'mc', q: 'Convert 2.64 kg to grams.', a: ['2.64 x 10^3 g', '2.64 x 10^-3 g', '2.64 x 10^6 g', '0.264 g'], why: '1 kg = 10^3 g, so multiply by 1000. A kilogram is bigger than a gram, so the number of grams is bigger.' },
  { lv: 2, t: 'mc', q: 'Convert 94.50 µL to mL.', a: ['0.09450 mL', '94,500 mL', '9.450 mL', '0.00009450 mL'], why: '1 µL = 10^-6 L and 1 mL = 10^-3 L, so 94.50 µL = 94.50 x 10^-6 L = 9.450 x 10^-5 L = 0.09450 mL. Route through the base unit, liters, as Dr. Meyers does.' },
  { lv: 2, t: 'mc', q: 'A 250. cm^3 flask holds how many liters?', a: ['0.250 L', '250. L', '0.0250 L', '2.50 x 10^5 L'], why: '1 cm^3 = 1 mL, so 250. cm^3 = 250. mL. Then 1000 mL = 1 L, giving 0.250 L.' },
  { lv: 2, t: 'mc', q: 'To convert 1500. cm^2 to m^2, which setup is correct?', a: ['1500. cm^2 x (1 m / 100 cm) x (1 m / 100 cm)', '1500. cm^2 x (1 m / 100 cm)', '1500. cm^2 x (100 cm / 1 m) x (100 cm / 1 m)', '1500. cm^2 x (1 m / 100 cm) x (1 m / 100 cm) x (1 m / 100 cm)'], why: 'A squared unit needs the whole factor squared, number included: (1 m / 100 cm) twice. One factor leaves cm in the answer. The flipped factor leaves cm^2 on top, so nothing cancels. Three factors would be for cm^3.' },
  { lv: 2, t: 'mc', q: 'Convert 0.42 cm^2 to in^2 (2.54 cm = 1 in).', a: ['0.065 in^2', '2.7 in^2', '0.17 in^2', '0.42 in^2'], why: 'Square the factor: 0.42 / 2.54^2 = 0.42 / 6.4516 = 0.065 in^2. Multiplying by 6.4516 gives 2.7, and dividing by 2.54 only once gives 0.17.' },
  { lv: 2, t: 'mc', q: 'Convert 2.0 m^3 to cm^3.', a: ['2.0 x 10^6 cm^3', '2.0 x 10^2 cm^3', '2.0 x 10^4 cm^3', '2.0 x 10^-6 cm^3'], why: 'Cube the whole factor: (100 cm / 1 m) cubed is 100^3 = 10^6. So 2.0 m^3 = 2.0 x 10^6 cm^3. The cm^3 count must be much larger, because a cm^3 is tiny.' },
  { lv: 2, t: 'mc', q: 'Convert 68.5 mm^3 to m^3.', a: ['6.85 x 10^-8 m^3', '6.85 x 10^-5 m^3', '6.85 x 10^-2 m^3', '6.85 x 10^8 m^3'], why: '1 mm = 10^-3 m, so cube it: 10^-3 x 10^-3 x 10^-3 = 10^-9. Then 68.5 x 10^-9 = 6.85 x 10^-8 m^3. Using 10^-3 once gives 10^-2, and squaring gives 10^-5.' },
  { lv: 2, t: 'mc', q: 'A trip is 405 miles. The car gets 24 mi/gal and gas costs $3.50/gal. What is the gas cost to the correct sig figs?', a: ['$59', '$59.06', '$1418', '$60'], why: '405 mi x (1 gal / 24 mi) x ($3.50 / 1 gal) = $59.0625. 24 mi/gal has only 2 sig figs, so $59, and $59.06 keeps too many. Flip the mpg factor so miles cancel. Leaving it out (405 x 3.50) gives the absurd $1418.' },
  { lv: 2, t: 'mc', q: 'You buy 2.50 bushels of apples. A bushel holds 125 apples and each apple costs 25.00 cents. What is the total in dollars, to the correct sig figs?', a: ['$78.1', '$781', '$7.81', '$78.13'], why: '2.50 bu x (125 apples / 1 bu) x (25.00 cents / 1 apple) x ($1 / 100 cents) = $78.125. The 2.50 limits the answer to 3 sig figs, so $78.1, and $78.13 keeps 4. The 7812.5 cents must be divided by 100: dividing by 10 gives $781 and dividing by 1000 gives $7.81.' },
  { lv: 2, t: 'mc', q: 'You drive at 65 mph and look away for 1.0 s. How many feet do you travel? (5280 ft = 1 mi). Use 2 sig figs.', a: ['95 ft', '3.4 x 10^5 ft', '5.7 x 10^3 ft', '65 ft'], why: '65 mi/hr x (5280 ft / 1 mi) x (1 hr / 60 min) x (1 min / 60 s) = 95.3 ft per second, so 95 ft. Skipping hours to seconds gives 3.4 x 10^5, and stopping at minutes gives 5.7 x 10^3.' },
  { lv: 2, t: 'type', q: 'What prefix name stands for 10^-9?', ans: 'nano', re: '^(nano|n)$', why: 'Nano (n) is 10^-9. Micro is 10^-6 and milli is 10^-3.' },
  { lv: 2, t: 'type', q: 'How many millimeters are in 1 meter? Give the plain number, with no power of ten.', ans: '1000', re: '^(1000|1,000)(mm|millimeters?|millimetres?)?$', why: 'Milli is 10^-3, so 1 mm = 10^-3 m, and 1 m = 1000 mm.' },
  { lv: 2, t: 'type', q: 'Convert 2.504 g to cg (centigrams). Give the plain number, with no power of ten.', ans: '250.4', re: '^250\\.4(cg|centigrams?)?$', why: 'Centi is 10^-2, so 1 cg = 10^-2 g, or 100 cg = 1 g. 2.504 g x 100 cg / 1 g = 250.4 cg.' },
  { lv: 2, t: 'mc', boss: true, q: 'Convert 1500. cm^2 to m^2.', a: ['0.1500 m^2', '15.00 m^2', '150.0 m^2', '0.001500 m^2'], why: 'Square the factor: 1500. x (1 / 100^2) = 1500. / 10,000 = 0.1500 m^2. 1500. has 4 sig figs, so keep 4.' },
  { lv: 2, t: 'mc', boss: true, q: 'A patient swallows 15.00 mL of a solution every 6.0 hours. Every 5.00 mL contains 2.5 mg of drug. How many mg does the patient take in 2.00 days?', a: ['6.0 x 10^1 mg', '3.0 x 10^1 mg', '1.2 x 10^2 mg', '7.5 mg'], why: 'Each dose is 15.00 mL x (2.5 mg / 5.00 mL) = 7.5 mg. In 2.00 days there are 2.00 x 24 / 6.0 = 8 doses, so 7.5 x 8 = 60 mg, or 6.0 x 10^1 mg with 2 sig figs. 7.5 mg is a single dose, and 3.0 x 10^1 covers only one day.' },

  { lv: 3, t: 'mc', q: 'A pure metal cube has a mass of 31.12 mg and a volume of 0.4837 cm^3. What is its density in g/mL?', a: ['0.06434 g/mL', '64.34 g/mL', '15.54 g/mL', '6.434 g/mL'], why: 'Convert 31.12 mg to 0.03112 g and use 1 cm^3 = 1 mL: 0.03112 g / 0.4837 mL = 0.06434 g/mL. Leaving the mass in mg gives 64.34. Dividing volume by mass gives 15.54.' },
  { lv: 3, t: 'mc', q: 'A copper block weighs 1896 g and measures 8.4 cm by 5.5 cm by 4.6 cm. What is its density in g/mL?', a: ['8.9 g/mL', '8.92 g/mL', '0.11 g/mL', '89 g/mL'], why: 'V = 8.4 x 5.5 x 4.6 = 212.5 cm^3 = 212.5 mL, and 1896 g / 212.5 mL = 8.92. The dimensions have 2 sig figs, so the answer is 8.9 g/mL. 0.11 comes from dividing volume by mass.' },
  { lv: 3, t: 'mc', q: 'A 45.2 g rock is lowered into a graduated cylinder. The water level rises from 25.0 mL to 31.4 mL. What is the rock\'s density?', a: ['7.1 g/mL', '1.8 g/mL', '1.4 g/mL', '0.14 g/mL'], why: 'The rock\'s volume is the rise in water level: 31.4 - 25.0 = 6.4 mL. Then 45.2 g / 6.4 mL = 7.1 g/mL. Using either reading alone as the volume gives 1.8 or 1.4, and flipping the ratio gives 0.14.' },
  { lv: 3, t: 'mc', q: 'A liquid has a density of 0.245 g/mL. What is the mass of 1.25 L of it?', a: ['306 g', '0.306 g', '5.10 g', '1.96 x 10^-4 g'], why: 'Convert liters to mL first: 1.25 L = 1250 mL. Then 1250 mL x 0.245 g/mL = 306 g. Skipping the conversion gives 0.306. Dividing volume by density gives 5.10, which is not a mass.' },
  { lv: 3, t: 'mc', q: 'You have 1.5 kg of a substance with a density of 15 g/mL. What volume does it occupy?', a: ['1.0 x 10^2 mL', '1.0 x 10^-1 mL', '2.3 x 10^4 mL', '1.0 x 10^5 mL'], why: 'Convert 1.5 kg to 1500 g, then V = m / rho = 1500 g / 15 g/mL = 100 mL, or 1.0 x 10^2 mL with 2 sig figs. Forgetting kg to g gives 1.0 x 10^-1, and multiplying mass by density gives 2.3 x 10^4.' },
  { lv: 3, t: 'mc', q: 'Ethanol has a density of 0.789 g/mL. What is the mass, in kg, of ethanol that exactly fills a 200.0 mL container?', a: ['0.158 kg', '0.1578 kg', '158 kg', '0.253 kg'], why: 'm = rho x V = 0.789 g/mL x 200.0 mL = 157.8 g = 0.1578 kg. The density 0.789 has only 3 sig figs, so the answer is 0.158 kg, as in the Handout 3 key. 158 kg leaves the number in grams, and 0.253 comes from dividing instead of multiplying.' },
  { lv: 3, t: 'mc', q: 'What is 25 °C in kelvin?', a: ['298 K', '248 K', '25 K', '273 K'], why: 'K = °C + 273.15 = 298.15. The 25 has no decimals, so the answer rounds to 298 K. Subtracting gives 248, and 273 is just 0 °C.' },
  { lv: 3, t: 'mc', q: 'Liquid nitrogen boils at 77 K. What is that in °C?', a: ['-196 °C', '196 °C', '350 °C', '-350 °C'], why: '°C = K - 273.15 = -196.15, which rounds to -196 °C. The sign matters: 77 K is far below the freezing point of water. Adding 273 gives 350, which is the wrong direction.' },
  { lv: 3, t: 'mc', q: 'Normal body temperature is 98.6 °F. What is that in °C?', a: ['37.0 °C', '54.8 °C', '66.6 °C', '1.20 x 10^2 °C'], why: '°C = (°F - 32) x 5/9 = 66.6 x 5/9 = 37.0. Skipping the subtraction of 32 gives 54.8, and forgetting the 5/9 stops at 66.6. Using 9/5 instead of 5/9 gives about 120.' },
  { lv: 3, t: 'mc', q: 'Which is the lowest temperature: -30 °C, 0 °F, 250 K or 260 K?', a: ['-30 °C', '0 °F', '250 K', '260 K'], why: 'Put them all in kelvin: -30 °C = 243 K, 0 °F = 255 K, 250 K, and 260 K. The lowest is 243 K, which is -30 °C. A 0 °F reading looks low, but it is warmer than -30 °C.' },
  { lv: 3, t: 'mc', q: 'An object has a density of 0.85 g/mL. Water is 1.00 g/mL. What happens when it is placed in water?', a: ['It floats, because 0.85 g/mL is less than 1.00 g/mL', 'It sinks, because 0.85 g/mL is less than 1.00 g/mL', 'It floats, because 0.85 g/mL is greater than 1.00 g/mL', 'Cannot tell without its mass'], why: 'Density is an intensive property, so the mass is not needed. An object less dense than the liquid floats, and a denser one sinks.' },
  { lv: 3, t: 'type', q: 'A sample has a mass of 50.0 g and a volume of 25.0 mL. What is its density in g/mL?', ans: '2.00', re: '^2\\.00(g/ml|g/cm\\^?3|g/cc)?$', why: 'rho = m / V = 50.0 g / 25.0 mL = 2.00 g/mL. Both values have 3 sig figs, so keep 3.' },
  { lv: 3, t: 'type', q: 'What is -40 °C in kelvin? Give the number.', ans: '233', re: '^233(k|kelvins?)?$', why: 'K = °C + 273.15 = -40 + 273.15 = 233.15. The -40 has no decimals, so 233 K.' },
  { lv: 3, t: 'type', q: 'What is the name of the SI base unit of temperature?', ans: 'kelvin', re: '^(kelvin|kelvins|k)$', why: 'The SI base unit of temperature is the kelvin (K). Degrees Celsius and Fahrenheit are not SI base units.' },
  { lv: 3, t: 'mc', boss: true, q: 'Benzene has a density of 0.8765 g/mL. What volume, in liters, must you pour to get 125 g?', a: ['0.143 L', '143 L', '0.110 L', '1.43 L'], why: 'V = m / rho = 125 g / 0.8765 g/mL = 142.6 mL = 0.143 L. 125 has 3 sig figs. Multiplying mass by density gives 110 mL, which is the wrong operation.' },
  { lv: 3, t: 'mc', boss: true, q: 'The density of mercury is 13.6 g/mL. What is it in kg/L?', a: ['13.6 kg/L', '1.36 x 10^4 kg/L', '1.36 x 10^-2 kg/L', '1.36 x 10^-5 kg/L'], why: 'Multiply by 1 kg / 1000 g and by 1000 mL / 1 L. The two factors of 1000 cancel, so the number does not change: 13.6 g/mL = 13.6 kg/L.' },
  { lv: 3, t: 'mc', boss: true, q: 'A block of aluminum is cut into two equal halves. What happens to the density of each half?', a: ['It is unchanged', 'It is cut in half', 'It doubles', 'It depends on the shape of the half'], why: 'Density is intensive: it does not depend on how much of the substance there is. Mass and volume are both halved, so their ratio stays the same.' },

  { lv: 4, t: 'mc', q: 'Which term describes matter with a constant composition, where every sample has the same makeup and properties?', a: ['Pure substance', 'Heterogeneous mixture', 'Homogeneous mixture', 'Solution'], why: 'A pure substance has a constant composition. Every sample of sucrose is the same by mass: 42.1% C, 6.5% H, 51.4% O. A homogeneous mixture (a solution) is uniform but its composition can vary from sample to sample.' },
  { lv: 4, t: 'mc', q: 'A mixture whose composition varies from point to point is called', a: ['A heterogeneous mixture', 'A homogeneous mixture', 'A compound', 'An element'], why: 'Heterogeneous means the composition is not uniform: sand in water, a chocolate chip cookie. Homogeneous mixtures are uniform throughout.' },
  { lv: 4, t: 'mc', q: 'Which of these is a homogeneous mixture?', a: ['Filtered air', 'Sand in water', 'Oil and vinegar dressing', 'A chocolate chip cookie'], why: 'Filtered air is uniform throughout, a solution of gases. The others have visibly different regions.' },
  { lv: 4, t: 'mc', q: 'A clear sample of salt dissolved in water looks the same throughout. How is it classified?', a: ['A homogeneous mixture', 'A heterogeneous mixture', 'A compound', 'An element'], why: 'The salt and the water are physically mixed and can be separated again by evaporation. It is uniform, so it is a homogeneous mixture. A compound has fixed composition and needs a chemical change to be split.' },
  { lv: 4, t: 'mc', q: 'A substance that cannot be broken into simpler substances by chemical change is', a: ['An element', 'A compound', 'A homogeneous mixture', 'A solution'], why: 'An element cannot be decomposed chemically. A compound such as water can: it splits into hydrogen and oxygen.' },
  { lv: 4, t: 'mc', q: 'Pure water splits into hydrogen gas and oxygen gas only when electricity is passed through it. What does this show about water?', a: ['It is a compound', 'It is an element', 'It is a homogeneous mixture', 'It is a heterogeneous mixture'], why: 'Breaking a substance into simpler substances by a chemical change means it is a compound. An element cannot be broken down, and a mixture would separate by physical means.' },
  { lv: 4, t: 'mc', q: 'Which property is true of a gas but not of a liquid?', a: ['It expands to fill its container and is easily compressed', 'It takes the shape of its container', 'It has a definite volume', 'Its particles touch each other'], why: 'Filling the whole container and being easily compressed are gas-only properties. Taking the shape of the container is true of both gases and liquids, so it cannot separate them. A liquid has a definite volume.' },
  { lv: 4, t: 'mc', q: 'Which of these is a chemical property?', a: ['Flammability', 'Density', 'Melting point', 'Hardness'], why: 'Flammability is the ability to change into other substances, so it is chemical. Density, melting point and hardness can all be measured without changing the substance.' },
  { lv: 4, t: 'mc', q: 'Which change is physical rather than chemical?', a: ['Water boiling to steam', 'Wood burning', 'Milk souring', 'Iron rusting'], why: 'Boiling changes only the state. The substance is still H2O. Burning, souring and rusting all make new substances.' },
  { lv: 4, t: 'mc', q: 'Which is a chemical change?', a: ['Iron rusting', 'Ice melting', 'Water boiling', 'Sugar crystals being ground to a powder'], why: 'Rust is iron oxide, a new substance, so rusting is a chemical change. Melting, boiling and grinding change only form or state.' },
  { lv: 4, t: 'mc', q: 'An intensive property is one that', a: ['Does not depend on the amount of substance', 'Depends on the amount of substance', 'Can only be a chemical property', 'Is always measured in grams'], why: 'Intensive properties such as density, color and melting point stay the same no matter how much you have. Mass and volume are extensive.' },
  { lv: 4, t: 'type', q: 'Is density an intensive or an extensive property?', ans: 'intensive', re: '^intensive$', why: 'Density is a ratio of mass to volume. Doubling the sample doubles both, so density does not change. That makes it intensive.' },
  { lv: 4, t: 'type', q: 'Are mass and volume intensive or extensive properties?', ans: 'extensive', re: '^extensive$', why: 'Both scale with how much substance there is, so both are extensive.' },
  { lv: 4, t: 'type', q: 'Which state of matter has a definite volume but takes the shape of its container?', ans: 'liquid', re: '^(liquid|aliquid)$', why: 'A liquid keeps its volume but flows to fit the container. A solid keeps both shape and volume, and a gas has neither.' },
  { lv: 4, t: 'mc', boss: true, q: 'N2 gas is best classified as', a: ['A pure substance that is an element', 'A pure substance that is a compound', 'A homogeneous mixture', 'A heterogeneous mixture'], why: 'N2 contains only nitrogen atoms, so it is an element, even though each particle is a molecule of two atoms. A compound needs two or more different elements.' },
  { lv: 4, t: 'mc', boss: true, q: 'Which pair are both extensive properties?', a: ['Mass and volume', 'Density and color', 'Volume and density', 'Melting point and mass'], why: 'Mass and volume both depend on the amount of substance. Density, color and melting point do not.' },
  { lv: 4, t: 'mc', boss: true, q: 'Which statement about a solid is correct?', a: ['Its particles are in fixed positions, so it has a definite shape and volume', 'It takes the shape of its container', 'It expands to fill its container', 'Its particles move freely past one another'], why: 'In a solid the particles are held in fixed positions, giving a definite shape and volume. Taking the container\'s shape describes a liquid or a gas, and free movement describes a liquid or a gas too.' },

  { lv: 5, t: 'mc', q: 'Which subatomic particle is negatively charged and has by far the smallest mass?', a: ['Electron', 'Proton', 'Neutron', 'Nucleus'], why: 'The electron has a 1- charge and about 1/1836 the mass of a proton. Protons are 1+, neutrons are neutral, and the nucleus is not one particle but the protons and neutrons together.' },
  { lv: 5, t: 'mc', q: 'The atomic number of an element equals the number of', a: ['Protons', 'Neutrons', 'Protons plus neutrons', 'Electrons in any ion of it'], why: 'The atomic number Z is the proton count and defines the element. Protons plus neutrons is the mass number.' },
  { lv: 5, t: 'mc', q: 'The mass number of an atom equals', a: ['Protons plus neutrons', 'Protons only', 'Protons plus electrons', 'The average atomic mass'], why: 'Mass number A is protons plus neutrons. It is always a whole number. The average atomic mass is a weighted average and is usually not.' },
  { lv: 5, t: 'mc', q: 'How many neutrons are in an atom of silicon-30? (Si has Z = 14)', a: ['16', '14', '30', '44'], why: 'Neutrons = A - Z = 30 - 14 = 16. The 30 is protons plus neutrons together.' },
  { lv: 5, t: 'mc', q: 'A neutral atom has 26 protons. What is it, and how many electrons does it have?', a: ['Iron, 26 electrons', 'Krypton, 26 electrons', 'Iron, 30 electrons', 'Copper, 26 electrons'], why: 'Z = 26 is iron (Fe), and a neutral atom has as many electrons as protons. Krypton is Z = 36 and copper is Z = 29.' },
  { lv: 5, t: 'mc', q: 'Copper-65 exists as a 2+ cation (Cu has Z = 29). How many protons, neutrons and electrons does it have?', a: ['29 p, 36 n, 27 e', '29 p, 36 n, 29 e', '29 p, 34 n, 27 e', '27 p, 38 n, 27 e'], why: 'Protons = 29. Neutrons = 65 - 29 = 36. A 2+ ion has lost 2 electrons, so 29 - 2 = 27. Charge changes the electrons only, never the protons or neutrons.' },
  { lv: 5, t: 'mc', q: 'Nitrogen-15 exists as a 3- anion (N has Z = 7). How many electrons does it have?', a: ['10', '7', '8', '4'], why: 'A 3- charge means 3 extra electrons: 7 + 3 = 10. The 8 is the neutron count (15 - 7).' },
  { lv: 5, t: 'mc', q: 'An ion has 37 protons, 48 neutrons and 36 electrons. Which description matches?', a: ['Rb, mass number 85, charge 1+', 'Rb, mass number 85, charge 1-', 'Rb, mass number 48, charge 1+', 'Kr, mass number 85, charge 1+'], why: 'Z = 37 is rubidium. A = 37 + 48 = 85. The charge is protons minus electrons: 37 - 36 = 1+. The element is set by the protons, not the electrons, so it is not krypton.' },
  { lv: 5, t: 'mc', q: 'How many electrons does a Ca^2+ ion have? (Ca has Z = 20)', a: ['18', '20', '22', '2'], why: 'A 2+ charge means 2 electrons were lost: 20 - 2 = 18. Adding 2 would be for a 2- ion.' },
  { lv: 5, t: 'mc', q: 'How many protons and electrons does an Fe^3+ ion have? (Fe has Z = 26)', a: ['26 p, 23 e', '26 p, 29 e', '23 p, 23 e', '29 p, 26 e'], why: 'Protons stay at 26. A 3+ ion has lost 3 electrons: 26 - 3 = 23. Gaining electrons would make it an anion.' },
  { lv: 5, t: 'mc', q: 'The ion S-33 with a 2- charge has how many neutrons? (S has Z = 16)', a: ['17', '16', '18', '33'], why: 'Neutrons = A - Z = 33 - 16 = 17. The charge only changes the electrons (18 here), not the neutron count.' },
  { lv: 5, t: 'mc', q: 'Where is nearly all the mass of an atom found?', a: ['In the nucleus', 'In the electron cloud', 'Spread evenly through the atom', 'In the outermost shell'], why: 'Protons and neutrons are in the tiny nucleus and are about 1836 times heavier than an electron each, so the nucleus holds almost all of the mass.' },
  { lv: 5, t: 'type', q: 'How many neutrons are in Br-81? (Br has Z = 35)', ans: '46', re: '^(46|fortysix)(neutrons?)?$', why: 'Neutrons = 81 - 35 = 46. Br-79 has 44 neutrons, and both are bromine.' },
  { lv: 5, t: 'type', q: 'How many electrons does an Al^3+ ion have? (Al has Z = 13)', ans: '10', re: '^(10|ten)(electrons?|e)?$', why: 'Al has 13 electrons when neutral. Losing 3 gives 13 - 3 = 10.' },
  { lv: 5, t: 'type', q: 'How many protons does an S^2- ion have? (S has Z = 16)', ans: '16', re: '^(16|sixteen)(protons?|p\\+?)?$', why: 'Protons never change when an ion forms. Sulfur always has 16. The 2- charge means it has 18 electrons.' },
  { lv: 5, t: 'mc', boss: true, q: 'A cation is formed when an atom', a: ['Loses electrons', 'Gains electrons', 'Gains protons', 'Loses neutrons'], why: 'Losing electrons leaves more protons than electrons, a net positive charge. Gaining electrons makes an anion. Protons and neutrons stay put in chemical changes.' },
  { lv: 5, t: 'mc', boss: true, q: 'An ion has 12 protons and 10 electrons. What is its charge?', a: ['2+', '2-', '10+', '12+'], why: 'Charge = protons - electrons = 12 - 10 = 2+. The element is magnesium, which forms Mg^2+.' },

  { lv: 6, t: 'mc', q: 'Two atoms are isotopes of the same element. They must differ in', a: ['Number of neutrons', 'Number of protons', 'Number of electrons in the neutral atom', 'Atomic number'], why: 'Isotopes share the proton count, which defines the element, but have different neutron counts and so different mass numbers.' },
  { lv: 6, t: 'mc', q: 'How many neutrons are in Br-79? (Br has Z = 35)', a: ['44', '35', '46', '79'], why: 'Neutrons = 79 - 35 = 44. Br-81 has 46. Both have 35 protons.' },
  { lv: 6, t: 'mc', q: 'Chlorine has two isotopes: Cl-35 (34.969 amu, 75.770%) and Cl-37 (36.966 amu, 24.230%). What is the average atomic mass?', a: ['35.453 amu', '35.968 amu', '36.966 amu', '34.969 amu'], why: '(0.75770 x 34.969) + (0.24230 x 36.966) = 26.496 + 8.957 = 35.453 amu. The plain average of the two masses, 35.968, ignores that Cl-35 is three times as common.' },
  { lv: 6, t: 'mc', q: 'Magnesium has Mg-24 (23.985 amu, 78.99%), Mg-25 (24.986 amu, 10.00%) and Mg-26 (25.983 amu, 11.01%). What is its average atomic mass?', a: ['24.31 amu', '24.98 amu', '25.00 amu', '23.99 amu'], why: '(0.7899 x 23.985) + (0.1000 x 24.986) + (0.1101 x 25.983) = 18.946 + 2.499 + 2.861 = 24.31 amu. The plain average of the three masses is 24.98, which ignores abundance.' },
  { lv: 6, t: 'mc', q: 'Gallium has Ga-69 (68.926 amu, 60.11%) and Ga-71 (70.925 amu, 39.89%). What is its average atomic mass?', a: ['69.72 amu', '69.93 amu', '70.93 amu', '68.93 amu'], why: '(0.6011 x 68.926) + (0.3989 x 70.925) = 41.43 + 28.29 = 69.72 amu. Since Ga-69 is more abundant, the average sits closer to 69 than to the midpoint, 69.93.' },
  { lv: 6, t: 'mc', q: 'Boron has two isotopes. B-10 has an exact mass of 10.0129 amu and an abundance of 19.80%. The average atomic mass of boron is 10.811 amu. What is the exact mass of B-11? Round to four decimals.', a: ['11.0080 amu', '14.0437 amu', '8.8284 amu', '10.4120 amu'], why: 'B-11 is 100 - 19.80 = 80.20% = 0.8020. 10.811 = (0.1980 x 10.0129) + (0.8020 x m). So m = (10.811 - 1.9826) / 0.8020 = 11.0080 amu, the answer on the class slide (the accepted value is 11.0093 amu). 14.0437 swaps the two abundances, and 8.8284 forgets to divide by 0.8020.' },
  { lv: 6, t: 'mc', q: 'An element has an average atomic mass of 10.81 amu, and its two isotopes have masses 10.0129 amu and 11.0093 amu. Which isotope is more abundant?', a: ['The 11.0093 amu isotope', 'The 10.0129 amu isotope', 'They are equally abundant', 'It cannot be determined'], why: 'The weighted average sits closer to the more abundant isotope. 10.81 is much nearer to 11.0093, so the heavier isotope dominates.' },
  { lv: 6, t: 'mc', q: 'The average atomic mass of copper is 63.546 amu, and its two isotopes are Cu-63 and Cu-65. Which isotope is more abundant?', a: ['Cu-63', 'Cu-65', 'They are about equal', 'Cannot be determined'], why: '63.546 is much closer to 63 than to 65, so Cu-63 carries more of the weight. If they were equal the average would be near 64.' },
  { lv: 6, t: 'mc', q: 'Why is the average atomic mass of an element almost never a whole number, while a mass number always is?', a: ['It is a weighted average over isotopes with different masses', 'Instruments cannot measure whole numbers', 'Electrons add fractional mass to the atom', 'The abundances are always rounded'], why: 'A mass number counts nucleons, so it is a whole number. The average atomic mass blends several isotope masses by abundance and lands between them.' },
  { lv: 6, t: 'mc', q: 'Which equation on the exam formula sheet gives the average atomic mass?', a: ['Sum of (isotope abundance x isotope mass)', 'Sum of isotope masses divided by the number of isotopes', 'Mass divided by moles', 'Protons plus neutrons'], why: 'The formula sheet gives average atomic mass = sum of (isotope abundance x isotope mass). It is a weighted average, so each percent must be turned into a decimal first. A plain average treats every isotope as equally common.' },
  { lv: 6, t: 'mc', q: 'Atoms of Cl-35 and Cl-37 (both neutral) have the same number of', a: ['Protons and electrons', 'Neutrons and protons', 'Neutrons and electrons', 'Nucleons'], why: 'Both are chlorine, so both have 17 protons and 17 electrons. They differ in neutrons (18 and 20), and so in mass number.' },
  { lv: 6, t: 'type', q: 'How many neutrons are in B-10? (B has Z = 5)', ans: '5', re: '^(5|five)(neutrons?)?$', why: 'Neutrons = 10 - 5 = 5. B-11 has 6.' },
  { lv: 6, t: 'type', q: 'Isotopes of the same element have the same number of which particle?', ans: 'protons', re: '^(protons?|p\\+?)$', why: 'The proton count (the atomic number) defines the element, so isotopes always share it and differ in neutrons. Electrons match only when both atoms are neutral, because an ion has gained or lost some.' },
  { lv: 6, t: 'type', q: 'In the average atomic mass equation, each isotope mass is multiplied by its ____ written as a decimal.', ans: 'abundance', re: '^(abundance|percentabundance|fractionalabundance|relativeabundance|naturalabundance)$', why: 'Average atomic mass = sum of (isotope abundance x isotope mass). The abundance is the percent of atoms of that isotope, divided by 100.' },
  { lv: 6, t: 'mc', boss: true, q: 'An element has 60.0% of an isotope with mass 10.0 amu and 40.0% of an isotope with mass 20.0 amu. What is its average atomic mass?', a: ['14.0 amu', '15.0 amu', '12.0 amu', '16.0 amu'], why: '(0.600 x 10.0) + (0.400 x 20.0) = 6.00 + 8.00 = 14.0 amu. The plain midpoint, 15.0, ignores that the lighter isotope is more abundant.' },
  { lv: 6, t: 'mc', boss: true, q: 'Neon has Ne-20 (19.992 amu, 90.48%), Ne-21 (20.994 amu, 0.27%) and Ne-22 (21.991 amu, 9.25%). What is its average atomic mass?', a: ['20.18 amu', '20.99 amu', '21.00 amu', '19.99 amu'], why: '(0.9048 x 19.992) + (0.0027 x 20.994) + (0.0925 x 21.991) = 18.089 + 0.057 + 2.034 = 20.18 amu. The plain average, 20.99, is far too high because Ne-20 is 90% of the atoms.' },

  { lv: 7, t: 'mc', q: 'Which formula represents a compound?', a: ['CO2', 'O2', 'Na', 'He'], why: 'A compound has two or more different elements chemically combined. CO2 has C and O. O2 is a molecule of an element, and Na and He are elements.' },
  { lv: 7, t: 'mc', q: 'Which is a molecule of an element?', a: ['N2', 'NaCl', 'H2O', 'CO'], why: 'N2 is two atoms of the same element bonded together. NaCl, H2O and CO each contain two different elements, so they are compounds.' },
  { lv: 7, t: 'mc', q: 'Which of these is made of ions rather than molecules?', a: ['NaCl', 'CO2', 'H2O', 'CH4'], why: 'NaCl is ionic, a lattice of Na^+ and Cl^- ions, so its particle is called a formula unit. CO2, H2O and CH4 are molecular compounds.' },
  { lv: 7, t: 'mc', q: 'Which species is a polyatomic ion?', a: ['NH4^+', 'Na^+', 'Cl^-', 'Mg^2+'], why: 'A polyatomic ion is a group of bonded atoms with a net charge. NH4^+ is ammonium. Na^+, Cl^- and Mg^2+ are single atoms with a charge, so they are monatomic ions.' },
  { lv: 7, t: 'mc', q: 'Which of these is a monatomic ion?', a: ['Cl^-', 'NO3^-', 'OH^-', 'SO4^2-'], why: 'A monatomic ion is one atom with a charge. Nitrate, hydroxide and sulfate each contain several atoms.' },
  { lv: 7, t: 'mc', q: 'Which pair of elements are in the same group of the periodic table?', a: ['Na and K', 'Na and Mg', 'Na and Cl', 'C and N'], why: 'A group is a vertical column. Na and K are both in group 1A. Na, Mg and Cl share a row (period 3), and C and N share a period.' },
  { lv: 7, t: 'mc', q: 'Which of these elements is a metalloid?', a: ['Si', 'Al', 'P', 'Ca'], why: 'Silicon sits on the staircase between metals and nonmetals and has properties of both. Al and Ca are metals, and P is a nonmetal.' },
  { lv: 7, t: 'mc', q: 'Which of these elements is a noble gas?', a: ['Ar', 'Cl', 'Ca', 'N'], why: 'Argon is in group 8A. Cl is a halogen, Ca an alkaline earth metal, and N a nonmetal in group 5A.' },
  { lv: 7, t: 'mc', q: 'Which element is in period 3 (the third row)?', a: ['Si', 'C', 'Ge', 'Kr'], why: 'Silicon has Z = 14, which falls in the third row. C is in period 2, and Ge and Kr are in period 4.' },
  { lv: 7, t: 'mc', q: 'Which is NOT a point of Dalton\'s atomic theory as given in lecture?', a: ['Atoms of an element may have different numbers of neutrons', 'Each element is made of small particles called atoms', 'Compounds form from a whole-number ratio of atoms', 'In a chemical reaction, atoms rearrange but do not change'], why: 'Dalton\'s points are the other three. Isotopes, atoms of one element with different neutron counts, were discovered later and revised his theory.' },
  { lv: 7, t: 'mc', q: 'What is the chemical symbol for potassium?', a: ['K', 'P', 'Po', 'Kr'], why: 'K, from the Latin kalium. P is phosphorus and Kr is krypton.' },
  { lv: 7, t: 'type', q: 'What is the chemical symbol for zinc?', ans: 'Zn', re: '^zn$', why: 'Zn. Zinc is element 30.' },
  { lv: 7, t: 'type', q: 'What is the chemical symbol for sodium?', ans: 'Na', re: '^na$', why: 'Na, from the Latin natrium. S is sulfur and N is nitrogen.' },
  { lv: 7, t: 'type', q: 'What is the name of the family of elements in group 8A (He, Ne, Ar, Kr)?', ans: 'noble gases', re: '^noblegas(es)?$', why: 'Group 8A is the noble gases. They are very unreactive because their valence shells are full.' },
  { lv: 7, t: 'mc', boss: true, q: 'A compound has a defined ratio of elements, which gives it its identity. Which law is this, and who is credited?', a: ['Law of Definite Proportions, Proust', 'Law of Multiple Proportions, Dalton', 'Law of Conservation of Mass, Lavoisier', 'Atomic Theory, Dalton'], why: 'The Law of Definite Proportions (Proust) says a compound always has the same ratio of elements. The Law of Multiple Proportions concerns elements that form more than one compound.' },
  { lv: 7, t: 'mc', boss: true, q: 'The exam requires the first 36 elements. Which element is number 36?', a: ['Krypton (Kr)', 'Argon (Ar)', 'Bromine (Br)', 'Zinc (Zn)'], why: 'Krypton has Z = 36, the last element on the list. Bromine is 35, zinc is 30 and argon is 18.' },

  { lv: 8, t: 'mc', q: 'What is Avogadro\'s number, and what does it count?', a: ['6.022 x 10^23 particles per mole', '6.022 x 10^23 grams per mole', '6.022 x 10^-23 particles per mole', '6.022 x 10^23 amu per particle'], why: 'The formula sheet gives NA = 6.0221415 x 10^23 particles / mol, usually rounded to 6.022 x 10^23. It counts particles of any kind: atoms, molecules, formula units, even pens. It is not a mass.' },
  { lv: 8, t: 'mc', q: 'How many pens are in 2.5 moles of pens?', a: ['1.5 x 10^24', '1.5 x 10^25', '4.2 x 10^-24', '6.0 x 10^23'], why: '2.5 mol x (6.022 x 10^23 pens / 1 mol) = 1.5 x 10^24 pens. The mole is a counting unit and works on pens as well as atoms. 2.5 has 2 sig figs.' },
  { lv: 8, t: 'mc', q: 'What is the mass, in kg, of 3.54 x 10^26 atoms of iron? (Fe = 55.845 g/mol)', a: ['32.8 kg', '32,800 kg', '0.0328 kg', '16.4 kg'], why: '3.54 x 10^26 atoms x (1 mol / 6.022 x 10^23) x (55.845 g / 1 mol) x (1 kg / 1000 g) = 32.8 kg. The path is particles to moles to grams to kg. Forgetting the last conversion leaves 32,800 g.' },
  { lv: 8, t: 'mc', q: 'What is the molar mass of P2O5? (P = 30.974, O = 15.999 g/mol)', a: ['141.94 g/mol', '46.97 g/mol', '93.95 g/mol', '110.97 g/mol'], why: '2(30.974) + 5(15.999) = 61.948 + 79.995 = 141.943, or 141.94 g/mol. Multiply each atomic mass by its subscript before adding.' },
  { lv: 8, t: 'mc', q: 'What is the molar mass of Fe(NO3)3? (Fe = 55.845, N = 14.007, O = 15.999 g/mol)', a: ['241.86 g/mol', '145.86 g/mol', '117.85 g/mol', '725.58 g/mol'], why: 'The 3 outside the parentheses multiplies everything inside: 1 Fe, 3 N and 9 O. 55.845 + 3(14.007) + 9(15.999) = 55.845 + 42.021 + 143.991 = 241.857, or 241.86 g/mol. Using only 3 oxygens gives 145.86.' },
  { lv: 8, t: 'mc', q: 'What is the mass of 0.0231 moles of carbon atoms? (C = 12.011 g/mol)', a: ['0.277 g', '2.77 g', '0.0277 g', '12.011 g'], why: '0.0231 mol x (12.011 g / 1 mol) = 0.27745 g, which rounds to 0.277 g (3 sig figs). The answer must be less than 12.011 g, the mass of a whole mole.' },
  { lv: 8, t: 'mc', q: 'How many carbon atoms are in 5.00 g of carbon? (C = 12.011 g/mol)', a: ['2.51 x 10^23', '3.01 x 10^24', '3.62 x 10^25', '8.30 x 10^-24'], why: '5.00 g x (1 mol / 12.011 g) x (6.022 x 10^23 atoms / 1 mol) = 2.51 x 10^23 atoms. Always go through moles. Multiplying by 12.011 instead of dividing gives 3.62 x 10^25.' },
  { lv: 8, t: 'mc', q: 'How many water molecules are in 125. mg of H2O? (H = 1.0079, O = 15.999 g/mol)', a: ['4.18 x 10^21', '4.18 x 10^24', '7.53 x 10^22', '1.36 x 10^24'], why: 'The molar mass is 2(1.0079) + 15.999 = 18.015 g/mol. 125. mg = 0.125 g, so 0.125 g x (1 mol / 18.015 g) x (6.022 x 10^23 / 1 mol) = 4.18 x 10^21. Leaving mg unconverted gives 10^24.' },
  { lv: 8, t: 'mc', q: 'How many atoms of sodium are in a 20.3 ng sample? (Na = 22.990 g/mol)', a: ['5.32 x 10^14', '5.32 x 10^23', '5.32 x 10^17', '1.22 x 10^16'], why: '20.3 ng x (1 g / 10^9 ng) x (1 mol / 22.990 g) x (6.022 x 10^23 / 1 mol) = 5.32 x 10^14 atoms. Nano is 10^-9, so 1 g = 10^9 ng.' },
  { lv: 8, t: 'mc', q: 'What is the mass, in grams, of 4.758 x 10^18 atoms of silicon? (Si = 28.085 g/mol)', a: ['2.219 x 10^-4 g', '2.813 x 10^-7 g', '1.336 x 10^20 g', '7.901 x 10^-6 g'], why: '4.758 x 10^18 atoms x (1 mol / 6.022 x 10^23) x (28.085 g / 1 mol) = 2.219 x 10^-4 g. 7.901 x 10^-6 is the mole count, not grams. Dividing by the molar mass instead gives 2.813 x 10^-7.' },
  { lv: 8, t: 'mc', q: 'How many moles of Fe(NO3)3 are in 3.4 g of it? (molar mass 241.86 g/mol)', a: ['0.014 mol', '0.14 mol', '8.2 x 10^2 mol', '0.0014 mol'], why: '3.4 g x (1 mol / 241.86 g) = 0.014 mol (2 sig figs). Multiplying by the molar mass gives 8.2 x 10^2, which is wrong because grams must cancel.' },
  { lv: 8, t: 'type', q: 'What is the molar mass of NaCl in g/mol? (Na = 22.990, Cl = 35.453)', ans: '58.44', re: '^58\\.44(3)?(g/mol|g/mole)?$', why: '22.990 + 35.453 = 58.443, or 58.44 g/mol.' },
  { lv: 8, t: 'type', q: 'How many oxygen atoms are in one formula unit of Al2(SO4)3?', ans: '12', re: '^(12|twelve)(oxygenatoms?|oatoms?|atoms?)?$', why: 'Each sulfate has 4 O, and the 3 outside the parentheses gives 3 sulfates: 3 x 4 = 12 O atoms.' },
  { lv: 8, t: 'type', q: 'Write Avogadro\'s number as shown on the formula sheet, to four sig figs (use x for times).', ans: '6.022 x 10^23', re: '^6\\.022x10\\^23(particles/mol|particles/mole|/mol)?$', why: 'The formula sheet shows NA = 6.0221415 x 10^23 particles / mol. Rounded to 4 sig figs, that is 6.022 x 10^23.' },
  { lv: 8, t: 'mc', boss: true, q: 'How many total atoms are in one formula unit of Fe(NO3)3?', a: ['13', '7', '5', '3'], why: 'Fe has 1, N has 3 (one per nitrate, three nitrates), and O has 9 (3 per nitrate). 1 + 3 + 9 = 13. Counting only 3 elements, or leaving out the outside subscript, undercounts.' },
  { lv: 8, t: 'mc', boss: true, q: 'How many oxygen atoms are in 2.00 mol of CO2?', a: ['2.41 x 10^24', '1.20 x 10^24', '4.82 x 10^24', '4.00'], why: 'Each CO2 has 2 O, so 2.00 mol CO2 has 4.00 mol O atoms. 4.00 mol x 6.022 x 10^23 = 2.41 x 10^24. 1.20 x 10^24 counts only the CO2 molecules, and 4.00 is moles, not atoms.' },
  { lv: 8, t: 'mc', boss: true, q: 'Which sample has more atoms: 10.0 g of carbon (12.011 g/mol) or 10.0 g of iron (55.845 g/mol)?', a: ['10.0 g of carbon', '10.0 g of iron', 'They have the same number', 'It depends on the temperature'], why: 'Atoms follow moles, not grams. 10.0 g C is 0.833 mol, while 10.0 g Fe is 0.179 mol. Lighter atoms means more of them in the same mass.' },

  { lv: 9, t: 'mc', q: 'Which list puts the seven regions of the electromagnetic spectrum in order from LOWEST to HIGHEST energy?', a: ['radio, microwave, infrared, visible, ultraviolet, X-ray, gamma', 'gamma, X-ray, ultraviolet, visible, infrared, microwave, radio', 'radio, infrared, microwave, visible, X-ray, ultraviolet, gamma', 'microwave, radio, infrared, visible, ultraviolet, gamma, X-ray'], why: 'Dr. Meyers\' order is radio, microwave, infrared, visible, ultraviolet, X-ray, gamma. The reversed list runs high to low. The other two each swap two pairs of neighbors: one puts infrared below microwave and X-ray below ultraviolet, and the other puts microwave below radio and gamma below X-ray.' },
  { lv: 9, t: 'mc', q: 'Which type of radiation has the highest frequency?', a: ['Gamma rays', 'X-rays', 'Ultraviolet light', 'Microwaves'], why: 'Gamma rays top the spectrum, so they have the shortest wavelength and the highest frequency and energy. X-rays are next, but they are still below gamma.' },
  { lv: 9, t: 'mc', q: 'If the wavelength of light increases, what happens to its frequency and its energy per photon?', a: ['Both decrease', 'Frequency decreases and energy increases', 'Both increase', 'Both stay the same because light always moves at c'], why: 'c = λν, so wavelength and frequency are inversely related, and E = hν makes energy follow frequency. A longer wavelength means lower frequency and lower energy. Constant speed does not keep frequency fixed: c stays the same because λ and ν trade off.' },
  { lv: 9, t: 'mc', q: 'What does the amplitude of a light wave control?', a: ['Its brightness (intensity)', 'Its color', 'Its speed in a vacuum', 'Its wavelength'], why: 'Amplitude is the wave height and sets brightness. Wavelength sets the color. Speed in a vacuum is c for every type of EM radiation.' },
  { lv: 9, t: 'mc', q: 'What is the frequency of green light with a wavelength of 550. nm? Use c = 3.00 x 10^8 m/s.', a: ['5.45 x 10^14 Hz', '5.45 x 10^5 Hz', '1.65 x 10^2 Hz', '1.83 x 10^-15 Hz'], why: 'Convert first: 550. nm = 5.50 x 10^-7 m. Then ν = c/λ = (3.00 x 10^8)/(5.50 x 10^-7) = 5.45 x 10^14 Hz. Skipping the nm conversion gives 5.45 x 10^5. Multiplying c by λ gives 1.65 x 10^2. Dividing λ by c inverts the equation.' },
  { lv: 9, t: 'mc', q: 'What is the energy of one photon of 400. nm light? Use h = 6.626 x 10^-34 J s and c = 3.00 x 10^8 m/s.', a: ['4.97 x 10^-19 J', '4.97 x 10^-28 J', '2.65 x 10^-31 J', '7.95 x 10^-32 J'], why: 'E = hc/λ with λ = 4.00 x 10^-7 m: (6.626 x 10^-34)(3.00 x 10^8)/(4.00 x 10^-7) = 4.97 x 10^-19 J. Leaving λ in nm gives 4.97 x 10^-28. Multiplying h by 400 treats the wavelength as a frequency. Multiplying hc by λ instead of dividing gives 7.95 x 10^-32.' },
  { lv: 9, t: 'mc', q: 'What is the energy of one photon with a frequency of 6.00 x 10^14 Hz? Use h = 6.626 x 10^-34 J s.', a: ['3.98 x 10^-19 J', '1.10 x 10^-48 J', '9.06 x 10^47 J', '1.99 x 10^-25 J'], why: 'Given frequency, use E = hν = (6.626 x 10^-34)(6.00 x 10^14) = 3.98 x 10^-19 J. Dividing h by ν, or ν by h, inverts the equation. The 1.99 x 10^-25 figure is hc, which belongs to the wavelength form E = hc/λ.' },
  { lv: 9, t: 'mc', q: 'An FM radio station broadcasts at 100. MHz. What is the wavelength of its signal? Use c = 3.00 x 10^8 m/s.', a: ['3.00 m', '3.00 x 10^6 m', '0.333 m', '3.33 x 10^-7 m'], why: '100. MHz = 1.00 x 10^8 Hz, so λ = c/ν = (3.00 x 10^8)/(1.00 x 10^8) = 3.00 m. Using 100 without converting MHz gives 3.00 x 10^6. Dividing ν by c gives 0.333, which has the wrong units.' },
  { lv: 9, t: 'mc', q: 'A blue photon (450 nm) and a red photon (650 nm) are compared. Which statement is correct?', a: ['The blue photon has more energy, about 1.4 times as much', 'The red photon has more energy because its wavelength is longer', 'They have equal energy because both travel at c', 'The red photon has more energy because it has the lower frequency'], why: 'E = hc/λ, so a shorter wavelength means more energy. The ratio is 650/450 = 1.44. Speed being equal does not make energy equal, since energy depends on frequency. A lower frequency means less energy, not more.' },
  { lv: 9, t: 'mc', q: 'A beam of electrons passes through two narrow slits and builds up a striped interference pattern on a screen. What does this show?', a: ['Electrons behave as waves as well as particles', 'Electrons are only particles that bounce off the slit edges', 'Electrons have no mass', 'Light is only a wave'], why: 'Only waves make interference patterns, yet the electrons still land one at a time as particles. That is wave-particle duality. The experiment says nothing about electrons lacking mass.' },
  { lv: 9, t: 'mc', q: 'Which effect do infrared photons mainly have on molecules?', a: ['They make bonds vibrate', 'They make molecules rotate', 'They excite electrons to higher levels', 'They excite the nuclei, which is how NMR works'], why: 'Infrared makes bonds vibrate. Microwaves make molecules rotate, UV and visible light excite electrons, and radio waves excite nuclei.' },
  { lv: 9, t: 'type', q: 'Name the region of the EM spectrum that sits between visible light and X-rays.', ans: 'ultraviolet', re: '^(ultraviolet|uv)(light|radiation|rays?)?$', why: 'The order is radio, microwave, infrared, visible, ultraviolet, X-ray, gamma. UV is just above violet light.' },
  { lv: 9, t: 'type', q: 'Which color of visible light has the highest energy per photon? One word.', ans: 'violet', re: '^violet$', why: 'Visible light runs from about 400 nm (violet) to 750 nm (red). The shortest wavelength carries the most energy.' },
  { lv: 9, t: 'type', q: 'Which region of the EM spectrum has the longest wavelength? One word.', ans: 'radio', re: '^(radio|radiowaves?)$', why: 'Radio waves are at the low-energy end, so they have the longest wavelength and the lowest frequency.' },
  { lv: 9, t: 'mc', boss: true, q: 'A photon has an energy of 3.31 x 10^-19 J. What is its wavelength? Use h = 6.626 x 10^-34 J s and c = 3.00 x 10^8 m/s.', a: ['6.01 x 10^-7 m', '1.67 x 10^6 m', '2.00 x 10^-15 m', '5.00 x 10^14 m'], why: 'λ = hc/E = (6.626 x 10^-34)(3.00 x 10^8)/(3.31 x 10^-19) = 6.01 x 10^-7 m, or about 601 nm, which is visible orange light. Flipping the fraction to E/hc gives 1.67 x 10^6. Leaving out c gives h/E = 2.00 x 10^-15. E/h = 5.00 x 10^14 is the frequency in Hz, not a wavelength.' },
  { lv: 9, t: 'mc', boss: true, q: 'What is the energy of one mole of 500. nm photons? Use h = 6.626 x 10^-34 J s, c = 3.00 x 10^8 m/s and 6.022 x 10^23 photons/mol.', a: ['2.39 x 10^5 J', '3.98 x 10^-19 J', '2.39 x 10^2 J', '6.60 x 10^-43 J'], why: 'One photon is hc/λ = 3.976 x 10^-19 J; carry that extra digit. Multiply by 6.022 x 10^23 to get 2.394 x 10^5, so 2.39 x 10^5 J per mole. Rounding to 3.98 first drifts to 2.40 x 10^5. The single-photon value stops one step early. 2.39 x 10^2 is the answer in kJ written with the unit J. Dividing by Avogadro\'s number goes the wrong way.' },

  { lv: 10, t: 'mc', q: 'A hydrogen lamp shows a few thin colored lines, not a continuous rainbow. What does this tell us about the electron?', a: ['Its energy is quantized, so it can only drop between specific levels', 'It can have any energy, so the lines are just the brightest colors', 'It moves at the speed of light between shells', 'It gives off light only once and then stays in the ground state'], why: 'A line means a photon of one exact energy, and that happens only if the levels are fixed. If any energy were allowed, the spectrum would be continuous.' },
  { lv: 10, t: 'mc', q: 'An electron in hydrogen drops from n = 4 to n = 2. What happens?', a: ['A photon is emitted with energy equal to the difference between the two levels', 'A photon is absorbed with energy equal to the difference between the two levels', 'A photon is emitted with energy equal to the n = 4 level alone', 'No energy changes hands because the electron stays in the atom'], why: 'Moving down in energy releases the difference as a photon. Absorption is what happens going up, from n = 2 to n = 4. The photon carries the gap between levels, not the energy of one level.' },
  { lv: 10, t: 'mc', q: 'A hydrogen electron falls from n = 3 to n = 2. What is the wavelength of the emitted photon? Use RH = 1.097 x 10^7 m^-1.', a: ['6.56 x 10^-7 m', '5.47 x 10^-7 m', '1.52 x 10^6 m', '4.86 x 10^-7 m'], why: '1/λ = (1.097 x 10^7)(1/4 - 1/9) = 1.52 x 10^6 m^-1, so λ = 6.56 x 10^-7 m. Stopping at 1.52 x 10^6 forgets to invert. Using 1/2 - 1/3 forgets to square the shell numbers. The 4.86 x 10^-7 m answer belongs to the n = 4 to n = 2 jump.' },
  { lv: 10, t: 'mc', q: 'How much energy does a hydrogen atom release when the electron drops from n = 4 to n = 2? Use RH = 2.18 x 10^-18 J.', a: ['4.09 x 10^-19 J', '5.45 x 10^-19 J', '3.03 x 10^-19 J', '2.04 x 10^-18 J'], why: 'RH(1/4 - 1/16) = (2.18 x 10^-18)(0.1875) = 4.09 x 10^-19 J. Leaving out the squares gives 5.45 x 10^-19. The 3.03 x 10^-19 value is the n = 3 to n = 2 drop, and 2.04 x 10^-18 is n = 4 to n = 1.' },
  { lv: 10, t: 'mc', q: 'In Dr. Meyers\' version of the Rydberg equation, RH(1/nf squared - 1/ni squared), a positive answer means which of these?', a: ['Energy was emitted as a photon, with nf lower than ni', 'Energy was absorbed, with nf higher than ni', 'The electron was removed from the atom', 'The electron stayed in the same shell'], why: 'His rule: a positive result means a photon was emitted, which happens when the electron falls to a smaller n. A negative result means a photon was absorbed. (Some textbooks give the sign of the atom\'s own energy change instead, so use his rule on his exam.)' },
  { lv: 10, t: 'mc', q: 'What is the frequency of the photon emitted when a hydrogen electron falls from n = 3 to n = 1? Use RH = 3.290 x 10^15 Hz.', a: ['2.92 x 10^15 Hz', '2.19 x 10^15 Hz', '3.66 x 10^14 Hz', '3.29 x 10^15 Hz'], why: 'ν = (3.290 x 10^15)(1/1 - 1/9) = 2.92 x 10^15 Hz. Using 1/1 - 1/3 forgets the squares. 3.66 x 10^14 keeps only the 1/9 term. 3.29 x 10^15 is just the constant with the bracket dropped.' },
  { lv: 10, t: 'mc', q: 'A hydrogen electron falls to nf = 2 and emits light of frequency 6.16 x 10^14 Hz. What shell did it start in? Use RH = 3.290 x 10^15 Hz.', a: ['n = 4', 'n = 3', 'n = 5', 'n = 16'], why: '6.16 x 10^14 / 3.290 x 10^15 = 0.187 = 1/4 - 1/ni squared, so 1/ni squared = 0.0628 and ni squared = 15.9. Take the square root to get ni = 3.99, which rounds to 4. Reporting 15.9 or 16 forgets the square root.' },
  { lv: 10, t: 'mc', q: 'Which transition in hydrogen emits the photon with the HIGHEST energy?', a: ['n = 4 to n = 1', 'n = 4 to n = 3', 'n = 3 to n = 2', 'n = 2 to n = 1'], why: 'Compare the energy gaps in units of RH: 4 to 1 is 0.9375, 2 to 1 is 0.75, 3 to 2 is 0.139 and 4 to 3 is 0.049. The biggest gap sends out the highest-energy photon.' },
  { lv: 10, t: 'mc', q: 'Which transition in hydrogen emits the photon with the LONGEST wavelength?', a: ['n = 4 to n = 3', 'n = 3 to n = 2', 'n = 2 to n = 1', 'n = 4 to n = 1'], why: 'Longest wavelength means lowest energy, and that is the smallest gap. The levels crowd together as n grows, so 4 to 3 is the smallest of the four.' },
  { lv: 10, t: 'mc', q: 'On an energy level diagram for hydrogen, how does the spacing between levels change as n increases?', a: ['The levels get closer together', 'The levels get farther apart', 'The levels stay evenly spaced', 'Only the n = 1 and n = 2 levels are spaced out'], why: 'Energy goes as minus 1 over n squared, so the gaps shrink as n increases and the levels crowd together toward the limit at n = infinity.' },
  { lv: 10, t: 'mc', q: 'How much energy must a hydrogen atom absorb to move its electron from n = 1 to n = 3? Use RH = 2.18 x 10^-18 J.', a: ['1.94 x 10^-18 J', '2.18 x 10^-18 J', '2.42 x 10^-19 J', '1.64 x 10^-18 J'], why: 'In his form, nf = 3 and ni = 1: RH(1/9 - 1/1) = (2.18 x 10^-18)(-0.8889) = -1.94 x 10^-18 J. The minus sign means absorbed, so the atom takes in 1.94 x 10^-18 J. The full constant 2.18 x 10^-18 would take n = 1 to n = infinity. 2.42 x 10^-19 keeps only the 1/9 term. 1.64 x 10^-18 is the jump from n = 1 to n = 2.' },
  { lv: 10, t: 'mc', q: 'Why does each element\'s flame test give its own color?', a: ['Each element has its own set of electron energy levels, so it emits its own set of photon energies', 'Every element has the same levels, but the flames differ in temperature', 'The flame changes the nucleus of the element', 'Electrons are removed from the atoms and recombine as a new element'], why: 'Energy levels depend on the element, so the photon energies are a fingerprint. The flame only supplies the energy to excite the electrons. The nucleus is not changed.' },
  { lv: 10, t: 'type', q: 'When an electron drops to a lower energy level, does the atom emit or absorb a photon? One word.', ans: 'emit', re: '^(emit|emits|emitted|emission)$', why: 'Dropping down releases the energy difference as a photon. Going up requires absorbing one.' },
  { lv: 10, t: 'type', q: 'What one-word term describes energies that are limited to certain specific values, like the allowed energies of an electron in an atom?', ans: 'quantized', re: '^quanti[sz]ed$', why: 'The electron energies in an atom are quantized, which is why the emission spectrum shows lines.' },
  { lv: 10, t: 'type', q: 'An electron absorbs energy and moves to a higher shell. Is nf larger or smaller than ni? One word.', ans: 'larger', re: '^(larger|greater|bigger|higher)$', why: 'Absorbing a photon sends the electron up, so the final shell number is bigger than the starting one. In emission it is the other way around.' },
  { lv: 10, t: 'mc', boss: true, q: 'What is the wavelength of the photon emitted when a hydrogen electron falls from n = 6 to n = 3? Use RH = 1.097 x 10^7 m^-1.', a: ['1.09 x 10^-6 m', '9.14 x 10^5 m', '4.34 x 10^-7 m', '1.22 x 10^-7 m'], why: '1/λ = (1.097 x 10^7)(1/9 - 1/36) = 9.14 x 10^5 m^-1, so λ = 1.09 x 10^-6 m, which is infrared. 9.14 x 10^5 is the answer before the inversion. 4.34 x 10^-7 m is the 5 to 2 jump and 1.22 x 10^-7 m is the 2 to 1 jump.' },
  { lv: 10, t: 'mc', boss: true, q: 'A hydrogen electron falls to nf = 2 and emits a photon with a wavelength of 486 nm. What shell did it start in? Use RH = 1.097 x 10^7 m^-1.', a: ['n = 4', 'n = 3', 'n = 5', 'n = 6'], why: '1/λ = 1/(4.86 x 10^-7 m) = 2.06 x 10^6 m^-1. Divide by RH to get 0.1876 = 1/4 - 1/ni squared, so 1/ni squared = 0.0624 and ni squared = 16.0, which makes ni = 4. A drop from n = 3 would give 656 nm and a drop from n = 5 would give 434 nm.' },

  { lv: 11, t: 'mc', q: 'Which quantum number gives the shape of an orbital (its subshell)?', a: ['The angular momentum number, l', 'The principal number, n', 'The magnetic number, ml', 'The spin number, ms'], why: 'l gives the subshell and its shape (0 is s, 1 is p, 2 is d, 3 is f). n sets the shell, ml sets the orientation, and ms sets the spin.' },
  { lv: 11, t: 'mc', q: 'What does the magnetic quantum number, ml, describe?', a: ['The orientation of the orbital in space', 'The size and energy of the shell', 'The shape of the subshell', 'The spin direction of the electron'], why: 'ml picks one orbital within a subshell, which sets its orientation. Size and energy belong to n, shape belongs to l, and spin belongs to ms.' },
  { lv: 11, t: 'mc', q: 'Which values of l are allowed when n = 3?', a: ['0, 1 and 2', '1, 2 and 3', '0, 1, 2 and 3', '-2, -1, 0, 1 and 2'], why: 'l runs from 0 to n - 1, so n = 3 allows 0, 1 and 2 (3s, 3p, 3d). Starting at 1 or ending at n both break the rule. The list with negatives is the range for ml when l = 2.' },
  { lv: 11, t: 'mc', q: 'Which values of ml are allowed for a p subshell?', a: ['-1, 0 and +1', '0, +1 and +2', '-2, -1, 0, +1 and +2', '0 and +1 only'], why: 'A p subshell has l = 1, and ml runs from -l to +l, so -1, 0 and +1. That is 2l + 1 = 3 orbitals. The five-value list is for d.' },
  { lv: 11, t: 'mc', q: 'Which set of (n, l, ml) is allowed?', a: ['(3, 2, -2)', '(2, 2, 0)', '(3, 1, -2)', '(1, 1, 0)'], why: '(3, 2, -2) is a 3d orbital, and all three numbers stay inside their ranges. (2, 2, 0) and (1, 1, 0) need l less than n. (3, 1, -2) needs ml between -1 and +1.' },
  { lv: 11, t: 'mc', q: 'How many orbitals are in the third shell (n = 3)?', a: ['9', '3', '6', '18'], why: 'The third shell has 3s (1 orbital), 3p (3) and 3d (5), which is 9 in all. The shell holds 18 electrons, which is a different count. The number of subshells is 3.' },
  { lv: 11, t: 'mc', q: 'How many subshells are in the n = 4 shell?', a: ['4', '16', '3', '7'], why: 'l runs from 0 to 3, giving 4s, 4p, 4d and 4f. That is 4 subshells. The shell has 16 orbitals, and 7 is the number of orbitals in just the f subshell.' },
  { lv: 11, t: 'mc', q: 'How many orbitals make up a 4d subshell?', a: ['5', '10', '3', '7'], why: 'A d subshell has l = 2, so 2l + 1 = 5 orbitals. Ten is the maximum number of electrons it holds. Three is the p count and seven is the f count.' },
  { lv: 11, t: 'mc', q: 'Which description fits the three 2p orbitals?', a: ['Dumbbells at right angles to each other, along the x, y and z axes', 'Spheres of three different sizes', 'Three dumbbells all pointing along the same axis', 'Cloverleaves in the xy, xz and yz planes'], why: 'Each p orbital is a dumbbell, and the three point along the x, y and z axes at 90 degrees. A sphere is an s orbital, and cloverleaves are mostly d orbitals.' },
  { lv: 11, t: 'mc', q: 'An electron is described by n = 5, l = 2, ml = 1. Which subshell is it in?', a: ['5d', '5p', '4d', '5f'], why: 'n = 5 is the fifth shell and l = 2 means d, so it is 5d. ml = 1 is allowed for l = 2. The l = 1 option would be p, l = 3 would be f, and n = 4 would put it in the fourth shell.' },
  { lv: 11, t: 'mc', q: 'Which subshell does NOT exist?', a: ['2d', '3d', '4f', '2p'], why: 'd needs l = 2, which needs n of at least 3. So there is no 2d. Likewise, f first appears at n = 4.' },
  { lv: 11, t: 'mc', q: 'Each p orbital has a nodal plane. What is true about it?', a: ['The electron is never found in that plane, which passes through the nucleus', 'The electron is found only in that plane', 'It marks the 90% boundary of the orbital', 'It exists only in the 2p orbitals'], why: 'A node is where the electron density is zero. Each p orbital has one nodal plane through the nucleus, between the two lobes. The 90% boundary is the surface of the orbital plot, which is a different idea. Every p orbital has it, not just 2p.' },
  { lv: 11, t: 'type', q: 'What letter names the subshell with l = 2?', ans: 'd', re: '^d$', why: 'l = 0 is s, 1 is p, 2 is d, 3 is f.' },
  { lv: 11, t: 'type', q: 'How many orbitals are in an f subshell? Type the number.', ans: '7', re: '^7$', why: 'f has l = 3, so ml runs from -3 to +3, and 2l + 1 = 7 orbitals.' },
  { lv: 11, t: 'type', q: 'What is the name of the quantum number ms? One word.', ans: 'spin', re: '^(electron)?spin(quantumnumber)?$', why: 'ms is the spin quantum number, +1/2 or -1/2.' },
  { lv: 11, t: 'mc', boss: true, q: 'What is the maximum number of electrons in the n = 4 shell?', a: ['32', '16', '18', '8'], why: 'The fourth shell has 16 orbitals (4s, 4p, 4d, 4f), and each holds 2 electrons, so 32. Sixteen is the orbital count. Eighteen is the n = 3 capacity, and 8 is the n = 2 capacity.' },
  { lv: 11, t: 'mc', boss: true, q: 'Which set of quantum numbers (n, l, ml, ms) could describe an electron in a 3p orbital?', a: ['3, 1, 0, +1/2', '3, 2, 0, +1/2', '2, 1, 0, +1/2', '3, 1, 2, +1/2'], why: 'A 3p orbital needs n = 3 and l = 1. ml may be -1, 0 or +1. The l = 2 set is a 3d orbital and the n = 2 set is a 2p orbital. An ml of 2 is not allowed when l = 1.' },

  { lv: 12, t: 'mc', q: 'What is the full electron configuration of a sulfur atom (Z = 16)?', a: ['1s^2 2s^2 2p^6 3s^2 3p^4', '1s^2 2s^2 2p^6 3s^2 3p^6', '1s^2 2s^2 2p^6 3s^2 3p^2 4s^2', '1s^2 2s^2 2p^6 3s^2 3p^3 4s^1'], why: 'Fill in order up to 16 electrons: 2 + 2 + 6 + 2 + 4. A configuration ending in 3p^6 has 18 electrons, which is argon. The two that use 4s put electrons there before 3p is full.' },
  { lv: 12, t: 'mc', q: 'What is the noble-gas configuration of calcium (Z = 20)?', a: ['[Ar]4s^2', '[Ne]4s^2', '[Ar]3d^2', '[Kr]4s^2'], why: 'Argon covers the first 18 electrons, and the last 2 fill 4s before 3d. [Ne] stops at 10, so it would be missing 8 electrons. [Ar]3d^2 breaks aufbau, and [Kr] is past calcium.' },
  { lv: 12, t: 'mc', q: 'Why does 4s fill before 3d?', a: ['A 4s electron penetrates close to the nucleus and so is lower in energy', 'The fourth shell is always lower in energy than the third', 'Hund\'s rule says s subshells fill before d subshells', 'The 3d subshell holds more electrons than 4s, so it has to wait until 4s is full'], why: 'The 4s orbital has density near the nucleus, so it is shielded less and feels more of the nuclear charge. Shell number alone does not rank the energies, a subshell\'s capacity does not set its place in the order, and Hund\'s rule is about filling orbitals within one subshell.' },
  { lv: 12, t: 'mc', q: 'What does the Pauli exclusion principle say?', a: ['No two electrons in an atom can have the same four quantum numbers, so an orbital holds at most 2 electrons with opposite spins', 'Electrons fill the lowest-energy orbital available first', 'Electrons fill separate orbitals in a subshell before pairing', 'Every orbital must hold exactly 2 electrons'], why: 'That is the Pauli principle. Lowest-energy-first filling is aufbau, and filling separate orbitals before pairing is Hund\'s rule. An orbital can hold 0, 1 or 2 electrons, not always 2.' },
  { lv: 12, t: 'mc', q: 'Which drawing of the 2p orbitals correctly shows the three 2p electrons of nitrogen?', a: ['Three boxes, each with one up arrow', 'One box with a pair, one box with a single arrow and one empty box', 'Three boxes with arrows alternating up, down, up', 'Three boxes, each with an up-down pair'], why: 'Hund\'s rule: spread the electrons over the three orbitals with the same spin before pairing. The alternating-spin and paired drawings both break it. A set of three pairs holds 6 electrons, not 3.' },
  { lv: 12, t: 'mc', q: 'How many unpaired electrons does a ground-state oxygen atom have?', a: ['2', '4', '0', '1'], why: 'Oxygen is 2p^4. The first three electrons go in separate orbitals, and the fourth pairs with one of them, leaving 2 unpaired.' },
  { lv: 12, t: 'mc', q: 'What is the electron configuration of Fe^2+ (Fe is [Ar]3d^6 4s^2)?', a: ['[Ar]3d^6', '[Ar]3d^4 4s^2', '[Ar]3d^6 4s^2', '[Ar]3d^5 4s^1'], why: 'Transition metals lose the outer s electrons first, so Fe^2+ keeps all six 3d electrons. 3d^4 4s^2 removes d electrons first and ends up with two too few in 3d. 3d^6 4s^2 is the neutral atom, with 26 electrons where Fe^2+ has 24. 3d^5 4s^1 has the right count but is not what the ion looks like.' },
  { lv: 12, t: 'mc', q: 'What is the ground-state configuration of chromium (Z = 24)?', a: ['[Ar]3d^5 4s^1', '[Ar]3d^4 4s^2', '[Ar]3d^5 4s^2', '[Ar]3d^6'], why: 'Chromium is one of the exceptions: one 4s electron moves into 3d to give a half-filled 3d subshell. The regular filling would be 3d^4 4s^2, but that is not what is observed. 3d^5 4s^2 has 25 electrons and is manganese, and 3d^6 alone is the configuration of Fe^2+.' },
  { lv: 12, t: 'mc', q: 'Which of these is paramagnetic?', a: ['N', 'Mg', 'Zn', 'Ar'], why: 'Nitrogen is 2p^3 with three unpaired electrons, so it is attracted to a magnet. Mg (3s^2), Zn ([Ar]3d^10 4s^2) and Ar (3p^6) have every electron paired and are diamagnetic.' },
  { lv: 12, t: 'mc', q: 'Which species is isoelectronic with Ar?', a: ['Cl^-', 'Cl', 'Na^+', 'Br^-'], why: 'Isoelectronic means the same number of electrons. Ar has 18, and Cl^- has 17 + 1 = 18. Neutral Cl has 17, Na^+ has 10 and Br^- has 36.' },
  { lv: 12, t: 'mc', q: 'How many valence electrons and how many core electrons does a germanium atom (Z = 32, [Ar]3d^10 4s^2 4p^2) have?', a: ['4 valence and 28 core', '14 valence and 18 core', '4 valence and 10 core', '2 valence and 30 core'], why: 'Valence electrons are in the outer shell, 4s^2 4p^2, so 4. Everything else is core, including the filled 3d^10: 32 - 4 = 28. Counting the 3d electrons as valence gives the 14 and 18 split, which is wrong for a main-group element.' },
  { lv: 12, t: 'mc', q: 'Using Zeff = Z - S, what is the effective nuclear charge on a valence electron of phosphorus (Z = 15)? Treat S as the number of core electrons.', a: ['+5', '+15', '+10', '+3'], why: 'Phosphorus has 10 core electrons (1s^2 2s^2 2p^6), so Zeff = 15 - 10 = +5. Using Z alone ignores shielding. Using +10 is the number of shielding electrons, and +3 is the p electron count.' },
  { lv: 12, t: 'mc', q: 'Which element has the configuration [Kr]5s^2 4d^10 5p^3?', a: ['Sb', 'As', 'Bi', 'Sn'], why: 'Count from Kr (36): 2 + 10 + 3 = 15 more electrons gives 51, which is antimony. Read 5p^3 as row 5, p block, third element across (group 5A). As would be [Ar]3d^10 4s^2 4p^3, Bi is in row 6, and Sn would end at 5p^2.' },
  { lv: 12, t: 'type', q: 'Write the noble-gas configuration of chlorine. Write superscripts with a caret, as in 3s^2 3p^4.', ans: '[Ne]3s^2 3p^5', re: '^\\[ne\\]3s\\^?23p\\^?5$', why: 'Cl has 17 electrons: neon covers 10, and the remaining 7 are 3s^2 3p^5.' },
  { lv: 12, t: 'type', q: 'How many unpaired electrons does a ground-state phosphorus atom have? Type the number.', ans: '3', re: '^3$', why: 'Phosphorus is 3s^2 3p^3. By Hund\'s rule the three 3p electrons sit in separate orbitals, all unpaired.' },
  { lv: 12, t: 'type', q: 'Whose rule says electrons fill separate orbitals of the same energy, with parallel spins, before any pairing? Type the name.', ans: 'Hund', re: '^hund[\'\\u2019]?s?(rule)?$', why: 'That is Hund\'s rule. Aufbau is about lowest energy first, and Pauli limits an orbital to 2 electrons.' },
  { lv: 12, t: 'mc', boss: true, q: 'Which species is diamagnetic?', a: ['Cu^+', 'Cu', 'Fe^3+', 'Mn^2+'], why: 'Cu^+ is [Ar]3d^10, with every electron paired. Cu is [Ar]3d^10 4s^1, with one unpaired 4s electron. Fe^3+ is 3d^5 and Mn^2+ is 3d^5, so each has 5 unpaired electrons.' },
  { lv: 12, t: 'mc', boss: true, q: 'What is the configuration of V^2+? Vanadium (Z = 23) is [Ar]3d^3 4s^2.', a: ['[Ar]3d^3', '[Ar]3d^1 4s^2', '[Ar]3d^3 4s^2', '[Ar]3d^2 4s^1'], why: 'The two 4s electrons leave first, which leaves [Ar]3d^3. The 3d^1 4s^2 option removes d electrons instead. 3d^3 4s^2 is the neutral atom. 3d^2 4s^1 has 21 electrons like V^2+, but the wrong arrangement.' },
  { lv: 12, t: 'mc', boss: true, q: 'Which pair of species is isoelectronic?', a: ['K^+ and S^2-', 'Na^+ and Mg', 'F^- and Cl^-', 'O^2- and S^2-'], why: 'K^+ and S^2- both have 18 electrons. Na^+ has 10 and Mg has 12. F^- has 10 and Cl^- has 18. O^2- has 10 and S^2- has 18.' },

  { lv: 13, t: 'mc', q: 'Which of these has the largest atomic radius: Na, Mg, Al or Si?', a: ['Na', 'Mg', 'Al', 'Si'], why: 'Radius decreases across a period because Zeff rises and pulls the same shell inward, so the element farthest left, sodium, is the largest.' },
  { lv: 13, t: 'mc', q: 'Which of these has the smallest atomic radius: F, Cl, Br or I?', a: ['F', 'Cl', 'Br', 'I'], why: 'Radius increases down a group because the outer orbital is bigger and farther from the nucleus. Fluorine is at the top, so it is smallest.' },
  { lv: 13, t: 'mc', q: 'How does the radius of Mg^2+ compare with that of a Mg atom?', a: ['Mg^2+ is smaller because it has lost its outer shell and the same 12 protons pull fewer electrons', 'Mg^2+ is larger because it has more protons than electrons', 'They are the same size because the nucleus is unchanged', 'Mg^2+ is larger because the lost electrons leave empty space'], why: 'Cations are smaller than their atoms, about half the radius. Losing the n = 3 shell shrinks the ion, and the 12 protons now hold only 10 electrons, so each is pulled in harder.' },
  { lv: 13, t: 'mc', q: 'Which has the largest radius: S^2-, Cl^-, K^+ or Ca^2+?', a: ['S^2-', 'Cl^-', 'K^+', 'Ca^2+'], why: 'All four have 18 electrons, so the one with the fewest protons is largest. S^2- has 16 protons and Ca^2+ has 20, which pulls its electrons in the hardest.' },
  { lv: 13, t: 'mc', q: 'Which of these has the highest first ionization energy: Na, Mg, P or Cl?', a: ['Cl', 'Na', 'Mg', 'P'], why: 'Ionization energy rises across a period as Zeff grows, so the element farthest right, chlorine, is highest. Sodium, at the far left, is lowest.' },
  { lv: 13, t: 'mc', q: 'Nitrogen has a higher first ionization energy than oxygen. Why?', a: ['The fourth 2p electron in oxygen is paired, so it is repelled and easier to remove', 'Nitrogen has more protons than oxygen', 'Nitrogen\'s 2p electrons are in a higher shell', 'Oxygen has a larger atomic radius, which makes it harder to ionize'], why: 'Oxygen has a paired 2p electron, and the repulsion makes it easier to remove. This is one of the two dips across period 2, the other being B below Be. Oxygen has more protons, not nitrogen, and both are in the second shell.' },
  { lv: 13, t: 'mc', q: 'Which of these has the most negative electron affinity: Na, Mg, Cl or Ar?', a: ['Cl', 'Na', 'Mg', 'Ar'], why: 'A more negative electron affinity means a stronger pull on an added electron. Chlorine, one electron short of a full shell, is the most negative at -349 kJ/mol. Argon has a full shell and does not want another electron.' },
  { lv: 13, t: 'mc', q: 'Which has the greatest metallic character: Cs, Ba, Al or Na?', a: ['Cs', 'Ba', 'Al', 'Na'], why: 'Metallic character grows down and to the left. Cs is lowest and leftmost of the four, and its outer electron is the easiest to lose.' },
  { lv: 13, t: 'mc', q: 'Based on its valence electrons, what ion does selenium form?', a: ['Se^2-', 'Se^2+', 'Se^6+', 'Se^-'], why: 'Selenium is in group 6A with 6 valence electrons, so it gains 2 to reach 8. That gives Se^2-. Nonmetals gain electrons and metals lose them, so the plus options are wrong.' },
  { lv: 13, t: 'mc', q: 'Which pair of ions does the periodic table predict for strontium and iodine?', a: ['Sr^2+ and I^-', 'Sr^+ and I^-', 'Sr^2+ and I^7-', 'Sr^2- and I^+'], why: 'Sr is in 2A, so it loses 2 electrons. I is in 7A, so it gains 1. Writing 7- for iodine counts its valence electrons instead of the electrons needed.' },
  { lv: 13, t: 'mc', q: 'Why does atomic radius decrease from left to right across a period?', a: ['Zeff increases, so the nucleus pulls the same shell in more tightly', 'More shells are added, so the atom gets denser', 'Electrons are removed from the outer shell', 'Shielding by core electrons increases'], why: 'Across a period the electrons enter the same shell while the nuclear charge increases, so Zeff rises and the shell shrinks. Core shielding stays the same. No new shells are added.' },
  { lv: 13, t: 'mc', q: 'Which has the larger second ionization energy, K or Ca?', a: ['K, because its second electron must come from the 3p core', 'Ca, because it has more protons', 'They are equal, because both are metals', 'Ca, because its second electron is paired in 4s'], why: 'K loses 4s^1 first, and the second electron comes from the 3p subshell, which is much harder to remove. Ca loses a second 4s electron. A big jump marks the start of core removal.' },
  { lv: 13, t: 'mc', q: 'On the periodic table, which direction gives larger atoms and more metallic character?', a: ['Down and to the left', 'Down and to the right', 'Up and to the left', 'Up and to the right'], why: 'Both grow toward the bottom left. Down adds shells, and left means lower Zeff. Ionization energy and electronegativity grow the other way, toward the top right.' },
  { lv: 13, t: 'type', q: 'Across a period from left to right, does atomic radius increase or decrease? One word.', ans: 'decrease', re: '^decreas(e|es|ed|ing)$', why: 'Zeff rises across a period, so the radius shrinks.' },
  { lv: 13, t: 'type', q: 'What charge does an aluminum ion carry? Type it like 3+.', ans: '3+', re: '^(\\+3|3\\+|al\\^?3\\+)$', why: 'Al is in group 3A. It loses its 3 valence electrons to match neon, giving Al^3+.' },
  { lv: 13, t: 'type', q: 'What is the name of the energy needed to remove one electron from a gaseous atom? Two words.', ans: 'ionization energy', re: '^(first)?ioni[sz]ation(energy)?$', why: 'That is ionization energy. It rises across a period and falls down a group.' },
  { lv: 13, t: 'mc', boss: true, q: 'Which order of ionic radii, smallest to largest, is correct?', a: ['Ca^2+ < K^+ < Cl^- < S^2-', 'S^2- < Cl^- < K^+ < Ca^2+', 'K^+ < Ca^2+ < S^2- < Cl^-', 'Cl^- < S^2- < Ca^2+ < K^+'], why: 'All four have 18 electrons, so more protons means a smaller ion: Ca (20), K (19), Cl (17), S (16). Listing them largest to smallest is the reverse.' },
  { lv: 13, t: 'mc', boss: true, q: 'Which order of first ionization energies, lowest to highest, is correct?', a: ['Cs < Ca < Mg', 'Mg < Ca < Cs', 'Ca < Cs < Mg', 'Cs < Mg < Ca'], why: 'Cs is farthest down and left, so it is lowest. Ca is below Mg in the same group, so Ca is lower than Mg. The other orders break one of those two rules.' },

  { lv: 14, t: 'mc', q: 'What happens to the electrons when sodium and chlorine form an ionic bond?', a: ['Sodium transfers an electron to chlorine, and the ions attract each other', 'Sodium and chlorine share a pair of electrons equally', 'Chlorine gives an electron to sodium', 'The electrons are shared in a sea around both atoms'], why: 'Metal atoms lose electrons and nonmetal atoms gain them. Na loses 1 to become Na^+, and Cl gains 1 to become Cl^-. Sharing is covalent bonding, and a sea of electrons describes a metallic bond.' },
  { lv: 14, t: 'mc', q: 'Which compound is ionic?', a: ['MgCl2', 'CO2', 'CH4', 'H2O'], why: 'Ionic compounds join a metal to a nonmetal. Mg is a metal and Cl a nonmetal. The others join only nonmetals, so their atoms share electrons.' },
  { lv: 14, t: 'mc', q: 'Which compound is held together by covalent bonds only?', a: ['SO2', 'NaF', 'CaO', 'K2S'], why: 'Both S and O are nonmetals, so they share electrons. The others each pair a metal with a nonmetal and are ionic.' },
  { lv: 14, t: 'mc', q: 'Which statement about NH4Cl is correct?', a: ['It has ionic bonds and covalent bonds', 'It has only ionic bonds', 'It has only covalent bonds', 'It has metallic bonds'], why: 'NH4^+ is held together by covalent bonds, and NH4^+ attracts Cl^- ionically. The polyatomic ion makes both bond types appear in one compound.' },
  { lv: 14, t: 'mc', q: 'Which statement describes the octet rule?', a: ['Atoms tend to gain, lose or share electrons to end up with 8 valence electrons (2 for hydrogen)', 'Atoms always form exactly 8 bonds', 'Every atom has 8 protons', 'A molecule can contain at most 8 atoms'], why: 'Eight valence electrons match the filled outer shell of a noble gas. The rule is about electrons, not about bonds or atoms counted in a molecule. Hydrogen stops at 2.' },
  { lv: 14, t: 'mc', q: 'What is the formula of the compound formed by Al^3+ and O^2-?', a: ['Al2O3', 'AlO', 'Al3O2', 'Al2O'], why: 'The charges must add to zero: 2 x (+3) = +6 and 3 x (-2) = -6. That gives Al2O3. The subscripts 3 and 2 are swapped in Al3O2, and AlO and Al2O leave the charges unbalanced.' },
  { lv: 14, t: 'mc', q: 'What is the formula of the compound formed by Ca^2+ and PO4^3-?', a: ['Ca3(PO4)2', 'Ca2(PO4)3', 'CaPO4', 'Ca3PO4'], why: '3 x (+2) = +6 and 2 x (-3) = -6. Put parentheses around the polyatomic ion before adding a subscript. Swapping the subscripts gives Ca2(PO4)3, and CaPO4 and Ca3PO4 leave the charge unbalanced.' },
  { lv: 14, t: 'mc', q: 'What is the formula of the compound formed by NH4^+ and SO4^2-?', a: ['(NH4)2SO4', 'NH4SO4', 'NH4(SO4)2', '(NH4)2(SO4)2'], why: 'It takes 2 NH4^+ to cancel 1 SO4^2-. Parentheses go around NH4 only because a subscript is needed there. NH4SO4 leaves a charge of -1 and NH4(SO4)2 has the 2 on the wrong ion. Two ammoniums with two sulfates would be +2 against -4, so the charges do not cancel there either.' },
  { lv: 14, t: 'mc', q: 'How many ions are in one formula unit of Ca(NO3)2?', a: ['3', '2', '5', '9'], why: 'One Ca^2+ and two NO3^- make 3 ions. Counting each polyatomic ion as one particle is the key. Atoms would be 1 + 2 x 4 = 9, but that is a different count.' },
  { lv: 14, t: 'mc', q: 'Which of these is a polyatomic ion?', a: ['NO3^-', 'Na^+', 'NH3', 'N2O'], why: 'A polyatomic ion is a charged group of covalently bonded atoms. Na^+ is one atom, so it is monatomic. NH3 and N2O are neutral molecules.' },
  { lv: 14, t: 'mc', q: 'Which of these is a molecule of an element?', a: ['O2', 'NaCl', 'He', 'H2O'], why: 'O2 is two bonded atoms of the same element. NaCl is an ionic compound. He is a single atom, not a molecule. H2O is a molecule of a compound.' },
  { lv: 14, t: 'mc', q: 'Why does magnesium form Mg^2+?', a: ['It loses its 2 valence electrons and ends with the same configuration as neon', 'It gains 2 electrons to reach 8 valence electrons', 'It has 2 protons', 'It shares 2 electrons with a nonmetal'], why: 'Mg is [Ne]3s^2. Losing the two 3s electrons leaves [Ne], a filled shell. Metals lose electrons, so gaining is wrong. Its atomic number is 12, not 2.' },
  { lv: 14, t: 'type', q: 'Type the formula of the compound formed from aluminum and sulfur.', ans: 'Al2S3', re: '^al2s3$', why: 'Al^3+ and S^2-: two Al give +6 and three S give -6.' },
  { lv: 14, t: 'type', q: 'What charge does barium form as an ion? Type it like 2+.', ans: '2+', re: '^(\\+2|2\\+|ba\\^?2\\+)$', why: 'Ba is in group 2A. It loses 2 valence electrons and forms Ba^2+.' },
  { lv: 14, t: 'type', q: 'In sodium chloride, are the valence electrons shared or transferred? One word.', ans: 'transferred', re: '^(transferred|transfer)$', why: 'Na gives its valence electron to Cl, which makes the ions Na^+ and Cl^-. Sharing would be covalent.' },
  { lv: 14, t: 'mc', boss: true, q: 'What is the formula of the compound formed by Fe^3+ and SO4^2-?', a: ['Fe2(SO4)3', 'Fe3(SO4)2', 'FeSO4', 'Fe(SO4)3'], why: 'It takes 2 Fe^3+ (+6) to cancel 3 SO4^2- (-6). Fe3(SO4)2 swaps the subscripts, and FeSO4 would need Fe^2+. Fe(SO4)3 has a charge of 3 - 6 = -3.' },
  { lv: 14, t: 'mc', boss: true, q: 'Which compound contains both ionic and covalent bonds?', a: ['Ca(OH)2', 'NaCl', 'CO2', 'MgO'], why: 'Ca^2+ is attracted ionically to two OH^-, and each OH^- has a covalent O-H bond inside it. NaCl and MgO are ionic only, and CO2 is covalent only.' },

  { lv: 15, t: 'mc', q: 'What is the name of Fe2O3?', a: ['iron(III) oxide', 'iron(II) oxide', 'iron(III) trioxide', 'iron(VI) oxide'], why: 'Three O^2- give -6, so two Fe must give +6, which is +3 each. That makes iron(III) oxide. Iron(II) oxide is FeO. Ionic names take no prefixes. The charge is per iron, not the total.' },
